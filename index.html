<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Kho Tài liệu Học tập</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --light-bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 30px; color: #333; background-color: #f0f2f5; }
        .notebook { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 10px; font-size: 2.2em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 15px; }
        li > a { text-decoration: none; color: var(--primary); display: block; padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 12px; transition: all 0.3s ease; }
        li > a:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateX(5px); box-shadow: 0 5px 15px rgba(52,152,219,0.3); }
        .item-icon { font-size: 1.5em; margin-right: 12px; vertical-align: middle; }
        .item-title { font-weight: 700; font-size: 1.1em; }
        .item-desc { font-size: 0.85em; opacity: 0.7; margin-top: 5px; font-weight: 400; }
        footer { text-align: center; margin-top: 30px; color: #999; font-size: 0.85em; }
        footer a { color: var(--accent); display: inline; padding: 0; border: none; background: none; font-weight: 600; }
        footer a:hover { text-decoration: underline; background: none; color: var(--accent); transform: none; }

        @media (max-width: 768px) {
            body { padding: 10px; font-size: 16px; }
            .notebook { padding: 15px; border-radius: 8px; }
            h1 { font-size: 1.6em; }
        }
    </style>
</head>
<body>
    <div class="notebook">
        <h1>📖 Kho Tài liệu Học tập</h1>
        <p class="subtitle">Tổng hợp ghi chú và tài liệu cá nhân</p>

        <ul>
            <li>
                <a href="book/">
                    <span class="item-icon">📚</span>
                    <span class="item-title">Sách & Khóa học</span>
                    <div class="item-desc">Ghi chú từ các khóa học và sách đã đọc</div>
                </a>
            </li>
            <!-- Thêm danh mục mới ở đây, ví dụ:
            <li>
                <a href="cheatsheet/">
                    <span class="item-icon">📝</span>
                    <span class="item-title">Cheatsheet</span>
                    <div class="item-desc">Tổng hợp các bảng tra cứu nhanh</div>
                </a>
            </li>
            -->
        </ul>

        <footer>
            <p>🔗 <a href="https://github.com/ngthotuan/docs">GitHub Repo</a></p>
        </footer>
    </div>
</body>
</html>
