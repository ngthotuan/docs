<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Kho Tài liệu Học tập</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --light-bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 30px; color: #333; background-color: #f0f2f5; }
        .notebook { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 10px; font-size: 2.2em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; }
        .section { margin-bottom: 35px; }
        .section h2 { color: var(--accent); margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 10px; background: var(--light-bg); padding-top: 8px; padding-bottom: 8px; border-radius: 0 5px 5px 0; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; list-style: none; padding: 0; }
        .card a { text-decoration: none; color: var(--primary); display: block; padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 12px; transition: all 0.3s ease; }
        .card a:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(52,152,219,0.3); }
        .card-icon { font-size: 2em; margin-bottom: 8px; display: block; }
        .card-title { font-weight: 700; font-size: 1.1em; margin-bottom: 5px; }
        .card-desc { font-size: 0.85em; opacity: 0.7; font-weight: 400; }
        .tag { font-size: 0.75em; padding: 2px 8px; border-radius: 12px; font-weight: bold; display: inline-block; margin-top: 8px; }
        .tag-book { background: #e3f2fd; color: #1976d2; }
        footer { text-align: center; margin-top: 30px; color: #999; font-size: 0.85em; }

        @media (max-width: 768px) {
            body { padding: 10px; font-size: 16px; }
            .notebook { padding: 15px; border-radius: 8px; }
            .card-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.6em; }
            h2 { font-size: 1.3em; }
        }
    </style>
</head>
<body>
    <div class="notebook">
        <h1>📖 Kho Tài liệu Học tập</h1>
        <p class="subtitle">Tổng hợp ghi chú và tài liệu từ các khóa học</p>

        <div class="section">
            <h2>📚 Sách & Khóa học</h2>
            <ul class="card-grid">
                <li class="card">
                    <a href="book/ielts-basic/">
                        <span class="card-icon">🇬🇧</span>
                        <div class="card-title">Ngữ pháp cơ bản cho IELTS</div>
                        <div class="card-desc">13 bài học lý thuyết và bài tập ngữ pháp</div>
                        <span class="tag tag-book">26 notes</span>
                    </a>
                </li>
                <!-- Thêm khóa học mới ở đây -->
            </ul>
        </div>

        <footer>
            <p>🔗 <a href="https://github.com/ngthotuan/docs" style="color: var(--accent); display: inline; padding: 0; border: none; background: none; font-weight: 600;">GitHub Repo</a></p>
        </footer>
    </div>
</body>
</html>
