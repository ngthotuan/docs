<title>Ôn tập PTHM – Đề 2012-2013 (RHM5, Đề A)</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--text:#e2e8f0;--muted:#94a3b8;
    --green:#22c55e;--greenbg:#052e16;--red:#ef4444;--redbg:#450a0a;--accent:#38bdf8;--border:#334155;}
  @media (prefers-color-scheme: light){:root{--bg:#f1f5f9;--card:#fff;--card2:#f8fafc;--text:#0f172a;
    --muted:#64748b;--greenbg:#dcfce7;--redbg:#fee2e2;--border:#e2e8f0;}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;padding:16px;}
  .wrap{max-width:820px;margin:0 auto;}
  header{text-align:center;margin-bottom:18px;}
  h1{font-size:20px;margin:0 0 4px;}.sub{color:var(--muted);font-size:14px;}
  .bar{position:sticky;top:0;z-index:10;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .score{font-weight:600;font-size:15px;}.score b{color:var(--accent);}
  .bar button{background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;}
  .bar button:hover{border-color:var(--accent);}
  .q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .qnum{color:var(--accent);font-weight:700;}.qtext{font-weight:600;margin-bottom:12px;}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--text);
    border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:15px;transition:.12s;}
  .opt:hover{border-color:var(--accent);}.opt .lab{font-weight:700;margin-right:8px;}
  .opt.correct{background:var(--greenbg);border-color:var(--green);}
  .opt.wrong{background:var(--redbg);border-color:var(--red);}
  .opt.reveal{border-color:var(--green);}.opt:disabled{cursor:default;}
  .exp{margin-top:10px;padding:12px;border-radius:9px;background:var(--card2);border-left:4px solid var(--accent);font-size:14px;display:none;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;margin-bottom:6px;}
  .tag.ok{background:var(--green);color:#04210f;}.tag.no{background:var(--red);color:#fff;}
  .exp .kh{color:var(--muted);font-size:13px;margin-top:6px;}
  .note{color:#f59e0b;font-size:13px;margin-top:6px;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0;}
</style>
</head>

<header>
  <h1>Ôn tập Phẫu thuật Hàm mặt</h1>

</div>
<script>
const TF={A:"Đúng",B:"Sai"};
const DATA=[
{n:1,q:"Theo phân loại của Kernahan và Stark thì khe hở bẩm sinh hàm mặt có mấy loại:",o:{A:"2",B:"3",C:"4",D:"5",E:"6"},c:"B",kh:"B",e:"Kernahan & Stark chia 3 nhóm: khe hở vòm miệng tiên phát, khe hở vòm miệng thứ phát, và khe hở cả hai."},
{n:2,q:"Trên một bệnh nhân có thể chỉ có khe hở vòm miệng cứng mà không hở vòm miệng mềm.",o:TF,c:"B",kh:"B",e:"Sai. Khe hở vòm phát triển từ sau ra trước (lưỡi gà/vòm mềm hở trước), nên không thể chỉ hở vòm cứng mà vòm mềm nguyên vẹn."},
{n:3,q:"Ranh giới giữa vòm miệng tiên phát và thứ phát là:",o:{A:"Lỗ khẩu cái trước",B:"Lỗ khẩu cái sau",C:"Lỗ răng cửa",D:"Lỗ cằm",E:"Các câu trên đều sai"},c:"C",kh:"C",e:"Lỗ răng cửa (lỗ cửa) là mốc ranh giới vòm miệng tiên phát – thứ phát."},
{n:4,q:"Khe hở môi thường gặp phía bên trái nhiều hơn bên phải.",o:TF,c:"A",kh:"A",e:"Đúng. Khe hở môi một bên gặp bên trái nhiều hơn bên phải."},
{n:5,q:"Thời gian điều trị phẫu thuật thích hợp nhất đối với khe hở môi:",o:{A:"Càng sớm càng tốt",B:"3-6 tháng",C:"6 tháng đến 2 tuổi",D:"2-3 tuổi",E:"Trên 3 tuổi"},c:"B",kh:"B",e:"Phẫu thuật môi lần đầu lúc 3-6 tháng (quy tắc số 10)."},
{n:6,q:"Thời gian phẫu thuật thích hợp đối với trẻ có khe hở vòm miệng:",o:{A:"Sau khi mổ môi",B:"Trước mổ môi",C:"1-2 tuổi (10–12 tháng)",D:"Càng sớm càng tốt",E:"2-3 tuổi"},c:"C",kh:"C",e:"Phẫu thuật vòm miệng thường lúc 12-18 tháng (khoảng 1-2 tuổi) để cân bằng phát âm và tăng trưởng hàm."},
{n:7,q:"Trong các bệnh do Virus, bệnh nào có khả năng gây dị tật bẩm sinh:",o:{A:"Sốt xuất huyết",B:"Viêm gan B",C:"Zona",D:"Cúm",E:"Sởi"},c:"D",kh:"D",e:"Nhiễm virus (Cúm/Rubella) 3 tháng đầu thai kỳ gây nguy cơ dị tật cao. Đáp án đề: Cúm."},
{n:8,q:"Dị tật bẩm sinh hàm mặt thường gặp là:",o:{A:"Khe hở giữa môi trên",B:"Khe hở bên môi trên",C:"Khe hở giữa môi dưới",D:"Khe hở ngang mặt",E:"Khe hở chéo mặt"},c:"B",kh:"B",e:"Khe hở bên môi trên là dị tật bẩm sinh hàm mặt hay gặp nhất."},
{n:9,q:"Lần phẫu thuật KHM đầu tiên cần ưu tiên nhất là:",o:{A:"Tạo hình lại cánh mũi",B:"Tạo hình nền mũi",C:"Khâu kín khe hở",D:"Phục hồi cơ vòng môi",E:"Tạo lại nhân trung"},c:"D",kh:"D",e:"Ưu tiên phục hồi cơ vòng môi đúng giải phẫu để bảo đảm chức năng và thẩm mỹ."},
{n:10,q:"Các nụ mặt xuất hiện vào tuần thứ mấy của phôi:",o:{A:"Tuần thứ 3",B:"Tuần thứ 4",C:"Tuần thứ 5",D:"Tuần thứ 6",E:"Tuần thứ 7"},c:"A",kh:"A",e:"Đề khoanh tuần thứ 3.",note:"Nhiều tài liệu phôi thai học kinh điển ghi các nụ mặt xuất hiện vào tuần thứ 4. Nên đối chiếu giáo trình đang học."},
{n:11,q:"Chỉ định phẫu thuật tạo hình ở trẻ em:",o:{A:"Phục hồi chức năng nên trì hoãn",B:"Nhu cầu thẩm mỹ đặt lên hàng đầu",C:"Phục hồi chức năng càng sớm càng tốt",D:"Không chỉ định phẫu thuật"},c:"C",kh:"C",e:"Ở trẻ em ưu tiên phục hồi chức năng càng sớm càng tốt (theo thời điểm phù hợp từng dị tật)."},
{n:12,q:"PTTH hàm mặt ở trẻ em thuận lợi hơn ở người lớn vì trẻ em đòi hỏi thẩm mỹ ít.",o:TF,c:"B",kh:"B",e:"Sai. Mô trẻ nhỏ, đang tăng trưởng và tâm lý gia đình phức tạp nên không hề dễ hơn."},
{n:13,q:"Những khó khăn trong PTTH ở người già:",o:{A:"Tình trạng bệnh lý",B:"Sự nuôi dưỡng tổ chức tân tạo, phục hồi kéo dài",C:"Lựa chọn phương pháp vô cảm",D:"Tất cả đều đúng",E:"A và C đúng"},c:"D",kh:"D",e:"Người già có nhiều bệnh nền, mô nuôi dưỡng kém, khó chọn vô cảm → tất cả đều đúng."},
{n:14,q:"Khuôn mặt được tạo thành từ các nụ:",o:{A:"1 nụ trán, 2 hàm trên, 2 hàm dưới",B:"2 nụ trán, 2 hàm trên, 2 hàm dưới",C:"2 nụ trán, 2 hàm trên, hàm dưới",D:"1 nụ trán, 2 hàm trên, hàm dưới",E:"1 nụ mũi, 2 hàm trên, 2 hàm dưới"},c:"A",kh:"A",e:"Mặt tạo từ 1 nụ trán-mũi, 2 nụ hàm trên, 2 nụ hàm dưới."},
{n:15,q:"Theo hình ảnh trên, bệnh nhân được mổ theo phương pháp nào?",o:{A:"Tennisson",B:"Millard",C:"Basky",D:"Veau",E:"Husson – Rose"},c:"A",kh:"A",e:"Theo bản khoanh trên đề, hình ứng với phương pháp Tennisson (vạt tam giác)."},
{n:16,q:"Phức hợp điều trị các khe hở môi – vòm miệng bao gồm:",o:{A:"Chỉnh hình xương hàm, răng",B:"Dạy phát âm",C:"Chăm sóc và nuôi dưỡng",D:"Phẫu thuật",E:"Tất cả các câu"},c:"E",kh:"E",e:"Điều trị đa chuyên khoa gồm tất cả: chăm sóc, phẫu thuật, phát âm, chỉnh hình."},
{n:17,q:"Mục đích của PTTH hàm mặt:",o:{A:"Chức năng",B:"Thẩm mỹ",C:"Sửa chữa khiếm khuyết bẩm sinh, bệnh lý hay chấn thương",D:"A, B đúng",E:"Tất cả đều đúng"},c:"E",kh:"E",e:"PTTH nhằm phục hồi chức năng, thẩm mỹ và sửa chữa khiếm khuyết → tất cả đều đúng."},
{n:18,q:"Nhu cầu thẩm mỹ là chỉ định có tính chất quyết định của PTTH hàm mặt.",o:TF,c:"A",kh:"A",e:"Đề khoanh Đúng – với vùng mặt, nhu cầu thẩm mỹ của bệnh nhân có vai trò quyết định chỉ định.",note:"Trong ngoại khoa tái tạo nói chung, chức năng mới là ưu tiên số 1; câu này còn tùy quan điểm giáo trình."},
{n:19,q:"Chống chỉ định PTTH hàm mặt trong trường hợp:",o:{A:"Bệnh bẩm sinh",B:"Chấn thương",C:"Lao",D:"Viêm gan siêu vi B",E:"Tất cả đều sai"},c:"C",kh:"C",e:"Lao (đang tiến triển) là chống chỉ định phẫu thuật tạo hình có chuẩn bị."},
{n:20,q:"Bệnh nhân sốt rét mà không bị suy dinh dưỡng có thể vừa điều trị, dùng thuốc phòng sốt rét vừa PTTH hàm mặt.",o:TF,c:"B",kh:"B",e:"Đề khoanh Sai – nên điều trị ổn định bệnh toàn thân (sốt rét) trước khi phẫu thuật tạo hình có chuẩn bị."},
{n:21,q:"Theo hình ảnh trên, bệnh nhân được mổ theo phương pháp nào?",o:{A:"Tennisson",B:"Millard",C:"Basky",D:"Veau",E:"Husson – Rose"},c:"B",kh:"B",e:"Theo bản khoanh trên đề, hình các bước ứng với phương pháp Millard (xoay-đẩy)."},
{n:22,q:"Bệnh nhân có KHMVM ảnh hưởng đến:",o:{A:"Dinh dưỡng",B:"Phát âm",C:"Hô hấp",D:"A, B Đúng",E:"Tất cả đúng"},c:"E",kh:"E",e:"Khe hở môi-vòm ảnh hưởng bú/dinh dưỡng, phát âm và cả hô hấp → tất cả đúng."},
{n:23,q:"Nhóm điều trị cho bệnh nhân KHMVM gồm, NGOẠI TRỪ:",o:{A:"Phẫu thuật viên",B:"Nha sĩ",C:"Bác sĩ di truyền",D:"Bố mẹ bệnh nhân",E:"Kĩ thuật viên"},c:"D",kh:"D",e:"Nhóm điều trị chuyên môn gồm phẫu thuật viên, nha sĩ, BS di truyền, KTV… Bố mẹ bệnh nhân không thuộc nhóm điều trị (ngoại trừ)."},
{n:24,q:"Chúng ta có thể can thiệp chỉnh hình trước khi phẫu thuật KHMVM.",o:TF,c:"A",kh:"A",e:"Đúng. Chỉnh hình trước phẫu thuật (nắn chỉnh mũi-ổ răng, NAM) được áp dụng."},
{n:25,q:"Chỉ định PTTH hàm mặt dễ dàng hơn trong các đối tượng sau:",o:{A:"BN có trạng thái tâm lý không bình thường",B:"Người lao động, ít tiếp xúc xã hội",C:"Nhóm BN đánh giá đúng mức độ tật của mình",D:"Tất cả đều sai",E:"Tất cả đều đúng"},c:"C",kh:"C",e:"Bệnh nhân đánh giá đúng, thực tế về mức độ tật của mình sẽ dễ chỉ định và hài lòng sau mổ."},
{n:26,q:"PTTH hàm mặt thuận lợi hơn ở người già và trẻ em.",o:TF,c:"B",kh:"B",e:"Sai. Cả người già và trẻ em đều có nhiều khó khăn riêng."},
{n:27,q:"Theo thuyết nụ mầm, khe hở bên môi trên là do không ráp nối giữa các nụ:",o:{A:"Nụ mũi trong và nụ hàm trên",B:"Nụ mũi giữa và nụ hàm trên",C:"Nụ mũi ngoài và nụ hàm trên",D:"Nụ mũi và nụ trán",E:"Nụ mũi trong và mũi ngoài"},c:"B",kh:"B",e:"Đề khoanh B. Bản chất là nụ mũi trong/giữa (medial nasal) không dính nụ hàm trên → khe hở môi bên.",note:"\"Nụ mũi giữa\" và \"nụ mũi trong\" đều chỉ mỏm mũi trong (medial nasal process). Đáp án A và B về bản chất tương đương."},
{n:28,q:"Sự hình thành khe hở ở vùng mặt là do:",o:{A:"Các nụ không dính với nhau",B:"Các nụ kém phát triển",C:"Các nụ không trải qua trung bì hóa",D:"Các câu trên Đúng",E:"Các câu trên Sai"},c:"D",kh:"D",e:"Khe hở mặt do các nụ không dính, kém phát triển hoặc không trung bì hóa → các câu trên đúng."},
{n:29,q:"Ở bệnh nhân KHM, cơ vòng môi thường bám vào:",o:{A:"Cánh mũi",B:"Nhân trung",C:"Gai mũi trước",D:"A, B Đúng",E:"A, C Đúng"},c:"E",kh:"E",e:"Trong KHM, cơ vòng môi bám lệch vào cánh mũi và gai mũi trước (thay vì đường giữa) → A, C đúng."},
{n:30,q:"Trẻ KHM gây nên các dạng:",o:{A:"Biến dạng ở môi",B:"Biến dạng ở mũi",C:"Rối loạn phát âm",D:"A, B Đúng",E:"A, B và C Đúng"},c:"E",kh:"E",e:"KHM gây biến dạng môi, mũi và rối loạn phát âm → tất cả."},
{n:31,q:"Điều kiện cần và đủ để xây dựng kế hoạch PTTH là phân tích đầy đủ tính chất và mức độ tổn thương.",o:TF,c:"A",kh:"A",e:"Đúng. Phân tích đầy đủ tổn thương là điều kiện cần và đủ để lập kế hoạch."},
{n:32,q:"Mục tiêu của kế hoạch phẫu thuật:",o:{A:"Phương pháp phẫu thuật hợp lý và đơn giản",B:"Thời gian điều trị ngắn",C:"Kết quả chức năng và thẩm mỹ tốt",D:"A và C đúng",E:"Tất cả đều đúng"},c:"E",kh:"E",e:"Kế hoạch tốt hướng đến phương pháp hợp lý, thời gian ngắn, kết quả chức năng-thẩm mỹ tốt."},
{n:33,q:"Trong quá trình thực hiện phẫu thuật nếu gặp khó khăn có thể thay đổi một số chi tiết kế hoạch.",o:TF,c:"A",kh:"A",e:"Đúng. Có thể điều chỉnh chi tiết kế hoạch linh hoạt trong mổ."},
{n:34,q:"Phân tích tổn thương bao gồm:",o:{A:"Vị trí",B:"Kích thước",C:"Hình dạng",D:"Tính phức tạp",E:"Tất cả đều đúng"},c:"E",kh:"E",e:"Phân tích tổn thương gồm vị trí, kích thước, hình dạng, tính phức tạp → tất cả."},
{n:35,q:"Trong tạo hình, sai lầm khó khắc phục nhất là dự kiến thiếu hay \"vừa đủ\" tổ chức.",o:TF,c:"B",kh:"B",e:"Đề khoanh Sai.",note:"Nhiều tài liệu xem việc dự kiến THIẾU mô mới là sai lầm khó khắc phục nhất (nên đáp án có thể là Đúng). Cần đối chiếu giáo trình."},
{n:36,q:"Trong PTTH, chất liệu tạo hình không ảnh hưởng tới việc lựa chọn phương pháp xử lý.",o:TF,c:"B",kh:"B",e:"Sai. Chất liệu (loại mô, độ dày, màu sắc…) ảnh hưởng lớn đến việc chọn phương pháp."},
{n:37,q:"Cơ màn hầu gồm:",o:{A:"Cơ căng màn hầu",B:"Cơ nâng màn hầu",C:"Cơ lưỡi gà",D:"A, B Đúng",E:"A, B và C Đúng"},c:"D",kh:"D",e:"Đề khoanh D (cơ căng + cơ nâng màn hầu).",note:"Vòm miệng mềm thực tế có 5 cơ (căng, nâng màn hầu, cơ lưỡi gà, cơ khẩu cái-lưỡi, cơ khẩu cái-hầu). Vì cơ lưỡi gà cũng thuộc màn hầu nên đáp án E (A,B,C) có thể đầy đủ hơn."},
{n:38,q:"Vạt dồn đẩy là:",o:{A:"Vạt hình V-Y",B:"Vạt hình chữ U",C:"Vạt chữ Z",D:"A, B đúng",E:"A, C đúng"},c:"D",kh:"D",e:"Vạt dồn đẩy (advancement) gồm vạt V-Y và vạt chữ U → A, B đúng."},
{n:39,q:"Vạt hình chữ H là một biến thể trong tạo hình chữ U.",o:TF,c:"A",kh:"A",e:"Đúng. Vạt chữ H là hai vạt chữ U (đẩy hai bên) đối nhau."},

renderQuiz(DATA,'quiz');
function renderQuiz(data,elid){
  const box=document.getElementById(elid);
  data.forEach(item=>{
    const card=document.createElement('div');card.className='q';card.dataset.n=item.n;
    let opts='';for(const k in item.o){opts+=`<button class="opt" data-k="${k}"><span class="lab">${k}.</span>${item.o[k]}</button>`;}
    const noteHtml=item.note?`<div class="note">⚠️ ${item.note}</div>`:'';
    card.innerHTML=`<div class="qtext"><span class="qnum">Câu ${item.n}.</span> ${item.q}</div>${opts}
      <div class="exp"><span class="tag"></span><div class="expbody"></div>
      <div class="kh">Đáp án đúng: <b>${item.c}</b> · Đề khoanh: ${item.kh}</div>${noteHtml}</div>`;
    card.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>choose(card,item,btn.dataset.k)));
    box.appendChild(card);
  });
}
function choose(card,item,k){
  if(card.dataset.answered)return;card.dataset.answered='1';
  const ok=(k===item.c);
  card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
    if(b.dataset.k===item.c)b.classList.add(ok?'correct':'reveal');
    if(b.dataset.k===k&&!ok)b.classList.add('wrong');});
  const exp=card.querySelector('.exp');const tag=exp.querySelector('.tag');
  tag.className='tag '+(ok?'ok':'no');tag.textContent=ok?'✔ Chính xác':'✘ Chưa đúng';
  exp.querySelector('.expbody').textContent=item.e;exp.classList.add('show');
  card.dataset.correct=ok?'1':'0';updateScore();
}
function updateScore(){
  let done=0,right=0;
  document.querySelectorAll('.q').forEach(c=>{if(c.dataset.answered){done++;if(c.dataset.correct==='1')right++;}});
  document.getElementById('done').textContent=done;document.getElementById('right').textContent=right;
}
function revealAll(){
  document.querySelectorAll('.q').forEach(card=>{
    if(card.dataset.answered)return;const item=DATA.find(d=>d.n==card.dataset.n);
    card.dataset.answered='1';card.dataset.correct='';
    card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===item.c)b.classList.add('reveal');});
    const exp=card.querySelector('.exp');const tag=exp.querySelector('.tag');
    tag.className='tag ok';tag.textContent='Đáp án: '+item.c;
    exp.querySelector('.expbody').textContent=item.e;exp.classList.add('show');});
}
function resetAll(){location.reload();}
