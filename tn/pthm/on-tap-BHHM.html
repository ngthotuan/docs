<style>
  :root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--text:#e2e8f0;--muted:#94a3b8;
    --green:#22c55e;--greenbg:#052e16;--red:#ef4444;--redbg:#450a0a;--accent:#38bdf8;--border:#334155;}
  @media (prefers-color-scheme: light){:root{--bg:#f1f5f9;--card:#fff;--card2:#f8fafc;--text:#0f172a;
    --muted:#64748b;--greenbg:#dcfce7;--redbg:#fee2e2;--border:#e2e8f0;}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;padding:16px;}
  .wrap{max-width:820px;margin:0 auto;}
  header{text-align:center;margin-bottom:18px;}
  h1{font-size:20px;margin:0 0 4px;}.sub{color:var(--muted);font-size:14px;}
  .bar{position:sticky;top:0;z-index:10;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .score{font-weight:600;font-size:15px;}.score b{color:var(--accent);}
  .bar button{background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;}
  .bar button:hover{border-color:var(--accent);}
  .q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .qnum{color:var(--accent);font-weight:700;}.qtext{font-weight:600;margin-bottom:12px;}
  .qimg{display:block;max-width:100%;height:auto;margin:0 0 12px;border-radius:10px;border:1px solid var(--border);background:#fff;}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--text);
    border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:15px;transition:.12s;}
  .opt:hover{border-color:var(--accent);}.opt .lab{font-weight:700;margin-right:8px;}
  .opt.correct{background:var(--greenbg);border-color:var(--green);}
  .opt.wrong{background:var(--redbg);border-color:var(--red);}
  .opt.reveal{border-color:var(--green);}.opt:disabled{cursor:default;}
  .exp{margin-top:10px;padding:12px;border-radius:9px;background:var(--card2);border-left:4px solid var(--accent);font-size:14px;display:none;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;margin-bottom:6px;}
  .tag.ok{background:var(--green);color:#04210f;}.tag.no{background:var(--red);color:#fff;}
  .exp .kh{color:var(--muted);font-size:13px;margin-top:6px;}
  .note{color:#f59e0b;font-size:13px;margin-top:6px;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0;}
</style>

const DATA=[
{n:2,q:`Khi rạch da hình elip, trục dài đường rạch nào sau đây phù hợp để khâu không bị dư da?`,o:{A:`Gấp 2 lần chiều rộng`,B:`Gấp 3 lần chiều rộng`,C:`Gấp 4 lần chiều rộng`,D:`Gấp 5 lần chiều rộng`},c:"B",e:`Đường rạch elip nên có chiều dài ≈ 3 lần chiều rộng (góc đỉnh ~30°) để khi khâu không tạo tai chó (dog-ear) / dư da.`},
{n:5,q:`Trong phẫu thuật vùng miệng – hàm mặt, khi cần khâu vết thương niêm mạc với chỉ tự tiêu tổng hợp, loại chỉ nào sau đây phù hợp nhất?`,o:{A:`Vicryl`,B:`Silk`,C:`Catgut`,D:`Chromic`},c:"A",e:`Vicryl (polyglactin 910) là chỉ tự tiêu TỔNG HỢP, phù hợp khâu niêm mạc. Catgut/Chromic là tự tiêu tự nhiên; Silk không tiêu.`},
{n:7,q:`Một trẻ nam 8 tháng tuổi bị khe hở vòm miệng bẩm sinh (khe hở vòm mềm và một phần vòm cứng), bú kém, hay sặc, chưa phát âm bập bẹ rõ. Trẻ phát triển thể chất bình thường. Thời điểm nào thích hợp nhất để tạo hình vòm miệng?`,o:{A:`Ngay ở thời điểm hiện tại`,B:`Khi trẻ được 10–12 tháng tuổi`,C:`Khi trẻ được 12–16 tháng tuổi`,D:`Khi trẻ được 16–18 tháng tuổi`},c:"B",e:`Tạo hình vòm miệng nên thực hiện quanh 10–12 tháng, trước giai đoạn phát âm để tối ưu ngôn ngữ.`,note:`Một số giáo trình ghi rộng hơn 12–18 tháng — nên đối chiếu tài liệu đang học.`},
{n:8,q:`Mũi chỉ khâu nào sau đây sử dụng khi khâu hai mép vết thương căng?`,o:{A:`Mũi đơn`,B:`Mũi liên tục`,C:`Mũi luồn dưới da`,D:`Mũi khâu đệm`},c:"D",e:`Mũi khâu đệm (mattress) phân tán lực căng, giúp áp sát và tránh toác mép khi hai mép căng.`},
{n:10,q:`Khi khâu da vùng mặt, khoảng cách giữa các mũi chỉ khâu là bao nhiêu?`,o:{A:`1–2mm`,B:`1–3mm`,C:`2–3mm`,D:`3–5mm`},c:"C",e:`Da vùng mặt khâu mũi dày, khoảng cách giữa các mũi ~2–3mm để mép da áp sát, sẹo đẹp.`},
{n:12,q:`Bệnh nhân nam 25 tuổi, khuyết hổng phần mềm vùng má 2×2 cm sau cắt u, nền vết thương sạch, mô xung quanh còn tốt. Phương pháp tạo hình nào phù hợp?`,o:{A:`Ghép da rời`,B:`Để lành thứ phát`,C:`Vạt tại chỗ`,D:`Vạt tự do vi phẫu`},c:"C",e:`Khuyết nhỏ, nền sạch, mô lân cận tốt → dùng vạt tại chỗ cho kết quả chức năng và thẩm mỹ tốt nhất.`},
{n:13,q:`Vạt nào sau đây là vạt ngẫu nhiên?`,o:{A:`Vạt dưới cằm`,B:`Vạt trán mũi`,C:`Vạt A-C`,D:`Vạt thái dương`},c:"C",e:`Vạt dưới cằm, trán mũi, thái dương đều là vạt trục (có động mạch định danh). Vạt A-C (xoay–đẩy tại chỗ) là vạt ngẫu nhiên (nuôi bởi đám rối dưới da).`},
{n:16,q:`Bệnh nhân nữ 25 tuổi, mất da vùng cánh mũi trái, đường kính khuyết ~1cm. Bác sĩ thiết kế vạt tạo hình đóng khuyết hổng (hình). Đây là loại vạt gì?`,o:{A:`Vạt trán- mũi`,B:`Vạt hai thùy`,C:`Vạt chữ Z`,D:`Vạt trượt`},c:"B",e:`Khuyết nhỏ ~1cm ở cánh/đầu mũi → vạt hai thùy (bilobed) là lựa chọn kinh điển, huy động da lỏng lẻo lân cận.`,img:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIEAAAB4CAIAAABaXwbWAAAACXBIWXMAAA7EAAAOxAGVKw4bAAABZGlDQ1BJQ0NCYXNlZChSR0IsR29vZ2xlL1NraWEvN0M1RkEyMTUxMzk3NDc0QTA0ODZCQkNDODM3MzNENTkpAAB4nH2QvUrDYBSGH2tBFMVBhw4OGRxc1P5of8ClrVhcW4VWpzRNi9ifkKboBejm4OomLt6A6GUoCA7i4CWIoLNvGiQFqefw5nt485Iv50Akhioah07Xc8ulglGtHRhT70yoh2VafYfxpdT3S5B9Xv0nN66mG3bf0vkhea4u1ycb4sVWwKc+1wO+8PnEczzxtc/uXrkovhOvtEa4PsKW4/r5N/FWpz2wwv9m1u7uV3RWpSVK9NQt2tisU+GYI0xRhiKb7JAnSUKUIEVO7sZQeeJ6ZklTUBfVWb3PSCm2lc75+wyu7N1A9gsmL0OvfgUP5xB7Db1lzTZ/BvePoRfu2DFdc2hFpUizCZ+3MFeDhSeYOfxd7JhZjT+zGuzSxWJNlNQ0CdI/hc1LvY60eocAAFEeSURBVHicjb2HkiRXdiWIf5tdm90haZzlUE+T3Ca7m90AGloWRAGlULpQWqbWKiJDKw+PCI/w0CIjZYnmv+y597z33DMLpK3ZM7fIrESi6h6/91z93gnag6A9bHZGrd447I3b/b12fxL2Js3uKOwN24NxdzgJ+4P2YNAZjrqjyWByMJoejQ+OB3sHvfG0O9rDh9H+EU5/st8fTweT/dH0sLd32B5NB/vHw8OT1miynEj+z3/81SffnF/eSa0k0w9mFt777KtiIxwdvhxNjgaj/eF4fzjZH4z2eoNRpz9uD/a6wyn+Mp3BHp+d3kROd4xnuzMKO6N2F3/bUdDu1VodPKuN1uPns3/5v/72L/7qb67evOMHYUP/qBqE+KNas10Pu/VWF5+9etNrtOpBuxn2Gs0OPtQaIZ4N+dCsBy2/gR8IcCpBUG4EVTxr9WLVx6nU6/mKlyuV88VSvljGh1y5gpMul9LFUrpQeLaw8IePP/7bf/7nP3zy8W8/+vCv//c//Ou//24nvYuzuZvYSGyvbm3Mr6w+nZ29euvW+UuX8fmdequHAyRaIvSJnjHwCDrDVm/YGU56k32czmivO5r2JgeDvePh3vF4/+VwChjkjKb48hio4Dk5OJkcnuDD8OBkfPgKIh4eHDf7w/VU5s6TZz9evfndxauffXP+k6+/W09mJkevh/snk4OX+G3AFUdAHU66w73++GAwORxM8J0DgNEZTLv9PZzeYNrj596kK6iMw86gFfabrV6h5C8urV+9fufB0xeVejPo9CH0WrPjB21fhNuu26echhwAICeQEzS7QcucWtAWqBqtSoATeo0GMCj5NR4Fo1qqVItlL1+uAJJsuZwulzPFUjKbXdncmllaunn//qUbN85f/enW/Xtbu8lEJo3nRmIHZ217a3Vra2F1bXZpCc/Vre13/AB/0V6zI6og0u+OePCdAP/C4R5e5/ZovzM+wOntHfenL/vTE/mwJ8/BFGCcAI/RPkT/cnL4igcAQL56joFfvd0t1YJUwUvkSsl8uQ6dOnw1mB4P5b96NZqeQNwQem+kGA {n:24,q:`Mục đích chính của tạo hình chữ Z là gì?`,o:{A:`Thay đổi vị trí sẹo`,B:`Làm dài sẹo co kéo`,C:`Gián đoạn sẹo`,D:`Bù thiếu chiều ngang`},c:"B",e:`Tạo hình chữ Z chủ yếu để KÉO DÀI theo trục sẹo co kéo (và đổi hướng sẹo). Với góc 60° kéo dài ~75%.`},
{n:27,q:`Loại khe hở nào sau đây là khe hở vùng mặt hiếm gặp?`,o:{A:`Khe hở môi trên`,B:`Khe hở vòm miệng`,C:`Khe hở môi dưới`,D:`Khe hở môi - vòm miệng`},c:"C",e:`Khe hở môi DƯỚI (đường giữa) rất hiếm gặp; khe hở môi trên và môi–vòm mới thường gặp.`},

{n:43,q:`Trong phân loại Kernahan–Stark, mốc giải phẫu nào phân chia khe hở tiền phát và khe hở thứ phát?`,o:{A:`Lỗ khẩu cái`,B:`Lỗ răng cửa`,C:`Lỗ tròn`,D:`Lỗ bầu dục`},c:"B",e:`Lỗ răng cửa (incisive foramen) là mốc chia vòm tiên phát (trước) và thứ phát (sau).`},
{n:54,q:`Bệnh nhi nam 3 tháng tuổi, khe hở kéo dài từ bờ môi đỏ và da môi bên trái, không có khe hở vòm miệng (hình). Theo phân loại khe hở môi, trường hợp này thuộc loại nào?`,o:{A:`Độ I`,B:`Độ II`,C:`Độ III`,D:`KHM toàn bộ`},c:"B",e:`Khe hở qua bờ môi đỏ và một phần da môi nhưng CHƯA tới nền mũi → khe hở môi độ II (không toàn bộ).`,img:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAABqCAIAAADRMz/XAAAACXBIWXMAAA7EAAAOxAGVKw4bAAABZGlDQ1BJQ0NCYXNlZChSR0IsR29vZ2xlL1NraWEvN0M1RkEyMTUxMzk3NDc0QTA0ODZCQkNDODM3MzNENTkpAAB4nH2QvUrDYBSGH2tBFMVBhw4OGRxc1P5of8ClrVhcW4VWpzRNi9ifkKboBejm4OomLt6A6GUoCA7i4CWIoLNvGiQFqefw5nt485Iv50Akhioah07Xc8ulglGtHRhT70yoh2VafYfxpdT3S5B9Xv0nN66mG3bf0vkhea4u1ycb4sVWwKc+1wO+8PnEczzxtc/uXrkovhOvtEa4PsKW4/r5N/FWpz2wwv9m1u7uV3RWpSVK9NQt2tisU+GYI0xRhiKb7JAnSUKUIEVO7sZQeeJ6ZklTUBfVWb3PSCm2lc75+wyu7N1A9gsmL0OvfgUP5xB7Db1lzTZ/BvePoRfu2DFdc2hFpUizCZ+3MFeDhSeYOfxd7JhZjT+zGuzSxWJNlNQ0CdI/hc1LvY60eocAAGdcSURBVHicdL31X13J9i3av993P/edr5xzWuPuBNuw3Q13d3cLcSHBEpwQIAoJMQhRQkK0vTuKxrrP/V/eqBqbCqfvfdWrV9ZerL32qho15xxz1qxaX7ybn/uwMP/hndg+vl/A/v3CHPafPrz789PHP/8Q2x/c/vz46dOHj58+fPrjAz7++eenP/789AlHnz5++PDh06dPf/7xx59//Ik9jj/98enPP//8lyx/LpY/cMGS488f1JlPf7DgBh8/ituivH///t37+Q8f3mG/8G7u/fsFbAsLczjGfn5hdn5+dm5uZm5ebLNz0+J4bmZ2VhzMzL59O/1meuYNzuPM9PSbt9OvseHAd/z2zczs9MwMtrdikxfjTzh+K69ZPH6ttunpt2rD17G9fiPu82Zx//r1q5evXr589eLFi99+++0X3/a72H799edffv2J+1+w/+Wnn37+8Zefsfvx559++PGH5z98/wzb98+ePnv+5NmzJ0+ePHr8ZAr758+fPn32+Ak2fHw69XDq/tTDiampiUePJr+QgC18fLfgA3LBhyW2Pz9++N9/fML2rz8+/gtNKvH7+PH9h4/v0KAfP70HomxrFGLwaUlRGC09/xmtJWXpZeokryeE+DkB4bt57gEekCOE2ICcQHF+EUtu8iRgA4rYCKrAY/YtQcJeAPz2Na4ESAotgbeEX3QIfGXmLeAn3vgrzuPD3Nwcbo0vT4tPgB9Xzs7IMi2BfS3Kq9dvXr58+fvr1y9fvXqBg99//1UC+esvEsIff/z+Z+CHgx9+eP78OQB7+uTR1NSDyfv37t65devW+I0bo9euX7l8+dLw8IWLF4fOnj/Tf7r/5Knuq9dGnjx9+OjhvUdTd30QvpufxYYDyt/H9+8I4R8f3wtB/PSBG8ATTfoRLSrkAB/l9pHiokQHQqkgVEjwGh6ok/97sQC/v2C/FEKACOTwiwAPP+07fr9AOAWii7IIcUVZkAUHhJ8f52VB0wv5nRPXK0kl8MDpM0hyL3rA3DT2i/IHCXsFMADFL7/88lyWZ8+ePZXlwcMHd+/evX37Ntr+yhW0++WRk {n:55,q:`Khuôn mặt được hình thành từ các nụ nào sau đây?`,o:{A:`Nụ trán, mũi, hàm dưới`,B:`Nụ trán, hàm trên, mũi`,C:`Nụ hàm trên, hàm dưới`,D:`Nụ trán, hàm trên, hàm dưới`},c:"D",e:`Mặt tạo từ 1 nụ trán–mũi, 2 nụ hàm trên và 2 nụ hàm dưới → gồm nụ trán, hàm trên, hàm dưới.`},
{n:56,q:`Khi khâu da mũi rời, độ sâu đâm kim ở lớp nào sau đây?`,o:{A:`Thượng bì`,B:`Trung bì`,C:`Mỡ`,D:`Cơ`},c:"B",e:`Mũi khâu da rời cần lấy tới lớp trung bì (dermis) để mép da áp sát và chịu lực, không chỉ ở thượng bì.`},
{n:58,q:`Khuôn mặt hoàn thiện trong khoảng thời gian nào, theo phôi thai học?`,o:{A:`7 tuần`,B:`8 tuần`,C:`9 tuần`,D:`10 tuần`},c:"B",e:`Các nụ mặt dính và hoàn thiện vào cuối thời kỳ phôi, khoảng tuần thứ 8.`,note:`Một số tài liệu ghi 10 tuần (tính cả hoàn tất vòm miệng) — nên đối chiếu giáo trình.`},
{n:59,q:`Bệnh nhân nam 50 tuổi, khuyết hổng xương hàm dưới đoạn 6 cm sau cắt u. Phương pháp phục hồi nào tốt nhất?`,o:{A:`Nẹp titan giữ khoảng`,B:`Ghép xương mào chậu`,C:`Vạt xương mác tự do`,D:`Ghép xương sườn`},c:"C",e:`Khuyết xương hàm dưới đoạn dài (≥6 cm) → vạt xương mác tự do vi phẫu là "tiêu chuẩn vàng" (đủ chiều dài, có cấp máu, cắm implant được).`},
{n:66,q:`Tế bào đóng vai trò giải phóng yếu tố tăng sinh mạch máu trong giai đoạn cầm máu của quá trình lành thương?`,o:{A:`Hồng cầu`,B:`Bạch cầu`,C:`Tiểu cầu`,D:`Tế bào sợi`},c:"C",e:`Giai đoạn cầm máu: tiểu cầu kết tập và giải phóng các yếu tố tăng trưởng (PDGF, VEGF, TGF-β) khởi động tăng sinh mạch.`},
{n:73,q:`Biến chứng đặc trưng nhất của vết thương xây xát không được làm sạch kỹ là gì?`,o:{A:`Sẹo xấu`,B:`Nhiễm trùng`,C:`Nhiễm màu`,D:`Chậm lành thương`},c:"C",e:`Dị vật/bụi bẩn còn sót trong vết xây xát → nhiễm màu (traumatic tattoo / xăm do chấn thương), rất khó xóa về sau.`},
{n:76,q:`Vết thương vùng hàm mặt có thể khâu kín trong thời gian nào sau đây?`,o:{A:`24H`,B:`48H`,C:`72H`,D:`Sau nhiều ngày`},c:"D",e:`Vùng hàm mặt được cấp máu rất phong phú nên vết thương (sạch) vẫn có thể khâu kín kỳ đầu dù đến muộn, sau nhiều ngày.`,note:`Nếu đề nhấn mạnh "thì đầu" thông thường thì mốc hay dùng là 24–72h — đối chiếu giáo trình.`},
{n:77,q:`Bệnh nhân nam 30 tuổi, vết rách da má dài 3 cm, mép hơi căng do mất một phần tổ chức. Cần kỹ thuật khâu giảm lực căng, tránh hoại tử mép, mép da áp sát tốt. Kiểu khâu nào phù hợp nhất?`,o:{A:`Mũi chữ O`,B:`Đệm ngang`,C:`Đệm đứng`,D:`Dưới da`},c:"C",e:`Mũi đệm đứng (vertical mattress) vừa giảm lực căng vừa giúp mép da lộn ra ngoài, áp sát tốt và ít gây thiếu máu mép.`},

{n:84,q:`Bệnh nhân nữ 22 tuổi, xây xát nông vùng má phải, chỉ mất lớp biểu bì, không chảy máu nhiều, không dị vật, đã rửa nước muối sinh lý. Vết thương này thường lành trong khoảng thời gian nào?`,o:{A:`5–7 ngày`,B:`7–10 ngày`,C:`10–12 ngày`,D:`12–15 ngày`},c:"A",e:`Xây xát nông chỉ mất biểu bì → biểu mô hóa nhanh, thường lành trong 5–7 ngày.`,note:`Nếu tính tái tạo biểu bì hoàn toàn, một số tài liệu ghi 7–10 ngày.`},
{n:85,q:`Bệnh nhân nam 35 tuổi, vết thương dập nát vùng cằm do tai nạn 12 giờ trước, nhiều dị vật, mô bầm dập. Xử trí nào phù hợp?`,o:{A:`Khâu kín ngay`,B:`Cắt lọc + khâu kín`,C:`Cắt lọc + để hở, khâu trì hoãn`,D:`Để hở + khâu trì hoãn`},c:"C",e:`Vết thương dập nát, nhiều dị vật, đến muộn (12h) → cắt lọc kỹ mô hoại tử/dị vật rồi để hở, khâu trì hoãn tránh nhiễm trùng.`},
{n:86,q:`Vòm miệng cứng được tạo thành từ nụ nào sau đây?`,o:{A:`Nụ hàm trên`,B:`Nụ khẩu cái`,C:`Nụ chân bướm hàm`,D:`Nụ trán`},c:"B",e:`Vòm miệng cứng (vòm thứ phát) hình thành từ hai nụ (mấu) khẩu cái của mỏm hàm trên dính vào nhau.`},
{n:87,q:`Tế bào đóng vai trò quan trọng trong giai đoạn đầu của liền thương (giai đoạn viêm)?`,o:{A:`Hồng cầu`,B:`Bạch cầu`,C:`Tiểu cầu`,D:`Tế bào sợi`},c:"B",e:`Giai đoạn viêm: bạch cầu (trung tính rồi đại thực bào) dọn dẹp vi khuẩn, mô hoại tử và điều hòa lành thương.`},
{n:91,q:`Vạt chữ Z còn được gọi là vạt gì?`,o:{A:`Chuyển vị`,B:`Hoán vị`,C:`Xoay`,D:`Đảo`},c:"A",e:`Vạt chữ Z là vạt chuyển vị (transposition) – chuyển hai vạt tam giác kế cận sang vị trí của nhau.`,note:`Một số giáo trình gọi là vạt "hoán vị" (hai tam giác đổi chỗ) — về bản chất tương đương.`},
{n:96,q:`Đường kính chỉ nào sau đây thích hợp để khâu da vùng mặt nhằm hạn chế sẹo?`,o:{A:`3.0–4.0`,B:`4.0–5.0`,C:`5.0–6.0`,D:`6.0–7.0`},c:"C",e:`Da mặt cần chỉ nhỏ để hạn chế sẹo, thường dùng 5-0 đến 6-0.`},
{n:98,q:`Trong các loại vạt sau, vạt nào thuộc nhóm vạt đảo (island flap)?`,o:{A:`Vạt dưới cằm`,B:`Vạt trán mũi`,C:`Vạt hai thùy`,D:`Vạt thái dương`},c:"A",e:`Vạt dưới cằm (submental artery island flap) là vạt đảo điển hình: đảo da nuôi chỉ bằng cuống mạch.`},
{n:99,q:`Trong quá trình phát triển phôi thai, khe hở môi hình thành chủ yếu do cơ chế nào sau đây?`,o:{A:`Không hợp nhất giữa hai nụ hàm trên`,B:`Không hợp nhất giữa nụ mũi giữa và nụ hàm trên`,C:`Không hợp nhất giữa nụ mũi bên và nụ hàm trên`,D:`Không hợp nhất giữa nụ mũi giữa và nụ mũi bên`},c:"B",e:`Khe hở môi (bên) do nụ mũi giữa (medial nasal) không hợp nhất với nụ hàm trên (maxillary) cùng bên.`},
{n:100,q:`Vạt ngẫu nhiên được cấp máu bởi nguồn mạch máu nào sau đây?`,o:{A:`Một nhánh động mạch`,B:`Đám rối dưới da`,C:`Nhiều nhánh động mạch`,D:`Động mạch và tĩnh mạch`},c:"B",e:`Vạt ngẫu nhiên không có động mạch trục định danh; được nuôi bởi đám rối mạch dưới da/dưới trung bì.`}
];
renderQuiz(DATA,'quiz');
function renderQuiz(data,elid){
  const box=document.getElementById(elid);
  data.forEach(item=>{
    const card=document.createElement('div');card.className='q';card.dataset.n=item.n;
    let opts='';for(const k in item.o){opts+=`<button class="opt" data-k="${k}"><span class="lab">${k}.</span>${item.o[k]}</button>`;}
    const noteHtml=item.note?`<div class="note">⚠️ ${item.note}</div>`:'';
    const imgHtml=item.img?`<img class="qimg" src="${item.img}" alt="Hình câu ${item.n}">`:'';
    card.innerHTML=`<div class="qtext"><span class="qnum">Câu ${item.n}.</span> ${item.q}</div>${imgHtml}${opts}
      <div class="exp"><span class="tag"></span><div class="expbody"></div>
      <div class="kh">Đáp án đúng: <b>${item.c}</b></div>${noteHtml}</div>`;
    card.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>choose(card,item,btn.dataset.k)));
    box.appendChild(card);
  });
}
function choose(card,item,k){
  if(card.dataset.answered)return;card.dataset.answered='1';
  const ok=(k===item.c);
  card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
    if(b.dataset.k===item.c)b.classList.add(ok?'correct':'reveal');
    if(b.dataset.k===k&&!ok)b.classList.add('wrong');});
  const exp=card.querySelector('.exp');const tag=exp.querySelector('.tag');
  tag.className='tag '+(ok?'ok':'no');tag.textContent=ok?'✔ Chính xác':'✘ Chưa đúng';
  exp.querySelector('.expbody').textContent=item.e;exp.classList.add('show');
  card.dataset.correct=ok?'1':'0';updateScore();
}
function updateScore(){
  let done=0,right=0;
  document.querySelectorAll('.q').forEach(c=>{if(c.dataset.answered){done++;if(c.dataset.correct==='1')right++;}});
  document.getElementById('done').textContent=done;document.getElementById('right').textContent=right;
}
function revealAll(){
  document.querySelectorAll('.q').forEach(card=>{
    if(card.dataset.answered)return;const item=DATA.find(d=>d.n==card.dataset.n);
    card.dataset.answered='1';card.dataset.correct='';
    card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===item.c)b.classList.add('reveal');});
    const exp=card.querySelector('.exp');const tag=exp.querySelector('.tag');
    tag.className='tag ok';tag.textContent='Đáp án: '+item.c;
    exp.querySelector('.expbody').textContent=item.e;exp.classList.add('show');});
}
function resetAll(){location.reload();}
</script>
