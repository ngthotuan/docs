<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập PTHM – Đề 2019-2020 (RHM5)</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--text:#e2e8f0;--muted:#94a3b8;
    --green:#22c55e;--greenbg:#052e16;--red:#ef4444;--redbg:#450a0a;--accent:#38bdf8;--border:#334155;}
  @media (prefers-color-scheme: light){:root{--bg:#f1f5f9;--card:#fff;--card2:#f8fafc;--text:#0f172a;
    --muted:#64748b;--greenbg:#dcfce7;--redbg:#fee2e2;--border:#e2e8f0;}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;padding:16px;}
  .wrap{max-width:820px;margin:0 auto;}
  header{text-align:center;margin-bottom:18px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:14px;}
  .bar{position:sticky;top:0;z-index:10;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .score{font-weight:600;font-size:15px;}.score b{color:var(--accent);}
  .bar button{background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;}
  .bar button:hover{border-color:var(--accent);}
  .sec{margin:20px 0 8px;font-weight:700;color:var(--accent);font-size:15px;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .qnum{color:var(--accent);font-weight:700;}.qtext{font-weight:600;margin-bottom:12px;}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--text);
    border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:15px;transition:.12s;}
  .opt:hover{border-color:var(--accent);}.opt .lab{font-weight:700;margin-right:8px;}
  .opt.correct{background:var(--greenbg);border-color:var(--green);}
  .opt.wrong{background:var(--redbg);border-color:var(--red);}
  .opt.reveal{border-color:var(--green);}.opt:disabled{cursor:default;}
  .exp{margin-top:10px;padding:12px;border-radius:9px;background:var(--card2);border-left:4px solid var(--accent);font-size:14px;display:none;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;margin-bottom:6px;}
  .tag.ok{background:var(--green);color:#04210f;}.tag.no{background:var(--red);color:#fff;}
  .exp .kh{color:var(--muted);font-size:13px;margin-top:6px;}
  .note{color:#f59e0b;font-size:13px;margin-top:6px;}
  .showbtn{background:var(--accent);color:#04263a;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Ôn tập Phẫu thuật Hàm mặt</h1>
  <div class="sub">Đề thi 2019-2020 · Lớp RHM5 · HKI · Đề B</div>
</header>
<div class="bar">
  <div class="score">Đúng: <b id="right">0</b> / <span id="done">0</span> · Trắc nghiệm 25 câu</div>
  <button onclick="revealAll()">Hiện hết đáp án</button>
  <button onclick="resetAll()">Làm lại</button>
</div>
<div class="sec">Phần trắc nghiệm (câu 1–24, 27)</div>
<div id="quiz"></div>
<div class="sec">Phần điền khuyết / tự luận (câu 25, 26, 28–35) — bấm để xem đáp án</div>
<div id="essay"></div>
<footer>Đáp án xác định theo y khoa &amp; đối chiếu bản khoanh/điền trên đề. Câu có ⚠️ là câu cần lưu ý.</footer>
</div>
<script>

{n:2,q:"Các nụ mũi được hình thành từ:",o:{A:"Nụ hàm trên",B:"Nụ hàm dưới",C:"Nụ trán",D:"Nụ mặt"},c:"C",kh:"C",e:"Các nụ mũi (trong, ngoài) phát triển từ nụ trán-mũi (frontonasal)."},

{n:23,q:"Đường rạch da hình elip, trục dài lý tưởng:",o:{A:"Gấp 2 lần chiều rộng",B:"Gấp 3 lần chiều rộng",C:"Gấp 4 lần chiều rộng",D:"Gấp 5 lần chiều rộng"},c:"B",kh:"B",e:"Đường rạch hình thoi/elip lý tưởng có trục dài gấp ~3 lần trục ngang."},

{n:27,q:"Vạt chữ Z:",o:{A:"Lần đầu được mô tả bởi Berger (Fricke)",B:"Vạt có cuống",C:"Chỉ định làm dài sẹo (co kéo)",D:"Có thể nhiều chữ Z"},c:"D",kh:"D",e:"Vạt chữ Z có thể thực hiện dạng nhiều chữ Z liên tiếp (multiple Z-plasty) trên một sẹo dài. Đề khoanh D."}
];
const ESSAY=[
{n:25,q:"Vạt chữ Z còn được gọi là vạt: ……",a:"Vạt hoán vị (transposition flap).",e:"Vạt chữ Z là dạng vạt hoán vị – hoán đổi vị trí hai vạt tam giác kế cận."},
{n:26,q:"Tác dụng của vạt chữ Z: …… (3 ý)",a:"1) Kéo dài sẹo co kéo; 2) Làm phân tán hoặc gián đoạn sẹo thẳng; 3) Sắp xếp lại hướng của sẹo theo các nếp nhăn tự nhiên.",e:"Ba tác dụng chính của Z-plasty trong tạo hình sẹo."},
{n:28,q:"Bệnh nhân nữ 25 tuổi, tai nạn lao động mất da vùng cánh mũi phải, đường kính khuyết ~1cm. Loại vạt sử dụng: ……",a:"Vạt xoay-đẩy (vạt xoay đẩy).",e:"Khuyết da cánh mũi nhỏ ~1cm dùng vạt xoay-đẩy tại chỗ để che phủ."},
{n:29,q:"Phân loại vạt: …… (có 5 cách phân loại)",a:"5 cách phân loại vạt: (1) Theo nguồn cấp máu: vạt ngẫu nhiên / vạt trục / vạt đảo. (2) Theo vị trí: vạt tại chỗ / lân cận / xa. (3) Theo hình dáng: vạt tam giác, chữ Z, hình thoi, hai thùy… (4) Theo thành phần cấu tạo: vạt 1 thành phần / vạt hỗn hợp (≥2 lớp). (5) Theo cách chuyển vạt: vạt đẩy, trượt, xoay, chuyển vị, hoán vị, ghép.",e:"Đây là phần trình bày phân loại vạt đầy đủ 5 tiêu chí."},
{n:30,q:"Đặc điểm của trẻ bị hội chứng Van der Woude là: ……",a:"Khe hở môi/vòm miệng (KHM/VM) kèm lỗ dò (tịt) môi dưới.",e:"Van der Woude là hội chứng KHM/VM di truyền trội, đặc trưng bởi lỗ dò môi dưới."},
{n:31,q:"Vạt vi phẫu nằm trong nhóm vạt phân loại nào? ……",a:"Nhóm vạt xa – vạt lân cận/vạt xa tự do (phân loại theo vị trí).",e:"Vạt vi phẫu (free flap) là vạt xa được chuyển tự do, nối mạch bằng vi phẫu."},
{n:32,q:"KHM trên một bên độ I ảnh hưởng đến: ……",a:"Phát âm (chủ yếu ảnh hưởng âm môi).",e:"Khe hở môi một bên độ I mức nhẹ, chủ yếu ảnh hưởng phát âm âm môi và thẩm mỹ."},
{n:33,q:"Chỉ tự tiêu có nguồn gốc tự nhiên được tiêu hủy bằng cơ chế: ……",a:"Phân giải protein (proteolysis) bằng enzyme.",e:"Chỉ tự nhiên (catgut) tiêu bằng phân giải protein; chỉ tổng hợp tiêu bằng thủy phân."},
{n:34,q:"Tạo hình môi bằng vạt xoay-đẩy còn được gọi là: ……",a:"Phương pháp Millard (vạt xoay-đẩy Millard).",e:"Kỹ thuật rotation-advancement của Millard là chuẩn vàng tạo hình khe hở môi."},
{n:35,q:"Nguyên tắc số 10 trong phẫu thuật môi gồm: …… (3đ)",a:"• > 10 tuần tuổi • ≥ 10 lbs (cân nặng ~4,5 kg) • Hemoglobin > 10 g/100ml (và bạch cầu < 10.000/mm³).",e:"\"Rule of 10s\" – tiêu chuẩn an toàn để phẫu thuật môi lần đầu."}
];
renderQuiz(DATA,'quiz');
renderEssay(ESSAY,'essay');
function renderQuiz(data,elid){
  const box=document.getElementById(elid);
  data.forEach(item=>{
    const card=document.createElement('div');card.className='q';card.dataset.n=item.n;
    let opts='';for(const k in item.o){opts+=`<button class="opt" data-k="${k}"><span class="lab">${k}.</span>${item.o[k]}</button>`;}
    const noteHtml=item.note?`<div class="note">⚠️ ${item.note}</div>`:'';
    card.innerHTML=`<div class="qtext"><span class="qnum">Câu ${item.n}.</span> ${item.q}</div>${opts}
      <div class="exp"><span class="tag"></span><div class="expbody"></div>
      <div class="kh">Đáp án đúng: <b>${item.c}</b> · Đề khoanh: ${item.kh}</div>${noteHtml}</div>`;
    card.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>choose(card,item,btn.dataset.k)));
    box.appendChild(card);
  });
}
function renderEssay(data,elid){
  const box=document.getElementById(elid);
  data.forEach(item=>{
    const card=document.createElement('div');card.className='q';
    card.innerHTML=`<div class="qtext"><span class="qnum">Câu ${item.n}.</span> ${item.q}</div>
      <button class="showbtn">Xem đáp án</button>
      <div class="exp"><span class="tag ok">Đáp án</span><div class="expbody"><b>${item.a}</b><br><span style="color:var(--muted)">${item.e}</span></div></div>`;
    const btn=card.querySelector('.showbtn');const exp=card.querySelector('.exp');
    btn.addEventListener('click',()=>{exp.classList.toggle('show');btn.textContent=exp.classList.contains('show')?'Ẩn đáp án':'Xem đáp án';});
    box.appendChild(card);
  });
}
function choose(card,item,k){
  if(card.dataset.answered)return;card.dataset.answered='1';
  const ok=(k===item.c);
  card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
    if(b.dataset.k===item.c)b.classList.add(ok?'correct':'reveal');
    if(b.dataset.k===k&&!ok)b.classList.add('wrong');});
  const exp=card.querySelector('.exp');const tag=exp.querySelector('.tag');
  tag.className='tag '+(ok?'ok':'no');tag.textContent=ok?'✔ Chính xác':'✘ Chưa đúng';
  exp.querySelector('.expbody').textContent=item.e;exp.classList.add('show');
  card.dataset.correct=ok?'1':'0';updateScore();
}
function updateScore(){
  let done=0,right=0;
  document.querySelectorAll('#quiz .q').forEach(c=>{if(c.dataset.answered){done++;if(c.dataset.correct==='1')right++;}});
  document.getElementById('done').textContent=done;document.getElementById('right').textContent=right;
}
function revealAll(){
  document.querySelectorAll('#quiz .q').forEach(card=>{
    if(card.dataset.answered)return;const item=DATA.find(d=>d.n==card.dataset.n);
    card.dataset.answered='1';card.dataset.correct='';
    card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===item.c)b.classList.add('reveal');});
    const exp=card.querySelector('.exp');const tag=exp.querySelector('.tag');
    tag.className='tag ok';tag.textContent='Đáp án: '+item.c;
    exp.querySelector('.expbody').textContent=item.e;exp.classList.add('show');});
}
function resetAll(){location.reload();}
</script>
