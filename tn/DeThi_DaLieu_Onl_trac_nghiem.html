<script>
const DATA=[{"n": 1, "q": "Thương tổn da có giới hạn rõ, mất cảm giác ở trung tâm, xét nghiệm vi khuẩn thường âm tính là đặc tính của bệnh Phong thể:", "o": {"A": "I (bất định)", "B": "T (củ)", "C": "Tất cả đều sai", "D": "L (u)", "E": "B (trung gian)"}, "c": "B", "e": "Phong thể củ (Tuberculoid – T): tổn thương giới hạn rõ, mất cảm giác rõ ở trung tâm, chỉ số vi khuẩn (BI) thường âm tính do miễn dịch tế bào mạnh."}, {"n": 2, "q": "Đặc điểm U hạt Majocchi:", "o": {"A": "Do sự lây lan vào tuyến bã và tuyến mồ hôi gây tăng sinh u hạt", "B": "Tổn thương do nấm Candida lan toả", "C": "Do sự phát triển quá phát nấm mốc trong nang lông và tuyến bã", "D": "Do sự thâm nhập nấm sợi vào tổ chức nang lông gây phản ứng viêm tạo u hạt", "E": "Không liên quan do nấm"}, "c": "D", "e": "U hạt Majocchi: nấm sợi (dermatophyte, thường T. rubrum) xâm nhập sâu xuống nang lông và trung bì gây phản ứng viêm tạo u hạt."}, {"n": 3, "q": "Tác nhân thường gặp nhất gây các bệnh nhiễm khuẩn ở da ở các nước phát triển là:", "o": {"A": "Streptococcus pyogenes", "B": "Propionibacterium acnes", "C": "Pseudomonas aeruginosa", "D": "Staphylococcus aureus", "E": "Staphylococcus epidermidis"}, "c": "D", "e": "Tụ cầu vàng (Staphylococcus aureus) là tác nhân thường gặp nhất gây nhiễm khuẩn da."}, {"n": 4, "q": "MRSA có đặc điểm sau:", "o": {"A": "CA-MRSA khó trị hơn HA-MRSA", "B": "CA-MRSA đề kháng với nhiều loại kháng sinh kể cả aminoglycosid", "C": "CA-MRSA là tụ cầu vàng kháng methicillin trong môi trường y tế", "D": "Tất cả đều đúng", "E": "Clindamycin có thể được dùng để điều trị CA-MRSA"}, "c": "E", "e": "CA-MRSA (mắc phải cộng đồng) thường ít kháng thuốc hơn HA-MRSA và có thể điều trị bằng clindamycin, TMP-SMX... HA-MRSA mới là loại trong môi trường y tế."}, {"n": 5, "q": "Điều trị sùi mào gà, câu nào sau đây đúng:", "o": {"A": "Dùng thuốc điều trị đặc hiệu sẽ hết nhanh", "B": "Sau khi huỷ tổn thương sùi mào gà chắc chắn không tái phát", "C": "Phẫu thuật không được chỉ định đối với tổn thương lớn", "D": "Tất cả đều đúng", "E": "Có rất nhiều phương pháp để huỷ tổn thương sùi mào gà"}, "c": "E", "e": "Chưa có thuốc đặc hiệu diệt sạch HPV; có nhiều phương pháp hủy tổn thương (podofilox, TCA, imiquimod, nitơ lỏng, laser…); bệnh vẫn có thể tái phát."}, {"n": 6, "q": "Phân loại bệnh phong theo hội nghị Madrid (1953):", "o": {"A": "T", "B": "B", "C": "L", "D": "Tất cả đều đúng", "E": "I"}, "c": "D", "e": "Phân loại Madrid 1953 gồm 4 nhóm: I (bất định), T (củ), B (trung gian), L (u). Do đó 'tất cả đều đúng'.", "note": "Câu về bệnh Phong không nằm trong bài giảng De10-19, đối chiếu thêm giáo trình phong."}, {"n": 7, "q": "Bệnh nhân có TPHA (+) và RPR 1/64 được điều trị theo phác đồ và xét nghiệm lại sau 1 tuần, kết quả nào sau đây phù hợp:", "o": {"A": "TPHA (+), RPR 1/64", "B": "TPHA (+), RPR 1/16", "C": "TPHA (+), RPR 1/32", "D": "TPHA (-), RPR 1/64", "E": "TPHA (-), RPR 1/32"}, "c": "A", "e": "TPHA (+) tồn tại suốt đời (sẹo huyết thanh). Hiệu giá RPR chỉ giảm rõ sau 3 tháng (giảm 4 lần), 6 tháng (16 lần); sau 1 tuần gần như chưa đổi → TPHA (+), RPR 1/64."}, {"n": 8, "q": "Chẩn đoán phân biệt sùi mào gà thường gặp nhất ở nam giới:", "o": {"A": "U mềm lây", "B": "Lichen", "C": "Tất cả đều đúng", "D": "Ghẻ", "E": "Sẩn hạt ngọc dương vật (pearly penile papules)"}, "c": "E", "e": "Ở nam, CĐPB sùi mào gà thường gặp nhất là sẩn hạt ngọc dương vật (pearly penile papules) — phân bố đối xứng thành hàng, mềm, acid acetic không làm trắng khu trú."}, {"n": 9, "q": "Đa hoá trị liệu trong bệnh Phong thể ít khuẩn (PB):", "o": {"A": "Rifampicin-Clofazimin-Dapson", "B": "Rifampicin-Dapson", "C": "Rifampicin-Minocycline", "D": "Rifampicin-Quinolon", "E": "Quinolon-Dapson-Clarithromycin"}, "c": "B", "e": "Phác đồ WHO cho phong thể ít khuẩn (PB): Rifampicin + Dapson. Thể nhiều khuẩn (MB) thêm Clofazimin.", "note": "Bệnh Phong ngoài phạm vi bài giảng De10-19; đối chiếu phác đồ WHO/BYT."}, {"n": 10, "q": "Tổn thương sẩn lõm giữa (umbilicated papule) gặp trong bệnh lý nào sau đây:", "o": {"A": "Sùi mào gà", "B": "Hạt cơm", "C": "Viêm nang lông", "D": "U mềm lây (molluscum contagiosum)", "E": "Mày đay"}, "c": "D", "e": "Sẩn lõm giữa (rốn lõm trung tâm) là đặc trưng của u mềm lây (molluscum contagiosum)."}, {"n": 11, "q": "Xét nghiệm nào sau đây là xét nghiệm huyết thanh giang mai KHÔNG đặc hiệu:", "o": {"A": "VDRL, RPR", "B": "VDRL, FTA", "C": "TPHA, VDRL", "D": "TPHA, RPR", "E": "TPI, FTA"}, "c": "A", "e": "Xét nghiệm không đặc hiệu (kháng cardiolipin): VDRL, RPR. Các xét nghiệm đặc hiệu: TPHA, FTA, TPI."}, {"n": 12, "q": "Vị trí tổn thương đặc trưng của bệnh chốc:", "o": {"A": "Kẽ ngón tay", "B": "Vùng tì đè", "C": "Vùng sinh dục", "D": "Tay chân", "E": "Quanh hốc tự nhiên (mũi, miệng)"}, "c": "E", "e": "Chốc (impetigo) hay gặp quanh các hốc tự nhiên (quanh mũi, miệng) với vảy tiết màu vàng mật ong."}, {"n": 13, "q": "Khi mẹ bị nhiễm lậu cầu, trẻ sơ sinh có khả năng:", "o": {"A": "Viêm âm hộ", "B": "Viêm hậu môn", "C": "Viêm niệu đạo", "D": "Viêm họng", "E": "Viêm kết mạc mủ"}, "c": "E", "e": "Trẻ sơ sinh của mẹ nhiễm lậu có nguy cơ viêm kết mạc mủ (lậu mắt sơ sinh – ophthalmia neonatorum) khi sinh qua đường âm đạo."}, {"n": 14, "q": "Sự khác biệt giữa sẩn và mụn nước là:", "o": {"A": "Tổn thương cơ bản nguyên phát hay thứ phát", "B": "Vị trí", "C": "Tất cả câu trên đều đúng", "D": "Kích thước", "E": "Tổ chức đặc hay lỏng"}, "c": "E", "e": "Sẩn (papule) là tổn thương chắc đặc; mụn nước (vesicle) chứa dịch lỏng — khác nhau ở tổ chức đặc hay lỏng."}, {"n": 15, "q": "Tác nhân thường gặp nhất gây bệnh chốc:", "o": {"A": "Streptococcus pyogenes", "B": "Staphylococcus aureus và Pseudomonas aeruginosa", "C": "Staphylococcus aureus", "D": "Streptococcus pyogenes và Staphylococcus aureus", "E": "Pseudomonas aeruginosa"}, "c": "C", "e": "Tác nhân thường gặp nhất gây chốc là Staphylococcus aureus (chốc bọng nước hầu hết do tụ cầu vàng).", "note": "Một số câu khác trong đề hỏi 'các tác nhân' (số nhiều) thì đáp án là S.aureus + S.pyogenes."}, {"n": 16, "q": "Hội chứng Stevens-Johnson liên quan đến tổn thương da:", "o": {"A": "10%", "B": "Tất cả đều sai", "C": "Dưới 10%", "D": "Trên 10%", "E": "Dưới 20%"}, "c": "C", "e": "SJS: diện tích bong da/tổn thương < 10% diện tích cơ thể; TEN (Lyell) > 30%; thể chồng lấp 10-30%."}, {"n": 17, "q": "Ở nữ giới, triệu chứng của nhiễm lậu cầu hay gặp là:", "o": {"A": "Viêm hậu môn - trực tràng và viêm âm đạo - âm hộ", "B": "Viêm niệu đạo và viêm nội mạc tử cung", "C": "Viêm cổ tử cung và viêm kết mạc", "D": "Viêm niệu đạo và viêm cổ tử cung", "E": "Viêm nội mạc tử cung và viêm tiểu khung"}, "c": "D", "e": "Ở nữ, lậu hay gây viêm cổ tử cung và viêm niệu đạo."}, {"n": 18, "q": "Bệnh nào có tổn thương cơ bản là dát (macule):", "o": {"A": "Vảy nến", "B": "Chàm", "C": "Lang ben", "D": "Giang mai 1", "E": "Mụn trứng cá"}, "c": "C", "e": "Lang ben có tổn thương cơ bản là dát (thay đổi sắc tố). Vảy nến = mảng có vảy; chàm = mụn nước/mảng; giang mai 1 = săng (loét); trứng cá = sẩn/mụn mủ."}, {"n": 19, "q": "Ban đỏ dạng dát sẩn (do thuốc) có các biểu hiện sau, NGOẠI TRỪ:", "o": {"A": "Tiến triển lành tính", "B": "Đôi khi ngứa", "C": "Khu trú chủ yếu ở thân chi", "D": "Có thể có nội ban", "E": "Sốt rất cao"}, "c": "E", "e": "Ban đỏ dạng dát sẩn do thuốc thường lành tính, đôi khi ngứa, khu trú ở thân-chi, có thể kèm nội ban; KHÔNG gây sốt rất cao (sốt cao gợi ý thể nặng)."}, {"n": 20, "q": "Tổn thương bằng mặt da, có màu đỏ, dấu ấn kính (+) gọi là:", "o": {"A": "Dát sung huyết", "B": "Bớt bẩm sinh", "C": "Dát xuất huyết", "D": "Dát tăng sắc tố", "E": "Mảng bầm máu"}, "c": "A", "e": "Dát đỏ do giãn mạch (sung huyết) sẽ mất màu khi ấn kính → dấu ấn kính (+). Dát xuất huyết thì ấn kính không mất màu."}, {"n": 21, "q": "Hồng ban cố định nhiễm sắc:", "o": {"A": "Thường xuất hiện tại vị trí cũ và vị trí mới khi tiếp xúc lại với thuốc", "B": "Sinh thiết giúp chẩn đoán xác định", "C": "Tổn thương là dát tròn/bầu dục có màu tím", "D": "Tất cả đều đúng", "E": "Xuất hiện từ 30 phút đến 8 giờ sau tiếp xúc với thuốc"}, "c": "D", "e": "Hồng ban cố định nhiễm sắc: tái phát tại vị trí cũ (và có thể vị trí mới) khi dùng lại thuốc, tổn thương dát tròn/bầu dục màu tím/nâu, xuất hiện sau vài giờ — tất cả đều đúng."}, {"n": 22, "q": "Thuốc điều trị sùi mào gà theo cơ chế kích thích miễn dịch tại chỗ:", "o": {"A": "Bleomycin", "B": "Imiquimod", "C": "TCA", "D": "Podofilox", "E": "5-FU"}, "c": "B", "e": "Imiquimod kích thích miễn dịch tại chỗ (tăng sản xuất interferon và cytokine). TCA/podofilox/5-FU/bleomycin là cơ chế hủy hoại/độc tế bào."}, {"n": 23, "q": "Dịch xuất tiết điển hình trong bệnh lậu có đặc điểm, NGOẠI TRỪ:", "o": {"A": "Dịch số lượng nhiều", "B": "Dịch màu hơi vàng", "C": "Dịch loãng dễ chảy ra", "D": "Dịch mủ", "E": "Dịch nhầy"}, "c": "E", "e": "Dịch mủ niệu đạo do lậu: số lượng nhiều, màu vàng/trắng đục, loãng dễ chảy, là dịch mủ. Dịch nhầy trong (không mủ) gợi ý Chlamydia hơn.", "note": "Đối chiếu thêm; đề có thể coi đáp án khác."}, {"n": 24, "q": "Đặc điểm lâm sàng nhiễm lậu cầu ở nam giới, NGOẠI TRỪ:", "o": {"A": "Mủ chảy ra tự nhiên hoặc khi vuốt", "B": "Miệng sáo sưng đỏ", "C": "Dịch mủ niệu đạo có màu hơi vàng", "D": "Rấm rứt ở niệu đạo", "E": "Những lần mắc bệnh sau thường gặp tiểu buốt, tiểu rắt"}, "c": "E", "e": "Lậu nam cấp tính: mủ niệu đạo vàng chảy tự nhiên/khi vuốt, miệng sáo sưng đỏ, rấm rứt niệu đạo. 'Những lần mắc sau nặng hơn' không phải đặc điểm điển hình.", "note": "Câu 'ngoại trừ', đối chiếu thêm giáo trình."}, {"n": 25, "q": "Đặc điểm nhiễm nấm nông tại da:", "o": {"A": "Nhiễm nấm sợi do lây từ người thường có phản ứng viêm mạnh", "B": "Hầu hết bệnh nhân nhiễm Candida là do suy giảm miễn dịch", "C": "Các bệnh nhân làm vườn chỉ có nguy cơ nhiễm nấm sâu", "D": "Nguy cơ lây nhiễm cao ở các bệnh nhân tiếp xúc nhiều với động vật và gia súc", "E": "Tất cả các trường hợp nhiễm nấm cần điều trị tích cực bằng đường hệ thống"}, "c": "D", "e": "Nấm sợi ưa động vật (zoophilic) lây từ động vật/gia súc gây phản ứng viêm mạnh; người tiếp xúc nhiều động vật có nguy cơ lây cao. Nấm lây từ người (anthropophilic) thường viêm nhẹ, mạn tính."}, {"n": 26, "q": "Đặc điểm lâm sàng nhiễm nấm sợi thân mình:", "o": {"A": "Mụn nước/mụn mủ thường mọc ở bờ viền tổn thương kèm vảy da", "B": "Hiếm khi lan toả toàn thân", "C": "Viêm nhiều khi nguồn lây từ người sang người", "D": "Tiến triển hướng tâm và có nhiều vảy da kèm mụn mủ vệ tinh", "E": "Mảng hồng ban ranh giới mờ và có nhiều vảy"}, "c": "A", "e": "Nấm thân (hắc lào): mảng đỏ giới hạn rõ, tiến triển ly tâm (trung tâm lành), bờ hoạt động có vảy và mụn nước/mụn mủ ở rìa tổn thương."}, {"n": 27, "q": "Bệnh nhân 63 tuổi: ngứa, da khô, tổn thương dày sừng và tróc vảy vùng khoeo tay, cẳng chân, tái phát nhiều lần. Định hướng thăm khám da vị trí nào được chú ý nhiều?", "o": {"A": "Vùng tì đè nhiều: mông, gối, khuỷu tay", "B": "Vùng phơi bày ánh sáng: cổ, ngực", "C": "Vùng nếp gấp: khoeo tay, cổ chân, cổ, tai", "D": "Mặt duỗi cẳng tay chân", "E": "Vùng sinh dục"}, "c": "C", "e": "Viêm da cơ địa ở trẻ lớn/người lớn: tổn thương ưu thế vùng nếp gấp (khoeo tay, cổ chân, cổ, sau tai), biểu hiện mạn tính (dày sừng, lichen hóa)."}, {"n": 28, "q": "Bệnh nhân 6 tháng: ngứa, da khô, hồng ban rỉ dịch và tróc vảy ở mặt, tái phát nhiều lần. Định hướng thăm khám da vị trí nào được chú ý nhiều?", "o": {"A": "Vùng tì đè nhiều: mông, gối, khuỷu tay", "B": "Vùng phơi bày ánh sáng: cổ, ngực", "C": "Vùng nếp gấp: khoeo tay, cổ chân, cổ, tai", "D": "Vùng lồi mặt: 2 má, trán, cằm", "E": "Mặt duỗi cánh tay, đùi"}, "c": "D", "e": "Viêm da cơ địa ở trẻ nhũ nhi (chàm sữa): tổn thương vùng lồi của mặt (2 má, trán, cằm), da đầu, mặt duỗi chi; thường biểu hiện cấp (rỉ dịch)."}, {"n": 29, "q": "Cận lâm sàng trong hội chứng Stevens-Johnson và hội chứng Lyell:", "o": {"A": "Men gan rối loạn", "B": "Tăng bạch cầu và tăng ưa acid", "C": "VS tăng", "D": "Rối loạn nước điện giải", "E": "Các câu trên đều đúng"}, "c": "E", "e": "SJS/Lyell là phản ứng nặng: có thể rối loạn men gan, tăng bạch cầu/ưa acid, VS tăng, rối loạn nước-điện giải (do mất da diện rộng) — các câu trên đều đúng."}, {"n": 30, "q": "Đặc điểm lâm sàng đặc trưng nhiễm nấm thân mình do nấm sợi:", "o": {"A": "Các bờ viền tổn thương thường tróc vảy hoặc có mụn nước", "B": "Ranh giới tổn thương thường khó phân biệt", "C": "Các tổn thương có nhiều viền vảy đồng tâm giống vảy cá với sẩn vệ tinh rải rác", "D": "Tổn thương thường xuất hiện thành các mảng lớn", "E": "Các sẩn mụn nước thường tập trung thành cụm quanh nang lông"}, "c": "A", "e": "Nấm thân: mảng đỏ giới hạn rõ, bờ hoạt động (rìa) tróc vảy hoặc có mụn nước, tiến triển ly tâm."}, {"n": 31, "q": "Tác nhân thường gây viêm quầng (erysipelas):", "o": {"A": "Staphylococcus epidermidis", "B": "Pseudomonas aeruginosa", "C": "Propionibacterium acnes", "D": "Staphylococcus aureus", "E": "Streptococcus pyogenes"}, "c": "E", "e": "Viêm quầng (erysipelas) chủ yếu do liên cầu tan huyết β nhóm A (Streptococcus pyogenes)."}, {"n": 32, "q": "Nguyên nhân có thể gây khởi phát vảy nến dạng giọt:", "o": {"A": "Liên cầu", "B": "Thuốc lá", "C": "Thuốc", "D": "Rượu", "E": "Ánh nắng"}, "c": "A", "e": "Vảy nến thể giọt hay gặp ở trẻ em/người trẻ, thường liên quan nhiễm liên cầu (streptococcus) trước đó."}, {"n": 33, "q": "Đặc điểm lâm sàng đặc trưng nhiễm nấm kẽ lớn do nấm sợi:", "o": {"A": "Hiếm khi lây lan các vùng da khác", "B": "Thường lây nhiễm kèm vùng bìu và dương vật", "C": "Tái phát nhiều lần nếu môi trường ẩm ướt", "D": "Mảng thương tổn đối xứng 2 bên rỉ dịch", "E": "Hiếm khi gặp ở nam giới"}, "c": "C", "e": "Nấm bẹn (nấm kẽ lớn) do nấm sợi thường ở nam, dễ tái phát khi môi trường ẩm ướt, ra nhiều mồ hôi; nấm sợi thường KHÔNG lan vùng bìu-dương vật (khác Candida)."}, {"n": 34, "q": "Đặc điểm nào sau đây là của bệnh chốc:", "o": {"A": "Bệnh do dinh dưỡng", "B": "Bệnh tự miễn", "C": "Bệnh nhiễm virus", "D": "Bệnh do di truyền", "E": "Bệnh nhiễm khuẩn"}, "c": "E", "e": "Chốc là bệnh nhiễm khuẩn da (tụ cầu vàng và/hoặc liên cầu)."}, {"n": 35, "q": "Chốc bọng nước thường gặp ở đối tượng nào:", "o": {"A": "Người lớn", "B": "Trẻ nhỏ", "C": "Trẻ sơ sinh", "D": "Người già", "E": "Tất cả đều đúng"}, "c": "C", "e": "Chốc bọng nước (do độc tố bong da của tụ cầu vàng) hay gặp ở trẻ sơ sinh và trẻ nhỏ.", "note": "Nếu đề nhấn 'trẻ nhỏ' nói chung thì có thể chọn B; đối chiếu giáo trình."}, {"n": 36, "q": "Vị trí sùi mào gà nào thường dễ bị bỏ sót ở nữ giới:", "o": {"A": "Cổ tử cung", "B": "Âm đạo", "C": "Môi bé", "D": "Môi lớn", "E": "Âm hộ"}, "c": "A", "e": "Sùi mào gà ở cổ tử cung thường dễ bị bỏ sót vì nằm sâu, cần khám mỏ vịt/soi cổ tử cung để phát hiện."}, {"n": 37, "q": "Chẩn đoán bệnh phong chủ yếu dựa vào dấu lâm sàng và:", "o": {"A": "Dấu da và phản ứng Lepromin", "B": "Xét nghiệm vi khuẩn/giải phẫu bệnh", "C": "Xét nghiệm vi khuẩn và dấu thần kinh", "D": "Xác định bằng xét nghiệm vi khuẩn (BI, MI)", "E": "Thần kinh lớn và da đổi màu"}, "c": "C", "e": "Chẩn đoán phong dựa vào lâm sàng kết hợp xét nghiệm vi khuẩn (BI) và dấu tổn thương thần kinh.", "note": "Bệnh Phong ngoài bài giảng De10-19; đối chiếu giáo trình phong."}, {"n": 38, "q": "Thương tổn chỉ có sự thay đổi màu sắc của da:", "o": {"A": "Mụn nước", "B": "Trợt", "C": "Bọng nước", "D": "Mảng", "E": "Dát"}, "c": "E", "e": "Dát (macule) là tổn thương phẳng, chỉ thay đổi màu sắc da, không sờ thấy gờ."}, {"n": 39, "q": "Đặc điểm lâm sàng đặc trưng nhiễm nấm kẽ lớn (do Candida):", "o": {"A": "Các kẽ lớn thường tróc vảy nhiều và đỏ nhiều", "B": "Nấm kẽ thường xuất hiện mùa đông do mặc quần áo dày", "C": "Mảng lớn tróc vảy mỏng kèm hình thành thêm các sẩn vệ tinh mới do Candida gây ra", "D": "Hiếm khi lây lan các vùng da khác", "E": "Tổn thương có thể xuất hiện 2 bên với viền ranh giới rõ do bội nhiễm Candida"}, "c": "C", "e": "Viêm kẽ do Candida đặc trưng bởi mảng đỏ, tróc vảy mỏng kèm các sẩn/mụn mủ 'vệ tinh' (satellite) ở ngoại vi."}, {"n": 40, "q": "Tổn thương cơ bản đặc trưng của bệnh mụn trứng cá là:", "o": {"A": "Nhân trứng cá (comedone)", "B": "Cục", "C": "Sẩn viêm", "D": "Nang", "E": "Mụn mủ"}, "c": "A", "e": "Tổn thương cơ bản đặc trưng (nguyên phát, không viêm) của trứng cá là nhân trứng cá (comedone – mở/đóng); sẩn viêm, mụn mủ, cục, nang là các tổn thương viêm thứ phát."}, {"n": 41, "q": "Các yếu tố có ảnh hưởng trong cơ chế bệnh sinh vảy nến:", "o": {"A": "Rối loạn miễn dịch tế bào gây ra hiện tượng tăng sản thượng bì", "B": "Tỷ lệ di truyền từ bố mẹ mắc bệnh vảy nến cho con rất thấp", "C": "Yếu tố nội tiết ảnh hưởng rõ đến tỉ lệ mắc bệnh", "D": "Nguyên nhân nhiễm khuẩn chiếm ưu thế trong cơ chế bệnh sinh", "E": "Rối loạn miễn dịch dịch thể tăng sản xuất kháng thể"}, "c": "A", "e": "Vảy nến: rối loạn miễn dịch tế bào (vai trò lympho T, trục TNF-IL23-Th17) gây tăng sinh/tăng sản tế bào thượng bì. Di truyền rõ (bố+mẹ mắc ~41%)."}, {"n": 42, "q": "Nhiễm độc da do thuốc:", "o": {"A": "Tất cả đều sai", "B": "Biểu hiện ở da không đặc trưng", "C": "Biểu hiện ở da ít đặc trưng", "D": "Biểu hiện ở da rất đặc trưng", "E": "Biểu hiện da thường kèm tổn thương niêm mạc"}, "c": "B", "e": "Nhiễm độc da do thuốc có biểu hiện đa dạng, KHÔNG đặc trưng (một thuốc gây nhiều kiểu ban, một kiểu ban do nhiều thuốc) nên chẩn đoán chủ yếu dựa tiền sử dùng thuốc.", "note": "Đáp án dựa nguyên lý 'ban do thuốc không đặc hiệu'; đối chiếu giáo trình."}, {"n": 43, "q": "Hội chứng Lyell thường phân biệt với:", "o": {"A": "Hội chứng 4S (SSSS – tụ cầu bong da)", "B": "Bọng nước dạng pemphigus", "C": "Pemphigus thường", "D": "Bỏng diện rộng", "E": "Các câu trên đều đúng"}, "c": "A", "e": "Hội chứng Lyell (TEN) cần phân biệt với hội chứng 4S (SSSS – da bong do độc tố tụ cầu), đặc biệt ở trẻ em; SSSS bong ở lớp nông (hạt), Lyell bong ở lớp đáy/toàn bộ thượng bì."}, {"n": 44, "q": "Lợi ích của đa hóa trị liệu bệnh Phong là:", "o": {"A": "Hiệu quả điều trị cao", "B": "Tất cả đều đúng", "C": "Phòng ngừa và giảm tỷ lệ tàn phế", "D": "Rút ngắn thời gian điều trị", "E": "Giảm khả năng kháng thuốc của M. leprae"}, "c": "B", "e": "Đa hóa trị liệu (MDT) giúp hiệu quả cao, giảm tàn phế, rút ngắn thời gian và giảm kháng thuốc — tất cả đều đúng.", "note": "Bệnh Phong ngoài bài giảng De10-19."}, {"n": 45, "q": "Bệnh nhân 6 tháng tuổi: ngứa, da khô, hồng ban và tróc vảy vùng mặt, tái phát nhiều lần. Lựa chọn thuốc bôi thích hợp:", "o": {"A": "Clobetasone", "B": "Tacrolimus", "C": "Betamethasone", "D": "Eumovate", "E": "Acid salicylic"}, "c": "B", "e": "Trẻ nhũ nhi, tổn thương ở mặt: ưu tiên thuốc ít tác dụng phụ tại chỗ. Tacrolimus (ức chế calcineurin) an toàn cho vùng mặt, tránh teo da do corticoid mạnh.", "note": "Tacrolimus khuyến cáo cho trẻ ≥2 tuổi; với nhũ nhi nhiều tài liệu chọn corticoid nhẹ (hydrocortisone) — đối chiếu giáo trình/thực hành."}, {"n": 46, "q": "Thương tổn nào sau đây là NGUYÊN PHÁT:", "o": {"A": "Lichen hóa", "B": "Sẹo", "C": "Sẩn phù", "D": "Trợt", "E": "Loét"}, "c": "C", "e": "Sẩn phù (mày đay – wheal) là tổn thương nguyên phát. Lichen hóa, sẹo, trợt, loét là tổn thương thứ phát."}, {"n": 47, "q": "Hội chứng Stevens-Johnson và hội chứng Lyell:", "o": {"A": "Ban đỏ tiến triển thành mụn nước/bọng nước rồi trợt da", "B": "Biểu hiện khoảng 1-3 tuần sau sử dụng thuốc", "C": "Tất cả đều đúng", "D": "Khoảng 2 tháng đầu với thuốc chống co giật", "E": "Dấu chứng không đặc trưng"}, "c": "C", "e": "SJS/Lyell: ban đỏ → bọng nước → trợt da/niêm mạc, thường khởi phát 1-3 tuần sau dùng thuốc (thuốc chống co giật có thể muộn hơn) — tất cả đều đúng."}, {"n": 48, "q": "Vảy nến thông thường có biểu hiện điển hình:", "o": {"A": "Vảy trắng bạc dễ tróc kèm mảng hồng ban vùng tì đè", "B": "Phát ban vảy trắng vùng phơi bày ánh sáng", "C": "Thường chỉ tổn thương tại da", "D": "Hồng ban kèm nhiều lớp vảy tập trung vùng mặt và bụng", "E": "Mảng hồng ban kèm viền vảy trắng bạc vùng mông, gối và da đầu"}, "c": "A", "e": "Vảy nến mảng điển hình: mảng đỏ giới hạn rõ phủ vảy trắng bạc dày, dễ tróc, phân bố đối xứng vùng tì đè (khuỷu, gối, thắt lưng cùng, da đầu).", "note": "Đáp án E cũng mô tả đúng vị trí; chọn A vì nêu đủ tính chất vảy trắng bạc dễ tróc + vùng tì đè."}, {"n": 49, "q": "Bệnh nào sau đây có nguyên nhân KHÔNG phải là nhiễm độc da do thuốc:", "o": {"A": "Viêm da cơ địa", "B": "Hồng ban cố định nhiễm sắc", "C": "Hồng ban đa dạng", "D": "Steven-Johnson", "E": "Mày đay"}, "c": "A", "e": "Viêm da cơ địa là bệnh viêm da mạn tính cơ địa dị ứng, KHÔNG phải nhiễm độc da do thuốc. Các bệnh còn lại có thể do thuốc."}, {"n": 50, "q": "Nhiễm nấm nông có đặc điểm sau:", "o": {"A": "Nấm sợi sử dụng keratin làm dinh dưỡng nên có thể gây bệnh da và niêm mạc", "B": "Nấm Candida thường gây bệnh tại các vị trí ẩm ướt và vùng kẽ", "C": "Nấm Candida thường do động vật lây truyền", "D": "Lang ben thường ít lây nhiễm do khó tồn tại trên môi trường da pH quá acid", "E": "Nấm sợi thường gây hoại thư tổ chức và gây bốc mùi hôi tại móng"}, "c": "B", "e": "Candida ưa môi trường ẩm ướt, hay gây bệnh vùng kẽ, niêm mạc. Nấm sợi ưa keratin nhưng KHÔNG gây bệnh ở niêm mạc."}, {"n": 51, "q": "Các yếu tố nguy cơ gây khởi phát và bùng phát vảy nến:", "o": {"A": "Rối loạn nội tiết thời kì mãn kinh làm tăng độ nặng của bệnh", "B": "Thuốc corticoid hệ thống có thể gây bùng phát vảy nến mủ", "C": "Các thuốc hầu như không gây khởi phát bệnh", "D": "Tụ cầu thường là nguyên nhân gây khởi phát vảy nến giọt", "E": "Methotrexate có thể làm bệnh nặng hơn"}, "c": "B", "e": "Corticoid toàn thân (hệ thống) chống chỉ định trong vảy nến vì khi ngưng gây hiện tượng dội, bùng phát vảy nến mủ/đỏ da toàn thân. (Vảy nến giọt liên quan liên cầu, không phải tụ cầu; MTX là thuốc điều trị.)"}, {"n": 52, "q": "Bệnh nhân 3 tuổi: ngứa, da khô, tổn thương dày sừng và tróc vảy vùng khoeo tay, cẳng chân, tái phát nhiều lần. Định hướng thăm khám vị trí nào?", "o": {"A": "Vùng tì đè nhiều: mông, gối, khuỷu tay", "B": "Mặt duỗi cẳng tay chân", "C": "Vùng phơi bày ánh sáng: cổ, ngực", "D": "Vùng sinh dục", "E": "Vùng nếp gấp: khoeo tay, cổ chân, cổ, tai"}, "c": "E", "e": "Viêm da cơ địa ở trẻ em (2-16 tuổi): tổn thương ưu thế vùng nếp gấp (khoeo tay, cổ chân, cổ, sau tai)."}, {"n": 53, "q": "Các thuốc sau thường gây nên hồng ban cố định nhiễm sắc, NGOẠI TRỪ:", "o": {"A": "Ampicilline", "B": "Kháng viêm không steroid (NSAID)", "C": "Vancomycine", "D": "Sulfamide kết hợp", "E": "Kháng sinh họ cycline (tetracycline)"}, "c": "C", "e": "Hồng ban cố định nhiễm sắc hay do sulfamid, NSAID, tetracyclin, ampicillin. Vancomycin không phải nguyên nhân điển hình."}, {"n": 54, "q": "Các thuốc tăng nguy cơ gây vảy nến mụn mủ toàn thân:", "o": {"A": "Isotretinoin", "B": "Methotrexate", "C": "Prednisolon", "D": "Rabeprazole", "E": "Itraconazole"}, "c": "C", "e": "Corticoid toàn thân (Prednisolon) khi ngưng đột ngột có thể gây bùng phát vảy nến mụn mủ toàn thân (Von Zumbusch)."}, {"n": 55, "q": "Đặc điểm nào sau đây là của SĂNG giang mai:", "o": {"A": "Vết trợt đáy bẩn, không đau", "B": "Vết trợt đáy sạch, không đau", "C": "Vết loét đáy bẩn, đau", "D": "Vết trợt đáy sạch, đau", "E": "Vết loét đáy sạch, không đau"}, "c": "E", "e": "Săng giang mai: vết loét/trợt tròn-bầu dục, đơn độc, đáy sạch, nền cứng, KHÔNG đau, rất lây.", "note": "Săng có thể mô tả là 'trợt' hoặc 'loét'; điểm mấu chốt là đáy sạch + không đau (loại A,C,D)."}, {"n": 56, "q": "Điều nào sau đây KHÔNG đúng về tổn thương sẩn:", "o": {"A": "Gờ lên mặt da", "B": "Có thể có nhiều màu sắc khác nhau", "C": "Đỉnh có nhiều dạng khác nhau", "D": "Tổ chức đặc", "E": "Thứ phát sau tổn thương mụn nước"}, "c": "E", "e": "Sẩn (papule) là tổn thương NGUYÊN PHÁT, chắc đặc, gờ lên mặt da; KHÔNG phải thứ phát sau mụn nước."}, {"n": 57, "q": "Bệnh nhân 6 tháng tuổi VDCĐ, đợt cấp rỉ dịch chảy nước, nguy cơ nhiễm trùng cao. Nguyên nhân nhiễm trùng thường do:", "o": {"A": "Malassezia furfur", "B": "Chlamydia trachomatis", "C": "Pseudomonas aeruginosa", "D": "Streptococcus pyogenes", "E": "Staphylococcus aureus"}, "c": "E", "e": "Bội nhiễm trên nền viêm da cơ địa thường do Staphylococcus aureus (chốc hóa)."}, {"n": 58, "q": "Đa hoá trị liệu trong bệnh Phong thể nhiều vi khuẩn (MB):", "o": {"A": "Rifampicin – Quinolon – Minocycline", "B": "Rifampicin – Clofazimin – Dapson", "C": "Rifampicin – Quinolon – Dapson", "D": "Quinolon – Dapson – Clarithromycin", "E": "Rifampicin – Minocycline – Dapson"}, "c": "B", "e": "Phác đồ WHO cho phong thể nhiều khuẩn (MB): Rifampicin + Clofazimin + Dapson.", "note": "Bệnh Phong ngoài bài giảng De10-19."}, {"n": 59, "q": "Đặc điểm nào KHÔNG đúng khi mô tả nấm sợi:", "o": {"A": "Nấm sợi hầu như không gây bệnh tại niêm mạc", "B": "Ba chủng nấm thường gặp gồm Trichophyton, Epidermophyton và Microsporum", "C": "Nấm sợi ưa keratin nên chủ yếu chỉ gây bệnh tại lớp sừng và lớp hạt", "D": "Nấm sợi thường ủ bệnh từ 1-3 tuần", "E": "Các nguồn nấm lây từ đất và người gây viêm mạnh hơn từ động vật"}, "c": "E", "e": "SAI: nấm lây từ ĐỘNG VẬT (zoophilic) mới gây viêm mạnh hơn, còn lây từ người (anthropophilic) viêm nhẹ mạn tính.", "note": "Câu C ('lớp sừng và lớp hạt') cũng chưa chuẩn (nấm sợi chủ yếu ở lớp sừng); nhưng đáp án 'sai' rõ nhất là E."}, {"n": 60, "q": "Ngoài thuốc, tác nhân nào sau đây thường gây hồng ban đa dạng (erythema multiforme):", "o": {"A": "VZV", "B": "HIV", "C": "HSV", "D": "Coxsackie virus", "E": "Tất cả đều sai"}, "c": "C", "e": "Ngoài thuốc, nguyên nhân hàng đầu của hồng ban đa dạng là nhiễm Herpes simplex virus (HSV)."}, {"n": 61, "q": "Bệnh da nào có đặc điểm lâm sàng đặc trưng với vảy tiết màu vàng mật ong:", "o": {"A": "Lậu", "B": "Chốc lây", "C": "Nhọt", "D": "Chốc bọng nước", "E": "Herpes"}, "c": "B", "e": "Vảy tiết màu vàng mật ong (honey-colored crust) là đặc trưng của chốc lây (chốc không bọng nước)."}, {"n": 62, "q": "Bệnh nhân 3 tuổi VDCĐ, dày sừng và tróc vảy vùng khoeo tay, cẳng chân. Lựa chọn thuốc bôi thích hợp:", "o": {"A": "Tacrolimus", "B": "Acid salicylic", "C": "Betamethasone", "D": "Hydrocortisone", "E": "Eumovate"}, "c": "A", "e": "Trẻ 3 tuổi, tổn thương mạn (dày sừng, lichen hóa) vùng nếp gấp: Tacrolimus (ức chế calcineurin, chỉ định ≥2 tuổi) an toàn dùng lâu dài, tránh teo da.", "note": "Tùy mức độ có thể phối hợp corticoid; đối chiếu thực hành."}, {"n": 63, "q": "Thương tổn nào sau đây là THỨ PHÁT:", "o": {"A": "Dát", "B": "Mụn mủ", "C": "Trợt", "D": "Mụn nước", "E": "Bọng nước"}, "c": "C", "e": "Trợt (erosion) là tổn thương thứ phát (mất một phần thượng bì). Dát, mụn mủ, mụn nước, bọng nước là tổn thương nguyên phát."}, {"n": 64, "q": "Biểu hiện thông thường của nhiễm lậu cầu ở nữ giới là:", "o": {"A": "Cấp tính", "B": "Không triệu chứng", "C": "Bán cấp và không triệu chứng", "D": "Cấp tính và bán cấp", "E": "Bán cấp"}, "c": "C", "e": "Ở nữ, lậu thường diễn tiến bán cấp hoặc không triệu chứng (khoảng 50% không triệu chứng) nên dễ bỏ sót, chẩn đoán muộn.", "note": "Đáp án theo hướng 'phần lớn nữ không/ít triệu chứng'; đối chiếu giáo trình."}, {"n": 65, "q": "Nguyên nhân gây thay đổi màu sắc da trong tổn thương DÁT là:", "o": {"A": "Giãn mạch", "B": "Xuất huyết", "C": "Mực xăm", "D": "Thay đổi lượng melanin", "E": "Tất cả đều đúng"}, "c": "E", "e": "Dát là tổn thương thay đổi màu sắc da do nhiều nguyên nhân: giãn mạch (dát đỏ), xuất huyết (dát xuất huyết), sắc tố melanin (tăng/giảm sắc tố), chất ngoại lai (mực xăm)… — tất cả đều đúng."}, {"n": 66, "q": "Những dấu hiệu lâm sàng gợi ý cho bệnh giang mai, NGOẠI TRỪ:", "o": {"A": "Sẩn ướt vùng hậu môn sinh dục", "B": "Hạch toàn bộ cơ thể sưng nhưng không đau", "C": "Rụng tóc dạng mọt gặm", "D": "Ban sẩn vảy lòng bàn tay chân", "E": "Rụng lông tóc toàn thể"}, "c": "E", "e": "Giang mai 2: sẩn ướt hậu môn-sinh dục, hạch lan tỏa không đau, rụng tóc kiểu 'mọt gặm' (từng mảng), ban sẩn vảy lòng bàn tay-chân. KHÔNG gây rụng lông tóc toàn thể."}];
const ESSAY=[];
let right=0, done=new Set();

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function renderQuiz(data, elid){
  const box=document.getElementById(elid);
  data.forEach((it,idx)=>{
    const card=document.createElement('div'); card.className='q';
    let opts='';
    for(const k of ['A','B','C','D','E']){
      if(it.o[k]===undefined) continue;
      opts+=`<button class="opt" data-k="${k}"><span class="k">${k}.</span>${esc(it.o[k])}</button>`;
    }
    let khline = (it.kh && it.kh!==it.c) ? `<div class="kh">📝 Đáp án khoanh trên đề: <b>${esc(it.kh)}</b> (khác đáp án chuẩn)</div>` : (it.kh? `<div class="kh">📝 Đáp án khoanh trên đề: ${esc(it.kh)}</div>`:'');
    card.innerHTML=`<div class="txt"><span class="num">Câu ${it.n||idx+1}.</span>${esc(it.q)}</div>`+opts+
      `<div class="exp"><span class="lab">Đáp án đúng: ${it.c}.</span> ${esc(it.e)}${khline}</div>`+
      (it.note?`<div class="note">⚠️ ${esc(it.note)}</div>`:'');
    box.appendChild(card);
    card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choose(card,it,b.dataset.k)));
  });
}
function choose(card, it, k){
  if(card.dataset.answered) return;
  card.dataset.answered='1';
  const btns=card.querySelectorAll('.opt');
  btns.forEach(b=>{b.disabled=true;
    if(b.dataset.k===it.c) b.classList.add('correct');
    if(b.dataset.k===k && k!==it.c) b.classList.add('wrong');});
  card.querySelector('.exp').classList.add('show');
  done.add(it); if(k===it.c) right++;
  updateScore();
}
function updateScore(){
  document.getElementById('right').textContent=right;
  document.getElementById('done').textContent=done.size;
}
function renderEssay(data, elid){
  if(!data.length) return;
  document.getElementById('essaywrap').style.display='block';
  const box=document.getElementById(elid);
  data.forEach((it,idx)=>{
    const card=document.createElement('div'); card.className='ess';
    card.innerHTML=`<div class="txt"><span class="num" style="color:var(--accent);font-weight:700">Câu ${it.n||idx+1}.</span> ${esc(it.q)}</div>`+
      `<button>Xem đáp án</button>`+
      `<div class="ans"><b>Đáp án:</b> ${esc(it.a)}${it.e?'\n\n'+esc(it.e):''}</div>`;
    box.appendChild(card);
    card.querySelector('button').addEventListener('click',()=>card.querySelector('.ans').classList.toggle('show'));
  });
}
function revealAll(){
  [...document.querySelectorAll('#quiz .q')].forEach((card,i)=>{
    const it=DATA[i];
    card.dataset.answered='1';
    card.querySelectorAll('.opt').forEach(b=>{
      b.disabled=true;
      if(b.dataset.k===it.c) b.classList.add('correct');
    });
    card.querySelector('.exp').classList.add('show');
  });
  document.querySelectorAll('#essay .ans').forEach(a=>a.classList.add('show'));
}
function resetAll(){ location.reload(); }
renderQuiz(DATA,'quiz');
renderEssay(ESSAY,'essay');
</script>
