let right=0, done=new Set();
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const sel=document.getElementById('secsel');
sel.innerHTML='<option value="-1">— Tất cả '+DATA.reduce((a,s)=>a+s.questions.length,0)+' câu —</option>'+
  DATA.map((s,i)=>`<option value="${i}">${esc(s.title)} (${s.questions.length})</option>`).join('');
sel.value="0";
function qCard(s,q,gid){
  const card=document.createElement('div');card.className='q';
  let opts='';
  for(const k of ['A','B','C','D','E']){ if(q.opts[k]===undefined)continue;
    opts+=`<button class="opt" data-k="${k}"><span class="k">${k}.</span>${esc(q.opts[k])}</button>`; }
  card.innerHTML=`<div class="txt"><span class="num">${q.n}.</span>${esc(q.q)}</div>`+opts+
    (q.patch?`<div class="warn">⚠️ ${esc(q.patch)}</div>`:'');
  card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(card.dataset.a)return; card.dataset.a=1;
    card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;
      if(x.dataset.k===q.correct)x.classList.add('correct');
      if(x.dataset.k===b.dataset.k&&b.dataset.k!==q.correct)x.classList.add('wrong');});
    if(!done.has(gid)){done.add(gid); if(b.dataset.k===q.correct)right++; upd();}
  }));
  return card;
}
function render(){
  const root=document.getElementById('root');root.innerHTML='';
  right=0;done=new Set();upd();
  const v=+sel.value; const secs=v<0?DATA.map((s,i)=>[s,i]):[[DATA[v],v]];
  for(const [s,si] of secs){
    const h=document.createElement('div');h.className='sec-h';h.textContent=s.title+' · '+s.questions.length+' câu';root.appendChild(h);
    s.questions.forEach((q,qi)=>root.appendChild(qCard(s,q,si+'-'+qi)));
  }
  window.scrollTo(0,0);
}
function upd(){document.getElementById('right').textContent=right;document.getElementById('done').textContent=done.size;}
function revealAll(){document.querySelectorAll('#root .q').forEach(card=>{
  card.dataset.a=1;card.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  const idx=[...card.parentNode.querySelectorAll('.q')].indexOf(card);});
  // đánh dấu đúng theo data
  const v=+sel.value; const secs=v<0?DATA:[DATA[v]];
  let cards=document.querySelectorAll('#root .q'),ci=0;
  for(const s of secs)for(const q of s.questions){const card=cards[ci++];
    card.querySelectorAll('.opt').forEach(x=>{if(x.dataset.k===q.correct)x.classList.add('correct');});}
}
function resetAll(){render();}
render();
</script></body></html>
