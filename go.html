1eb7p duy nh\u1ea5t (4 d\u1ea1ng)\n\nGo ch\u1ec9 c\u00f3 **m\u1ed9t** t\u1eeb kh\u00f3a loop: `for`. Kh\u00f4ng c\u00f3 `while`, `do-while`. Nh\u01b0ng `for` c\u00f3 4 d\u1ea1ng:\n\n### D\u1ea1ng 1: Complete for (C-style)\n\n```go\nfor i := 0; i < 10; i++ {\n    fmt.Println(i)\n}\n// In ra: 0 \u0111\u1ebfn 9\n```\n\n- Ph\u1ea3i d\u00f9ng `:=` trong init (kh\u00f4ng d\u00f9ng `var`)\n- Kh\u00f4ng c\u00f3 d\u1ea5u `()` quanh 3 ph\u1ea7n\n- C\u00f3 th\u1ec3 b\u1ecf init ho\u1eb7c increment:\n\n```go\n// B\u1ecf init\ni := 0\nfor ; i < 10; i++ {\n    fmt.Println(i)\n}\n\n// B\u1ecf increment (logic ph\u1ee9c t\u1ea1p trong body)\nfor i := 0; i < 10; {\n    fmt.Println(i)\n    if i % 2 == 0 { i++ } else { i += 2 }\n}\n```\n\n### D\u1ea1ng 2: Condition-only for (nh\u01b0 while)\n\n```go\n// T\u01b0\u01a1ng \u0111\u01b0\u01a1ng while (i < 100) trong Java\ni := 1\nfor i < 100 {\n    fmt.Println(i)\n    i = i * 2\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:** `while (condition) { ... }` \u2192 Go: `for condition { ... }`\n\n### D\u1ea1ng 3: Infinite for loop\n\n```go\nfor {\n    fmt.Println(\"Hello\")  // ch\u1ea1y m\u00e3i m\u00e3i\n}\n// D\u1eebng b\u1eb1ng Ctrl+C ho\u1eb7c break\n```\n\n**M\u00f4 ph\u1ecfng do-while c\u1ee7a Java:**\n```go\n// Java:\n// do { ... } while (CONDITION);\n\n// Go:\nfor {\n    // ... logic\n    if !CONDITION {\n        break\n    }\n}\n```\n\n### D\u1ea1ng 4: for-range (quan tr\u1ecdng nh\u1ea5t)\n\nD\u00f9ng \u0111\u1ec3 iterate qua slice, array, map, string, channel:\n\n```go\nevenVals := []int{2, 4, 6, 8, 10, 12}\nfor i, v := range evenVals {\n    fmt.Println(i, v)  // index, value\n}\n// 0 2\n// 1 4\n// ...\n```\n\n**B\u1ecf index (d\u00f9ng `_`):**\n```go\nfor _, v := range evenVals {\n    fmt.Println(v)\n}\n```\n\n**Ch\u1ec9 l\u1ea5y index (b\u1ecf value):**\n```go\nuniqueNames := map[string]bool{\"Fred\": true, \"Raul\": true}\nfor k := range uniqueNames {  // ch\u1ec9 key, kh\u00f4ng c\u00f3 value\n    fmt.Println(k)\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:**\n> - Java `for (int v : list)` \u2192 Go `for _, v := range list`\n> - Java `for (Map.Entry<K,V> e : map.entrySet())` \u2192 Go `for k, v := range map`\n> - Go ti\u1ec7n h\u01a1n v\u00ec index/key lu\u00f4n c\u00f3 s\u1eb5n\n\n**Iterating over map \u2014 th\u1ee9 t\u1ef1 KH\u00d4NG c\u1ed1 \u0111\u1ecbnh:**\n```go\nm := map[string]int{\"a\": 1, \"c\": 3, \"b\": 2}\nfor k, v := range m {\n    fmt.Println(k, v)  // th\u1ee9 t\u1ef1 kh\u00e1c nhau m\u1ed7i l\u1ea7n ch\u1ea1y!\n}\n```\n\n> **T\u1ea1i sao random?** B\u1ea3o v\u1ec7 kh\u1ecfi Hash DoS attack. Go runtime t\u1ea1o random seed khi kh\u1edfi t\u1ea1o map v\u00e0 x\u00e1o tr\u1ed9n th\u1ee9 t\u1ef1 iteration. Ngo\u1ea1i l\u1ec7: `fmt.Println(m)` lu\u00f4n in theo ascending key order.\n\n**Iterating over string \u2014 tr\u1ea3 v\u1ec1 runes:**\n```go\nfor i, r := range \"apple_\u03c0!\" {\n    fmt.Println(i, r, string(r))\n}\n// 0 97 a\n// 1 112 p\n// ...\n// 6 960 \u03c0   \u2190 index nh\u1ea3y t\u1eeb 6 \u2192 8 v\u00ec \u03c0 chi\u1ebfm 2 bytes\n// 8 33 !\n```\n\n> for-range string tr\u1ea3 v\u1ec1 **rune** (kh\u00f4ng ph\u1ea3i byte) \u2014 x\u1eed l\u00fd Unicode \u0111\u00fang. Index l\u00e0 byte position, kh\u00f4ng ph\u1ea3i rune index.\n\n**for-range copy value:**\n```go\nevenVals := []int{2, 4, 6, 8, 10, 12}\nfor _, v := range evenVals {\n    v *= 2  // s\u1eeda copy, kh\u00f4ng s\u1eeda slice g\u1ed1c!\n}\nfmt.Println(evenVals)  // [2 4 6 8 10 12] \u2014 kh\u00f4ng \u0111\u1ed5i\n```\n\n> K\u1ec3 t\u1eeb Go 1.22: m\u1ed7i iteration t\u1ea1o bi\u1ebfn `v` m\u1edbi (thay v\u00ec reuse). \u0110i\u1ec1u n\u00e0y fix m\u1ed9t bug ph\u1ed5 bi\u1ebfn v\u1edbi goroutines trong for-range.\n\n### break v\u00e0 continue\n\n```go\n// break tho\u00e1t v\u00f2ng l\u1eb7p\nfor i := 0; i < 10; i++ {\n    if i == 5 {\n        break  // tho\u00e1t ngay\n    }\n    fmt.Println(i)\n}\n\n// continue b\u1ecf qua iteration hi\u1ec7n t\u1ea1i\nfor i := 1; i <= 100; i++ {\n    if i%3 == 0 && i%5 == 0 {\n        fmt.Println(\"FizzBuzz\")\n        continue\n    }\n    if i%3 == 0 {\n        fmt.Println(\"Fizz\")\n        continue\n    }\n    if i%5 == 0 {\n        fmt.Println(\"Buzz\")\n        continue\n    }\n    fmt.Println(i)\n}\n```\n\n> **Go idiom:** D\u00f9ng `continue` \u0111\u1ec3 tr\u00e1nh nested if-else. Flat code d\u1ec5 \u0111\u1ecdc h\u01a1n.\n\n### Labeled for \u2014 X\u1eed l\u00fd nested loops\n\n```go\nouter:\n    for _, sample := range samples {\n        for i, r := range sample {\n            fmt.Println(i, r, string(r))\n            if r == 'l' {\n                continue outer  // b\u1ecf qua sang iteration ti\u1ebfp theo c\u1ee7a outer loop\n            }\n        }\n        fmt.Println()\n    }\n```\n\nLabel c\u0169ng d\u00f9ng \u0111\u01b0\u1ee3c v\u1edbi `break`:\n```go\nloop:\n    for i := 0; i < 10; i++ {\n        switch i {\n        case 7:\n            break loop  // tho\u00e1t for loop, kh\u00f4ng ph\u1ea3i switch case\n        }\n    }\n```\n\n> **L\u01b0u \u00fd:** `break` trong switch ch\u1ec9 tho\u00e1t switch, kh\u00f4ng tho\u00e1t for loop b\u00ean ngo\u00e0i. Ph\u1ea3i d\u00f9ng label.\n\n### Ch\u1ecdn d\u1ea1ng for n\u00e0o?\n\n| T\u00ecnh hu\u1ed1ng | D\u00f9ng |\n|---|---|\n| Iterate to\u00e0n b\u1ed9 slice/map/string | `for-range` |\n| Kh\u00f4ng iterate t\u1eeb \u0111\u1ea7u \u0111\u1ebfn cu\u1ed1i | Complete `for i := 0; ...` |\n| Loop \u0111\u1ebfn khi \u0111i\u1ec1u ki\u1ec7n sai | Condition-only `for condition` |\n| Loop v\u00f4 h\u1ea1n + break | `for { ... break }` |\n| Iterate string v\u1edbi Unicode | `for-range` (b\u1eaft bu\u1ed9c!) |\n\n---\n\n## 5. switch\n\nGo switch **kh\u00e1c Java** \u1edf nhi\u1ec1u \u0111i\u1ec3m quan tr\u1ecdng:\n\n```go\nwords := []string{\"a\", \"cow\", \"smile\", \"gopher\", \"octopus\", \"anthropologist\"}\nfor _, word := range words {\n    switch size := len(word); size {  // scoped variable\n    case 1, 2, 3, 4:                  // nhi\u1ec1u value trong m\u1ed9t case\n        fmt.Println(word, \"is a short word!\")\n    case 5:\n        wordLen := len(word)          // bi\u1ebfn m\u1edbi trong case block\n        fmt.Println(word, \"is exactly the right length:\", wordLen)\n    case 6, 7, 8, 9:\n        // empty case = kh\u00f4ng l\u00e0m g\u00ec (kh\u00f4ng fall-through!)\n    default:\n        fmt.Println(word, \"is a long word!\")\n    }\n}\n```\n\n**Output:**\n```\na is a short word!\ncow is a short word!\nsmile is exactly the right length: 5\nanthropologist is a long word!\n(gopher v\u00e0 octopus: 6-7 chars \u2192 empty case \u2192 kh\u00f4ng in g\u00ec)\n```\n\n### So s\u00e1nh v\u1edbi Java switch\n\n| T\u00ednh n\u0103ng | Java | Go |\n|---|---|---|\n| Fall-through | M\u1eb7c \u0111\u1ecbnh c\u00f3 | M\u1eb7c \u0111\u1ecbnh KH\u00d4NG c\u00f3 |\n| `break` trong case | B\u1eaft bu\u1ed9c \u0111\u1ec3 tr\u00e1nh fall-through | Kh\u00f4ng c\u1ea7n |\n| Nhi\u1ec1u value trong case | Kh\u00f4ng c\u00f3 (ph\u1ea3i d\u00f9ng fall-through) | `case 1, 2, 3:` |\n| Empty case | Fall-through sang case ti\u1ebfp | Kh\u00f4ng l\u00e0m g\u00ec |\n| `()` quanh expression | C\u00f3 | Kh\u00f4ng |\n| Scoped variable | Kh\u00f4ng | C\u00f3 (`switch x := ...; x`) |\n\n**N\u1ebfu mu\u1ed1n fall-through trong Go (hi\u1ebfm khi c\u1ea7n):**\n```go\nswitch n {\ncase 1:\n    fmt.Println(\"one\")\n    fallthrough  // ti\u1ebfp t\u1ee5c xu\u1ed1ng case 2\ncase 2:\n    fmt.Println(\"two\")\n}\n```\n\n### Blank switch \u2014 So s\u00e1nh boolean b\u1ea5t k\u1ef3\n\n```go\nwords := []string{\"hi\", \"salutations\", \"hello\"}\nfor _, word := range words {\n    switch wordLen := len(word); {  // blank switch \u2014 kh\u00f4ng c\u00f3 expression sau ;\n    case wordLen < 5:\n        fmt.Println(word, \"is a short word!\")\n    case wordLen > 10:\n        fmt.Println(word, \"is a long word!\")\n    default:\n        fmt.Println(word, \"is exactly the right length.\")\n    }\n}\n```\n\nRegular switch ch\u1ec9 d\u00f9ng `==`. Blank switch d\u00f9ng b\u1ea5t k\u1ef3 boolean expression n\u00e0o.\n\n**FizzBuzz v\u1edbi blank switch \u2014 c\u00e1ch \u0111\u1ecdc r\u00f5 r\u00e0ng nh\u1ea5t:**\n```go\nfor i := 1; i <= 100; i++ {\n    switch {\n    case i%3 == 0 && i%5 == 0:\n        fmt.Println(\"FizzBuzz\")\n    case i%3 == 0:\n        fmt.Println(\"Fizz\")\n    case i%5 == 0:\n        fmt.Println(\"Buzz\")\n    default:\n        fmt.Println(i)\n    }\n}\n```\n\n### if/else vs switch \u2014 Khi n\u00e0o d\u00f9ng c\u00e1i n\u00e0o?\n\n- **switch**: c\u00e1c case c\u00f3 quan h\u1ec7 v\u1edbi nhau, c\u00f9ng x\u1eed l\u00fd m\u1ed9t kh\u00e1i ni\u1ec7m\n- **if/else chains**: c\u00e1c \u0111i\u1ec1u ki\u1ec7n kh\u00f4ng li\u00ean quan, logic ph\u1ee9c t\u1ea1p\n\n```go\n// D\u00f9ng switch v\u00ec c\u00e1c case \u0111\u1ec1u li\u00ean quan \u0111\u1ebfn \u0111\u1ed9 d\u00e0i string\nswitch {\ncase len(s) < 5:  ...\ncase len(s) > 10: ...\ndefault:          ...\n}\n\n// D\u00f9ng if/else v\u00ec c\u00e1c \u0111i\u1ec1u ki\u1ec7n kh\u00f4ng li\u00ean quan\nif isAuthenticated {\n    ...\n} else if hasPermission {\n    ...\n}\n```\n\n---\n\n## 6. goto \u2014 D\u00f9ng r\u1ea5t hi\u1ebfm\n\nGo c\u00f3 `goto` nh\u01b0ng v\u1edbi gi\u1edbi h\u1ea1n nghi\u00eam ng\u1eb7t:\n- Kh\u00f4ng \u0111\u01b0\u1ee3c nh\u1ea3y qua khai b\u00e1o bi\u1ebfn\n- Kh\u00f4ng \u0111\u01b0\u1ee3c nh\u1ea3y v\u00e0o inner/parallel block\n\n```go\n// ILLEGAL:\ngoto skip\nb := 20     // goto nh\u1ea3y qua khai b\u00e1o b\nskip:\nfmt.Println(b)  // b ch\u01b0a \u0111\u01b0\u1ee3c khai b\u00e1o\n\n// ILLEGAL:\nif a < b {\ninner:         // goto kh\u00f4ng th\u1ec3 nh\u1ea3y v\u00e0o block n\u00e0y\n    fmt.Println(\"inside\")\n}\nif c > a {\n    goto inner  // ERROR!\n}\n```\n\n**Khi n\u00e0o goto c\u00f3 th\u1ec3 h\u1ee3p l\u00fd:**\n```go\nfunc main() {\n    a := rand.Intn(10)\n    for a < 100 {\n        if a%5 == 0 {\n            goto done  // tho\u00e1t kh\u1ecfi loop + b\u1ecf qua code gi\u1eefa\n        }\n        a = a*2 + 1\n    }\n    fmt.Println(\"loop completed normally\")\ndone:\n    fmt.Println(\"always runs:\", a)\n}\n```\n\n> **Th\u1ef1c t\u1ebf:** H\u1ea7u nh\u01b0 kh\u00f4ng bao gi\u1edd c\u1ea7n `goto`. Ch\u1ec9 trong tr\u01b0\u1eddng h\u1ee3p code th\u1ef1c s\u1ef1 r\u00f5 r\u00e0ng h\u01a1n khi d\u00f9ng (nh\u01b0 trong `strconv` package c\u1ee7a standard library). Lu\u00f4n t\u00ecm c\u00e1ch kh\u00e1c tr\u01b0\u1edbc.\n\n---\n\n## Exercises\n\n**Exercise 1: T\u1ea1o slice v\u1edbi 100 random numbers:**\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"math/rand\"\n)\n\nfunc main() {\n    nums := make([]int, 0, 100)\n    for i := 0; i < 100; i++ {\n        nums = append(nums, rand.Intn(101))\n    }\n    fmt.Println(nums)\n}\n```\n\n**Exercise 2: FizzSix v\u1edbi blank switch:**\n```go\nfor _, v := range nums {\n    switch {\n    case v%6 == 0:\n        fmt.Println(\"Six!\")\n    case v%2 == 0:\n        fmt.Println(\"Two!\")\n    case v%3 == 0:\n        fmt.Println(\"Three!\")\n    default:\n        fmt.Println(\"Never mind\")\n    }\n}\n```\n\n**Exercise 3: Bug v\u1edbi shadowing trong for:**\n```go\nfunc main() {\n    total := 0\n    for i := 0; i < 10; i++ {\n        total := total + i  // BUG! := t\u1ea1o bi\u1ebfn total M\u1edaI trong for block\n        fmt.Println(total)  // in gi\u00e1 tr\u1ecb local total\n    }\n    fmt.Println(total)  // in ra 0 \u2014 outer total kh\u00f4ng thay \u0111\u1ed5i!\n}\n// Fix: d\u00f9ng = thay v\u00ec :=\n// total = total + i\n```\n\n---\n\n## Wrapping Up\n\nB\u1ea1n \u0111\u00e3 h\u1ecdc:\n- **Blocks** \u2014 m\u1ed7i `{}` t\u1ea1o block m\u1edbi; bi\u1ebfn ch\u1ec9 s\u1ed1ng trong block c\u1ee7a m\u00ecnh\n- **Shadowing** \u2014 inner block c\u00f3 th\u1ec3 \u1ea9n bi\u1ebfn outer block; c\u1ea9n th\u1eadn v\u1edbi `:=`\n- **if** \u2014 kh\u00f4ng c\u00f3 `()`; c\u00f3 th\u1ec3 khai b\u00e1o bi\u1ebfn scoped ngay trong \u0111i\u1ec1u ki\u1ec7n\n- **for** \u2014 t\u1eeb kh\u00f3a loop duy nh\u1ea5t: C-style, condition-only, infinite, for-range\n  - for-range: iterate \u0111\u00fang c\u00e1ch qua string (rune, kh\u00f4ng ph\u1ea3i byte)\n  - Map iteration order: ng\u1eabu nhi\u00ean\n  - Labels: d\u00f9ng khi break/continue c\u1ea7n tho\u00e1t outer loop\n- **switch** \u2014 kh\u00f4ng fall-through m\u1eb7c \u0111\u1ecbnh; blank switch cho boolean expressions\n- **goto** \u2014 tr\u00e1nh d\u00f9ng; ch\u1ec9 trong tr\u01b0\u1eddng h\u1ee3p code th\u1ef1c s\u1ef1 r\u00f5 h\u01a1n\n\n**Ch\u01b0\u01a1ng ti\u1ebfp theo:** Functions \u2014 c\u00e1ch t\u1ed5 ch\u1ee9c code trong Go.\n\n\n# Chapter 5. Functions\n\n## Gi\u1edbi thi\u1ec7u\n\nCh\u01b0\u01a1ng n\u00e0y kh\u00e1m ph\u00e1 functions trong Go:\n- Khai b\u00e1o v\u00e0 g\u1ecdi function\n- Variadic parameters\n- Multiple return values (\u0111\u1eb7c \u0111i\u1ec3m quan tr\u1ecdng c\u1ee7a Go)\n- Functions l\u00e0 values \u2014 higher-order functions\n- Closures\n- `defer` \u2014 d\u1ecdn d\u1eb9p t\u00e0i nguy\u00ean\n- Go l\u00e0 call-by-value\n\n---\n\n## 1. Declaring and Calling Functions\n\n```go\nfunc div(num int, denom int) int {\n    if denom == 0 {\n        return 0\n    }\n    return num / denom\n}\n\nfunc main() {\n    result := div(5, 2)\n    fmt.Println(result)  // 2\n}\n```\n\n**C\u1ea5u tr\u00fac function:**\n```\nfunc <t\u00ean>(<param> <type>, ...) <return type> {\n    ...\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:**\n> - Java: `public int div(int num, int denom) { ... }` \u2014 c\u1ea7n access modifier, ki\u1ec3u tr\u01b0\u1edbc t\u00ean\n> - Go: `func div(num int, denom int) int { ... }` \u2014 kh\u00f4ng c\u1ea7n access modifier, t\u00ean tr\u01b0\u1edbc ki\u1ec3u\n\n**Khi nhi\u1ec1u tham s\u1ed1 c\u00f9ng ki\u1ec3u \u2014 vi\u1ebft g\u1ecdn:**\n```go\nfunc div(num, denom int) int {  // c\u1ea3 hai \u0111\u1ec1u int\n    ...\n}\n```\n\n**Khi kh\u00f4ng c\u00f3 return value:**\n```go\nfunc printHello() {  // kh\u00f4ng c\u1ea7n vi\u1ebft return type\n    fmt.Println(\"Hello\")\n    // return; kh\u00f4ng b\u1eaft bu\u1ed9c \u1edf cu\u1ed1i\n}\n```\n\n---\n\n## 2. Simulating Named v\u00e0 Optional Parameters\n\nGo **kh\u00f4ng c\u00f3** named parameters hay optional parameters (ngo\u1ea1i tr\u1eeb variadic).\n\n**Thay th\u1ebf: d\u00f9ng struct:**\n```go\ntype MyFuncOpts struct {\n    FirstName string\n    LastName  string\n    Age       int\n}\n\nfunc MyFunc(opts MyFuncOpts) error {\n    // ...\n}\n\nfunc main() {\n    MyFunc(MyFuncOpts{\n        LastName: \"Patel\",\n        Age:      50,\n        // FirstName b\u1ecf tr\u1ed1ng \u2192 zero value \"\"\n    })\n    MyFunc(MyFuncOpts{\n        FirstName: \"Joe\",\n        LastName:  \"Smith\",\n    })\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java kh\u00f4ng c\u00f3 named/optional parameters ch\u00ednh th\u1ee9c (d\u00f9ng Builder pattern hay overloading). Go d\u00f9ng struct \u2014 t\u01b0\u1eddng minh v\u00e0 an to\u00e0n h\u01a1n.\n\n---\n\n## 3. Variadic Input Parameters\n\n```go\nfunc addTo(base int, vals ...int) []int {\n    out := make([]int, 0, len(vals))\n    for _, v := range vals {\n        out = append(out, base+v)\n    }\n    return out\n}\n\nfunc main() {\n    fmt.Println(addTo(3))              // []        \u2014 kh\u00f4ng c\u00f3 vals\n    fmt.Println(addTo(3, 2))           // [5]\n    fmt.Println(addTo(3, 2, 4, 6, 8)) // [5 7 9 11]\n\n    a := []int{4, 3}\n    fmt.Println(addTo(3, a...))               // [7 6] \u2014 expand slice\n    fmt.Println(addTo(3, []int{1,2,3}...))    // [4 5 6] \u2014 expand literal\n}\n```\n\n**Quy t\u1eafc:**\n- `...type` ph\u1ea3i l\u00e0 tham s\u1ed1 **cu\u1ed1i c\u00f9ng** (ho\u1eb7c duy nh\u1ea5t)\n- B\u00ean trong function, bi\u1ebfn variadic l\u00e0 `[]type` (slice)\n- Khi truy\u1ec1n slice v\u00e0o variadic parameter, ph\u1ea3i th\u00eam `...` sau slice\n\n> **So s\u00e1nh v\u1edbi Java:** `void method(int... vals)` \u2014 t\u01b0\u01a1ng t\u1ef1, nh\u01b0ng Java variadic c\u00f3 th\u1ec3 l\u00e0 b\u1ea5t k\u1ef3 v\u1ecb tr\u00ed n\u00e0o. Go b\u1eaft bu\u1ed9c ph\u1ea3i \u1edf cu\u1ed1i.\n\n---\n\n## 4. Multiple Return Values\n\n\u0110\u00e2y l\u00e0 t\u00ednh n\u0103ng \u0111\u1eb7c tr\u01b0ng quan tr\u1ecdng c\u1ee7a Go:\n\n```go\nfunc divAndRemainder(num, denom int) (int, int, error) {\n    if denom == 0 {\n        return 0, 0, errors.New(\"cannot divide by zero\")\n    }\n    return num / denom, num % denom, nil\n}\n\nfunc main() {\n    result, remainder, err := divAndRemainder(5, 2)\n    if err != nil {\n        fmt.Println(err)\n        os.Exit(1)\n    }\n    fmt.Println(result, remainder)  // 2 1\n}\n```\n\n**Quy t\u1eafc:**\n- Nhi\u1ec1u return types \u2192 \u0111\u1eb7t trong `(type1, type2, ...)`\n- Ph\u1ea3i return \u0111\u1ee7 s\u1ed1 values, ng\u0103n c\u00e1ch b\u1eb1ng `,`\n- Kh\u00f4ng \u0111\u01b0\u1ee3c b\u1ecdc trong `()` khi return: `return (a, b)` \u2192 **compile error**\n- **Quy \u01b0\u1edbc:** error l\u00e0 gi\u00e1 tr\u1ecb tr\u1ea3 v\u1ec1 **cu\u1ed1i c\u00f9ng**\n\n> **So s\u00e1nh v\u1edbi Java:** Java kh\u00f4ng c\u00f3 multiple return values. Ph\u1ea3i d\u00f9ng wrapper object, array, ho\u1eb7c exception. Go gi\u1ea3i quy\u1ebft g\u1ecdn g\u00e0ng h\u01a1n nhi\u1ec1u \u2014 \u0111\u1eb7c bi\u1ec7t v\u1edbi error handling.\n\n**Multiple return values l\u00e0 NHI\u1ec0U GI\u00c1 TR\u1eca RI\u00caNG BI\u1ec6T, kh\u00f4ng ph\u1ea3i tuple:**\n```go\n// KH\u00d4NG \u0111\u01b0\u1ee3c g\u00e1n v\u00e0o m\u1ed9t bi\u1ebfn duy nh\u1ea5t\nv := divAndRemainder(5, 2)  // compile error!\n\n// Ph\u1ea3i g\u00e1n t\u1eebng gi\u00e1 tr\u1ecb\nresult, remainder, err := divAndRemainder(5, 2)\n```\n\n### B\u1ecf qua returned values\n\n```go\n// B\u1ecf qua m\u1ed9t v\u00e0i gi\u00e1 tr\u1ecb b\u1eb1ng _\nresult, _, err := divAndRemainder(5, 2)\n\n// B\u1ecf qua t\u1ea5t c\u1ea3 (kh\u00f4ng idiomatic \u2014 n\u00ean tr\u00e1nh tr\u1eeb fmt functions)\ndivAndRemainder(5, 2)\n```\n\n---\n\n## 5. Named Return Values\n\n```go\nfunc divAndRemainder(num, denom int) (result int, remainder int, err error) {\n    // result, remainder, err \u0111\u01b0\u1ee3c t\u1ef1 \u0111\u1ed9ng khai b\u00e1o v\u1edbi zero values\n    if denom == 0 {\n        err = errors.New(\"cannot divide by zero\")\n        return result, remainder, err  // result=0, remainder=0\n    }\n    result, remainder = num/denom, num%denom\n    return result, remainder, err\n}\n```\n\n**Named return values:**\n- T\u1ef1 \u0111\u1ed9ng khai b\u00e1o v\u1edbi zero values\n- Ph\u1ea3i \u0111\u1eb7t trong `()` d\u00f9 ch\u1ec9 c\u00f3 1 return value\n- T\u00ean ch\u1ec9 c\u00f3 \u00fd ngh\u0129a trong function \u2014 caller c\u00f3 th\u1ec3 \u0111\u1eb7t t\u00ean kh\u00e1c\n\n**C\u1ea3nh b\u00e1o \u2014 shadowing v\u1edbi named returns:**\n```go\nfunc confusing(num, denom int) (result int, remainder int, err error) {\n    result, remainder = 20, 30  // g\u00e1n gi\u00e1 tr\u1ecb cho named returns\n    if denom == 0 {\n        return 0, 0, errors.New(\"...\")  // return values KH\u00c1C overrides named returns\n    }\n    return num / denom, num % denom, nil\n}\n// Khi denom != 0: tr\u1ea3 v\u1ec1 num/denom, num%denom, nil (kh\u00f4ng ph\u1ea3i 20, 30)\n```\n\n### Blank Returns \u2014 KH\u00d4NG BAO GI\u1edc D\u00d9NG\n\n```go\nfunc divAndRemainder(num, denom int) (result int, remainder int, err error) {\n    if denom == 0 {\n        err = errors.New(\"cannot divide by zero\")\n        return  // blank return \u2014 tr\u1ea3 v\u1ec1 gi\u00e1 tr\u1ecb hi\u1ec7n t\u1ea1i c\u1ee7a result, remainder, err\n    }\n    result, remainder = num/denom, num%denom\n    return  // blank return\n}\n```\n\n> **T\u1ea1i sao kh\u00f4ng d\u00f9ng?** Ng\u01b0\u1eddi \u0111\u1ecdc code ph\u1ea3i scroll ng\u01b0\u1ee3c l\u00ean t\u00ecm xem bi\u1ebfn n\u00e0o \u0111ang \u0111\u01b0\u1ee3c tr\u1ea3 v\u1ec1. R\u1ea5t kh\u00f3 debug.\n\n**Khi n\u00e0o named return values C\u00d3 \u00cdCH?** V\u1edbi `defer` \u0111\u1ec3 modify return values (xem ph\u1ea7n defer).\n\n---\n\n## 6. Functions Are Values\n\nTrong Go, function l\u00e0 first-class value \u2014 c\u00f3 th\u1ec3 g\u00e1n v\u00e0o bi\u1ebfn, truy\u1ec1n v\u00e0o function kh\u00e1c, tr\u1ea3 v\u1ec1 t\u1eeb function.\n\n```go\nfunc f1(a string) int { return len(a) }\nfunc f2(a string) int {\n    total := 0\n    for _, v := range a {\n        total += int(v)\n    }\n    return total\n}\n\nfunc main() {\n    var myFuncVariable func(string) int  // ki\u1ec3u: func(string) int\n    myFuncVariable = f1\n    fmt.Println(myFuncVariable(\"Hello\"))  // 5\n\n    myFuncVariable = f2\n    fmt.Println(myFuncVariable(\"Hello\"))  // 500\n}\n```\n\n**Zero value c\u1ee7a function variable l\u00e0 `nil`:** G\u1ecdi function nil \u2192 panic.\n\n**V\u00ed d\u1ee5 th\u1ef1c t\u1ebf \u2014 simple calculator:**\n```go\nfunc add(i, j int) int { return i + j }\nfunc sub(i, j int) int { return i - j }\nfunc mul(i, j int) int { return i * j }\nfunc div(i, j int) int { return i / j }\n\nvar opMap = map[string]func(int, int) int{\n    \"+\": add,\n    \"-\": sub,\n    \"*\": mul,\n    \"/\": div,\n}\n\n// G\u1ecdi:\nopFunc, ok := opMap[\"+\"]\nif ok {\n    result := opFunc(2, 3)  // 5\n}\n```\n\n### Function Type Declarations\n\n```go\ntype opFuncType func(int, int) int\n\nvar opMap = map[string]opFuncType{\n    \"+\": add,\n    // ...\n}\n```\n\n\u0110\u1eb7t t\u00ean cho function type gi\u00fap code d\u1ec5 \u0111\u1ecdc v\u00e0 t\u00e1i s\u1eed d\u1ee5ng.\n\n> **So s\u00e1nh v\u1edbi Java:** Java 8+ c\u00f3 functional interfaces (`Function<T,R>`, `BiFunction<T,U,R>`) v\u00e0 lambda. Go \u0111\u01a1n gi\u1ea3n h\u01a1n \u2014 function type l\u00e0 first-class, kh\u00f4ng c\u1ea7n wrapper interface.\n\n---\n\n## 7. Anonymous Functions\n\n```go\nfunc main() {\n    f := func(j int) {\n        fmt.Println(\"printing\", j, \"from anonymous function\")\n    }\n    for i := 0; i < 5; i++ {\n        f(i)\n    }\n}\n```\n\n**G\u1ecdi ngay (IIFE):**\n```go\nfunc main() {\n    for i := 0; i < 5; i++ {\n        func(j int) {\n            fmt.Println(\"printing\", j)\n        }(i)  // \u2190 g\u1ecdi ngay v\u1edbi argument i\n    }\n}\n```\n\n**Package-level anonymous functions (c\u1ea9n th\u1eadn):**\n```go\nvar add = func(i, j int) int { return i + j }\n\n// C\u00f3 th\u1ec3 reassign \u2014 nguy hi\u1ec3m v\u00ec thay \u0111\u1ed5i behavior\nfunc changeAdd() {\n    add = func(i, j int) int { return i + j + j }\n}\n```\n\n---\n\n## 8. Closures\n\nClosure l\u00e0 anonymous function c\u00f3 th\u1ec3 access v\u00e0 **modify** bi\u1ebfn trong outer scope:\n\n```go\nfunc main() {\n    a := 20\n    f := func() {\n        fmt.Println(a)   // \u0111\u1ecdc a t\u1eeb outer scope\n        a = 30           // s\u1eeda a t\u1eeb outer scope\n    }\n    f()\n    fmt.Println(a)  // 30 \u2014 a \u0111\u00e3 b\u1ecb thay \u0111\u1ed5i b\u1edfi closure\n}\n// Output: 20, 30\n```\n\n**C\u1ea9n th\u1eadn v\u1edbi shadowing trong closure:**\n```go\nfunc main() {\n    a := 20\n    f := func() {\n        fmt.Println(a)  // \u0111\u1ecdc outer a \u2192 20\n        a := 30          // \u2190 := t\u1ea1o bi\u1ebfn a M\u1edaI trong closure (shadow!)\n        fmt.Println(a)  // 30 (local a)\n    }\n    f()\n    fmt.Println(a)  // 20 \u2014 outer a KH\u00d4NG thay \u0111\u1ed5i\n}\n// Output: 20, 30, 20\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java lambda c\u0169ng l\u00e0 closure nh\u01b0ng ch\u1ec9 capture effectively final variables (kh\u00f4ng th\u1ec3 modify). Go closure c\u00f3 th\u1ec3 modify outer variables \u2014 m\u1ea1nh h\u01a1n nh\u01b0ng c\u1ea7n c\u1ea9n th\u1eadn h\u01a1n.\n\n### Passing Functions as Parameters\n\n```go\ntype Person struct {\n    FirstName string\n    LastName  string\n    Age       int\n}\n\npeople := []Person{\n    {\"Pat\", \"Patterson\", 37},\n    {\"Tracy\", \"Bobdaughter\", 23},\n    {\"Fred\", \"Fredson\", 18},\n}\n\n// Sort theo last name \u2014 closure capture bi\u1ebfn people\nsort.Slice(people, func(i, j int) bool {\n    return people[i].LastName < people[j].LastName\n})\nfmt.Println(people)  // [{Tracy Bobdaughter 23} {Fred Fredson 18} {Pat Patterson 37}]\n\n// Sort theo age\nsort.Slice(people, func(i, j int) bool {\n    return people[i].Age < people[j].Age\n})\nfmt.Println(people)  // [{Fred Fredson 18} {Tracy Bobdaughter 23} {Pat Patterson 37}]\n```\n\nClosure capture `people` t\u1eeb outer scope \u2014 c\u00f9ng m\u1ed9t function sort nh\u01b0ng logic s\u1eafp x\u1ebfp kh\u00e1c nhau.\n\n### Returning Functions from Functions\n\n```go\nfunc makeMult(base int) func(int) int {\n    return func(factor int) int {\n        return base * factor  // closure capture base t\u1eeb outer function\n    }\n}\n\nfunc main() {\n    twoBase := makeMult(2)    // function nh\u00e2n 2\n    threeBase := makeMult(3)  // function nh\u00e2n 3\n    for i := 0; i < 3; i++ {\n        fmt.Println(twoBase(i), threeBase(i))\n    }\n}\n// Output:\n// 0 0\n// 2 3\n// 4 6\n```\n\n**Pattern n\u00e0y g\u1ecdi l\u00e0 \"higher-order functions\"** \u2014 function nh\u1eadn ho\u1eb7c tr\u1ea3 v\u1ec1 function.\n\n---\n\n## 9. defer\n\n`defer` tr\u00ec ho\u00e3n vi\u1ec7c g\u1ecdi function cho \u0111\u1ebfn khi surrounding function tho\u00e1t ra. D\u00f9ng \u0111\u1ec3 d\u1ecdn d\u1eb9p t\u00e0i nguy\u00ean:\n\n```go\nfunc main() {\n    f, err := os.Open(\"filename.txt\")\n    if err != nil {\n        log.Fatal(err)\n    }\n    defer f.Close()  // \u2190 s\u1ebd \u0111\u01b0\u1ee3c g\u1ecdi khi main() tho\u00e1t, d\u00f9 tho\u00e1t b\u1eb1ng c\u00e1ch n\u00e0o\n\n    // \u0111\u1ecdc file...\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java d\u00f9ng `try-with-resources` hay `finally` block. Go d\u00f9ng `defer` \u2014 g\u1ecdn g\u00e0ng h\u01a1n v\u00e0 kh\u00f4ng t\u1ea1o th\u00eam level indentation.\n\n### Nhi\u1ec1u defer \u2014 LIFO order\n\n```go\nfunc deferExample() int {\n    a := 10\n    defer func(val int) {\n        fmt.Println(\"first:\", val)\n    }(a)    // \u2190 a=10 \u0111\u01b0\u1ee3c evaluate NGAY (kh\u00f4ng ph\u1ea3i khi defer ch\u1ea1y)\n    a = 20\n    defer func(val int) {\n        fmt.Println(\"second:\", val)\n    }(a)    // \u2190 a=20\n    a = 30\n    fmt.Println(\"exiting:\", a)\n    return a\n}\n// Output:\n// exiting: 30\n// second: 20  \u2190 ch\u1ea1y sau (LIFO)\n// first: 10   \u2190 ch\u1ea1y cu\u1ed1i\n```\n\n**\u0110i\u1ec3m quan tr\u1ecdng:** Input parameters c\u1ee7a defer \u0111\u01b0\u1ee3c evaluate NGAY khi g\u1ecdi `defer`, kh\u00f4ng ph\u1ea3i khi defer function ch\u1ea1y.\n\n### defer + named return values \u2014 Modify return\n\n```go\nfunc DoSomeInserts(ctx context.Context, db *sql.DB, value1, value2 string) (err error) {\n    tx, err := db.BeginTx(ctx, nil)\n    if err != nil {\n        return err\n    }\n    defer func() {\n        if err == nil {\n            err = tx.Commit()   // \u2190 modify named return value err\n        }\n        if err != nil {\n            tx.Rollback()\n        }\n    }()\n    // ... insert operations\n    return nil\n}\n```\n\n\u0110\u00e2y l\u00e0 l\u00fd do ch\u00ednh \u0111\u1ec3 d\u00f9ng named return values \u2014 cho ph\u00e9p defer function modify return values.\n\n### Pattern: Function tr\u1ea3 v\u1ec1 cleanup function\n\n```go\nfunc getFile(name string) (*os.File, func(), error) {\n    file, err := os.Open(name)\n    if err != nil {\n        return nil, nil, err\n    }\n    return file, func() {\n        file.Close()\n    }, nil\n}\n\nfunc main() {\n    f, closer, err := getFile(os.Args[1])\n    if err != nil {\n        log.Fatal(err)\n    }\n    defer closer()  // Go s\u1ebd kh\u00f4ng compile n\u1ebfu qu\u00ean g\u1ecdi closer (unused variable)\n    // ...\n}\n```\n\n---\n\n## 10. Go Is Call by Value\n\nGo lu\u00f4n **copy** gi\u00e1 tr\u1ecb khi truy\u1ec1n v\u00e0o function:\n\n```go\ntype person struct {\n    age  int\n    name string\n}\n\nfunc modifyFails(i int, s string, p person) {\n    i = i * 2      // ch\u1ec9 s\u1eeda copy\n    s = \"Goodbye\"  // ch\u1ec9 s\u1eeda copy\n    p.name = \"Bob\" // ch\u1ec9 s\u1eeda copy\n}\n\nfunc main() {\n    p := person{}\n    i := 2\n    s := \"Hello\"\n    modifyFails(i, s, p)\n    fmt.Println(i, s, p)  // 2 Hello {0 }  \u2014 kh\u00f4ng \u0111\u1ed5i!\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java c\u0169ng l\u00e0 call-by-value, nh\u01b0ng v\u1edbi objects, c\u00e1i \u0111\u01b0\u1ee3c copy l\u00e0 **reference** (\u0111\u1ecba ch\u1ec9). V\u00ec v\u1eady modifying fields trong Java function \u1ea3nh h\u01b0\u1edfng object g\u1ed1c. Go: struct \u0111\u01b0\u1ee3c copy to\u00e0n b\u1ed9 \u2192 kh\u00f4ng \u1ea3nh h\u01b0\u1edfng.\n\n### Map v\u00e0 Slice \u2014 Tr\u01b0\u1eddng h\u1ee3p \u0111\u1eb7c bi\u1ec7t\n\n```go\nfunc modMap(m map[int]string) {\n    m[2] = \"hello\"     // \u1ea3nh h\u01b0\u1edfng map g\u1ed1c!\n    delete(m, 1)       // \u1ea3nh h\u01b0\u1edfng map g\u1ed1c!\n}\n\nfunc modSlice(s []int) {\n    for k, v := range s {\n        s[k] = v * 2   // \u1ea3nh h\u01b0\u1edfng slice g\u1ed1c!\n    }\n    s = append(s, 10)  // KH\u00d4NG \u1ea3nh h\u01b0\u1edfng slice g\u1ed1c (bi\u1ebfn s \u0111\u01b0\u1ee3c reassign)\n}\n```\n\n**T\u1ea1i sao?** Map v\u00e0 slice \u0111\u01b0\u1ee3c implement v\u1edbi **pointers** b\u00ean trong. Khi copy, b\u1ea1n copy pointer \u2014 c\u1ea3 hai pointer tr\u1ecf \u0111\u1ebfn c\u00f9ng underlying data.\n\n**Quy t\u1eafc:**\n- S\u1eeda **ph\u1ea7n t\u1eed** c\u1ee7a slice trong function \u2192 \u1ea3nh h\u01b0\u1edfng slice g\u1ed1c\n- `append` slice trong function \u2192 KH\u00d4NG \u1ea3nh h\u01b0\u1edfng slice g\u1ed1c (append c\u00f3 th\u1ec3 t\u1ea1o backing array m\u1edbi)\n- M\u1ecdi thay \u0111\u1ed5i tr\u00ean map \u2192 \u1ea3nh h\u01b0\u1edfng map g\u1ed1c\n\n> **M\u1ecdi ki\u1ec3u trong Go \u0111\u1ec1u l\u00e0 value type. \u0110\u00f4i khi value \u0111\u00f3 l\u00e0 pointer.**\n\nKhi c\u1ea7n function th\u1ef1c s\u1ef1 modify input \u2192 d\u00f9ng **pointer** (h\u1ecdc \u1edf Chapter 6).\n\n---\n\n## Exercises\n\n**1. Division by zero:**\n```go\nfunc div(i, j int) (int, error) {\n    if j == 0 {\n        return 0, errors.New(\"division by zero\")\n    }\n    return i / j, nil\n}\n```\n\n**2. fileLen v\u1edbi defer:**\n```go\nfunc fileLen(name string) (int, error) {\n    f, err := os.Open(name)\n    if err != nil {\n        return 0, err\n    }\n    defer f.Close()  // \u0111\u1ea3m b\u1ea3o file lu\u00f4n \u0111\u01b0\u1ee3c \u0111\u00f3ng\n\n    data, err := io.ReadAll(f)\n    if err != nil {\n        return 0, err\n    }\n    return len(data), nil\n}\n```\n\n**3. prefixer \u2014 closure:**\n```go\nfunc prefixer(prefix string) func(string) string {\n    return func(s string) string {\n        return prefix + \" \" + s  // closure capture prefix\n    }\n}\n\nfunc main() {\n    helloPrefix := prefixer(\"Hello\")\n    fmt.Println(helloPrefix(\"Bob\"))    // Hello Bob\n    fmt.Println(helloPrefix(\"Maria\"))  // Hello Maria\n}\n```\n\n---\n\n## Wrapping Up\n\nB\u1ea1n \u0111\u00e3 h\u1ecdc:\n- **Function syntax** \u2014 `func name(params) returnType`\n- **Multiple return values** \u2014 \u0111\u1eb7c \u0111i\u1ec3m quan tr\u1ecdng nh\u1ea5t, d\u00f9ng nhi\u1ec1u cho error handling\n- **Variadic** \u2014 `...type` l\u00e0 tham s\u1ed1 cu\u1ed1i c\u00f9ng\n- **Named return values** \u2014 khai b\u00e1o tr\u01b0\u1edbc, zero values t\u1ef1 \u0111\u1ed9ng; d\u00f9ng v\u1edbi defer\n- **Blank returns** \u2014 KH\u00d4NG d\u00f9ng\n- **Functions as values** \u2014 function variable, anonymous function, closures\n- **Higher-order functions** \u2014 pass functions in/out\n- **defer** \u2014 cleanup t\u00e0i nguy\u00ean, LIFO order, parameters evaluated ngay l\u1eadp t\u1ee9c\n- **Call by value** \u2014 struct \u0111\u01b0\u1ee3c copy; map/slice chia s\u1ebb underlying data qua pointer\n\n**Ch\u01b0\u01a1ng ti\u1ebfp theo:** Pointers \u2014 hi\u1ec3u khi n\u00e0o v\u00e0 t\u1ea1i sao c\u1ea7n truy\u1ec1n pointer.\n\n\n# Chapter 6. Pointers\n\n## Gi\u1edbi thi\u1ec7u\n\nCh\u01b0\u01a1ng n\u00e0y gi\u1ea3i th\u00edch:\n- Pointer l\u00e0 g\u00ec v\u00e0 c\u00fa ph\u00e1p c\u01a1 b\u1ea3n\n- T\u1ea1i sao Go developers n\u00ean d\u00f9ng pointer m\u1ed9t c\u00e1ch ti\u1ebft ki\u1ec7m\n- Khi n\u00e0o n\u00ean v\u00e0 kh\u00f4ng n\u00ean d\u00f9ng pointer\n- Stack vs Heap \u2014 memory allocation\n- Garbage collector v\u00e0 c\u00e1ch t\u1ed1i \u01b0u\n\n---\n\n## 1. A Quick Pointer Primer\n\n**Pointer** l\u00e0 bi\u1ebfn l\u01b0u \u0111\u1ecba ch\u1ec9 b\u1ed9 nh\u1edb n\u01a1i m\u1ed9t gi\u00e1 tr\u1ecb kh\u00e1c \u0111\u01b0\u1ee3c l\u01b0u tr\u1eef.\n\n```\nB\u1ed9 nh\u1edb:\nAddress  Value\n1        10      \u2190 var x int32 = 10\n5        1       \u2190 var y bool = true (1 = true)\n6        1       \u2190 pointerX = &x (l\u01b0u address 1)\n10       5       \u2190 pointerY = &y (l\u01b0u address 5)\n14       0       \u2190 var pointerZ *string (nil = 0)\n```\n\n### C\u00fa ph\u00e1p pointer\n\n```go\n// & \u2014 address operator: l\u1ea5y \u0111\u1ecba ch\u1ec9 c\u1ee7a bi\u1ebfn\nx := \"hello\"\npointerToX := &x      // pointerToX ch\u1ee9a \u0111\u1ecba ch\u1ec9 c\u1ee7a x\n\n// * \u2014 indirection operator (dereferencing): l\u1ea5y gi\u00e1 tr\u1ecb t\u1ea1i \u0111\u1ecba ch\u1ec9\nx := 10\npointerToX := &x\nfmt.Println(pointerToX)   // 0xc0000b4010 (\u0111\u1ecba ch\u1ec9 b\u1ed9 nh\u1edb)\nfmt.Println(*pointerToX)  // 10 (gi\u00e1 tr\u1ecb t\u1ea1i \u0111\u1ecba ch\u1ec9 \u0111\u00f3)\nz := 5 + *pointerToX\nfmt.Println(z)            // 15\n```\n\n**Zero value c\u1ee7a pointer l\u00e0 `nil`:**\n```go\nvar x *int\nfmt.Println(x == nil)  // true\nfmt.Println(*x)        // PANIC! Kh\u00f4ng \u0111\u01b0\u1ee3c dereference nil pointer\n```\n\n**Khai b\u00e1o pointer type:**\n```go\nx := 10\nvar pointerToX *int   // pointer to int\npointerToX = &x\n```\n\n**T\u1ea1o pointer v\u1edbi `new`:**\n```go\nvar x = new(int)\nfmt.Println(x == nil)  // false\nfmt.Println(*x)        // 0 (zero value c\u1ee7a int)\n// Hi\u1ebfm khi d\u00f9ng new \u2014 ch\u1ec9 d\u00f9ng v\u1edbi struct literal &Foo{}\n```\n\n**Pointer to struct:**\n```go\nx := &Foo{}    // pointer to struct \u2014 d\u00f9ng ph\u1ed5 bi\u1ebfn\nvar y string\nz := &y        // pointer to string variable\n```\n\n**Kh\u00f4ng th\u1ec3 l\u1ea5y address c\u1ee7a constant hay literal:**\n```go\ntype person struct {\n    FirstName  string\n    MiddleName *string  // pointer field\n    LastName   string\n}\n\n// KH\u00d4NG \u0111\u01b0\u1ee3c:\np := person{\n    MiddleName: \"Perry\",  // compile error: cannot use \"Perry\" as *string\n}\n\n// Gi\u1ea3i ph\u00e1p 1: d\u00f9ng bi\u1ebfn trung gian\nmiddleName := \"Perry\"\np := person{MiddleName: &middleName}\n\n// Gi\u1ea3i ph\u00e1p 2: helper function (generic)\nfunc makePointer[T any](t T) *T {\n    return &t\n}\np := person{MiddleName: makePointer(\"Perry\")}\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java kh\u00f4ng c\u00f3 pointer c\u00fa ph\u00e1p (d\u00f9ng references ng\u1ea7m). Go t\u01b0\u1eddng minh h\u01a1n \u2014 b\u1ea1n th\u1ea5y r\u00f5 khi n\u00e0o \u0111ang d\u00f9ng pointer.\n\n---\n\n## 2. Don't Fear the Pointers\n\nN\u1ebfu b\u1ea1n \u0111\u1ebfn t\u1eeb Java, Python, Ruby \u2014 **pointer trong Go ch\u00ednh l\u00e0 behavior quen thu\u1ed9c c\u1ee7a objects trong c\u00e1c ng\u00f4n ng\u1eef \u0111\u00f3**.\n\n**Java/Python/Ruby:**\n```python\n# Python\nclass Foo:\n    def __init__(self, x): self.x = x\n\ndef outer():\n    f = Foo(10)\n    inner1(f)\n    print(f.x)  # 20 \u2014 field b\u1ecb s\u1eeda trong inner1\n\ndef inner1(f):\n    f.x = 20    # s\u1eeda field \u2192 \u1ea3nh h\u01b0\u1edfng f \u1edf outer\n\ndef inner2(f):\n    f = Foo(30) # reassign parameter \u2192 KH\u00d4NG \u1ea3nh h\u01b0\u1edfng f \u1edf outer\n```\n\n**Go v\u1edbi pointer \u2014 h\u00e0nh vi gi\u1ed1ng h\u1ec7t:**\n```go\ntype Foo struct{ x int }\n\nfunc inner1(f *Foo) {\n    f.x = 20    // s\u1eeda field qua pointer \u2192 \u1ea3nh h\u01b0\u1edfng caller\n}\n\nfunc inner2(f *Foo) {\n    f = &Foo{x: 30}  // reassign pointer \u2192 KH\u00d4NG \u1ea3nh h\u01b0\u1edfng caller\n}\n```\n\n**Quy t\u1eafc trong m\u1ecdi ng\u00f4n ng\u1eef (Java, Python, Ruby, Go):**\n1. S\u1eeda **field** c\u1ee7a object/struct \u0111\u01b0\u1ee3c pass v\u00e0o \u2192 \u1ea3nh h\u01b0\u1edfng original \u2713\n2. **Reassign** tham s\u1ed1 b\u1eb1ng object/struct m\u1edbi \u2192 KH\u00d4NG \u1ea3nh h\u01b0\u1edfng original \u2717\n3. Pass `nil`/`null` v\u00e0o, g\u00e1n gi\u00e1 tr\u1ecb m\u1edbi cho parameter \u2192 KH\u00d4NG \u1ea3nh h\u01b0\u1edfng original \u2717\n\n**\u0110i\u1ec3m kh\u00e1c bi\u1ec7t c\u1ee7a Go:** B\u1ea1n \u0111\u01b0\u1ee3c **ch\u1ecdn** d\u00f9ng pointer hay value. V\u1edbi Java/Python/Ruby, objects lu\u00f4n l\u00e0 implicit pointer.\n\n---\n\n## 3. Pointers Indicate Mutable Parameters\n\nGo kh\u00f4ng c\u00f3 `final` (Java) hay `const` cho variables. Thay v\u00e0o \u0111\u00f3:\n- **Value parameter** \u2192 function nh\u1eadn copy, KH\u00d4NG th\u1ec3 modify original\n- **Pointer parameter** \u2192 function nh\u1eadn \u0111\u1ecba ch\u1ec9, C\u00d3 TH\u1ec2 modify original\n\n```go\n// Value \u2014 immutable t\u1eeb g\u00f3c nh\u00ecn c\u1ee7a function\nfunc cannotModify(s string) {\n    s = \"changed\"  // ch\u1ec9 s\u1eeda copy\n}\n\n// Pointer \u2014 mutable\nfunc canModify(s *string) {\n    *s = \"changed\"  // s\u1eeda value t\u1ea1i \u0111\u1ecba ch\u1ec9 \u2192 \u1ea3nh h\u01b0\u1edfng caller\n}\n```\n\n**C\u1ea1m b\u1eaby 1: Pass nil pointer, kh\u00f4ng th\u1ec3 make it non-nil:**\n```go\nfunc failedUpdate(g *int) {\n    x := 10\n    g = &x     // ch\u1ec9 s\u1eeda copy c\u1ee7a pointer, kh\u00f4ng s\u1eeda original\n}\n\nfunc main() {\n    var f *int   // nil\n    failedUpdate(f)\n    fmt.Println(f)  // nil \u2014 kh\u00f4ng \u0111\u1ed5i!\n}\n```\n\n**C\u1ea1m b\u1eaby 2: Reassign pointer \u2260 modify pointed-to value:**\n```go\nfunc failedUpdate(px *int) {\n    x2 := 20\n    px = &x2    // \u2190 thay \u0111\u1ed5i copy c\u1ee7a pointer, kh\u00f4ng thay \u0111\u1ed5i original\n}\n\nfunc update(px *int) {\n    *px = 20    // \u2190 dereference v\u00e0 g\u00e1n \u2192 thay \u0111\u1ed5i value t\u1ea1i \u0111\u1ecba ch\u1ec9\n}\n\nfunc main() {\n    x := 10\n    failedUpdate(&x)\n    fmt.Println(x)  // 10 \u2014 kh\u00f4ng \u0111\u1ed5i\n    update(&x)\n    fmt.Println(x)  // 20 \u2014 \u0111\u00e3 \u0111\u1ed5i\n}\n```\n\n> **Quy t\u1eafc nh\u1edb:** \u0110\u1ec3 modify gi\u00e1 tr\u1ecb qua pointer, ph\u1ea3i dereference: `*px = newValue`\n\n---\n\n## 4. Pointers Are a Last Resort\n\n**D\u00f9ng value types theo m\u1eb7c \u0111\u1ecbnh. Pointer ch\u1ec9 khi c\u1ea7n thi\u1ebft.**\n\n```go\n// \u274c \u0110\u1eebng l\u00e0m th\u1ebf n\u00e0y \u2014 Java-style, kh\u00f4ng idiomatic Go\nfunc MakeFoo(f *Foo) error {\n    f.Field1 = \"val\"\n    f.Field2 = 20\n    return nil\n}\n\n// \u2705 H\u00e3y l\u00e0m th\u1ebf n\u00e0y \u2014 Go idiom\nfunc MakeFoo() (Foo, error) {\n    f := Foo{\n        Field1: \"val\",\n        Field2: 20,\n    }\n    return f, nil\n}\n```\n\n**Ngo\u1ea1i l\u1ec7 \u2014 d\u00f9ng pointer parameter v\u1edbi interface (nh\u01b0 JSON):**\n```go\n// json.Unmarshal c\u1ea7n pointer v\u00ec kh\u00f4ng bi\u1ebft type at compile time\nf := struct {\n    Name string `json:\"name\"`\n    Age  int    `json:\"age\"`\n}{}\nerr := json.Unmarshal([]byte(`{\"name\": \"Bob\", \"age\": 30}`), &f)\n```\n\n**Khi n\u00e0o KH\u00d4NG d\u00f9ng pointer:**\n- Primitive types (int, string, bool...)\n- Small structs \u2014 return value, kh\u00f4ng return pointer\n- Khi function kh\u00f4ng c\u1ea7n modify value\n\n**Khi n\u00e0o C\u00d3 TH\u1ec2 d\u00f9ng pointer:**\n- Function c\u1ea7n modify input\n- Large structs (performance \u2014 xem ph\u1ea7n ti\u1ebfp)\n- C\u1ea7n ph\u00e2n bi\u1ec7t \"zero value\" vs \"kh\u00f4ng c\u00f3 gi\u00e1 tr\u1ecb\"\n- Concurrency (m\u1ed9t s\u1ed1 types b\u1eaft bu\u1ed9c ph\u1ea3i truy\u1ec1n pointer)\n\n> **So s\u00e1nh v\u1edbi Java:** Java objects lu\u00f4n l\u00e0 implicit pointer \u2192 garbage collector ph\u1ea3i l\u00e0m nhi\u1ec1u h\u01a1n. Go value types \u2192 \u00edt garbage h\u01a1n, faster GC.\n\n---\n\n## 5. Pointer Passing Performance\n\n| K\u1ecbch b\u1ea3n | K\u1ebft qu\u1ea3 |\n|---|---|\n| Pass pointer v\u00e0o function | H\u1eb1ng s\u1ed1 ~1 nanosecond, b\u1ea5t k\u1ec3 size |\n| Pass value v\u00e0o function | T\u0103ng theo data size; ~0.7ms cho 10MB |\n| Return pointer t\u1eeb function | ~30ns cho 100 bytes |\n| Return value t\u1eeb function | ~10ns cho 100 bytes, ch\u1eadm h\u01a1n pointer |\n| Return large value (>10MB) | ~1.5ms; return pointer (~0.5ms) nhanh h\u01a1n |\n\n**K\u1ebft lu\u1eadn th\u1ef1c t\u1ebf:**\n- H\u1ea7u h\u1ebft structs nh\u1ecf \u2192 d\u00f9ng value, kh\u00f4ng c\u1ea7n lo performance\n- N\u1ebfu profiler cho th\u1ea5y large data l\u00e0 bottleneck \u2192 m\u1edbi x\u00e9t d\u00f9ng pointer\n- \u0110\u1eebng optimize s\u1edbm \u2014 \u0111\u1ecdc code tr\u01b0\u1edbc, profile sau\n\n---\n\n## 6. The Zero Value Versus No Value\n\nPointer c\u00f3 th\u1ec3 ph\u00e2n bi\u1ec7t \"zero value\" vs \"kh\u00f4ng \u0111\u01b0\u1ee3c set\":\n\n```go\n// int: zero value = 0\n// *int: nil = ch\u01b0a \u0111\u01b0\u1ee3c set; &0 = \u0111\u01b0\u1ee3c set v\u1edbi gi\u00e1 tr\u1ecb 0\n\ntype Config struct {\n    Timeout *int   // nil = kh\u00f4ng set; non-nil = set (k\u1ec3 c\u1ea3 0)\n    MaxSize *int\n}\n```\n\n**Nh\u01b0ng c\u1ea9n th\u1eadn:** Pointer indicates mutable. N\u1ebfu kh\u00f4ng c\u1ea7n modify, d\u00f9ng value + bool:\n\n```go\n// T\u1ed1t h\u01a1n khi kh\u00f4ng c\u1ea7n mutation:\ntype Config struct {\n    Timeout int\n    HasTimeout bool\n}\n\n// Ho\u1eb7c d\u00f9ng comma ok idiom khi return t\u1eeb function\nfunc getTimeout() (int, bool) {\n    // ...\n}\n```\n\n**D\u00f9ng pointer-to-nullable cho JSON:**\n```go\ntype Person struct {\n    Name      string  `json:\"name\"`\n    MiddleName *string `json:\"middleName,omitempty\"`  // nil = absent in JSON\n}\n```\n\n---\n\n## 7. The Difference Between Maps and Slices\n\n### Maps \u2014 implemented as pointer\n\n```go\n// Map trong Go l\u00e0 pointer \u0111\u1ebfn struct b\u00ean trong\n// \u2192 M\u1ecdi thay \u0111\u1ed5i trong function \u1ea3nh h\u01b0\u1edfng map g\u1ed1c\nfunc modMap(m map[int]string) {\n    m[2] = \"hello\"  // \u1ea3nh h\u01b0\u1edfng map g\u1ed1c\n    delete(m, 1)    // \u1ea3nh h\u01b0\u1edfng map g\u1ed1c\n}\n```\n\n**H\u1ec7 qu\u1ea3 cho API design:** Tr\u00e1nh d\u00f9ng map l\u00e0m parameter/return value tr\u00ean public APIs:\n- Map kh\u00f4ng self-documenting (kh\u00f4ng r\u00f5 keys l\u00e0 g\u00ec)\n- Map kh\u00f4ng immutable \u2014 caller kh\u00f4ng bi\u1ebft function c\u00f3 modify kh\u00f4ng\n- **D\u00f9ng struct thay map khi c\u00f3 th\u1ec3**\n\n### Slices \u2014 struct v\u1edbi 3 fields + pointer\n\nB\u00ean trong Go, slice l\u00e0:\n```\nstruct {\n    ptr      *T   // pointer to backing array\n    len      int  // current length\n    cap      int  // current capacity\n}\n```\n\nKhi pass slice v\u00e0o function, b\u1ea1n copy c\u1ea3 3 fields (bao g\u1ed3m c\u1ea3 pointer):\n\n```go\nfunc modSlice(s []int) {\n    for k, v := range s {\n        s[k] = v * 2   // s\u1eeda qua shared pointer \u2192 \u1ea3nh h\u01b0\u1edfng g\u1ed1c \u2713\n    }\n    s = append(s, 10)  // n\u1ebfu c\u00f2n capacity: ghi v\u00e0o backing array nh\u01b0ng len g\u1ed1c kh\u00f4ng \u0111\u1ed5i\n                        // n\u1ebfu h\u1ebft capacity: t\u1ea1o backing array m\u1edbi \u2192 g\u1ed1c kh\u00f4ng th\u1ea5y \u2717\n}\n```\n\n| H\u00e0nh \u0111\u1ed9ng trong function | \u1ea2nh h\u01b0\u1edfng slice g\u1ed1c? |\n|---|---|\n| `s[i] = v` \u2014 s\u1eeda ph\u1ea7n t\u1eed | \u2713 C\u00f3 |\n| `append(s, v)` v\u1edbi c\u00f2n capacity | Ghi data v\u00e0o, nh\u01b0ng len g\u1ed1c kh\u00f4ng \u0111\u1ed5i |\n| `append(s, v)` h\u1ebft capacity | \u2717 Kh\u00f4ng \u2014 t\u1ea1o backing array m\u1edbi |\n\n---\n\n## 8. Slices as Buffers\n\n**Pattern quan tr\u1ecdng** \u2014 t\u00e1i s\u1eed d\u1ee5ng slice l\u00e0m buffer thay v\u00ec allocate m\u1ed7i l\u1ea7n:\n\n```go\n// \u274c Kh\u00f4ng t\u1ed1t \u2014 m\u1ed7i iteration allocate m\u1edbi\nfor data := range resource {\n    process(data)  // data allocation l\u00e3ng ph\u00ed\n}\n\n// \u2705 T\u1ed1t \u2014 m\u1ed9t l\u1ea7n allocate, t\u00e1i s\u1eed d\u1ee5ng buffer\nfile, err := os.Open(fileName)\ndefer file.Close()\n\ndata := make([]byte, 100)  // t\u1ea1o buffer 1 l\u1ea7n\nfor {\n    count, err := file.Read(data)\n    process(data[:count])  // ch\u1ec9 process ph\u1ea7n \u0111\u00e3 \u0111\u1ecdc\n    if err != nil {\n        if errors.Is(err, io.EOF) { return nil }\n        return err\n    }\n}\n```\n\n\u0110\u00e2y l\u00e0 pattern t\u1ea1i sao `json.Unmarshal` nh\u1eadn pointer thay v\u00ec return value \u2014 t\u00e1i s\u1eed d\u1ee5ng allocated memory.\n\n---\n\n## 9. Stack vs Heap \u2014 Memory Allocation\n\n### Stack\n- B\u1ed9 nh\u1edb li\u00ean t\u1ee5c, m\u1ed7i function call c\u00f3 stack frame ri\u00eang\n- Allocation c\u1ef1c nhanh \u2014 ch\u1ec9 di chuy\u1ec3n stack pointer\n- Bi\u1ebfn local \u0111\u01b0\u1ee3c l\u01b0u tr\u00ean stack\n- T\u1ef1 \u0111\u1ed9ng gi\u1ea3i ph\u00f3ng khi function return\n\n**\u0110i\u1ec1u ki\u1ec7n \u0111\u1ec3 l\u01b0u tr\u00ean stack:**\n- Size ph\u1ea3i bi\u1ebft t\u1ea1i compile time\n- Pointer kh\u00f4ng \u0111\u01b0\u1ee3c return ra ngo\u00e0i function\n- Compiler ph\u1ea3i ch\u1eafc ch\u1eafn data kh\u00f4ng escape\n\n### Heap\n- B\u1ed9 nh\u1edb do garbage collector qu\u1ea3n l\u00fd\n- Allocation ch\u1eadm h\u01a1n stack\n- Data s\u1ed1ng tr\u00ean heap n\u1ebfu pointer escapes stack\n\n**Escape analysis:**\n```go\nfunc returnsLocal() *int {\n    x := 10\n    return &x   // x escapes to heap (Go compiler t\u1ef1 x\u1eed l\u00fd, kh\u00f4ng crash nh\u01b0 C)\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java objects lu\u00f4n tr\u00ean heap. Go value types tr\u00ean stack \u2192 \u00edt GC work h\u01a1n nhi\u1ec1u.\n\n### Garbage Collector trong Go\n\nGo GC \u01b0u ti\u00ean **low latency** (< 500 microseconds pause) thay v\u00ec throughput cao.\n\n**V\u1ea5n \u0111\u1ec1 v\u1edbi nhi\u1ec1u garbage:**\n1. GC ch\u1ea1y nhi\u1ec1u h\u01a1n \u2192 steal CPU time\n2. Data scattered tr\u00ean heap \u2192 CPU cache miss \u2192 ch\u1eadm h\u01a1n\n\n**Mechanical Sympathy:** Vi\u1ebft code aware of hardware:\n```go\n// Slice of structs \u2014 data contiguous trong memory \u2192 cache-friendly \u2713\ntype Person struct { Name string; Age int }\npeople := []Person{{...}, {...}, ...}\n\n// Slice of pointers \u2014 data scattered trong memory \u2192 cache miss \u2717\npeople := []*Person{{...}, {...}, ...}\n```\n\nJava List<Object> th\u1ef1c ch\u1ea5t l\u00e0 array of pointers \u2192 data scattered \u2192 ch\u1eadm.\nGo `[]Struct` c\u00f3 data li\u00ean t\u1ee5c \u2192 nhanh h\u01a1n.\n\n---\n\n## 10. Tuning the Garbage Collector\n\n**GOGC** \u2014 ki\u1ec3m so\u00e1t khi n\u00e0o GC ch\u1ea1y:\n```bash\n# Formula: next_GC = current_heap * (1 + GOGC/100)\n# Default GOGC=100 \u2192 heap doubles \u2192 trigger GC\n\nGOGC=200   # GC \u00edt h\u01a1n, d\u00f9ng nhi\u1ec1u memory h\u01a1n\nGOGC=50    # GC nhi\u1ec1u h\u01a1n, d\u00f9ng \u00edt memory h\u01a1n\nGOGC=off   # T\u1eaft GC (ch\u1ec9 cho batch jobs)\n```\n\n**GOMEMLIMIT** \u2014 gi\u1edbi h\u1ea1n t\u1ed5ng memory:\n```bash\nGOMEMLIMIT=3GiB   # gi\u1edbi h\u1ea1n 3 gibibytes\n\n# K\u1ebft h\u1ee3p t\u1ed1t nh\u1ea5t:\nGOGC=100 GOMEMLIMIT=<max_available_memory * 0.9>\n```\n\n**Debug GC:**\n```bash\nGODEBUG=gctrace=1 ./myprogram  # in th\u00f4ng tin GC khi ch\u1ea1y\ngo build -gcflags=\"-m\"          # xem variables n\u00e0o escape to heap\n```\n\n---\n\n## Exercises\n\n**1. MakePerson vs MakePersonPointer:**\n```go\ntype Person struct {\n    FirstName string\n    LastName  string\n    Age       int\n}\n\nfunc MakePerson(firstName, lastName string, age int) Person {\n    return Person{firstName, lastName, age}\n}\n\nfunc MakePersonPointer(firstName, lastName string, age int) *Person {\n    return &Person{firstName, lastName, age}\n}\n\n// Compile v\u1edbi: go build -gcflags=\"-m\"\n// MakePerson: c\u00f3 th\u1ec3 kh\u00f4ng escape (stored on stack)\n// MakePersonPointer: escapes to heap (return pointer)\n```\n\n**2. UpdateSlice vs GrowSlice:**\n```go\nfunc UpdateSlice(s []string, str string) {\n    s[len(s)-1] = str  // modify element \u2192 caller th\u1ea5y thay \u0111\u1ed5i\n    fmt.Println(\"inside UpdateSlice:\", s)\n}\n\nfunc GrowSlice(s []string, str string) {\n    s = append(s, str)  // grow \u2192 caller KH\u00d4NG th\u1ea5y thay \u0111\u1ed5i\n    fmt.Println(\"inside GrowSlice:\", s)\n}\n\nfunc main() {\n    s := []string{\"a\", \"b\", \"c\"}\n    fmt.Println(\"before UpdateSlice:\", s)   // [a b c]\n    UpdateSlice(s, \"z\")\n    fmt.Println(\"after UpdateSlice:\", s)    // [a b z] \u2190 th\u1ea5y thay \u0111\u1ed5i\n\n    fmt.Println(\"before GrowSlice:\", s)     // [a b z]\n    GrowSlice(s, \"d\")\n    fmt.Println(\"after GrowSlice:\", s)      // [a b z] \u2190 KH\u00d4NG th\u1ea5y \"d\"\n}\n```\n\n---\n\n## Wrapping Up\n\nB\u1ea1n \u0111\u00e3 h\u1ecdc:\n- **Pointer syntax**: `&` l\u1ea5y address, `*` dereference\n- **nil pointer**: zero value, panic n\u1ebfu dereference\n- **Pointer = mutable parameter**: value = immutable, pointer = mutable\n- **Quy t\u1eafc v\u00e0ng**: D\u00f9ng value theo m\u1eb7c \u0111\u1ecbnh, pointer ch\u1ec9 khi c\u1ea7n\n- **Maps**: implemented as pointer \u2014 m\u1ecdi thay \u0111\u1ed5i \u1ea3nh h\u01b0\u1edfng original\n- **Slices**: copy of (ptr, len, cap) \u2014 s\u1eeda element th\u00ec \u1ea3nh h\u01b0\u1edfng, append th\u00ec kh\u00f4ng (n\u1ebfu h\u1ebft cap)\n- **Stack vs Heap**: value types tr\u00ean stack \u2192 \u00edt GC work \u2192 nhanh h\u01a1n\n- **GC tuning**: GOGC, GOMEMLIMIT cho production\n\n**Ch\u01b0\u01a1ng ti\u1ebfp theo:** Methods, Interfaces, v\u00e0 Types \u2014 OOP trong Go.\n\n\n# Chapter 7. Types, Methods, and Interfaces\n\n## Gi\u1edbi thi\u1ec7u\n\n\u0110\u00e2y l\u00e0 ch\u01b0\u01a1ng quan tr\u1ecdng nh\u1ea5t v\u1ec1 thi\u1ebft k\u1ebf h\u01b0\u1edbng \u0111\u1ed1i t\u01b0\u1ee3ng trong Go. Go **kh\u00f4ng c\u00f3** class, inheritance, method overloading \u2014 nh\u01b0ng c\u00f3 c\u00e1ch ti\u1ebfp c\u1eadn hay h\u01a1n: **composition, implicit interfaces, v\u00e0 duck typing an to\u00e0n ki\u1ec3u d\u1eef li\u1ec7u**.\n\n---\n\n## 1. Types in Go\n\n### User-defined types\n\n```go\n// Struct type (\u0111\u00e3 bi\u1ebft)\ntype Person struct {\n    FirstName string\n    LastName  string\n    Age       int\n}\n\n// Type d\u1ef1a tr\u00ean built-in type\ntype Score int\ntype Converter func(string) Score\ntype TeamScores map[string]Score\n```\n\n**T\u1ea1i sao t\u1ea1o type m\u1edbi t\u1eeb built-in?**\n- **Documentation** \u2014 t\u00ean type truy\u1ec1n \u0111\u1ea1t \u00fd ngh\u0129a\n- **Type safety** \u2014 tr\u00e1nh nh\u1ea7m l\u1eabn gi\u1eefa c\u00e1c s\u1ed1 nguy\u00ean c\u00f3 ngh\u0129a kh\u00e1c nhau\n\n```go\nfunc processScore(s Score) { ... }  // r\u00f5 r\u00e0ng h\u01a1n processScore(n int)\nfunc processPercentage(p Percentage) { ... }\n```\n\n### Type declarations kh\u00f4ng ph\u1ea3i inheritance\n\n```go\ntype HighScore Score\n\nvar s Score = 100\nvar hs HighScore = 200\nhs = s         // compile error! D\u00f9 c\u00f9ng underlying type int\ns = hs         // compile error!\ns = Score(hs)  // OK \u2014 type conversion t\u01b0\u1eddng minh\nhs = HighScore(s)  // OK\n```\n\nC\u00e1c methods c\u1ee7a `Score` KH\u00d4NG c\u00f3 tr\u00ean `HighScore`:\n```go\n// Score c\u00f3 method String() \u2192 HighScore KH\u00d4NG c\u00f3 String()\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java subclass k\u1ebf th\u1eeba methods c\u1ee7a parent class. Go type declaration **kh\u00f4ng** k\u1ebf th\u1eeba methods \u2014 ch\u1ec9 chia s\u1ebb underlying representation.\n\n---\n\n## 2. Methods\n\n```go\ntype Person struct {\n    FirstName string\n    LastName  string\n    Age       int\n}\n\n// Method declaration: receiver \u0111\u1ee9ng tr\u01b0\u1edbc t\u00ean method\nfunc (p Person) String() string {\n    return fmt.Sprintf(\"%s %s, age %d\", p.FirstName, p.LastName, p.Age)\n}\n\n// G\u1ecdi method\np := Person{FirstName: \"Fred\", LastName: \"Fredson\", Age: 52}\noutput := p.String()\n```\n\n**Convention:**\n- Receiver name = vi\u1ebft t\u1eaft c\u1ee7a type name (th\u01b0\u1eddng ch\u1eef c\u00e1i \u0111\u1ea7u): `p` cho `Person`\n- **KH\u00d4NG d\u00f9ng** `this` hay `self`\n- Methods ph\u1ea3i khai b\u00e1o trong **c\u00f9ng package** v\u1edbi type\n\n> **So s\u00e1nh v\u1edbi Java:** Java: `class Person { String name; String getName() { return name; } }`. Go t\u00e1ch bi\u1ec7t data (struct) v\u00e0 behavior (methods), d\u00f9 \u1edf c\u00f9ng package.\n\n### Pointer Receivers vs Value Receivers\n\n```go\ntype Counter struct {\n    total       int\n    lastUpdated time.Time\n}\n\n// Pointer receiver \u2014 C\u00d3 TH\u1ec2 modify state\nfunc (c *Counter) Increment() {\n    c.total++\n    c.lastUpdated = time.Now()\n}\n\n// Value receiver \u2014 KH\u00d4NG modify state (nh\u1eadn copy)\nfunc (c Counter) String() string {\n    return fmt.Sprintf(\"total: %d, last updated: %v\", c.total, c.lastUpdated)\n}\n```\n\n**Quy t\u1eafc ch\u1ecdn receiver:**\n\n| Khi n\u00e0o | D\u00f9ng |\n|---|---|\n| Method modify receiver | Pointer receiver (b\u1eaft bu\u1ed9c) |\n| Method c\u1ea7n x\u1eed l\u00fd nil instance | Pointer receiver (b\u1eaft bu\u1ed9c) |\n| Method kh\u00f4ng modify, nh\u01b0ng type c\u00f3 pointer receiver kh\u00e1c | Pointer receiver (consistent) |\n| Method kh\u00f4ng modify, type kh\u00f4ng c\u00f3 pointer receivers | Value receiver |\n\n**Go t\u1ef1 \u0111\u1ed9ng chuy\u1ec3n \u0111\u1ed5i:**\n```go\nvar c Counter\nc.Increment()   // Go t\u1ef1 chuy\u1ec3n th\u00e0nh (&c).Increment()\n\ncp := &Counter{}\ncp.String()     // Go t\u1ef1 chuy\u1ec3n th\u00e0nh (*cp).String()\n```\n\n**C\u1ea9n th\u1eadn khi pass by value:**\n```go\nfunc doUpdateWrong(c Counter) {  // nh\u1eadn COPY\n    c.Increment()   // modify copy, kh\u00f4ng \u1ea3nh h\u01b0\u1edfng g\u1ed1c\n}\n\nfunc doUpdateRight(c *Counter) { // nh\u1eadn pointer\n    c.Increment()   // modify qua pointer \u2192 \u1ea3nh h\u01b0\u1edfng g\u1ed1c\n}\n\nvar c Counter\ndoUpdateWrong(c)\nfmt.Println(c.String())  // total: 0 \u2014 kh\u00f4ng \u0111\u1ed5i!\ndoUpdateRight(&c)\nfmt.Println(c.String())  // total: 1 \u2014 \u0111\u00e3 \u0111\u1ed5i\n```\n\n### Methods on nil instances\n\n```go\ntype IntTree struct {\n    val         int\n    left, right *IntTree\n}\n\n// Pointer receiver \u2192 c\u00f3 th\u1ec3 x\u1eed l\u00fd nil\nfunc (it *IntTree) Insert(val int) *IntTree {\n    if it == nil {\n        return &IntTree{val: val}\n    }\n    // ...\n    return it\n}\n\nfunc (it *IntTree) Contains(val int) bool {\n    switch {\n    case it == nil:\n        return false\n    // ...\n    }\n}\n\n// D\u00f9ng:\nvar it *IntTree          // nil\nit = it.Insert(5)        // OK! G\u1ecdi method tr\u00ean nil pointer\nit = it.Insert(3)\nfmt.Println(it.Contains(5))  // true\n```\n\n### Methods are functions\n\n```go\ntype Adder struct { start int }\nfunc (a Adder) AddTo(val int) int { return a.start + val }\n\nmyAdder := Adder{start: 10}\n\n// Method value \u2014 bound to instance\nf1 := myAdder.AddTo\nfmt.Println(f1(10))  // 20 \u2014 nh\u01b0 closure\n\n// Method expression \u2014 unbound, receiver l\u00e0 tham s\u1ed1 \u0111\u1ea7u\nf2 := Adder.AddTo\nfmt.Println(f2(myAdder, 15))  // 25\n```\n\n### Khi n\u00e0o d\u00f9ng method vs function?\n\n- **Function**: ch\u1ec9 ph\u1ee5 thu\u1ed9c v\u00e0o input parameters \u2014 pure function\n- **Method**: ph\u1ee5 thu\u1ed9c v\u00e0o state \u0111\u01b0\u1ee3c c\u1ea5u h\u00ecnh khi kh\u1edfi \u0111\u1ed9ng ho\u1eb7c thay \u0111\u1ed5i trong runtime \u2192 l\u01b0u trong struct \u2192 implement as method\n\n---\n\n## 3. iota \u2014 Enumeration trong Go\n\nGo kh\u00f4ng c\u00f3 `enum`. Thay v\u00e0o \u0111\u00f3, d\u00f9ng `iota`:\n\n```go\ntype MailCategory int  // Step 1: t\u1ea1o type\n\nconst (\n    Uncategorized MailCategory = iota  // 0\n    Personal                            // 1\n    Spam                                // 2\n    Social                              // 3\n    Advertisements                      // 4\n)\n```\n\n`iota` t\u0103ng th\u00eam 1 m\u1ed7i const trong block, b\u1eaft \u0111\u1ea7u t\u1eeb 0.\n\n**iota trong bit flags:**\n```go\ntype Permission int\nconst (\n    Read    Permission = 1 << iota  // 1 (001)\n    Write                            // 2 (010)\n    Execute                          // 4 (100)\n)\n```\n\n**iota reset v\u1ec1 0 khi b\u1eaft \u0111\u1ea7u const block m\u1edbi.**\n\n**Khi n\u00e0o KH\u00d4NG d\u00f9ng iota:**\n- Khi gi\u00e1 tr\u1ecb c\u1ee5 th\u1ec3 quan tr\u1ecdng (API contract, database, external protocol)\n- Th\u00eam constant m\u1edbi v\u00e0o gi\u1eefa list \u2192 renumber t\u1ea5t c\u1ea3 sau \u0111\u00f3\n\n```go\n// \u0110\u1eebng d\u00f9ng iota n\u1ebfu gi\u00e1 tr\u1ecb c\u00f3 ngh\u0129a c\u1ee5 th\u1ec3:\nconst (\n    StatusOK       = 200  // explicit \u2014 \u0111\u00fang\n    StatusNotFound = 404  // explicit \u2014 \u0111\u00fang\n    // N\u1ebfu d\u00f9ng iota: th\u00eam 1 status v\u00e0o gi\u1eefa \u2192 ph\u00e1 v\u1ee1 to\u00e0n b\u1ed9\n)\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java `enum` c\u00f3 type-safe, c\u00f3 th\u1ec3 c\u00f3 fields/methods. Go `iota` \u0111\u01a1n gi\u1ea3n h\u01a1n nh\u01b0ng \u00edt safe h\u01a1n \u2014 kh\u00f4ng ng\u0103n g\u00e1n invalid int value.\n\n---\n\n## 4. Embedding for Composition\n\nGo kh\u00f4ng c\u00f3 inheritance nh\u01b0ng c\u00f3 **embedding** \u2014 composition v\u1edbi promotion:\n\n```go\ntype Employee struct {\n    Name string\n    ID   string\n}\n\nfunc (e Employee) Description() string {\n    return fmt.Sprintf(\"%s (%s)\", e.Name, e.ID)\n}\n\ntype Manager struct {\n    Employee           // embedded field \u2014 kh\u00f4ng c\u00f3 t\u00ean\n    Reports []Employee\n}\n```\n\n**Promotion:** Fields v\u00e0 methods c\u1ee7a Employee \u0111\u01b0\u1ee3c \"promoted\" l\u00ean Manager:\n\n```go\nm := Manager{\n    Employee: Employee{Name: \"Bob Bobson\", ID: \"12345\"},\n    Reports:  []Employee{},\n}\nfmt.Println(m.ID)            // 12345 \u2190 promoted field\nfmt.Println(m.Description()) // Bob Bobson (12345) \u2190 promoted method\nfmt.Println(m.Employee.ID)   // 12345 \u2190 truy c\u1eadp tr\u1ef1c ti\u1ebfp c\u0169ng \u0111\u01b0\u1ee3c\n```\n\n**Khi c\u00f9ng t\u00ean field/method \u2014 ph\u1ea3i explicit:**\n```go\ntype Outer struct {\n    Inner\n    X int   // c\u00f9ng t\u00ean v\u1edbi Inner.X\n}\no := Outer{Inner: Inner{X: 10}, X: 20}\nfmt.Println(o.X)       // 20 (Outer.X)\nfmt.Println(o.Inner.X) // 10 (Inner.X)\n```\n\n### Embedding IS NOT Inheritance\n\n```go\nvar eFail Employee = m         // compile error! Manager kh\u00f4ng ph\u1ea3i Employee\nvar eOK Employee = m.Employee  // OK \u2014 explicit extraction\n\n// Kh\u00f4ng c\u00f3 dynamic dispatch:\ntype Inner struct{ A int }\nfunc (i Inner) Double() string { return i.IntPrinter(i.A * 2) }\nfunc (i Inner) IntPrinter(val int) string { return fmt.Sprintf(\"Inner: %d\", val) }\n\ntype Outer struct{ Inner; S string }\nfunc (o Outer) IntPrinter(val int) string { return fmt.Sprintf(\"Outer: %d\", val) }\n\no := Outer{Inner: Inner{A: 10}}\nfmt.Println(o.Double())  // \"Inner: 20\" \u2014 KH\u00d4NG ph\u1ea3i \"Outer: 20\"!\n// Double() g\u1ecdi Inner.IntPrinter, kh\u00f4ng ph\u1ea3i Outer.IntPrinter\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java override method \u2192 dynamic dispatch (polymorphism). Go embedding: method c\u1ee7a embedded type g\u1ecdi method c\u1ee7a embedded type, kh\u00f4ng b\u1ecb override b\u1edfi outer.\n\n**T\u1ea1i sao d\u00f9ng embedding?** \u0110\u1ec3 t\u00e1i s\u1eed d\u1ee5ng code v\u00e0 \u0111\u1eb7c bi\u1ec7t \u0111\u1ec3 **implement interface** th\u00f4ng qua promoted methods.\n\n---\n\n## 5. Interfaces \u2014 \"The Star of Go's Design\"\n\n### Interface l\u00e0 g\u00ec\n\n```go\ntype Stringer interface {\n    String() string\n}\n\ntype Incrementer interface {\n    Increment()\n}\n```\n\n### Implicit Implementation \u2014 \u0110i\u1ec3m \u0111\u1eb7c bi\u1ec7t nh\u1ea5t c\u1ee7a Go\n\n**Kh\u00e1c Java/C#:** Kh\u00f4ng c\u1ea7n khai b\u00e1o `implements`. M\u1ed9t type t\u1ef1 \u0111\u1ed9ng implement interface n\u1ebfu n\u00f3 c\u00f3 \u0111\u1ee7 methods:\n\n```java\n// Java \u2014 explicit:\npublic class Person implements Stringer {  // khai b\u00e1o t\u01b0\u1eddng minh\n    @Override\n    public String String() { ... }\n}\n```\n\n```go\n// Go \u2014 implicit:\ntype Person struct { ... }\n\nfunc (p Person) String() string { ... }  // Person t\u1ef1 \u0111\u1ed9ng implements Stringer!\n// Kh\u00f4ng c\u1ea7n ghi implements hay b\u1ea5t k\u1ef3 khai b\u00e1o n\u00e0o\n```\n\n### Duck Typing An To\u00e0n Ki\u1ec3u\n\n```go\n// Python duck typing \u2014 kh\u00f4ng type-safe, runtime error n\u1ebfu method kh\u00f4ng t\u1ed3n t\u1ea1i\ndef program(logic):\n    logic.process(data)  # kh\u00f4ng bi\u1ebft ki\u1ec3u g\u00ec\n\n// Java \u2014 type-safe nh\u01b0ng rigid (explicit implements)\npublic class LogicImpl implements Logic {\n    @Override\n    public String process(String data) { ... }\n}\n\n// Go \u2014 type-safe V\u00c0 flexible (implicit)\ntype LogicProvider struct{}\nfunc (lp LogicProvider) Process(data string) string { ... }\n\ntype Logic interface {\n    Process(data string) string\n}\n// LogicProvider t\u1ef1 \u0111\u1ed9ng implements Logic\n// Compiler ki\u1ec3m tra t\u1ea1i compile-time\n```\n\n### Method sets v\u00e0 Pointer/Value Receivers\n\n```go\ntype Counter struct { total int }\nfunc (c *Counter) Increment() { c.total++ }  // pointer receiver\nfunc (c Counter) String() string { ... }      // value receiver\n\ntype Incrementer interface { Increment() }\n\nvar myStringer fmt.Stringer\nvar myIncrementer Incrementer\n\npointerCounter := &Counter{}\nvalueCounter := Counter{}\n\nmyStringer = pointerCounter    // OK\nmyStringer = valueCounter      // OK (String() l\u00e0 value receiver)\nmyIncrementer = pointerCounter // OK\nmyIncrementer = valueCounter   // COMPILE ERROR!\n// Counter kh\u00f4ng implement Incrementer (Increment c\u00f3 pointer receiver)\n// *Counter implement Incrementer\n```\n\n**Quy t\u1eafc method set:**\n- **Pointer type** `*T`: c\u00f3 c\u1ea3 value receiver methods V\u00c0 pointer receiver methods\n- **Value type** `T`: ch\u1ec9 c\u00f3 value receiver methods\n\n### Interfaces trong standard library\n\n```go\n// io.Reader\ntype Reader interface {\n    Read(p []byte) (n int, err error)\n}\n\n// io.Writer\ntype Writer interface {\n    Write(p []byte) (n int, err error)\n}\n\n// io.Closer\ntype Closer interface {\n    Close() error\n}\n\n// fmt.Stringer\ntype Stringer interface {\n    String() string\n}\n```\n\n**Decorator pattern v\u1edbi interfaces:**\n```go\n// process() nh\u1eadn b\u1ea5t k\u1ef3 io.Reader n\u00e0o\nfunc process(r io.Reader) error { ... }\n\n// File implement io.Reader\nr, err := os.Open(fileName)\nprocess(r)\n\n// GzipReader wrap io.Reader \u2014 c\u0169ng implement io.Reader\ngz, _ := gzip.NewReader(r)\nprocess(gz)  // c\u00f9ng code, kh\u00e1c implementation!\n```\n\n### Embedding interfaces trong interface\n\n```go\ntype ReadCloser interface {\n    Reader  // embed\n    Closer  // embed\n}\n// ReadCloser = Reader + Closer\n```\n\n---\n\n## 6. Accept Interfaces, Return Structs\n\n**Quy t\u1eafc v\u00e0ng c\u1ee7a Go API design:**\n\n```go\n// \u2705 \u0110\u00fang \u2014 accept interface, return struct\nfunc NewSimpleLogic(l Logger, ds DataStore) SimpleLogic {\n    return SimpleLogic{l: l, ds: ds}\n}\n\n// \u274c Tr\u00e1nh \u2014 return interface (tr\u1eeb error)\nfunc NewSimpleLogic(l Logger, ds DataStore) Logic {\n    return SimpleLogic{l: l, ds: ds}\n}\n```\n\n**T\u1ea1i sao:**\n- Return struct \u2192 d\u1ec5 th\u00eam fields/methods m\u1edbi m\u00e0 kh\u00f4ng break existing code\n- Return interface \u2192 th\u00eam method v\u00e0o interface \u2192 break t\u1ea5t c\u1ea3 implementations\n\n> **Ngo\u1ea1i l\u1ec7:** `error` lu\u00f4n return interface (v\u00ec c\u00f3 nhi\u1ec1u implementations kh\u00e1c nhau).\n\n---\n\n## 7. Interfaces v\u00e0 nil \u2014 Gotcha Quan Tr\u1ecdng\n\nInterface b\u00ean trong l\u00e0 struct v\u1edbi 2 fields: **type** + **value**.\n\nInterface = nil **ch\u1ec9 khi c\u1ea3 type l\u1eabn value \u0111\u1ec1u nil:**\n\n```go\nvar pointerCounter *Counter  // nil pointer\nfmt.Println(pointerCounter == nil)  // true\n\nvar incrementer Incrementer  // nil interface\nfmt.Println(incrementer == nil)  // true\n\nincrementer = pointerCounter  // g\u00e1n nil pointer v\u00e0o interface\nfmt.Println(incrementer == nil)  // FALSE! type field = *Counter (non-nil)\n```\n\n**H\u1ec7 qu\u1ea3 nguy hi\u1ec3m:**\n```go\nfunc getCounter() Incrementer {\n    var c *Counter  // nil pointer\n    return c        // tr\u1ea3 v\u1ec1 interface v\u1edbi type=*Counter, value=nil\n}\n\ninc := getCounter()\nif inc != nil {  // TRUE! d\u00f9 value l\u00e0 nil\n    inc.Increment()  // PANIC! value is nil\n}\n```\n\n**Fix:**\n```go\nfunc getCounter() Incrementer {\n    var c *Counter\n    if (condition) {\n        return c   // return nil pointer\n    }\n    return nil     // return nil interface \u2014 c\u1ea3 type l\u1eabn value = nil\n}\n```\n\n---\n\n## 8. Interfaces Are Comparable\n\nInterface c\u00f3 th\u1ec3 so s\u00e1nh v\u1edbi `==`, nh\u01b0ng **panic n\u1ebfu underlying type kh\u00f4ng comparable:**\n\n```go\ntype Doubler interface { Double() }\n\n// *DoubleInt \u2014 comparable (pointer)\nvar di DoubleInt = 10\nvar di2 DoubleInt = 10\nDoublerCompare(&di, &di2)   // false (kh\u00e1c pointer, d\u00f9 c\u00f9ng value)\n\n// DoubleIntSlice \u2014 NOT comparable (slice)\nvar dis = DoubleIntSlice{1, 2, 3}\nvar dis2 = DoubleIntSlice{1, 2, 3}\nDoublerCompare(dis, dis2)   // PANIC at runtime!\n```\n\n> **C\u1ea3nh b\u00e1o:** D\u00f9ng interface l\u00e0m map key \u2014 c\u0169ng c\u00f3 th\u1ec3 panic n\u1ebfu underlying type kh\u00f4ng comparable.\n\n---\n\n## 9. Empty Interface \u2014 `any`\n\n```go\nvar i interface{}  // legacy syntax\nvar i any          // Go 1.18+ \u2014 preferred\n\ni = 20\ni = \"hello\"\ni = struct{ FirstName, LastName string }{\"Fred\", \"Fredson\"}\n```\n\n**Khi n\u00e0o d\u00f9ng `any`:**\n- JSON v\u1edbi schema kh\u00f4ng x\u00e1c \u0111\u1ecbnh\n- Container data structures (nh\u01b0ng \u01b0u ti\u00ean generics ng\u00e0y nay)\n- Reflection-based code\n\n**Tr\u00e1nh d\u00f9ng `any`** khi c\u00f3 th\u1ec3 \u2014 Go l\u00e0 strongly typed language, `any` bypass type safety.\n\n---\n\n## 10. Type Assertions v\u00e0 Type Switches\n\n### Type Assertion \u2014 L\u1ea5y concrete type t\u1eeb interface\n\n```go\nvar i any\nvar mine MyInt = 20\ni = mine\n\n// Unsafe \u2014 panic n\u1ebfu sai type\ni2 := i.(MyInt)  // OK\ni3 := i.(string) // PANIC!\n\n// Safe \u2014 d\u00f9ng comma ok\ni2, ok := i.(MyInt)\nif !ok {\n    return fmt.Errorf(\"unexpected type for %v\", i)\n}\n```\n\n### Type Switch \u2014 X\u1eed l\u00fd nhi\u1ec1u types\n\n```go\nfunc doThings(i any) {\n    switch j := i.(type) {\n    case nil:\n        // j is any\n    case int:\n        // j is int\n    case MyInt:\n        // j is MyInt\n    case io.Reader:\n        // j is io.Reader\n    case string:\n        // j is string\n    case bool, rune:\n        // j is any (multiple types)\n    default:\n        // j is any\n    }\n}\n```\n\n**Pattern idiomatic \u2014 shadow variable:**\n```go\nswitch i := i.(type) {  // shadow i \u2014 th\u01b0\u1eddng d\u00f9ng\ncase int:\n    // i is int\n// ...\n}\n```\n\n### D\u00f9ng type assertion \u0111\u1ec3 check optional interface\n\n```go\n// Optimization pattern trong standard library\nfunc copyBuffer(dst Writer, src Reader, buf []byte) (int64, error) {\n    if wt, ok := src.(WriterTo); ok {\n        return wt.WriteTo(dst)  // s\u1eed d\u1ee5ng optimized path n\u1ebfu c\u00f3\n    }\n    // fallback path\n}\n```\n\n> **Nguy\u00ean t\u1eafc:** D\u00f9ng type assertion/switch sparingly. Ch\u1ee7 y\u1ebfu d\u00f9ng khi: check optional interface, x\u1eed l\u00fd error wrapping, parser x\u1eed l\u00fd kh\u00e1c nhau.\n\n---\n\n## 11. Function Types as Bridge to Interfaces\n\n```go\ntype Handler interface {\n    ServeHTTP(http.ResponseWriter, *http.Request)\n}\n\n// \u0110\u1ecbnh ngh\u0129a function type v\u1edbi method\ntype HandlerFunc func(http.ResponseWriter, *http.Request)\n\nfunc (f HandlerFunc) ServeHTTP(w http.ResponseWriter, r *http.Request) {\n    f(w, r)\n}\n\n// B\u00e2y gi\u1edd b\u1ea5t k\u1ef3 function n\u00e0o c\u00f3 \u0111\u00fang signature \u2192 c\u00f3 th\u1ec3 d\u00f9ng nh\u01b0 Handler\nfunc myHandler(w http.ResponseWriter, r *http.Request) {\n    w.Write([]byte(\"Hello\"))\n}\n\nhttp.HandleFunc(\"/\", myHandler)  // function \u2192 converted to HandlerFunc \u2192 implements Handler\n```\n\n---\n\n## 12. Implicit Interfaces Make Dependency Injection Easier\n\n**V\u00ed d\u1ee5 th\u1ef1c t\u1ebf: Web application v\u1edbi DI**\n\n```go\n// Dependencies \u0111\u01b0\u1ee3c define b\u1eb1ng interface\ntype DataStore interface {\n    UserNameForID(userID string) (string, bool)\n}\n\ntype Logger interface {\n    Log(message string)\n}\n\n// Business logic ph\u1ee5 thu\u1ed9c v\u00e0o interfaces, kh\u00f4ng ph\u1ea3i concrete types\ntype SimpleLogic struct {\n    l  Logger\n    ds DataStore\n}\n\nfunc (sl SimpleLogic) SayHello(userID string) (string, error) {\n    sl.l.Log(\"in SayHello for \" + userID)\n    name, ok := sl.ds.UserNameForID(userID)\n    if !ok {\n        return \"\", errors.New(\"unknown user\")\n    }\n    return \"Hello, \" + name, nil\n}\n\n// Concrete implementations \u2014 kh\u00f4ng khai b\u00e1o implements Logger/DataStore\ntype SimpleDataStore struct { userData map[string]string }\nfunc (sds SimpleDataStore) UserNameForID(id string) (string, bool) {\n    name, ok := sds.userData[id]\n    return name, ok\n}\n\n// Function adapter \u2192 implements Logger\ntype LoggerAdapter func(message string)\nfunc (lg LoggerAdapter) Log(message string) { lg(message) }\n\n// Wiring trong main()\nfunc main() {\n    l := LoggerAdapter(LogOutput)    // function \u2192 Logger interface\n    ds := NewSimpleDataStore()\n    logic := NewSimpleLogic(l, ds)   // accept interfaces\n    c := NewController(l, logic)\n    http.HandleFunc(\"/hello\", c.SayHello)\n    http.ListenAndServe(\":8080\", nil)\n}\n```\n\n**L\u1ee3i \u00edch:**\n- `main()` l\u00e0 n\u01a1i duy nh\u1ea5t bi\u1ebft v\u1ec1 concrete types\n- D\u1ec5 swap implementation (test, production, mock)\n- M\u1ed7i component kh\u00f4ng ph\u1ee5 thu\u1ed9c nhau\n\n> **So s\u00e1nh v\u1edbi Java Spring:** Java c\u1ea7n `@Autowired`, `@Component`, annotation framework. Go DI b\u1eb1ng hand-wiring \u0111\u01a1n gi\u1ea3n \u2014 kh\u00f4ng c\u1ea7n framework (ho\u1eb7c d\u00f9ng Wire n\u1ebfu ph\u1ee9c t\u1ea1p).\n\n---\n\n## Exercises\n\n**1. League management:**\n```go\ntype Team struct {\n    Name    string\n    Players []string\n}\n\ntype League struct {\n    Teams []Team\n    Wins  map[string]int\n}\n\nfunc (l *League) MatchResult(team1 string, score1 int, team2 string, score2 int) {\n    if l.Wins == nil {\n        l.Wins = make(map[string]int)\n    }\n    if score1 > score2 {\n        l.Wins[team1]++\n    } else if score2 > score1 {\n        l.Wins[team2]++\n    }\n}\n\nfunc (l *League) Ranking() []string {\n    type teamWin struct { name string; wins int }\n    teams := make([]teamWin, 0, len(l.Wins))\n    for name, wins := range l.Wins {\n        teams = append(teams, teamWin{name, wins})\n    }\n    sort.Slice(teams, func(i, j int) bool {\n        return teams[i].wins > teams[j].wins\n    })\n    result := make([]string, len(teams))\n    for i, t := range teams {\n        result[i] = t.name\n    }\n    return result\n}\n```\n\n**2. Ranker interface:**\n```go\ntype Ranker interface {\n    Ranking() []string\n}\n\nfunc RankPrinter(r Ranker, w io.Writer) {\n    for _, name := range r.Ranking() {\n        io.WriteString(w, name+\"\\n\")\n    }\n}\n\n// main:\nRankPrinter(&league, os.Stdout)\n```\n\n---\n\n## Wrapping Up\n\nB\u1ea1n \u0111\u00e3 h\u1ecdc:\n- **Types** \u2014 user-defined types cho documentation v\u00e0 type safety; kh\u00f4ng ph\u1ea3i inheritance\n- **Methods** \u2014 pointer receiver (mutable) vs value receiver (immutable); auto-conversion\n- **iota** \u2014 enumeration \u0111\u01a1n gi\u1ea3n; ch\u1ec9 d\u00f9ng khi value kh\u00f4ng quan tr\u1ecdng c\u1ee5 th\u1ec3\n- **Embedding** \u2014 composition, not inheritance; promoted methods; kh\u00f4ng c\u00f3 dynamic dispatch\n- **Interfaces** \u2014 implicit implementation (duck typing + type safety); small interfaces\n- **Accept interfaces, return structs** \u2014 flexible API design\n- **Interface + nil gotcha** \u2014 interface non-nil n\u1ebfu type field non-nil d\u00f9 value nil\n- **Type assertions & type switches** \u2014 safe extraction v\u1edbi comma ok; d\u00f9ng sparingly\n- **Function types \u2192 interfaces** \u2014 http.HandlerFunc pattern\n- **Dependency injection** \u2014 d\u1ec5 d\u00e0ng v\u1edbi implicit interfaces; kh\u00f4ng c\u1ea7n framework\n\n**Go kh\u00f4ng ph\u1ea3i OOP, kh\u00f4ng ph\u1ea3i functional \u2014 Go l\u00e0 practical. Borrow t\u1eeb m\u1ecdi n\u01a1i, \u0111\u01a1n gi\u1ea3n v\u00e0 readable.**\n\n**Ch\u01b0\u01a1ng ti\u1ebfp theo:** Generics \u2014 code reuse an to\u00e0n ki\u1ec3u d\u1eef li\u1ec7u.\n\n\n# Chapter 8. Generics\n\n## Gi\u1edbi thi\u1ec7u\n\nGenerics (type parameters) \u0111\u01b0\u1ee3c th\u00eam v\u00e0o Go 1.18 \u2014 gi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1 l\u1edbn nh\u1ea5t c\u1ee7a Go tr\u01b0\u1edbc \u0111\u00f3: kh\u00f4ng th\u1ec3 vi\u1ebft code type-safe t\u00e1i s\u1eed d\u1ee5ng cho nhi\u1ec1u ki\u1ec3u d\u1eef li\u1ec7u.\n\n---\n\n## 1. T\u1ea1i sao c\u1ea7n Generics?\n\n### V\u1ea5n \u0111\u1ec1 tr\u01b0\u1edbc khi c\u00f3 Generics\n\n**C\u00e1ch 1: Vi\u1ebft cho t\u1eebng type \u2014 l\u1eb7p code:**\n```go\ntype IntTree struct { val int; left, right *IntTree }\ntype StringTree struct { val string; left, right *StringTree }\n// ... bao nhi\u00eau type b\u1ea5y nhi\u00eau implementation\n```\n\n**C\u00e1ch 2: D\u00f9ng interface{}/any \u2014 m\u1ea5t type safety:**\n```go\ntype Tree struct {\n    val         Orderable  // interface\n    left, right *Tree\n}\n\n// V\u1ea5n \u0111\u1ec1: compiler kh\u00f4ng catch \u0111\u01b0\u1ee3c\nvar it *Tree\nit = it.Insert(OrderableInt(5))\nit = it.Insert(OrderableString(\"oops\"))  // compile OK, PANIC at runtime!\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java c\u00f3 generics t\u1eeb Java 5 (2004). Go th\u00eam generics \u1edf 1.18 (2022) \u2014 mu\u1ed9n nh\u01b0ng thi\u1ebft k\u1ebf c\u1ea9n th\u1eadn h\u01a1n.\n\n---\n\n## 2. Generic Types \u2014 Stack v\u00ed d\u1ee5\n\n```go\ntype Stack[T any] struct {\n    vals []T\n}\n\nfunc (s *Stack[T]) Push(val T) {\n    s.vals = append(s.vals, val)\n}\n\nfunc (s *Stack[T]) Pop() (T, bool) {\n    if len(s.vals) == 0 {\n        var zero T    // zero value cho generic type\n        return zero, false\n    }\n    top := s.vals[len(s.vals)-1]\n    s.vals = s.vals[:len(s.vals)-1]\n    return top, true\n}\n```\n\n**C\u00fa ph\u00e1p:**\n- `[T any]` \u2014 type parameter: `T` l\u00e0 t\u00ean, `any` l\u00e0 constraint\n- Trong method receiver: `Stack[T]` kh\u00f4ng ph\u1ea3i `Stack`\n- Zero value c\u1ee7a generic type: `var zero T`\n\n**D\u00f9ng:**\n```go\nvar intStack Stack[int]   // specify type khi khai b\u00e1o\nintStack.Push(10)\nintStack.Push(20)\nv, ok := intStack.Pop()  // v l\u00e0 int, kh\u00f4ng ph\u1ea3i any\n\nintStack.Push(\"nope\")    // compile error! \u2014 type safety\n```\n\n> **So s\u00e1nh v\u1edbi Java:**\n> ```java\n> Stack<Integer> stack = new Stack<>();  // Java\n> Stack[int] intStack                    // Go\n> ```\n\n### S\u1eed d\u1ee5ng `comparable` thay v\u00ec `any`\n\n```go\n// any \u2014 kh\u00f4ng d\u00f9ng \u0111\u01b0\u1ee3c == v\u00e0 !=\ntype Stack[T any] struct { vals []T }\n\nfunc (s Stack[T]) Contains(val T) bool {\n    for _, v := range s.vals {\n        if v == val { return true }  // compile error v\u1edbi any!\n    }\n    return false\n}\n\n// comparable \u2014 cho ph\u00e9p == v\u00e0 !=\ntype Stack[T comparable] struct { vals []T }\n// B\u00e2y gi\u1edd Contains compile \u0111\u01b0\u1ee3c\n\nvar s Stack[int]\ns.Push(10)\nfmt.Println(s.Contains(10))  // true\nfmt.Println(s.Contains(5))   // false\n```\n\n---\n\n## 3. Generic Functions\n\n```go\n// Map: transform []T1 th\u00e0nh []T2\nfunc Map[T1, T2 any](s []T1, f func(T1) T2) []T2 {\n    r := make([]T2, len(s))\n    for i, v := range s {\n        r[i] = f(v)\n    }\n    return r\n}\n\n// Reduce: aggregate []T1 th\u00e0nh T2\nfunc Reduce[T1, T2 any](s []T1, initializer T2, f func(T2, T1) T2) T2 {\n    r := initializer\n    for _, v := range s {\n        r = f(r, v)\n    }\n    return r\n}\n\n// Filter: l\u1ecdc ph\u1ea7n t\u1eed trong []T\nfunc Filter[T any](s []T, f func(T) bool) []T {\n    var r []T\n    for _, v := range s {\n        if f(v) {\n            r = append(r, v)\n        }\n    }\n    return r\n}\n```\n\n**D\u00f9ng:**\n```go\nwords := []string{\"One\", \"Potato\", \"Two\", \"Potato\"}\n\nfiltered := Filter(words, func(s string) bool { return s != \"Potato\" })\n// [\"One\", \"Two\"]\n\nlengths := Map(filtered, func(s string) int { return len(s) })\n// [3, 3]\n\nsum := Reduce(lengths, 0, func(acc, val int) int { return acc + val })\n// 6\n```\n\n**Type inference:** Go t\u1ef1 suy ra type parameters t\u1eeb arguments \u2014 kh\u00f4ng c\u1ea7n vi\u1ebft `Filter[string](...)`.\n\n---\n\n## 4. Generics v\u00e0 Interfaces\n\n```go\n// Generic struct v\u1edbi interface constraint\ntype Pair[T fmt.Stringer] struct {\n    Val1 T\n    Val2 T\n}\n\n// Generic interface\ntype Differ[T any] interface {\n    fmt.Stringer\n    Diff(T) float64\n}\n\n// Generic function v\u1edbi interface constraint\nfunc FindCloser[T Differ[T]](pair1, pair2 Pair[T]) Pair[T] {\n    d1 := pair1.Val1.Diff(pair1.Val2)\n    d2 := pair2.Val1.Diff(pair2.Val2)\n    if d1 < d2 {\n        return pair1\n    }\n    return pair2\n}\n```\n\n```go\ntype Point2D struct { X, Y int }\nfunc (p Point2D) String() string { return fmt.Sprintf(\"{%d,%d}\", p.X, p.Y) }\nfunc (p Point2D) Diff(from Point2D) float64 {\n    x, y := p.X-from.X, p.Y-from.Y\n    return math.Sqrt(float64(x*x + y*y))\n}\n\npair1 := Pair[Point2D]{Point2D{1, 1}, Point2D{5, 5}}\npair2 := Pair[Point2D]{Point2D{10, 10}, Point2D{15, 5}}\ncloser := FindCloser(pair1, pair2)\n```\n\n---\n\n## 5. Type Terms \u2014 Ch\u1ec9 \u0111\u1ecbnh Operators\n\n```go\n// Ch\u1ec9 \u0111\u1ecbnh c\u00e1c types \u0111\u01b0\u1ee3c ph\u00e9p\ntype Integer interface {\n    int | int8 | int16 | int32 | int64 |\n        uint | uint8 | uint16 | uint32 | uint64 | uintptr\n}\n\nfunc divAndRemainder[T Integer](num, denom T) (T, T, error) {\n    if denom == 0 {\n        return 0, 0, errors.New(\"cannot divide by zero\")\n    }\n    return num / denom, num % denom, nil  // / v\u00e0 % \u0111\u01b0\u1ee3c ph\u00e9p v\u00ec t\u1ea5t c\u1ea3 types \u0111\u1ec1u integer\n}\n```\n\n**`~` \u2014 match underlying type:**\n```go\ntype MyInt int  // underlying type l\u00e0 int\n\n// Kh\u00f4ng c\u00f3 ~: MyInt kh\u00f4ng th\u1ecfa Integer v\u00ec Integer ch\u1ec9 c\u00f3 `int` kh\u00f4ng ph\u1ea3i `MyInt`\n// C\u00f3 ~: match b\u1ea5t k\u1ef3 type n\u00e0o c\u00f3 underlying type l\u00e0 int\ntype Integer interface {\n    ~int | ~int8 | ...  // ~ match c\u1ea3 derived types\n}\n\nvar myA MyInt = 10\ndivAndRemainder(myA, MyInt(3))  // OK v\u1edbi ~ prefix\n```\n\n**Ordered interface \u2014 cho comparisons:**\n```go\ntype Ordered interface {\n    ~int | ~int8 | ~int16 | ~int32 | ~int64 |\n        ~uint | ~uint8 | ~uint16 | ~uint32 | ~uint64 | ~uintptr |\n        ~float32 | ~float64 |\n        ~string\n}\n// H\u1ed7 tr\u1ee3: ==, !=, <, >, <=, >=\n\n// Go 1.21+: cmp.Ordered \u0111\u00e3 c\u00f3 s\u1eb5n trong standard library\n```\n\n**Type terms + methods:**\n```go\ntype PrintableInt interface {\n    ~int\n    String() string\n}\n```\n\n> **L\u01b0u \u00fd:** Interface c\u
