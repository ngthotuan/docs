)\n    }\n}\n```\n\n**Ho\u1eb7c d\u00f9ng embed.FS cho nhi\u1ec1u ng\u00f4n ng\u1eef:**\n```go\n//go:embed *_rights.txt\nvar rights embed.FS\n\nfunc main() {\n    if len(os.Args) < 2 {\n        fmt.Println(\"Usage: program <language>\")\n        os.Exit(1)\n    }\n    lang := os.Args[1]\n    data, err := rights.ReadFile(lang + \"_rights.txt\")\n    if err != nil {\n        fmt.Printf(\"Language '%s' not found\\n\", lang)\n        os.Exit(1)\n    }\n    fmt.Println(string(data))\n}\n```\n\n**2. C\u00e0i v\u00e0 ch\u1ea1y staticcheck:**\n```bash\ngo install honnef.co/go/tools/cmd/staticcheck@latest\nstaticcheck ./...\n# S\u1eeda c\u00e1c v\u1ea5n \u0111\u1ec1 \u0111\u01b0\u1ee3c b\u00e1o c\u00e1o\n```\n\n**3. Cross-compile:**\n```bash\n# T\u1eeb Mac/Linux sang Windows ARM64\nGOOS=windows GOARCH=arm64 go build -o program.exe\n\n# T\u1eeb ARM64 sang Linux AMD64\nGOOS=linux GOARCH=amd64 go build -o program_linux\n```\n\n---\n\n## Wrapping Up\n\nB\u1ea1n \u0111\u00e3 h\u1ecdc:\n- **`go run`** \u2014 compile v\u00e0 ch\u1ea1y ngay, kh\u00f4ng l\u01b0u binary \u2014 d\u00f9ng nh\u01b0 script\n- **`go install`** \u2014 c\u00e0i tools t\u1eeb source v\u00e0o `~/go/bin` \u2014 lu\u00f4n d\u00f9ng `@version`\n- **`goimports`** \u2014 format + sort + clean imports\n- **Linters**: `go vet` \u2192 `staticcheck` \u2192 `revive` \u2192 `golangci-lint`\n  - staticcheck: 150+ checks, \u00edt false positives \u2014 b\u1eaft \u0111\u1ea7u t\u1eeb \u0111\u00e2y\n  - golangci-lint: aggregates 50+ tools v\u1edbi config file\n- **`govulncheck`** \u2014 scan known vulnerabilities trong deps v\u00e0 binary\n- **Embedding** (`//go:embed`) \u2014 nh\u00fang files v\u00e0o binary; `string`/`[]byte` cho 1 file, `embed.FS` cho directory\n- **`go generate`** \u2014 ch\u1ea1y tools sinh code (protobuf, stringer); commit generated code\n- **Build info** \u2014 m\u1ecdi binary c\u00f3 metadata, `go version -m` \u0111\u1ec3 xem\n- **Cross-compilation** \u2014 `GOOS=linux GOARCH=amd64 go build`\n- **Build tags** \u2014 `//go:build` cho platform-specific code v\u00e0 custom flags\n- **Multi-version testing** \u2014 `go install golang.org/dl/go1.19.2@latest`\n\n**Ch\u01b0\u01a1ng ti\u1ebfp theo:** Concurrency \u2014 m\u1ed9t trong nh\u1eefng t\u00ednh n\u0103ng \u0111\u1eb7c tr\u01b0ng nh\u1ea5t c\u1ee7a Go.\n\n\n# Chapter 12 \u2014 Concurrency in Go\n\n> T\u00e0i li\u1ec7u h\u1ecdc Go d\u00e0nh cho ng\u01b0\u1eddi chuy\u1ec3n t\u1eeb Java sang.  \n> B\u00e1m s\u00e1t n\u1ed9i dung s\u00e1ch *Learning Go* (2nd ed.) \u2014 Chapter 12.\n\n---\n\n## 1. When to Use Concurrency\n\n### \u00dd t\u01b0\u1edfng c\u1ed1t l\u00f5i\n\nGo tri\u1ec3n khai concurrency d\u1ef1a tr\u00ean **CSP (Communicating Sequential Processes)** \u2014 m\u1ed9t m\u00f4 h\u00ecnh \u0111\u01b0\u1ee3c Tony Hoare m\u00f4 t\u1ea3 n\u0103m 1978. Thay v\u00ec d\u00f9ng shared memory + lock nh\u01b0 Java, Go khuy\u1ebfn kh\u00edch **truy\u1ec1n d\u1eef li\u1ec7u qua channel**.\n\n> \"Share memory by communicating; do not communicate by sharing memory.\"\n\n### Concurrency \u2260 Parallelism\n\n- **Concurrency**: c\u00e1ch b\u1ea1n *c\u1ea5u tr\u00fac* ch\u01b0\u01a1ng tr\u00ecnh \u2014 chia nh\u1ecf th\u00e0nh c\u00e1c ph\u1ea7n \u0111\u1ed9c l\u1eadp.\n- **Parallelism**: c\u00e1c ph\u1ea7n \u0111\u00f3 c\u00f3 ch\u1ea1y *c\u00f9ng l\u00fac th\u1ef1c s\u1ef1* hay kh\u00f4ng (ph\u1ee5 thu\u1ed9c v\u00e0o ph\u1ea7n c\u1ee9ng).\n\n**Th\u00eam goroutine kh\u00f4ng t\u1ef1 \u0111\u1ed9ng l\u00e0m ch\u01b0\u01a1ng tr\u00ecnh nhanh h\u01a1n.** Chi ph\u00ed t\u1ea1o/truy\u1ec1n d\u1eef li\u1ec7u qua channel \u0111\u00f4i khi c\u00f2n ch\u1eadm h\u01a1n x\u1eed l\u00fd tu\u1ea7n t\u1ef1 n\u1ebfu t\u00e1c v\u1ee5 qu\u00e1 nh\u1ecf.\n\n### Khi n\u00e0o n\u00ean d\u00f9ng concurrency?\n\n| N\u00ean d\u00f9ng | Kh\u00f4ng n\u00ean d\u00f9ng |\n|---|---|\n| I/O: g\u1ecdi HTTP, \u0111\u1ecdc/ghi disk/DB | T\u00ednh to\u00e1n in-memory \u0111\u01a1n gi\u1ea3n |\n| Nhi\u1ec1u b\u01b0\u1edbc \u0111\u1ed9c l\u1eadp nhau | C\u00e1c b\u01b0\u1edbc ph\u1ee5 thu\u1ed9c tu\u1ea7n t\u1ef1 nhau |\n| C\u1ea7n gi\u1edbi h\u1ea1n th\u1eddi gian (timeout) | T\u1ed5ng th\u1eddi gian x\u1eed l\u00fd qu\u00e1 ng\u1eafn |\n\n**V\u00ed d\u1ee5 \u0111i\u1ec3n h\u00ecnh t\u1eeb s\u00e1ch:** G\u1ecdi 3 web services \u2014 2 service ch\u1ea1y song song, k\u1ebft qu\u1ea3 \u0111\u01b0\u1ee3c g\u1ed9p v\u00e0 g\u1eedi \u0111\u1ebfn service th\u1ee9 3, to\u00e0n b\u1ed9 ph\u1ea3i xong trong 50ms.\n\n---\n\n## 2. Goroutines\n\n### Goroutine l\u00e0 g\u00ec?\n\nGoroutine l\u00e0 **lightweight thread \u0111\u01b0\u1ee3c qu\u1ea3n l\u00fd b\u1edfi Go runtime**, kh\u00f4ng ph\u1ea3i OS thread.\n\n| | Java Thread | Go Goroutine |\n|---|---|---|\n| T\u1ea1o m\u1edbi | ~1MB stack, OS call | ~2KB stack, kh\u00f4ng OS call |\n| S\u1ed1 l\u01b0\u1ee3ng th\u1ef1c t\u1ebf | H\u00e0ng tr\u0103m | H\u00e0ng ch\u1ee5c ngh\u00ecn |\n| Switch context | OS scheduler | Go runtime scheduler |\n| Qu\u1ea3n l\u00fd | OS | Go runtime |\n\nGo runtime scheduler l\u00e0m vi\u1ec7c c\u00f9ng v\u1edbi network poller v\u00e0 garbage collector \u0111\u1ec3 t\u1ed1i \u01b0u hi\u1ec7u n\u0103ng.\n\n### C\u00e1ch t\u1ea1o goroutine\n\nCh\u1ec9 c\u1ea7n th\u00eam t\u1eeb kh\u00f3a `go` tr\u01b0\u1edbc l\u1eddi g\u1ecdi h\u00e0m:\n\n```go\ngo someFunction(arg1, arg2)\n```\n\n**L\u01b0u \u00fd quan tr\u1ecdng:** Gi\u00e1 tr\u1ecb tr\u1ea3 v\u1ec1 c\u1ee7a h\u00e0m \u0111\u01b0\u1ee3c g\u1ecdi b\u1eb1ng `go` s\u1ebd b\u1ecb b\u1ecf qua. Kh\u00f4ng th\u1ec3 `result := go someFunc()`.\n\n### So s\u00e1nh v\u1edbi Java\n\n```java\n// Java \u2014 ph\u1ea3i khai b\u00e1o Runnable ho\u1eb7c d\u00f9ng ExecutorService\nThread t = new Thread(() -> doSomething());\nt.start();\n\n// Ho\u1eb7c d\u00f9ng CompletableFuture\nCompletableFuture.runAsync(() -> doSomething());\n```\n\n```go\n// Go \u2014 \u0111\u01a1n gi\u1ea3n h\u01a1n nhi\u1ec1u\ngo doSomething()\n```\n\n### Pattern ph\u1ed5 bi\u1ebfn: Closure wrap business logic\n\nTrong Go, goroutine th\u01b0\u1eddng \u0111\u01b0\u1ee3c launch b\u1eb1ng m\u1ed9t closure. Business logic n\u1eb1m trong h\u00e0m ri\u00eang, closure lo ph\u1ea7n concurrency:\n\n```go\nfunc process(val int) int {\n    // logic thu\u1ea7n t\u00fay, kh\u00f4ng bi\u1ebft m\u00ecnh \u0111ang ch\u1ea1y trong goroutine\n    return val * 2\n}\n\nfunc processConcurrently(inVals []int) []int {\n    in := make(chan int, 5)\n    out := make(chan int, 5)\n\n    // Launch 5 worker goroutines \u2014 m\u1ed7i c\u00e1i \u0111\u1ecdc t\u1eeb 'in', ghi v\u00e0o 'out'\n    for i := 0; i < 5; i++ {\n        go func() {\n            for val := range in {\n                out <- process(val)  // g\u1ecdi business logic\n            }\n        }()\n    }\n    // ... load data v\u00e0o 'in', \u0111\u1ecdc k\u1ebft qu\u1ea3 t\u1eeb 'out'\n}\n```\n\n\u01afu \u0111i\u1ec3m: `process()` ho\u00e0n to\u00e0n testable, kh\u00f4ng b\u1ecb nhi\u1ec5m concurrency logic.\n\n> **So v\u1edbi Java:** Java d\u00f9ng `async`/`CompletableFuture` g\u1eafn v\u1edbi h\u00e0m. Go kh\u00f4ng c\u00f3 \"function coloring\" \u2014 m\u1ecdi h\u00e0m \u0111\u1ec1u c\u00f3 th\u1ec3 launch th\u00e0nh goroutine.\n\n---\n\n## 3. Channels\n\n### Channel l\u00e0 g\u00ec?\n\nChannel l\u00e0 **\u1ed1ng truy\u1ec1n d\u1eef li\u1ec7u** gi\u1eefa c\u00e1c goroutine. \u0110\u00e2y l\u00e0 c\u00f4ng c\u1ee5 ch\u00ednh \u0111\u1ec3 goroutine giao ti\u1ebfp v\u1edbi nhau.\n\n```go\nch := make(chan int)   // unbuffered channel\n```\n\n- Channel l\u00e0 **reference type** (gi\u1ed1ng map, slice).\n- Zero value c\u1ee7a channel l\u00e0 `nil`.\n- Truy\u1ec1n channel v\u00e0o h\u00e0m = truy\u1ec1n pointer t\u1edbi channel \u0111\u00f3.\n\n### 3.1 Reading, Writing, and Buffering\n\n#### To\u00e1n t\u1eed `<-`\n\n```go\na := <-ch   // \u0110\u1eccC t\u1eeb channel, g\u00e1n v\u00e0o a\nch <- b     // GHI gi\u00e1 tr\u1ecb b v\u00e0o channel\n```\n\nNh\u1edb m\u1eb9o: m\u0169i t\u00ean `<-` ch\u1ec9 h\u01b0\u1edbng d\u1eef li\u1ec7u \u0111i.\n\n#### Khai b\u00e1o h\u01b0\u1edbng channel (directional channel)\n\n```go\nfunc producer(ch chan<- int) { ... }   // ch\u1ec9 \u0111\u01b0\u1ee3c WRITE\nfunc consumer(ch <-chan int) { ... }   // ch\u1ec9 \u0111\u01b0\u1ee3c READ\n```\n\nGo compiler s\u1ebd b\u00e1o l\u1ed7i n\u1ebfu b\u1ea1n \u0111\u1ecdc channel `chan<-` ho\u1eb7c ghi v\u00e0o `<-chan`. \u0110\u00e2y l\u00e0 c\u00e1ch enforce contract \u1edf compile time.\n\n#### Unbuffered vs Buffered Channel\n\n**Unbuffered** (m\u1eb7c \u0111\u1ecbnh):\n- Write **block** cho \u0111\u1ebfn khi c\u00f3 goroutine kh\u00e1c read.\n- Read **block** cho \u0111\u1ebfn khi c\u00f3 goroutine kh\u00e1c write.\n- Gi\u1ed1ng nh\u01b0 b\u1eaft tay tr\u1ef1c ti\u1ebfp \u2014 b\u00ean giao v\u00e0 b\u00ean nh\u1eadn ph\u1ea3i s\u1eb5n s\u00e0ng c\u00f9ng l\u00fac.\n\n```go\nch := make(chan int)   // unbuffered\n```\n\n**Buffered**:\n- C\u00f3 th\u1ec3 write m\u00e0 kh\u00f4ng block, **mi\u1ec5n l\u00e0 buffer ch\u01b0a \u0111\u1ea7y**.\n- Read block n\u1ebfu buffer **r\u1ed7ng**.\n\n```go\nch := make(chan int, 10)   // buffered, capacity = 10\nfmt.Println(len(ch))       // s\u1ed1 ph\u1ea7n t\u1eed hi\u1ec7n t\u1ea1i trong buffer\nfmt.Println(cap(ch))       // capacity = 10\n```\n\n> Ph\u1ea7n l\u1edbn th\u1eddi gian, h\u00e3y d\u00f9ng **unbuffered channel**. Buffered channel c\u00f3 tr\u01b0\u1eddng h\u1ee3p d\u00f9ng ri\u00eang (xem m\u1ee5c 5.5).\n\n### 3.2 Using for-range and Channels\n\n```go\nfor v := range ch {\n    fmt.Println(v)\n}\n```\n\n- Ch\u1ec9 c\u00f3 **1 bi\u1ebfn** trong for-range v\u1edbi channel (kh\u00e1c v\u1edbi slice c\u00f3 index, value).\n- Loop t\u1ef1 \u0111\u1ed9ng **d\u1eebng khi channel b\u1ecb close**.\n- N\u1ebfu channel c\u00f2n m\u1edf v\u00e0 ch\u01b0a c\u00f3 gi\u00e1 tr\u1ecb \u2192 goroutine **block** ch\u1edd.\n\n### 3.3 Closing a Channel\n\n```go\nclose(ch)\n```\n\n**Quy t\u1eafc v\u00e0ng:** Ch\u1ec9 goroutine **vi\u1ebft** m\u1edbi \u0111\u01b0\u1ee3c close channel.\n\n| H\u00e0nh \u0111\u1ed9ng | K\u1ebft qu\u1ea3 |\n|---|---|\n| Write v\u00e0o channel \u0111\u00e3 close | **PANIC** |\n| Close channel \u0111\u00e3 close | **PANIC** |\n| Read t\u1eeb channel \u0111\u00e3 close | Tr\u1ea3 v\u1ec1 zero value (kh\u00f4ng panic) |\n| Read t\u1eeb closed buffered channel c\u00f2n gi\u00e1 tr\u1ecb | Tr\u1ea3 v\u1ec1 gi\u00e1 tr\u1ecb c\u00f2n l\u1ea1i tr\u01b0\u1edbc |\n\n#### Ph\u00e2n bi\u1ec7t \"zero value th\u1eadt\" vs \"zero value do channel \u0111\u00f3ng\"\n\nD\u00f9ng **comma-ok idiom** (gi\u1ed1ng map):\n\n```go\nv, ok := <-ch\nif ok {\n    // channel c\u00f2n m\u1edf, v l\u00e0 gi\u00e1 tr\u1ecb th\u1eadt\n} else {\n    // channel \u0111\u00e3 \u0111\u00f3ng, v l\u00e0 zero value\n}\n```\n\n> **L\u01b0u \u00fd:** Kh\u00f4ng c\u1ea7n close t\u1ea5t c\u1ea3 channel. Channel l\u00e0 variable \u2014 Go GC s\u1ebd thu d\u1ecdn khi kh\u00f4ng c\u00f2n reference n\u00e0o. Ch\u1ec9 c\u1ea7n close khi c\u00f3 goroutine \u0111ang `range` tr\u00ean channel \u0111\u00f3 ch\u1edd t\u00edn hi\u1ec7u d\u1eebng.\n\n### 3.4 Understanding How Channels Behave\n\nB\u1ea3ng t\u1ed5ng h\u1ee3p h\u00e0nh vi \u0111\u1ea7y \u0111\u1ee7:\n\n| | Unbuffered, open | Unbuffered, closed | Buffered, open | Buffered, closed | Nil |\n|---|---|---|---|---|---|\n| **Read** | Block ch\u1edd write | Tr\u1ea3 v\u1ec1 zero value | Block n\u1ebfu buffer r\u1ed7ng | Tr\u1ea3 v\u1ec1 gi\u00e1 tr\u1ecb c\u00f2n l\u1ea1i; r\u1ed7ng \u2192 zero value | **Hang m\u00e3i m\u00e3i** |\n| **Write** | Block ch\u1edd read | **PANIC** | Block n\u1ebfu buffer \u0111\u1ea7y | **PANIC** | **Hang m\u00e3i m\u00e3i** |\n| **Close** | OK | **PANIC** | OK, c\u00f2n gi\u00e1 tr\u1ecb trong buffer | **PANIC** | **PANIC** |\n\n**T\u00f3m t\u1eaft nguy\u00ean t\u1eafc tr\u00e1nh panic:**\n- Ch\u1ec9 writer m\u1edbi close channel.\n- Nhi\u1ec1u goroutine c\u00f9ng write \u2192 d\u00f9ng `sync.WaitGroup` \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o ch\u1ec9 close 1 l\u1ea7n.\n- Kh\u00f4ng bao gi\u1edd \u0111\u1ec3 channel `nil` tr\u1eeb khi d\u00f9ng k\u1ef9 thu\u1eadt t\u1eaft `case` trong `select` (xem 5.7).\n\n---\n\n## 4. select\n\n### select l\u00e0 g\u00ec?\n\n`select` l\u00e0 **control structure cho concurrency** trong Go \u2014 cho ph\u00e9p m\u1ed9t goroutine ch\u1edd tr\u00ean nhi\u1ec1u channel c\u00f9ng l\u00fac.\n\n```go\nselect {\ncase v := <-ch:\n    fmt.Println(\"read from ch:\", v)\ncase v := <-ch2:\n    fmt.Println(\"read from ch2:\", v)\ncase ch3 <- x:\n    fmt.Println(\"wrote to ch3\")\ncase <-ch4:\n    fmt.Println(\"got value on ch4 (ignored)\")\n}\n```\n\n### \u0110\u1eb7c \u0111i\u1ec3m quan tr\u1ecdng\n\n1. **Ch\u1ecdn ng\u1eabu nhi\u00ean** khi nhi\u1ec1u case s\u1eb5n s\u00e0ng \u2014 kh\u00e1c v\u1edbi `switch` lu\u00f4n ch\u1ecdn case \u0111\u1ea7u ti\u00ean. \u0110i\u1ec1u n\u00e0y gi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1 **starvation** (m\u1ed9t case b\u1ecb b\u1ecf \u0111\u00f3i m\u00e3i).\n\n2. **Tr\u00e1nh deadlock**: `select` ki\u1ec3m tra t\u1ea5t c\u1ea3 case tr\u01b0\u1edbc khi block.\n\n#### V\u00ed d\u1ee5 deadlock v\u00e0 c\u00e1ch tr\u00e1nh\n\n```go\n// DEADLOCK \u2014 c\u1ea3 2 goroutine block nhau\nfunc main() {\n    ch1, ch2 := make(chan int), make(chan int)\n    go func() {\n        ch1 <- 1        // block ch\u1edd main \u0111\u1ecdc ch1\n        v := <-ch2      // ... nh\u01b0ng main ch\u01b0a \u0111\u1ecdc\n        fmt.Println(v)\n    }()\n    ch2 <- 2            // main block ch\u1edd goroutine \u0111\u1ecdc ch2\n    v := <-ch1          // ... nh\u01b0ng goroutine ch\u01b0a \u0111\u1ecdc\n    fmt.Println(v)\n}\n// fatal error: all goroutines are asleep - deadlock!\n```\n\n```go\n// FIX \u2014 d\u00f9ng select, goroutine n\u00e0o s\u1eb5n s\u00e0ng tr\u01b0\u1edbc th\u00ec \u0111i tr\u01b0\u1edbc\nfunc main() {\n    ch1, ch2 := make(chan int), make(chan int)\n    go func() {\n        ch1 <- 1\n        v := <-ch2\n        fmt.Println(\"goroutine:\", v)\n    }()\n    var fromGoroutine int\n    select {\n    case ch2 <- 2:\n    case fromGoroutine = <-ch1:\n    }\n    fmt.Println(\"main:\", fromGoroutine)\n}\n```\n\n### for-select loop\n\nPattern r\u1ea5t ph\u1ed5 bi\u1ebfn \u2014 `select` th\u01b0\u1eddng n\u1eb1m trong v\u00f2ng l\u1eb7p v\u00f4 h\u1ea1n:\n\n```go\nfor {\n    select {\n    case <-done:\n        return\n    case v := <-ch:\n        fmt.Println(v)\n    }\n}\n```\n\nPh\u1ea3i c\u00f3 c\u00e1ch tho\u00e1t v\u00f2ng l\u1eb7p (channel `done`, context cancel, v.v.).\n\n### default trong select\n\n```go\nselect {\ncase v := <-ch:\n    fmt.Println(\"got:\", v)\ndefault:\n    fmt.Println(\"nothing ready, moving on\")\n}\n```\n\n- D\u00f9ng `default` \u0111\u1ec3 **non-blocking** read/write.\n- **C\u1ea2NH B\u00c1O:** \u0110\u1eebng d\u00f9ng `default` b\u00ean trong `for-select` loop \u2014 s\u1ebd spin loop li\u00ean t\u1ee5c, ng\u1ed1n CPU.\n\n---\n\n## 5. Concurrency Practices and Patterns\n\n### 5.1 Keep Your APIs Concurrency-Free\n\n**Nguy\u00ean t\u1eafc:** \u0110\u1eebng expose channel hay mutex trong public API.\n\n```go\n// BAD \u2014 bu\u1ed9c caller ph\u1ea3i bi\u1ebft c\u00e1ch qu\u1ea3n l\u00fd channel\nfunc StartProcessor() chan int { ... }\n\n// GOOD \u2014 \u1ea9n concurrency b\u00ean trong\nfunc ProcessAll(inputs []int) []int { ... }\n```\n\nN\u1ebfu b\u1ea1n expose channel, caller ph\u1ea3i lo:\n- Channel c\u00f3 buffered kh\u00f4ng?\n- Ai close channel?\n- N\u1ebfu \u0111\u1ecdc nil channel th\u00ec sao?\n\n**Ngo\u1ea1i l\u1ec7:** N\u1ebfu package c\u1ee7a b\u1ea1n *l\u00e0* m\u1ed9t concurrency helper library th\u00ec channel c\u00f3 th\u1ec3 l\u00e0 ph\u1ea7n c\u1ee7a API.\n\n### 5.2 Goroutines, for Loops, and Varying Variables\n\n#### Bug c\u1ed5 \u0111i\u1ec3n (Go \u2264 1.21)\n\n```go\na := []int{2, 4, 6, 8, 10}\nch := make(chan int, len(a))\nfor _, v := range a {\n    go func() {\n        ch <- v * 2   // BUG: t\u1ea5t c\u1ea3 goroutine capture c\u00f9ng 1 bi\u1ebfn v\n    }()\n}\n// K\u1ebft qu\u1ea3: 20 20 20 20 20 (t\u1ea5t c\u1ea3 d\u00f9ng v = 10, gi\u00e1 tr\u1ecb cu\u1ed1i)\n```\n\n**T\u1ea1i sao?** Tr\u01b0\u1edbc Go 1.22, bi\u1ebfn `v` trong for-range \u0111\u01b0\u1ee3c **t\u00e1i s\u1eed d\u1ee5ng** qua m\u1ed7i iteration. Khi goroutine th\u1ef1c s\u1ef1 ch\u1ea1y, `v` \u0111\u00e3 l\u00e0 gi\u00e1 tr\u1ecb cu\u1ed1i c\u00f9ng.\n\n#### C\u00e1ch fix (Go \u2264 1.21)\n\n```go\n// C\u00e1ch 1: shadow variable\nfor _, v := range a {\n    v := v   // t\u1ea1o b\u1ea3n copy m\u1edbi cho m\u1ed7i iteration\n    go func() {\n        ch <- v * 2\n    }()\n}\n\n// C\u00e1ch 2: pass as parameter\nfor _, v := range a {\n    go func(val int) {\n        ch <- val * 2\n    }(v)\n}\n```\n\n**Go 1.22+** t\u1ef1 \u0111\u1ed9ng t\u1ea1o bi\u1ebfn m\u1edbi cho m\u1ed7i iteration \u2014 bug n\u00e0y kh\u00f4ng c\u00f2n n\u1eefa.\n\n> **Rule t\u1ed5ng qu\u00e1t:** B\u1ea5t k\u1ef3 khi n\u00e0o closure capture m\u1ed9t bi\u1ebfn c\u00f3 th\u1ec3 thay \u0111\u1ed5i gi\u00e1 tr\u1ecb, h\u00e3y pass n\u00f3 nh\u01b0 parameter ho\u1eb7c t\u1ea1o copy tr\u01b0\u1edbc.\n\n### 5.3 Always Clean Up Your Goroutines\n\n**Goroutine leak** = goroutine kh\u00f4ng bao gi\u1edd exit \u2192 memory b\u1ecb gi\u1eef m\u00e3i, GC kh\u00f4ng thu d\u1ecdn \u0111\u01b0\u1ee3c.\n\n```go\n// BUG \u2014 goroutine leak n\u1ebfu caller break s\u1edbm\nfunc countTo(max int) <-chan int {\n    ch := make(chan int)\n    go func() {\n        for i := 0; i < max; i++ {\n            ch <- i   // n\u1ebfu kh\u00f4ng ai \u0111\u1ecdc, goroutine block m\u00e3i\n        }\n        close(ch)\n    }()\n    return ch\n}\n\nfunc main() {\n    for i := range countTo(10) {\n        if i > 5 {\n            break   // goroutine b\u00ean trong b\u1ecb leak!\n        }\n        fmt.Println(i)\n    }\n}\n```\n\n**Gi\u1ea3i ph\u00e1p:** D\u00f9ng context \u0111\u1ec3 b\u00e1o hi\u1ec7u goroutine n\u00ean d\u1eebng (xem 5.4).\n\n### 5.4 Use the Context to Terminate Goroutines\n\nContext l\u00e0 c\u01a1 ch\u1ebf chu\u1ea9n trong Go \u0111\u1ec3 truy\u1ec1n t\u00edn hi\u1ec7u h\u1ee7y v\u00e0 deadline xuy\u00ean su\u1ed1t call stack.\n\n```go\nfunc countTo(ctx context.Context, max int) <-chan int {\n    ch := make(chan int)\n    go func() {\n        defer close(ch)   // lu\u00f4n close khi goroutine exit\n        for i := 0; i < max; i++ {\n            select {\n            case <-ctx.Done():   // nh\u1eadn t\u00edn hi\u1ec7u h\u1ee7y \u2192 tho\u00e1t\n                return\n            case ch <- i:        // ghi b\u00ecnh th\u01b0\u1eddng\n            }\n        }\n    }()\n    return ch\n}\n\nfunc main() {\n    ctx, cancel := context.WithCancel(context.Background())\n    defer cancel()   // \u0111\u1ea3m b\u1ea3o cancel \u0111\u01b0\u1ee3c g\u1ecdi khi main exit\n\n    ch := countTo(ctx, 10)\n    for i := range ch {\n        if i > 5 {\n            break   // cancel() s\u1ebd \u0111\u01b0\u1ee3c g\u1ecdi qua defer \u2192 goroutine tho\u00e1t s\u1ea1ch\n        }\n        fmt.Println(i)\n    }\n}\n```\n\n**C\u01a1 ch\u1ebf ho\u1ea1t \u0111\u1ed9ng:**\n1. `context.WithCancel()` tr\u1ea3 v\u1ec1 context v\u00e0 h\u00e0m `cancel`.\n2. `ctx.Done()` tr\u1ea3 v\u1ec1 channel.\n3. Khi `cancel()` \u0111\u01b0\u1ee3c g\u1ecdi \u2192 channel `Done` b\u1ecb close \u2192 case `<-ctx.Done()` trong select k\u00edch ho\u1ea1t.\n\n> **So s\u00e1nh Java:** T\u01b0\u01a1ng t\u1ef1 `Thread.interrupt()` + ki\u1ec3m tra `Thread.interrupted()`, nh\u01b0ng clean h\u01a1n v\u00e0 d\u1ec5 d\u00f9ng h\u01a1n nhi\u1ec1u.\n\n### 5.5 Know When to Use Buffered and Unbuffered Channels\n\n**Unbuffered** \u2014 d\u00f9ng m\u1eb7c \u0111\u1ecbnh, \u0111\u01a1n gi\u1ea3n, d\u1ec5 hi\u1ec3u.\n\n**Buffered** \u2014 ph\u00f9 h\u1ee3p khi:\n- B\u1ea1n bi\u1ebft **ch\u00ednh x\u00e1c s\u1ed1 goroutine** s\u1ebd \u0111\u01b0\u1ee3c launch.\n- Mu\u1ed1n **gi\u1edbi h\u1ea1n s\u1ed1 goroutine** \u0111\u1ed3ng th\u1eddi.\n- Mu\u1ed1n **gi\u1edbi h\u1ea1n l\u01b0\u1ee3ng work** \u0111ang x\u1ebfp h\u00e0ng (backpressure).\n\n```go\n// Pattern: bi\u1ebft ch\u00ednh x\u00e1c 10 goroutine, d\u00f9ng buffered channel size 10\nfunc processChannel(ch chan int) []int {\n    const conc = 10\n    results := make(chan int, conc)   // buffer \u0111\u1ee7 cho t\u1ea5t c\u1ea3 goroutine write kh\u00f4ng block\n\n    for i := 0; i < conc; i++ {\n        go func() {\n            v := <-ch\n            results <- process(v)   // write ngay, kh\u00f4ng block\n        }()\n    }\n\n    var out []int\n    for i := 0; i < conc; i++ {\n        out = append(out, <-results)\n    }\n    return out\n}\n```\n\n### 5.6 Implement Backpressure\n\nBackpressure = **gi\u1edbi h\u1ea1n s\u1ed1 request \u0111ang x\u1eed l\u00fd \u0111\u1ed3ng th\u1eddi** \u0111\u1ec3 tr\u00e1nh system b\u1ecb qu\u00e1 t\u1ea3i.\n\n```go\ntype PressureGauge struct {\n    ch chan struct{}\n}\n\nfunc New(limit int) *PressureGauge {\n    return &PressureGauge{\n        ch: make(chan struct{}, limit),   // buffer = s\u1ed1 slot cho ph\u00e9p\n    }\n}\n\nfunc (pg *PressureGauge) Process(f func()) error {\n    select {\n    case pg.ch <- struct{}{}:   // th\u1eed l\u1ea5y 1 slot\n        f()                      // ch\u1ea1y function\n        <-pg.ch                  // tr\u1ea3 slot l\u1ea1i\n        return nil\n    default:\n        return errors.New(\"no more capacity\")   // h\u1ebft slot \u2192 t\u1eeb ch\u1ed1i\n    }\n}\n```\n\nS\u1eed d\u1ee5ng v\u1edbi HTTP server:\n\n```go\nfunc main() {\n    pg := New(10)   // t\u1ed1i \u0111a 10 request \u0111\u1ed3ng th\u1eddi\n    http.HandleFunc(\"/request\", func(w http.ResponseWriter, r *http.Request) {\n        err := pg.Process(func() {\n            w.Write([]byte(doThingThatShouldBeLimited()))\n        })\n        if err != nil {\n            w.WriteHeader(http.StatusTooManyRequests)\n        }\n    })\n    http.ListenAndServe(\":8080\", nil)\n}\n```\n\n> **So s\u00e1nh Java:** T\u01b0\u01a1ng t\u1ef1 `Semaphore` trong Java, nh\u01b0ng implement b\u1eb1ng channel + select.\n\n### 5.7 Turn Off a case in a select\n\nKhi m\u1ed9t channel b\u1ecb close, case t\u01b0\u01a1ng \u1ee9ng trong `select` s\u1ebd lu\u00f4n \u0111\u01b0\u1ee3c ch\u1ecdn (tr\u1ea3 v\u1ec1 zero value). \u0110\u00e2y l\u00e0 v\u1ea5n \u0111\u1ec1 v\u00ec n\u00f3 \"chi\u1ebfm slot random\" m\u00e0 kh\u00f4ng c\u00f3 d\u1eef li\u1ec7u th\u1eadt.\n\n**Gi\u1ea3i ph\u00e1p:** Set channel v\u1ec1 `nil` \u2014 read/write t\u1eeb nil channel **block m\u00e3i m\u00e3i**, n\u00ean case \u0111\u00f3 s\u1ebd kh\u00f4ng bao gi\u1edd \u0111\u01b0\u1ee3c ch\u1ecdn.\n\n```go\n// \u0110\u1ecdc t\u1eeb 2 channel cho \u0111\u1ebfn khi c\u1ea3 2 \u0111\u1ec1u \u0111\u00f3ng\nfor count := 0; count < 2; {\n    select {\n    case v, ok := <-in:\n        if !ok {\n            in = nil   // t\u1eaft case n\u00e0y, s\u1ebd kh\u00f4ng \u0111\u01b0\u1ee3c select n\u1eefa\n            count++\n            continue\n        }\n        // x\u1eed l\u00fd v\n\n    case v, ok := <-in2:\n        if !ok {\n            in2 = nil   // t\u1eaft case n\u00e0y\n            count++\n            continue\n        }\n        // x\u1eed l\u00fd v\n    }\n}\n```\n\n### 5.8 Time Out Code\n\nPattern chu\u1ea9n \u0111\u1ec3 gi\u1edbi h\u1ea1n th\u1eddi gian th\u1ef1c thi:\n\n```go\nfunc timeLimit[T any](worker func() T, limit time.Duration) (T, error) {\n    out := make(chan T, 1)   // buffered size 1 \u2014 goroutine write xong c\u00f3 th\u1ec3 exit ngay\n    ctx, cancel := context.WithTimeout(context.Background(), limit)\n    defer cancel()\n\n    go func() {\n        out <- worker()\n    }()\n\n    select {\n    case result := <-out:\n        return result, nil\n    case <-ctx.Done():\n        var zero T\n        return zero, errors.New(\"work timed out\")\n    }\n}\n```\n\n**T\u1ea1i sao buffer size 1?** N\u1ebfu timeout x\u1ea3y ra tr\u01b0\u1edbc khi worker xong:\n- Goroutine worker v\u1eabn ch\u1ea1y ti\u1ebfp, cu\u1ed1i c\u00f9ng write v\u00e0o `out`.\n- V\u00ec buffer = 1, goroutine write \u0111\u01b0\u1ee3c v\u00e0 exit b\u00ecnh th\u01b0\u1eddng (kh\u00f4ng b\u1ecb leak).\n- N\u1ebfu buffer = 0, goroutine b\u1ecb block m\u00e3i v\u00ec kh\u00f4ng ai \u0111\u1ecdc `out` n\u1eefa \u2192 **goroutine leak**.\n\n> **So s\u00e1nh Java:** `Future.get(timeout, TimeUnit)` \u2014 nh\u01b0ng Go l\u00e0m \u0111\u01b0\u1ee3c b\u1eb1ng primitives s\u1eb5n c\u00f3, kh\u00f4ng c\u1ea7n th\u00eam API.\n\n### 5.9 Use WaitGroups\n\nD\u00f9ng khi c\u1ea7n ch\u1edd **nhi\u1ec1u goroutine** ho\u00e0n th\u00e0nh.\n\n```go\nvar wg sync.WaitGroup\nwg.Add(3)   // s\u1ebd launch 3 goroutines\n\ngo func() {\n    defer wg.Done()   // d\u00f9ng defer \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o Done() lu\u00f4n \u0111\u01b0\u1ee3c g\u1ecdi\n    doThing1()\n}()\ngo func() {\n    defer wg.Done()\n    doThing2()\n}()\ngo func() {\n    defer wg.Done()\n    doThing3()\n}()\n\nwg.Wait()   // block cho \u0111\u1ebfn khi counter = 0\n```\n\n**3 methods c\u1ee7a `sync.WaitGroup`:**\n- `Add(n)`: t\u0103ng counter l\u00ean n (th\u01b0\u1eddng g\u1ecdi 1 l\u1ea7n v\u1edbi t\u1ed5ng s\u1ed1 goroutine).\n- `Done()`: gi\u1ea3m counter xu\u1ed1ng 1 (goroutine g\u1ecdi khi xong).\n- `Wait()`: block cho \u0111\u1ebfn khi counter = 0.\n\n**T\u1ea1i sao kh\u00f4ng pass WaitGroup v\u00e0o goroutine?**\n\n```go\n// SAI \u2014 goroutine nh\u1eadn b\u1ea3n copy, Done() kh\u00f4ng \u1ea3nh h\u01b0\u1edfng original\ngo func(wg sync.WaitGroup) {\n    defer wg.Done()   // bug!\n}(wg)\n\n// \u0110\u00daNG \u2014 capture qua closure, c\u00f9ng tham chi\u1ebfu\ngo func() {\n    defer wg.Done()   // \u0111\u00fang\n}()\n\n// Ho\u1eb7c pass pointer\ngo func(wg *sync.WaitGroup) {\n    defer wg.Done()\n}(&wg)\n```\n\n#### Pattern n\u00e2ng cao: WaitGroup + close channel\n\n```go\nfunc processAndGather[T, R any](in <-chan T, processor func(T) R, num int) []R {\n    out := make(chan R, num)\n    var wg sync.WaitGroup\n    wg.Add(num)\n\n    for i := 0; i < num; i++ {\n        go func() {\n            defer wg.Done()\n            for v := range in {\n                out <- processor(v)\n            }\n        }()\n    }\n\n    // Monitoring goroutine: \u0111\u1ee3i t\u1ea5t c\u1ea3 worker xong r\u1ed3i m\u1edbi close channel\n    go func() {\n        wg.Wait()\n        close(out)   // an to\u00e0n: ch\u1ec9 close 1 l\u1ea7n\n    }()\n\n    var result []R\n    for v := range out {\n        result = append(result, v)\n    }\n    return result\n}\n```\n\n> **So s\u00e1nh Java:** `CountDownLatch` ho\u1eb7c `CompletableFuture.allOf()`.\n\n> **Ghi nh\u1edb:** WaitGroup kh\u00f4ng ph\u1ea3i c\u00f4ng c\u1ee5 \u0111\u1ea7u ti\u00ean n\u00ean ngh\u0129 \u0111\u1ebfn. Ch\u1ec9 d\u00f9ng khi c\u1ea7n cleanup (nh\u01b0 close channel) sau khi t\u1ea5t c\u1ea3 goroutine xong.\n\n### 5.10 Run Code Exactly Once\n\n`sync.Once` \u0111\u1ea3m b\u1ea3o m\u1ed9t \u0111o\u1ea1n code ch\u1ea1y **\u0111\u00fang 1 l\u1ea7n**, d\u00f9 c\u00f3 nhi\u1ec1u goroutine g\u1ecdi \u0111\u1ed3ng th\u1eddi.\n\n```go\nvar parser SlowComplicatedParser\nvar once sync.Once\n\nfunc Parse(data string) string {\n    once.Do(func() {\n        parser = initParser()   // ch\u1ec9 ch\u1ea1y 1 l\u1ea7n duy nh\u1ea5t\n    })\n    return parser.Parse(data)\n}\n```\n\n**Go 1.21+** c\u00f3 helper functions ti\u1ec7n h\u01a1n:\n\n```go\n// sync.OnceValue \u2014 cache return value c\u1ee7a function\nvar initParserCached = sync.OnceValue(initParser)\n\nfunc Parse(data string) string {\n    parser := initParserCached()   // l\u1ea7n \u0111\u1ea7u g\u1ecdi initParser, c\u00e1c l\u1ea7n sau d\u00f9ng cache\n    return parser.Parse(data)\n}\n```\n\n| Helper | D\u00f9ng khi |\n|---|---|\n| `sync.OnceFunc` | Function kh\u00f4ng c\u00f3 return value |\n| `sync.OnceValue` | Function tr\u1ea3 v\u1ec1 1 gi\u00e1 tr\u1ecb |\n| `sync.OnceValues` | Function tr\u1ea3 v\u1ec1 2 gi\u00e1 tr\u1ecb |\n\n> **So s\u00e1nh Java:** `LazyHolder` pattern ho\u1eb7c `AtomicReference.compareAndSet()`. Go l\u00e0m \u0111\u01a1n gi\u1ea3n v\u00e0 safe h\u01a1n.\n\n> **C\u1ea3nh b\u00e1o:** Kh\u00f4ng copy `sync.Once` \u2014 m\u1ed7i copy c\u00f3 state ri\u00eang. Kh\u00f4ng khai b\u00e1o `sync.Once` trong body c\u1ee7a function (m\u1ed7i l\u1ea7n g\u1ecdi t\u1ea1o m\u1edbi, m\u1ea5t t\u00e1c d\u1ee5ng).\n\n### 5.11 Put Your Concurrent Tools Together\n\nV\u00ed d\u1ee5 t\u1ed5ng h\u1ee3p t\u1eeb \u0111\u1ea7u ch\u01b0\u01a1ng: g\u1ecdi 3 web services, A v\u00e0 B song song, k\u1ebft qu\u1ea3 g\u1eedi \u0111\u1ebfn C, timeout 50ms.\n\n```\nInput \u2500\u2500\u252c\u2500\u2500> Service A \u2500\u2500\u2510\n        \u2502                \u251c\u2500\u2500> cIn \u2500\u2500> Service C \u2500\u2500> Output\n        \u2514\u2500\u2500> Service B \u2500\u2500\u2518\n```\n\n```go\nfunc GatherAndProcess(ctx context.Context, data Input) (COut, error) {\n    ctx, cancel := context.WithTimeout(ctx, 50*time.Millisecond)\n    defer cancel()\n\n    // G\u1ecdi A v\u00e0 B song song\n    ab := newABProcessor()\n    ab.start(ctx, data)\n    inputC, err := ab.wait(ctx)\n    if err != nil {\n        return COut{}, err\n    }\n\n    // G\u1ecdi C v\u1edbi k\u1ebft qu\u1ea3 t\u1eeb A+B\n    c := newCProcessor()\n    c.start(ctx, inputC)\n    return c.wait(ctx)\n}\n```\n\n**abProcessor** \u2014 qu\u1ea3n l\u00fd 2 goroutine g\u1ecdi A v\u00e0 B:\n\n```go\ntype abProcessor struct {\n    outA chan aOut\n    outB chan bOut\n    errs chan error\n}\n\nfunc newABProcessor() *abProcessor {\n    return &abProcessor{\n        outA: make(chan aOut, 1),   // buffered: goroutine write xong c\u00f3 th\u1ec3 exit\n        outB: make(chan bOut, 1),\n        errs: make(chan error, 2),  // 2 slot v\u00ec c\u1ea3 A v\u00e0 B \u0111\u1ec1u c\u00f3 th\u1ec3 l\u1ed7i\n    }\n}\n\nfunc (p *abProcessor) start(ctx context.Context, data Input) {\n    go func() {\n        aOut, err := getResultA(ctx, data.A)\n        if err != nil { p.errs <- err; return }\n        p.outA <- aOut\n    }()\n    go func() {\n        bOut, err := getResultB(ctx, data.B)\n        if err != nil { p.errs <- err; return }\n        p.outB <- bOut\n    }()\n}\n\nfunc (p *abProcessor) wait(ctx context.Context) (cIn, error) {\n    var cData cIn\n    for count := 0; count < 2; count++ {   // ch\u1edd \u0111\u1ee7 2 k\u1ebft qu\u1ea3\n        select {\n        case a := <-p.outA:\n            cData.a = a\n        case b := <-p.outB:\n            cData.b = b\n        case err := <-p.errs:\n            return cIn{}, err\n        case <-ctx.Done():\n            return cIn{}, ctx.Err()\n        }\n    }\n    return cData, nil\n}\n```\n\n**\u0110i\u1ec3m m\u1ea5u ch\u1ed1t c\u1ee7a thi\u1ebft k\u1ebf n\u00e0y:**\n- T\u1ea5t c\u1ea3 channel \u0111\u1ec1u **buffered size 1** \u2192 goroutine kh\u00f4ng b\u1ecb block sau khi write.\n- `select` trong `wait()` x\u1eed l\u00fd 4 tr\u01b0\u1eddng h\u1ee3p: A xong, B xong, l\u1ed7i, timeout.\n- Code \u0111\u1ecdc nh\u01b0 sequential m\u1eb7c d\u00f9 b\u00ean trong ch\u1ea1y concurrent.\n\n### 5.12 When to Use Mutexes Instead of Channels\n\n**Tri\u1ebft l\u00fd Go:** D\u00f9ng channel \u0111\u1ec3 truy\u1ec1n ownership c\u1ee7a data. D\u00f9ng mutex ch\u1ec9 khi nhi\u1ec1u goroutine c\u1ea7n access shared state m\u00e0 kh\u00f4ng transfer data.\n\n#### Quy\u1ebft \u0111\u1ecbnh: Channel hay Mutex?\n\n| T\u00ecnh hu\u1ed1ng | D\u00f9ng g\u00ec |\n|---|---|\n| Goroutine ph\u1ed1i h\u1ee3p, truy\u1ec1n data qua pipeline | **Channel** |\n| Shared field trong struct, nhi\u1ec1u goroutine read/write | **Mutex** |\n| Ph\u00e1t hi\u1ec7n bottleneck khi d\u00f9ng channel | **Mutex** |\n\n#### V\u00ed d\u1ee5: Scoreboard v\u1edbi Mutex\n\n```go\ntype MutexScoreboardManager struct {\n    l          sync.RWMutex       // RWMutex: nhi\u1ec1u reader, 1 writer\n    scoreboard map[string]int\n}\n\nfunc (msm *MutexScoreboardManager) Update(name string, val int) {\n    msm.l.Lock()           // exclusive lock cho write\n    defer msm.l.Unlock()\n    msm.scoreboard[name] = val\n}\n\nfunc (msm *MutexScoreboardManager) Read(name string) (int, bool) {\n    msm.l.RLock()          // shared lock cho read \u2014 nhi\u1ec1u goroutine \u0111\u1ecdc c\u00f9ng l\u00fac \u0111\u01b0\u1ee3c\n    defer msm.l.RUnlock()\n    val, ok := msm.scoreboard[name]\n    return val, ok\n}\n```\n\n**`sync.RWMutex`** \u2014 n\u00e2ng c\u1ea5p so v\u1edbi `sync.Mutex`:\n- `Lock()` / `Unlock()` \u2014 writer lock (exclusive).\n- `RLock()` / `RUnlock()` \u2014 reader lock (shared, nhi\u1ec1u reader c\u00f9ng l\u00fac).\n\n**Lu\u00f4n d\u00f9ng `defer` \u0111\u1ec3 unlock** \u2014 \u0111\u1ea3m b\u1ea3o unlock d\u00f9 c\u00f3 panic.\n\n#### Nh\u1eefng \u0111i\u1ec3m kh\u00e1c v\u1edbi Java\n\n| | Java | Go |\n|---|---|---|\n| Reentrant lock | C\u00f3 (synchronized, ReentrantLock) | **Kh\u00f4ng** \u2014 deadlock n\u1ebfu c\u00f9ng goroutine lock 2 l\u1ea7n |\n| Copy mutex | Hi\u1ebfm khi issue | **Kh\u00f4ng bao gi\u1edd copy** \u2014 m\u1ed7i copy c\u00f3 state ri\u00eang |\n\n```go\n// DEADLOCK trong Go \u2014 mutex kh\u00f4ng reentrant\nfunc (msm *MutexScoreboardManager) DoubleLock() {\n    msm.l.Lock()\n    defer msm.l.Unlock()\n    msm.l.Lock()   // deadlock! goroutine t\u1ef1 ch\u1edd ch\u00ednh m\u00ecnh\n}\n```\n\n#### sync.Map\n\n`sync.Map` l\u00e0 concurrent-safe map trong standard library, nh\u01b0ng c\u00f3 nhi\u1ec1u h\u1ea1n ch\u1ebf:\n- Ch\u1ec9 d\u00f9ng khi key-value **insert 1 l\u1ea7n, \u0111\u1ecdc nhi\u1ec1u l\u1ea7n**.\n- D\u00f9ng `any` cho key/value \u2192 m\u1ea5t type safety.\n\n**Khuy\u1ebfn ngh\u1ecb:** Trong h\u1ea7u h\u1ebft tr\u01b0\u1eddng h\u1ee3p, d\u00f9ng `map` + `sync.RWMutex` thay v\u00ec `sync.Map`.\n\n### 5.13 Atomics \u2014 You Probably Don't Need These\n\n`sync/atomic` package cung c\u1ea5p atomic operations (add, swap, load, store, CAS) tr\u1ef1c ti\u1ebfp tr\u00ean CPU instruction.\n\nCh\u1ec9 d\u00f9ng khi:\n- B\u1ea1n l\u00e0 expert v\u1ec1 concurrent programming.\n- \u0110\u00e3 benchmark v\u00e0 confirm channel/mutex l\u00e0 bottleneck.\n\nV\u1edbi h\u1ea7u h\u1ebft use case, goroutine + channel/mutex l\u00e0 \u0111\u1ee7.\n\n---\n\n## 6. Exercises\n\n### Exercise 1 \u2014 3 goroutines giao ti\u1ebfp qua 1 channel\n\nT\u1ea1o function launch 3 goroutines: 2 goroutine \u0111\u1ea7u m\u1ed7i c\u00e1i write 10 s\u1ed1 v\u00e0o channel, goroutine th\u1ee9 3 \u0111\u1ecdc t\u1ea5t c\u1ea3 v\u00e0 print. Kh\u00f4ng leak goroutine.\n\n```go\nfunc exercise1() {\n    ch := make(chan int)\n    var wg sync.WaitGroup\n    wg.Add(2)\n\n    // Goroutine 1: write 1-10\n    go func() {\n        defer wg.Done()\n        for i := 1; i <= 10; i++ {\n            ch <- i\n        }\n    }()\n\n    // Goroutine 2: write 11-20\n    go func() {\n        defer wg.Done()\n        for i := 11; i <= 20; i++ {\n            ch <- i\n        }\n    }()\n\n    // Monitoring goroutine: \u0111\u1ee3i 2 writer xong r\u1ed3i close channel\n    go func() {\n        wg.Wait()\n        close(ch)\n    }()\n\n    // Goroutine 3 (main): read v\u00e0 print\n    for v := range ch {\n        fmt.Println(v)\n    }\n}\n```\n\n### Exercise 2 \u2014 for-select v\u1edbi 2 channel\n\nT\u1ea1o function launch 2 goroutines, m\u1ed7i c\u00e1i write 10 s\u1ed1 v\u00e0o channel ri\u00eang. D\u00f9ng for-select \u0111\u1ec3 \u0111\u1ecdc t\u1eeb c\u1ea3 2, print gi\u00e1 tr\u1ecb k\u00e8m goroutine n\u00e0o vi\u1ebft.\n\n```go\nfunc exercise2() {\n    ch1 := make(chan int)\n    ch2 := make(chan int)\n\n    go func() {\n        for i := 1; i <= 10; i++ {\n            ch1 <- i\n        }\n        close(ch1)\n    }()\n\n    go func() {\n        for i := 1; i <= 10; i++ {\n            ch2 <- i\n        }\n        close(ch2)\n    }()\n\n    for ch1 != nil || ch2 != nil {\n        select {\n        case v, ok := <-ch1:\n            if !ok {\n                ch1 = nil   // t\u1eaft case\n                continue\n            }\n            fmt.Println(\"goroutine 1:\", v)\n        case v, ok := <-ch2:\n            if !ok {\n                ch2 = nil   // t\u1eaft case\n                continue\n            }\n            fmt.Println(\"goroutine 2:\", v)\n        }\n    }\n}\n```\n\n### Exercise 3 \u2014 sync.OnceValue v\u1edbi square root cache\n\nBuild map[int]float64 v\u1edbi sqrt c\u1ee7a 0..99999. D\u00f9ng `sync.OnceValue` \u0111\u1ec3 cache map, lookup m\u1ed7i 1000 s\u1ed1.\n\n```go\nvar getSqrtMap = sync.OnceValue(func() map[int]float64 {\n    m := make(map[int]float64, 100_000)\n    for i := 0; i < 100_000; i++ {\n        m[i] = math.Sqrt(float64(i))\n    }\n    return m\n})\n\nfunc exercise3() {\n    sqrts := getSqrtMap()\n    for i := 0; i < 100_000; i += 1000 {\n        fmt.Printf(\"sqrt(%d) = %f\\n\", i, sqrts[i])\n    }\n}\n```\n\n---\n\n## T\u1ed5ng k\u1ebft\n\n| Kh\u00e1i ni\u1ec7m | T\u1eeb kh\u00f3a | So s\u00e1nh Java |\n|---|---|---|\n| Lightweight thread | `go func()` | `Thread` / `Executors` |\n| Giao ti\u1ebfp gi\u1eefa goroutines | `chan`, `<-` | `BlockingQueue` |\n| Ch\u1edd nhi\u1ec1u operation | `select` | `CompletableFuture.any()` |\n| H\u1ee7y goroutine | `context.WithCancel` | `Thread.interrupt()` |\n| Timeout | `context.WithTimeout` | `Future.get(timeout)` |\n| Ch\u1edd nhi\u1ec1u goroutine | `sync.WaitGroup` | `CountDownLatch` |\n| Kh\u1edfi t\u1ea1o 1 l\u1ea7n | `sync.Once` | `LazyHolder` |\n| Shared state | `sync.Mutex` / `sync.RWMutex` | `synchronized` / `ReentrantReadWriteLock` |\n\n**Nguy\u00ean t\u1eafc v\u00e0ng:**\n1. M\u1eb7c \u0111\u1ecbnh d\u00f9ng channel + goroutine.\n2. D\u00f9ng mutex khi nhi\u1ec1u goroutine share struct field kh\u00f4ng c\u1ea7n transfer ownership.\n3. Lu\u00f4n \u0111\u1ea3m b\u1ea3o m\u1ecdi goroutine c\u00f3 th\u1ec3 exit (kh\u00f4ng leak).\n4. \u1ea8n concurrency kh\u1ecfi public API.\n5. Benchmark tr\u01b0\u1edbc khi optimize \u2014 th\u00eam concurrency kh\u00f4ng t\u1ef1 \u0111\u1ed9ng = nhanh h\u01a1n.\n\n\n# Chapter 13 \u2014 The Standard Library\n\n> T\u00e0i li\u1ec7u h\u1ecdc Go d\u00e0nh cho ng\u01b0\u1eddi chuy\u1ec3n t\u1eeb Java sang.  \n> B\u00e1m s\u00e1t n\u1ed9i dung s\u00e1ch *Learning Go* (2nd ed.) \u2014 Chapter 13.\n\n---\n\n## 1. io and Friends\n\n### Tri\u1ebft l\u00fd I/O c\u1ee7a Go\n\nGo x\u00e2y d\u1ef1ng I/O xung quanh hai interface c\u1ef1c k\u1ef3 \u0111\u01a1n gi\u1ea3n:\n\n```go\ntype Reader interface {\n    Read(p []byte) (n int, err error)\n}\n\ntype Writer interface {\n    Write(p []byte) (n int, err error)\n}\n```\n\n> \u0110\u00e2y l\u00e0 interface \u0111\u01b0\u1ee3c d\u00f9ng **nhi\u1ec1u th\u1ee9 2 v\u00e0 3** trong Go (th\u1ee9 nh\u1ea5t l\u00e0 `error`).\n\n### T\u1ea1i sao `Read` nh\u1eadn v\u00e0o slice thay v\u00ec tr\u1ea3 v\u1ec1 slice?\n\n```go\n// KH\u00d4NG ph\u1ea3i c\u00e1ch Go \u0111\u1ecbnh ngh\u0129a\ntype NotHowReaderIsDefined interface {\n    Read() (p []byte, err error)  // M\u1ed7i l\u1ea7n g\u1ecdi \u2192 1 allocation m\u1edbi\n}\n\n// C\u00e1ch Go \u0111\u1ecbnh ngh\u0129a \u2014 caller cung c\u1ea5p buffer, t\u00e1i d\u00f9ng \u0111\u01b0\u1ee3c\ntype Reader interface {\n    Read(p []byte) (n int, err error)  // Zero allocation n\u1ebfu d\u00f9ng l\u1ea1i buffer\n}\n```\n\n**\u01afu \u0111i\u1ec3m:** Developer ki\u1ec3m so\u00e1t memory allocation. T\u1ea1o buffer 1 l\u1ea7n, d\u00f9ng nhi\u1ec1u l\u1ea7n.\n\n### V\u00ed d\u1ee5 \u0111\u1ecdc \u0111\u00fang c\u00e1ch\n\n```go\nfunc countLetters(r io.Reader) (map[string]int, error) {\n    buf := make([]byte, 2048)  // T\u1ea1o buffer 1 l\u1ea7n duy nh\u1ea5t\n    out := map[string]int{}\n    for {\n        n, err := r.Read(buf)\n        // X\u1eed l\u00fd n bytes \u0110\u00c3 \u0110\u1eccC tr\u01b0\u1edbc khi check error!\n        for _, b := range buf[:n] {\n            if (b >= 'A' && b <= 'Z') || (b >= 'a' && b <= 'z') {\n                out[string(b)]++\n            }\n        }\n        if err == io.EOF {\n            return out, nil  // EOF kh\u00f4ng ph\u1ea3i l\u1ed7i th\u1eadt, l\u00e0 t\u00edn hi\u1ec7u \"xong\"\n        }\n        if err != nil {\n            return nil, err\n        }\n    }\n}\n```\n\n**\u0110i\u1ec3m quan tr\u1ecdng:** Ph\u1ea3i x\u1eed l\u00fd `buf[:n]` tr\u01b0\u1edbc khi check `err`. Bytes c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c \u0111\u1ecdc v\u00e0 EOF x\u1ea3y ra trong **c\u00f9ng m\u1ed9t l\u1ea7n** g\u1ecdi `Read`.\n\n### Decorator Pattern v\u1edbi io.Reader\n\nGi\u1ed1ng Java's `InputStream` wrapping, Go chain c\u00e1c `io.Reader` l\u1ea1i:\n\n```java\n// Java\nInputStream is = new GZIPInputStream(new FileInputStream(\"file.gz\"));\n```\n\n```go\n// Go \u2014 c\u00f9ng pattern, nh\u01b0ng d\u00f9ng interface\nf, _ := os.Open(\"my_data.txt.gz\")\ngr, _ := gzip.NewReader(f)\n// gr implements io.Reader \u2014 d\u00f9ng \u0111\u01b0\u1ee3c v\u1edbi b\u1ea5t k\u1ef3 h\u00e0m n\u00e0o nh\u1eadn io.Reader\ncounts, _ := countLetters(gr)\n```\n\n### C\u00e1c interface ph\u1ed5 bi\u1ebfn trong io package\n\n```go\ntype Closer interface {\n    Close() error   // Lu\u00f4n d\u00f9ng defer f.Close()\n}\n\ntype Seeker interface {\n    Seek(offset int64, whence int) (int64, error)\n}\n```\n\nV\u00e0 c\u00e1c combination:\n\n| Interface | = |\n|---|---|\n| `io.ReadCloser` | `Reader` + `Closer` |\n| `io.ReadWriter` | `Reader` + `Writer` |\n| `io.ReadWriteCloser` | `Reader` + `Writer` + `Closer` |\n| `io.ReadSeeker` | `Reader` + `Seeker` |\n\n### Pattern: NopCloser \u2014 th\u00eam method v\u00e0o type c\u00f3 s\u1eb5n\n\n```go\n// Khi c\u1ea7n io.ReadCloser nh\u01b0ng ch\u1ec9 c\u00f3 io.Reader\nsr := strings.NewReader(\"hello\")   // ch\u1ec9 implement Reader, kh\u00f4ng c\u00f3 Close()\nrc := io.NopCloser(sr)              // wrap th\u00e0nh ReadCloser v\u1edbi Close() l\u00e0 no-op\n```\n\nImplement c\u1ee7a NopCloser r\u1ea5t \u0111\u01a1n gi\u1ea3n:\n\n```go\ntype nopCloser struct {\n    io.Reader  // embed Reader\n}\nfunc (nopCloser) Close() error { return nil }\n```\n\n> Pattern n\u00e0y r\u1ea5t h\u1eefu \u00edch: embed interface v\u00e0o struct \u0111\u1ec3 \"th\u00eam\" method m\u00e0 kh\u00f4ng c\u1ea7n implement l\u1ea1i.\n\n### C\u00e1c helper function quan tr\u1ecdng\n\n```go\nio.Copy(dst io.Writer, src io.Reader)  // copy to\u00e0n b\u1ed9\nio.ReadAll(r io.Reader) ([]byte, error) // \u0111\u1ecdc t\u1ea5t c\u1ea3 v\u00e0o []byte\nio.LimitReader(r, n)                   // ch\u1ec9 \u0111\u1ecdc t\u1ed1i \u0111a n bytes\nio.MultiReader(r1, r2, r3)             // \u0111\u1ecdc tu\u1ea7n t\u1ef1 t\u1eeb nhi\u1ec1u reader\nio.MultiWriter(w1, w2, w3)             // ghi \u0111\u1ed3ng th\u1eddi v\u00e0o nhi\u1ec1u writer\n```\n\n> **C\u1ea3nh b\u00e1o v\u1edbi loop:** Kh\u00f4ng d\u00f9ng `defer f.Close()` b\u00ean trong loop. `defer` ch\u1ec9 ch\u1ea1y khi **function** exit, kh\u00f4ng ph\u1ea3i khi loop iteration k\u1ebft th\u00fac.\n\n---\n\n## 2. time\n\n### Hai ki\u1ec3u ch\u00ednh\n\n```go\n// Kho\u1ea3ng th\u1eddi gian\nd := 2*time.Hour + 30*time.Minute  // type: time.Duration (based on int64)\nd2, _ := time.ParseDuration(\"2h30m\")\n\n// Th\u1eddi \u0111i\u1ec3m c\u1ee5 th\u1ec3\nnow := time.Now()           // time.Time v\u1edbi timezone\nt, _ := time.Parse(\"2006-01-02\", \"2024-01-15\")\n```\n\n### Format \u0111\u1eb7c bi\u1ec7t c\u1ee7a Go\n\nGo d\u00f9ng **ng\u00e0y chu\u1ea9n** `Mon Jan 2 15:04:05 MST 2006` \u0111\u1ec3 format (kh\u00f4ng d\u00f9ng `%Y %m %d` nh\u01b0 Java):\n\n```go\n// Java\nDateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm:ss\")\n\n// Go \u2014 d\u00f9ng ng\u00e0y tham chi\u1ebfu: 01/02 03:04:05PM '06 -0700\nt.Format(\"2006-01-02 15:04:05\")\nt.Format(\"January 2, 2006 at 3:04:05PM MST\")\n```\n\n**T\u1ea1i sao ng\u00e0y \u0111\u00f3?** M\u1ed7i ph\u1ea7n \u0111\u1ea1i di\u1ec7n cho s\u1ed1 1\u21927 theo th\u1ee9 t\u1ef1: th\u00e1ng=1, ng\u00e0y=2, gi\u1edd=3, ph\u00fat=4, gi\u00e2y=5, n\u0103m=06, timezone=7.\n\n**Constants th\u01b0\u1eddng d\u00f9ng:**\n\n```go\ntime.RFC3339        // \"2006-01-02T15:04:05Z07:00\"\ntime.RFC822         // \"02 Jan 06 15:04 MST\"\ntime.Kitchen        // \"3:04PM\"\ntime.DateOnly       // \"2006-01-02\" (Go 1.20+)\n```\n\n### So s\u00e1nh time\n\n```go\n// \u0110\u1eeaNG d\u00f9ng == v\u00ec kh\u00e1c timezone s\u1ebd fail\nt1 == t2        // SAI\n\n// D\u00f9ng Equal method\nt1.Equal(t2)    // \u0110\u00daNG \u2014 x\u1eed l\u00fd timezone\nt1.Before(t2)\nt1.After(t2)\n\n// T\u00ednh kho\u1ea3ng c\u00e1ch\ndiff := t2.Sub(t1)          // returns time.Duration\nlater := t1.Add(5 * time.Minute)\n```\n\n### 2.1 Monotonic Time\n\nH\u1ea7u h\u1ebft OS c\u00f3 2 \u0111\u1ed3ng h\u1ed3:\n- **Wall clock**: gi\u1edd hi\u1ec7n t\u1ea1i (c\u00f3 th\u1ec3 nh\u1ea3y khi DST, NTP sync).\n- **Monotonic clock**: \u0111\u1ebfm t\u1eeb khi boot, lu\u00f4n t\u0103ng \u0111\u1ec1u.\n\nGo t\u1ef1 \u0111\u1ed9ng d\u00f9ng **monotonic clock** khi t\u00ednh `Sub` n\u1ebfu c\u1ea3 hai `time.Time` \u0111\u01b0\u1ee3c t\u1ea1o b\u1eb1ng `time.Now()`. Transparent \u2014 kh\u00f4ng c\u1ea7n l\u00e0m g\u00ec th\u00eam.\n\n### 2.2 Timers and Timeouts\n\n```go\n// M\u1ed9t l\u1ea7n sau n gi\u00e2y\n<-time.After(5 * time.Second)\n\n// L\u1eb7p l\u1ea1i m\u1ed7i n gi\u00e2y \u2014 PH\u1ea2I d\u00f9ng NewTicker (\u0111\u1ec3 c\u00f3 th\u1ec3 Stop)\nticker := time.NewTicker(1 * time.Second)\ndefer ticker.Stop()   // quan tr\u1ecdng: tr\u00e1nh goroutine leak\nfor {\n    select {\n    case <-ticker.C:\n        doWork()\n    case <-done:\n        return\n    }\n}\n```\n\n> **\u0110\u1eebng d\u00f9ng** `time.Tick()` trong production v\u00ec kh\u00f4ng th\u1ec3 Stop v\u00e0 kh\u00f4ng \u0111\u01b0\u1ee3c GC.\n\n---\n\n## 3. encoding/json\n\n### 3.1 Struct Tags\n\n```go\ntype Order struct {\n    ID          string    `json:\"id\"`\n    DateOrdered time.Time `json:\"date_ordered\"`\n    CustomerID  string    `json:\"customer_id,omitempty\"` // b\u1ecf qua n\u1ebfu empty\n    Items       []Item    `json:\"items\"`\n    Internal    string    `json:\"-\"`  // lu\u00f4n b\u1ecf qua\n}\n```\n\n**Quy t\u1eafc struct tags:**\n- `json:\"name\"` \u2014 t\u00ean field trong JSON\n- `json:\"name,omitempty\"` \u2014 b\u1ecf qua n\u1ebfu zero value\n- `json:\"-\"` \u2014 lu\u00f4n b\u1ecf qua\n\n> **L\u01b0u \u00fd:** `omitempty` v\u1edbi struct kh\u00f4ng ho\u1ea1t \u0111\u1ed9ng nh\u01b0 mong \u0111\u1ee3i. Zero value c\u1ee7a struct **kh\u00f4ng** \u0111\u01b0\u1ee3c coi l\u00e0 \"empty\".\n\n> **So s\u00e1nh Java:** Gi\u1ed1ng `@JsonProperty`, `@JsonIgnore` c\u1ee7a Jackson, nh\u01b0ng l\u00e0 string annotation thu\u1ea7n t\u00fay \u2014 kh\u00f4ng c\u00f3 magic t\u1ef1 \u0111\u1ed9ng. Ch\u1ec9 \u0111\u01b0\u1ee3c x\u1eed l\u00fd khi pass v\u00e0o `json.Marshal/Unmarshal`.\n\n### 3.2 Unmarshaling and Marshaling\n\n```go\n// JSON \u2192 Go struct (Unmarshal)\nvar o Order\nerr := json.Unmarshal([]byte(jsonString), &o)\n\n// Go struct \u2192 JSON (Marshal)\nout, err := json.Marshal(o)\n// out l\u00e0 []byte\n```\n\n**T\u1ea1i sao `Unmarshal` d\u00f9ng pointer?** Cho ph\u00e9p t\u00e1i s\u1eed d\u1ee5ng struct, ki\u1ec3m so\u00e1t memory \u2014 gi\u1ed1ng `io.Reader.Read()`.\n\n### 3.3 JSON, Readers, and Writers\n\nD\u00f9ng `json.Encoder`/`json.Decoder` thay v\u00ec `Marshal`/`Unmarshal` khi l\u00e0m vi\u1ec7c v\u1edbi file/network:\n\n```go\n// Ghi JSON v\u00e0o file\nf, _ := os.Create(\"output.json\")\ndefer f.Close()\njson.NewEncoder(f).Encode(myStruct)\n\n// \u0110\u1ecdc JSON t\u1eeb file\nf2, _ := os.Open(\"output.json\")\ndefer f2.Close()\nvar result MyStruct\njson.NewDecoder(f2).Decode(&result)\n```\n\n> Hi\u1ec7u qu\u1ea3 h\u01a1n: kh\u00f4ng c\u1ea7n load to\u00e0n b\u1ed9 file v\u00e0o memory tr\u01b0\u1edbc.\n\n### 3.4 Encoding and Decoding JSON Streams\n\n\u0110\u1ecdc nhi\u1ec1u JSON object t\u1eeb stream:\n\n```go\n// streamData = nhi\u1ec1u JSON objects li\u00ean ti\u1ebfp (kh\u00f4ng ph\u1ea3i array)\n// {\"name\":\"Fred\",...}\\n{\"name\":\"Mary\",...}\\n...\n\ndec := json.NewDecoder(strings.NewReader(streamData))\nvar t Person\nfor {\n    err := dec.Decode(&t)\n    if errors.Is(err, io.EOF) {\n        break\n    }\n    if err != nil {\n        panic(err)\n    }\n    // x\u1eed l\u00fd t\n}\n```\n\n### 3.5 Custom JSON Parsing\n\nImplement `json.Marshaler` v\u00e0 `json.Unmarshaler` \u0111\u1ec3 custom format:\n\n```go\ntype RFC822ZTime struct {\n    time.Time   // embed time.Time \u0111\u1ec3 c\u00f3 c\u00e1c method\n}\n\nfunc (rt RFC822ZTime) MarshalJSON() ([]byte, error) {\n    out := rt.Time.Format(time.RFC822Z)\n    return []byte(`\"` + out + `\"`), nil\n}\n\nfunc (rt *RFC822ZTime) UnmarshalJSON(b []byte) error {\n    if string(b) == \"null\" {\n        return nil\n    }\n    t, err := time.Parse(`\"`+time.RFC822Z+`\"`, string(b))\n    if err != nil {\n        return err\n    }\n    *rt = RFC822ZTime{t}\n    return nil\n}\n```\n\n**Pattern tr\u00e1nh infinite loop khi marshal:**\n\n```go\nfunc (o Order) MarshalJSON() ([]byte, error) {\n    type Dup Order  // T\u1ea1o type m\u1edbi t\u1eeb Order \u2014 gi\u1ed1ng Order nh\u01b0ng KH\u00d4NG c\u00f3 MarshalJSON method\n    tmp := struct {\n        DateOrdered string `json:\"date_ordered\"`\n        Dup                 // embed Dup \u0111\u1ec3 l\u1ea5y t\u1ea5t c\u1ea3 fields c\u00f2n l\u1ea1i\n    }{\n        Dup: (Dup)(o),\n        DateOrdered: o.DateOrdered.Format(time.RFC822Z),\n    }\n    return json.Marshal(tmp)  // g\u1ecdi Marshal tr\u00ean Dup, kh\u00f4ng ph\u1ea3i Order \u2192 kh\u00f4ng loop\n}\n```\n\n> **Best practice:** \u0110\u1ecbnh ngh\u0129a 2 struct ri\u00eang \u2014 1 cho JSON wire format, 1 cho business logic. Copy qua l\u1ea1i. Gi\u1eef business logic \u0111\u1ed9c l\u1eadp v\u1edbi format.\n\n---\n\n## 4. net/http\n\n### 4.1 The Client\n\n```go\n// T\u1ea1o client ri\u00eang v\u1edbi timeout \u2014 KH\u00d4NG d\u00f9ng http.DefaultClient\nclient := &http.Client{\n    Timeout: 30 * time.Second,\n}\n\n// T\u1ea1o request v\u1edbi context\nreq, err := http.NewRequestWithContext(\n    context.Background(),\n    http.MethodGet,\n    \"https://api.example.com/data\",\n    nil,  // body (d\u00f9ng strings.NewReader(\"...\") cho POST/PUT)\n)\nreq.Header.Add(\"Authorization\", \"Bearer token123\")\n\n// Th\u1ef1c hi\u1ec7n request\nres, err := client.Do(req)\ndefer res.Body.Close()  // QUAN TR\u1eccNG: lu\u00f4n close body\n\nif res.StatusCode != http.StatusOK {\n    // handle error\n}\n\n// Decode JSON response\nvar data MyStruct\njson.NewDecoder(res.Body).Decode(&data)\n```\n\n> **C\u1ea3nh b\u00e1o:** C\u00e1c function ti\u1ec7n l\u1ee3i `http.Get()`, `http.Post()` d\u00f9ng `DefaultClient` \u2014 kh\u00f4ng c\u00f3 timeout. **Kh\u00f4ng d\u00f9ng trong production.**\n\n### 4.2 The Server\n\n```go\n// Handler interface\ntype Handler interface {\n    ServeHTTP(http.ResponseWriter, *http.Request)\n}\n\n// ResponseWriter: g\u1ecdi theo th\u1ee9 t\u1ef1: Header() \u2192 WriteHeader() \u2192 Write()\ntype HelloHandler struct{}\nfunc (h HelloHandler) ServeHTTP(w http.ResponseWriter, r *http.Request) {\n    w.Header().Set(\"Content-Type\", \"text/plain\")\n    // WriteHeader t\u1ef1 \u0111\u1ed9ng g\u1ecdi n\u1ebfu b\u1ecf qua (status 200)\n    w.Write([]byte(\"Hello!\"))\n}\n\n// Server v\u1edbi \u0111\u1ea7y \u0111\u1ee7 timeout\ns := http.Server{\n    Addr:         \":8080\",\n    ReadTimeout:  30 * time.Second,\n    WriteTimeout: 90 * time.Second,\n    IdleTimeout:  120 * time.Second,\n    Handler:      mux,\n}\ns.ListenAndServe()\n```\n\n**ServeMux \u2014 request router:**\n\n```go\nmux := http.NewServeMux()\n\n// Go 1.22+: h\u1ed7 tr\u1ee3 HTTP method v\u00e0 path variables\nmux.HandleFunc(\"GET /hello/{name}\", func(w http.ResponseWriter, r *http.Request) {\n    name := r.PathValue(\"name\")\n    w.Write([]byte(\"Hello, \" + name + \"!\"))\n})\n\nmux.HandleFunc(\"POST /user\", createUserHandler)\n```\n\n**Nesting ServeMux:**\n\n```go\napi := http.NewServeMux()\napi.HandleFunc(\"/users\", usersHandler)\napi.HandleFunc(\"/posts\", postsHandler)\n\nmux := http.NewServeMux()\nmux.Handle(\"/api/\", http.StripPrefix(\"/api\", api))\n// /api/users \u2192 usersHandler\n// /api/posts \u2192 postsHandler\n```\n\n> **\u0110\u1eebng d\u00f9ng** `http.DefaultServeMux` \u2014 shared state, kh\u00f3 ki\u1ec3m so\u00e1t, third-party lib c\u00f3 th\u1ec3 register v\u00e0o \u0111\u00f3.\n\n### 4.3 Middleware\n\nMiddleware trong Go l\u00e0 **h\u00e0m nh\u1eadn `http.Handler`, tr\u1ea3 v\u1ec1 `http.Handler`**:\n\n```go\n// Middleware \u0111\u01a1n gi\u1ea3n: timing\nfunc RequestTimer(h http.Handler) http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n        start := time.Now()\n        h.ServeHTTP(w, r)           // g\u1ecdi handler ti\u1ebfp theo\n        dur := time.Since(start)\n        slog.Info(\"request time\", \"path\", r.URL.Path, \"duration\", dur)\n    })\n}\n\n// Configurable middleware: factory function tr\u1ea3 v\u1ec1 middleware\nfunc TerribleSecurityProvider(password string) func(http.Handler) http.Handler {\n    return func(h http.Handler) http.Handler {\n        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n            if r.Header.Get(\"X-Secret-Password\") != password {\n                w.WriteHeader(http.StatusUnauthorized)\n                return\n            }\n            h.ServeHTTP(w, r)\n        })\n    }\n}\n```\n\n**Chaining middleware:**\n\n```go\nterribleSecurity := TerribleSecurityProvider(\"GOPHER\")\n\n// Handler \u2192 RequestTimer \u2192 terribleSecurity \u2192 client\nmux.Handle(\"/hello\", terribleSecurity(RequestTimer(myHandler)))\n\n// Ho\u1eb7c apply cho to\u00e0n b\u1ed9 mux\nwrappedMux := terribleSecurity(RequestTimer(mux))\ns := http.Server{Handler: wrappedMux}\n```\n\n> **So s\u00e1nh Java:** Gi\u1ed1ng `Filter` trong Jakarta EE hay `HandlerInterceptor` trong Spring, nh\u01b0ng kh\u00f4ng c\u1ea7n framework \u2014 ch\u1ec9 l\u00e0 function composition.\n\n### 4.4 ResponseController\n\nGo 1.20 th\u00eam `http.ResponseController` \u0111\u1ec3 expose optional functionality m\u00e0 kh\u00f4ng ph\u00e1 v\u1ee1 interface:\n\n```go\nfunc handler(rw http.ResponseWriter, req *http.Request) {\n    rc := http.NewResponseController(rw)\n    for i := 0; i < 10; i++ {\n        result := doStuff(i)\n        rw.Write([]byte(result))\n        err := rc.Flush()  // stream data ngay cho client\n        if err != nil && !errors.Is(err, http.ErrNotSupported) {\n            return\n        }\n    }\n}\n```\n\n---\n\n## 5. Structured Logging \u2014 log/slog\n\nGo 1.21 th\u00eam `log/slog` \u2014 structured logging chu\u1ea9n.\n\n### D\u00f9ng nhanh v\u1edbi default logger\n\n```go\nslog.Debug(\"debug message\")\nslog.Info(\"user login\", \"id\", userID, \"count\", loginCount)\nslog.Warn(\"low memory\", \"available_mb\", 50)\nslog.Error(\"failed to connect\", \"err\", err)\n\n// Output: 2023/04/20 23:36:38 INFO user login id=fred login_count=20\n```\n\n### Custom logger v\u1edbi JSON output\n\n```go\nopts := &slog.HandlerOptions{Level: slog.LevelDebug}\nhandler := slog.NewJSONHandler(os.Stderr, opts)\nlogger := slog.New(handler)\n\nlogger.Info(\"request processed\",\n    \"user_id\", 123,\n    \"duration_ms\", 45,\n)\n// {\"time\":\"...\",\"level\":\"INFO\",\"msg\":\"request processed\",\"user_id\":123,\"duration_ms\":45}\n```\n\n### High-performance logging v\u1edbi LogAttrs\n\n```go\n// Ch\u1eadm h\u01a1n (nhi\u1ec1u allocation)\nslog.Info(\"user action\", \"id\", userID, \"action\", \"login\")\n\n// Nhanh h\u01a1n \u2014 d\u00f9ng typed Attr\nlogger.LogAttrs(ctx, slog.LevelInfo, \"user action\",\n    slog.Int(\"id\", userID),\n    slog.String(\"action\", \"login\"),\n    slog.Time(\"at\", time.Now()),\n)\n```\n\n> **So s\u00e1nh Java:** Gi\u1ed1ng SLF4J + Logback v\u1edbi structured logging (MDC). Nh\u01b0ng trong Go, ch\u1ec9 c\u1ea7n 1 package chu\u1ea9n.\n\n---\n\n## 6. Exercises\n\n**Exercise 1** \u2014 Vi\u1ebft middleware t\u1ea1o context v\u1edbi timeout. Middleware nh\u1eadn s\u1ed1 milliseconds, tr\u1ea3 v\u1ec1 `func(http.Handler) http.Handler`.\n\n**Exercise 2** \u2014 G\u1ecdi API JSON v\u00e0 decode response. D\u00f9ng custom HTTP client v\u1edbi timeout.\n\n**Exercise 3** \u2014 Vi\u1ebft custom `json.Marshaler` cho type b\u1ea1n t\u1ef1 \u0111\u1ecbnh ngh\u0129a.\n\n---\n\n## T\u1ed5ng k\u1ebft\n\n| Package | M\u1ee5c \u0111\u00edch | Java t\u01b0\u01a1ng \u0111\u01b0\u01a1ng |\n|---|---|---|\n| `io` | Interface chu\u1ea9n cho I/O | `InputStream` / `OutputStream` |\n| `time` | Th\u1eddi gian, duration, timer | `java.time.*` |\n| `encoding/json` | JSON marshal/unmarshal | Jackson / Gson |\n| `net/http` client | HTTP requests | `HttpClient` (Java 11+) |\n| `net/http` server | HTTP server + routing | Spring MVC / Servlet |\n| `log/slog` | Structured logging | SLF4J + Logback |\n\n**Nguy\u00ean t\u1eafc thi\u1ebft k\u1ebf ti\u00eau bi\u1ec3u c\u1ee7a Go qua ch\u01b0\u01a1ng n\u00e0y:**\n1. Interface \u0111\u01a1n gi\u1ea3n (`io.Reader`, `io.Writer`) \u2192 d\u1ec5 compose, d\u1ec5 test.\n2. Explicit h\u01a1n implicit: struct tags \u0111\u01b0\u1ee3c x\u1eed l\u00fd khi b\u1ea1n g\u1ecdi h\u00e0m, kh\u00f4ng t\u1ef1 \u0111\u1ed9ng.\n3. Kh\u00f4ng d\u00f9ng shared state (`DefaultClient`, `DefaultServeMux`) trong production.\n4. Lu\u00f4n set timeout cho HTTP client/server.\n\n\n# Chapter 14 \u2014 The Context\n\n> T\u00e0i li\u1ec7u h\u1ecdc Go d\u00e0nh cho ng\u01b0\u1eddi chuy\u1ec3n t\u1eeb Java sang.  \n> B\u00e1m s\u00e1t n\u1ed9i dung s\u00e1ch *Learning Go* (2nd ed.) \u2014 Chapter 14.\n\n---\n\n## 1. What Is the Context?\n\n### B\u00e0i to\u00e1n: truy\u1ec1n metadata qua nhi\u1ec1u l\u1edbp\n\nServer c\u1ea7n truy\u1ec1n th\u00f4ng tin qua nhi\u1ec1u l\u1edbp x\u1eed l\u00fd:\n- **Request metadata**: tracking ID, user identity, locale\n- **Cancellation signal**: timeout, early cancel\n\nNg\u00f4n ng\u1eef kh\u00e1c d\u00f9ng **thread-local variables** (Java: `ThreadLocal`). Go kh\u00f4ng l\u00e0m v\u1eady v\u00ec goroutine kh\u00f4ng c\u00f3 identity, v\u00e0 v\u00ec `ThreadLocal` l\u00e0 \"magic\" \u2014 d\u1eef li\u1ec7u \u0111i v\u00e0o m\u1ed9t n\u01a1i, hi\u1ec7n ra \u1edf n\u01a1i kh\u00e1c.\n\n**Gi\u1ea3i ph\u00e1p c\u1ee7a Go:** Context \u2014 m\u1ed9t parameter th\u00f4ng th\u01b0\u1eddng, truy\u1ec1n **explicit** qua function call.\n\n### Context l\u00e0 g\u00ec?\n\n```go\n// Context ch\u1ec9 l\u00e0 m\u1ed9t interface\ntype Context interface {\n    Deadline() (deadline time.Time, ok bool)\n    Done() <-chan struct{}\n    Err() error\n    Value(key any) any\n}\n```\n\nContext l\u00e0 **immutable**. M\u1ed7i khi th\u00eam th\u00f4ng tin, b\u1ea1n t\u1ea1o ra **context con** bao b\u1ecdc context cha.\n\n```\ncontext.Background()   \u2190 root, kh\u00f4ng cancel \u0111\u01b0\u1ee3c\n    \u2514\u2500 WithValue(user)\n        \u2514\u2500 WithTimeout(5s)\n            \u2514\u2500 WithValue(requestID)  \u2190 context hi\u1ec7n t\u1ea1i\n```\n\n### Convention: Context l\u00e0 parameter \u0111\u1ea7u ti\u00ean, t\u00ean l\u00e0 `ctx`\n\n```go\n// Java \u2014 ThreadLocal, implicit\nThreadLocal<String> userContext = new ThreadLocal<>();\nuserContext.set(\"alice\");\n// ... code kh\u00e1c t\u1ef1 l\u1ea5y ra\n\n// Go \u2014 explicit parameter\nfunc logic(ctx context.Context, info string) (string, error) {\n    // ...\n}\n```\n\n### T\u1ea1o context\n\n```go\n// Root context \u2014 d\u00f9ng \u1edf entry point (main, CLI, top-level handler)\nctx := context.Background()\n\n// Placeholder trong development\nctx := context.TODO()  // Kh\u00f4ng d\u00f9ng trong production\n```\n\n### Context trong HTTP handler\n\nContext \u0111\u01b0\u1ee3c g\u1eafn v\u00e0o `*http.Request`. V\u00ec `context` \u0111\u01b0\u1ee3c th\u00eam v\u00e0o Go sau khi `net/http` \u0111\u00e3 c\u00f3, kh\u00f4ng th\u1ec3 thay \u0111\u1ed5i signature `http.Handler` \u2192 d\u00f9ng method thay th\u1ebf:\n\n```go\n// Middleware: \u0111\u1ecdc context \u2192 th\u00eam th\u00f4ng tin \u2192 t\u1ea1o request m\u1edbi\nfunc Middleware(handler http.Handler) http.Handler {\n    return http.HandlerFunc(func(rw http.ResponseWriter, req *http.Request) {\n        ctx := req.Context()            // l\u1ea5y context t\u1eeb request\n        ctx = addStuffToContext(ctx)    // th\u00eam th\u00f4ng tin\n        req = req.WithContext(ctx)      // t\u1ea1o request m\u1edbi v\u1edbi context m\u1edbi\n        handler.ServeHTTP(rw, req)\n    })\n}\n\n// Handler: tr\u00edch xu\u1ea5t context v\u00e0 truy\u1ec1n v\u00e0o business logic\nfunc handler(rw http.ResponseWriter, req *http.Request) {\n    ctx := req.Context()\n    result, err := logic(ctx, req.FormValue(\"data\"))\n    // ...\n}\n```\n\n### Context khi g\u1ecdi HTTP service kh\u00e1c\n\n```go\nfunc callAnotherService(ctx context.Context, data string) (string, error) {\n    // Truy\u1ec1n context v\u00e0o request \u2014 HTTP client t\u1ef1 cancel khi ctx b\u1ecb cancel\n    req, err := http.NewRequestWithContext(ctx, http.MethodGet,\n        \"http://service.example.com?data=\"+data, nil)\n    if err != nil {\n        return \"\", err\n    }\n    resp, err := http.DefaultClient.Do(req)\n    // ...\n}\n```\n\n---\n\n## 2. Values\n\n### Khi n\u00e0o l\u01b0u gi\u00e1 tr\u1ecb v\u00e0o context?\n\n**N\u00ean d\u00f9ng:**\n- Th\u00f4ng tin qu\u1ea3n l\u00fd \u1ee9ng d\u1ee5ng (tracking GUID, request ID)\n- Data k\u1ef9 thu\u1eadt c\u1ea7n truy\u1ec1n qua middleware chains (user t\u1eeb JWT)\n- Th\u00f4ng tin **kh\u00f4ng ph\u1ea3i** business logic\n\n**Kh\u00f4ng n\u00ean d\u00f9ng:**\n- Business parameters \u2014 d\u00f9ng explicit function parameters\n- D\u00f9ng context \u0111\u1ec3 \"l\u00e9n\" truy\u1ec1n data past API\n\n### context.WithValue \u2014 key ph\u1ea3i unique\n\n```go\n// SAI \u2014 string key c\u00f3 th\u1ec3 b\u1ecb collision gi\u1eefa c\u00e1c package\nctx = context.WithValue(ctx, \"user\", userID)\n\n// \u0110\u00daNG \u2014 d\u00f9ng unexported type \u0111\u1ec3 key l\u00e0 unique\ntype userKey int\nconst (\n    _ userKey = iota\n    key\n)\n\nfunc ContextWithUser(ctx context.Context, user string) context.Context {\n    return context.WithValue(ctx, key, user)\n}\n\nfunc UserFromContext(ctx context.Context) (string, bool) {\n    user, ok := ctx.Value(key).(string)\n    return user, ok\n}\n```\n\n**Ho\u1eb7c d\u00f9ng empty struct:**\n\n```go\ntype userKey struct{}\n\nfunc ContextWithUser(ctx context.Context, user string) context.Context {\n    return context.WithValue(ctx, userKey{}, user)\n}\n```\n\n**Naming convention:**\n- Function t\u1ea1o context: `ContextWith[Name]`\n- Function \u0111\u1ecdc t\u1eeb context: `[Name]FromContext`\n\n### V\u00ed d\u1ee5 th\u1ef1c t\u1ebf: User t\u1eeb cookie qua middleware\n\n```go\n// Middleware \u2014 \u0111\u1ecdc user t\u1eeb cookie, l\u01b0u v\u00e0o context\nfunc Middleware(h http.Handler) http.Handler {\n    return http.HandlerFunc(func(rw http.ResponseWriter, req *http.Request) {\n        user, err := extractUser(req)  // \u0111\u1ecdc t\u1eeb cookie/JWT\n        if err != nil {\n            rw.WriteHeader(http.StatusUnauthorized)\n            return\n        }\n        ctx := req.Context()\n        ctx = ContextWithUser(ctx, user)   // th\u00eam user v\u00e0o context\n        req = req.WithContext(ctx)\n        h.ServeHTTP(rw, req)\n    })\n}\n\n// Handler \u2014 tr\u00edch xu\u1ea5t user v\u00e0 pass v\u00e0o business logic\nfunc (c Controller) DoLogic(rw http.ResponseWriter, req *http.Request) {\n    ctx := req.Context()\n    user, ok := identity.UserFromContext(ctx)\n    if !ok {\n        rw.WriteHeader(http.StatusInternalServerError)\n        return\n    }\n    // Truy\u1ec1n user explicit v\u00e0o business logic\n    result, err := c.Logic.BusinessLogic(ctx, user, req.URL.Query().Get(\"data\"))\n    // ...\n}\n```\n\n### V\u00ed d\u1ee5: GUID tracking xuy\u00ean services\n\n```go\n// Middleware: t\u1ea1o ho\u1eb7c propagate GUID\nfunc Middleware(h http.Handler) http.Handler {\n    return http.HandlerFunc(func(rw http.ResponseWriter, req *http.Request) {\n        ctx := req.Context()\n        guid := req.Header.Get(\"X-GUID\")\n        if guid == \"\" {\n            guid = uuid.New().String()  // t\u1ea1o m\u1edbi n\u1ebfu ch\u01b0a c\u00f3\n        }\n        ctx = contextWithGUID(ctx, guid)\n        req = req.WithContext(ctx)\n        h.ServeHTTP(rw, req)\n    })\n}\n\n// Logger t\u1ef1 \u0111\u1ed9ng \u0111\u00ednh GUID v\u00e0o log\nfunc (Logger) Log(ctx context.Context, message string) {\n    if guid, ok := guidFromContext(ctx); ok {\n        message = \"GUID: \" + guid + \" - \" + message\n    }\n    fmt.Println(message)\n}\n\n// Khi g\u1ecdi service kh\u00e1c: \u0111\u00ednh GUID v\u00e0o header\nfunc Request(req *http.Request) *http.Request {\n    ctx := req.Context()\n    if guid, ok := guidFromContext(ctx); ok {\n        req.Header.Add(\"X-GUID\", guid)\n    }\n    return req\n}\n```\n\nBusiness logic ho\u00e0n to\u00e0n kh\u00f4ng bi\u1ebft \u0111\u1ebfn GUID \u2014 concern separation t\u1ed1t.\n\n---\n\n## 3. Cancellation\n\n### V\u1ea5n \u0111\u1ec1: d\u1eebng goroutine khi m\u1ed9t trong nhi\u1ec1u requests th\u1ea5t b\u1ea1i\n\n```\nRequest \u2192 launch goroutine A (call service A)\n        \u2192 launch goroutine B (call service B)\n        \nN\u1ebfu A th\u1ea5t b\u1ea1i \u2192 mu\u1ed1n B c\u0169ng d\u1eebng\n```\n\n### context.WithCancel\n\n```go\nctx, cancelFunc := context.WithCancel(context.Background())\ndefer cancelFunc()  // LU\u00d4N ph\u1ea3i g\u1ecdi, k\u1ec3 c\u1ea3 khi kh\u00f4ng c\u00f3 l\u1ed7i\n```\n\n**C\u00e1ch detect cancellation:** \u0110\u1ecdc channel t\u1eeb `ctx.Done()`:\n\n```go\nselect {\ncase result := <-workChan:\n    // x\u1eed l\u00fd k\u1ebft qu\u1ea3\ncase <-ctx.Done():\n    return ctx.Err()  // context.Canceled ho\u1eb7c context.DeadlineExceeded\n}\n```\n\n### V\u00ed d\u1ee5 ho\u00e0n ch\u1ec9nh: cancel khi c\u00f3 l\u1ed7i t\u1eeb b\u1ea5t k\u1ef3 goroutine n\u00e0o\n\n```go\nctx, cancelFunc := context.WithCancel(context.Background())\ndefer cancelFunc()\n\nch := make(chan string)\nvar wg sync.WaitGroup\nwg.Add(2)\n\n// Goroutine g\u1ecdi service A\ngo func() {\n    defer wg.Done()\n    for {\n        resp, err := makeRequest(ctx, \"http://service-a.example.com\")\n        if err != nil {\n            cancelFunc()  // signal c\u00e1c goroutine kh\u00e1c d\u1eebng\n            return\n        }\n        if resp.StatusCode == http.StatusInternalServerError {\n            cancelFunc()\n            return\n        }\n        select {\n        case ch <- \"success from A\":\n        case <-ctx.Done():\n            return\n        }\n    }\n}()\n\n// Goroutine g\u1ecdi service B (t\u01b0\u01a1ng t\u1ef1)\ngo func() { /* ... */ }()\n\n// Main loop\nloop:\nfor {\n    select {\n    case s := <-ch:\n        fmt.Println(s)\n    case <-ctx.Done():\n        fmt.Println(\"cancelled!\")\n        break loop\n    }\n}\nwg.Wait()\n```\n\n### WithCancelCause \u2014 truy\u1ec1n l\u1ed7i k\u00e8m theo cancel\n\n```go\nctx, cancelFunc := context.WithCancelCause(context.Background())\ndefer cancelFunc(nil)\n\n// Goroutine cancel v\u1edbi l\u1ed7i c\u1ee5 th\u1ec3\ncancelFunc(errors.New(\"service A returned 500\"))\n\n// \u0110\u1ecdc l\u1ed7i g\u1ed1c\ncause := context.Cause(ctx)     // l\u1ed7i \u0111\u1ea7u ti\u00ean \u0111\u01b0\u1ee3c pass v\u00e0o cancelFunc\nerr := ctx.Err()                // context.Canceled (n\u1ebfu manual cancel)\n                                // context.DeadlineExceeded (n\u1ebfu timeout)\n```\n\n> **L\u01b0u \u00fd:** `Cause` l\u00e0 function, kh\u00f4ng ph\u1ea3i method \u2014 v\u00ec \u0111\u01b0\u1ee3c th\u00eam v\u00e0o Go 1.20, sau khi `context.Context` interface \u0111\u00e3 stable. Th\u00eam method m\u1edbi v\u00e0o interface s\u1ebd ph\u00e1 v\u1ee1 backward compatibility.\n\n---\n\n## 4. Contexts with Deadlines\n\n### context.WithTimeout vs context.WithDeadline\n\n```go\n// Timeout: sau n th\u1eddi gian k\u1ec3 t\u1eeb b\u00e2y gi\u1edd\nctx, cancel := context.WithTimeout(parentCtx, 5*time.Second)\ndefer cancel()\n\n// Deadline: t\u1ea1i th\u1eddi \u0111i\u1ec3m c\u1ee5 th\u1ec3\ndeadline := time.Now().Add(5 * time.Second)\nctx, cancel := context.WithDeadline(parentCtx, deadline)\ndefer cancel()\n```\n\n### Context l\u1ed3ng nhau \u2014 child b\u1ecb bounded b\u1edfi parent\n\n```go\nparent, cancel1 := context.WithTimeout(ctx, 2*time.Second)\ndefer cancel1()\n\nchild, cancel2 := context.WithTimeout(parent, 3*time.Second)\ndefer cancel2()\n\n// child timeout = min(3s, 2s) = 2s (bounded b\u1edfi parent)\n<-child.Done()  // x\u1ea3y ra sau 2 gi\u00e2y, kh\u00f4ng ph\u1ea3i 3 gi\u00e2y\n```\n\n**\u1ee8ng d\u1ee5ng th\u1ef1c t\u1ebf:** Ph\u00e2n b\u1ed5 budget th\u1eddi gian:\n\n```go\n// T\u1ed5ng request: 100ms\n// G\u1ecdi service A: 40ms\n// G\u1ecdi service B: 40ms\n// C\u00f2n l\u1ea1i cho processing: 20ms\n\nfunc handleRequest(ctx context.Context) error {\n    ctx, cancel := context.WithTimeout(ctx, 100*time.Millisecond)\n    defer cancel()\n\n    ctxA, cancelA := context.WithTimeout(ctx, 40*time.Millisecond)\n    defer cancelA()\n    resultA, err := callServiceA(ctxA)\n    if err != nil { return err }\n\n    ctxB, cancelB := context.WithTimeout(ctx, 40*time.Millisecond)\n    defer cancelB()\n    resultB, err := callServiceB(ctxB)\n    if err != nil { return err }\n\n    return process(ctx, resultA, resultB)\n}\n```\n\n### Ki\u1ec3m tra l\u00fd do cancel\n\n```go\nctx.Err()  // nil n\u1ebfu c\u00f2n active\n           // context.Canceled \u2014 b\u1ecb cancel ch\u1ee7 \u0111\u1ed9ng\n           // context.DeadlineExceeded \u2014 h\u1ebft timeout\n\n// Check deadline\ndeadline, hasDeadline := ctx.Deadline()\n```\n\n### K\u1ebft h\u1ee3p WithTimeout v\u00e0 WithCancelCause\n\n```go\n// Mu\u1ed1n v\u1eeba c\u00f3 timeout v\u1eeba c\u00f3 custom error\nctx, cancelParent := context.WithTimeout(context.Background(), 3*time.Second)\ndefer cancelParent()\nctx, cancelWithCause := context.WithCancelCause(ctx)\ndefer cancelWithCause(nil)\n\n// Khi cancel v\u1edbi l\u1ed7i:\ncancelWithCause(errors.New(\"bad status\"))\n\n// Khi timeout:\n// context.Cause(ctx) \u2192 context.DeadlineExceeded\n// ctx.Err() \u2192 context.DeadlineExceeded\n```\n\n---\n\n## 5. Context Cancellation in Your Own Code\n\nH\u1ea7u h\u1ebft th\u1eddi gian kh\u00f4ng c\u1ea7n x\u1eed l\u00fd cancellation trong code ri\u00eang \u2014 HTTP client, DB driver t\u1ef1 x\u1eed l\u00fd khi nh\u1eadn context.\n\n**2 tr\u01b0\u1eddng h\u1ee3p c\u1ea7n t\u1ef1 x\u1eed l\u00fd:**\n\n### Tr\u01b0\u1eddng h\u1ee3p 1: Code d\u00f9ng select v\u1edbi channels\n\n```go\nfunc processData(ctx context.Context, in <-chan Data) error {\n    for {\n        select {\n        case data, ok := <-in:\n            if !ok {\n                return nil\n            }\n            processOne(data)\n        case <-ctx.Done():\n            return ctx.Err()  // tho\u00e1t s\u1ea1ch\n        }\n    }\n}\n```\n\n### Tr\u01b0\u1eddng h\u1ee3p 2: Computation l\u00e2u \u2014 ki\u1ec3m tra \u0111\u1ecbnh k\u1ef3\n\n```go\nfunc longRunningComputation(ctx context.Context, data string) (string, error) {\n    for {\n        // ... x\u1eed l\u00fd m\u1ed9t ph\u1ea7n ...\n\n        // Ki\u1ec3m tra \u0111\u1ecbnh k\u1ef3\n        if err := context.Cause(ctx); err != nil {\n            return partialResult, err\n        }\n\n        // ... ti\u1ebfp t\u1ee5c ...\n    }\n}\n```\n\n**V\u00ed d\u1ee5 th\u1ef1c t\u1ebf: t\u00ednh \u03c0 v\u1edbi Leibniz, cho ph\u00e9p cancel:**\n\n```go\nfunc computePi(ctx context.Context) (string, error) {\n    var sum, d big.Float\n    d.SetInt64(1)\n    two := big.NewFloat(2)\n\n    for i := 0; ; i++ {\n        if err := context.Cause(ctx); err != nil {\n            fmt.Printf(\"cancelled after %d iterations\\n\", i)\n            return sum.Text('g', 100), err\n        }\n        // ... Leibniz algorithm ...\n    }\n}\n```\n\n---\n\n## 6. Exercises\n\n**Exercise 1** \u2014 Vi\u1ebft middleware-generating function t\u1ea1o context v\u1edbi timeout:\n\n```go\nfunc TimeoutMiddleware(ms int) func(http.Handler) http.Handler {\n    return func(h http.Handler) http.Handler {\n        return http.HandlerFunc(func(rw http.ResponseWriter, req *http.Request) {\n            ctx, cancel := context.WithTimeout(req.Context(),\n                time.Duration(ms)*time.Millisecond)\n            defer cancel()\n            req = req.WithContext(ctx)\n            h.ServeHTTP(rw, req)\n        })\n    }\n}\n```\n\n**Exercise 2** \u2014 C\u1ed9ng s\u1ed1 ng\u1eabu nhi\u00ean cho \u0111\u1ebfn khi g\u1eb7p 1234 ho\u1eb7c 2 gi\u00e2y:\n\n```go\nfunc sumUntilCondition() {\n    ctx, cancel := context.WithTimeout(context.Background(), 2*time.Second)\n    defer cancel()\n\n    var sum, iterations int\n    reason := \"\"\n    rand.Seed(time.Now().UnixNano())\n\n    for {\n        if err := context.Cause(ctx); err != nil {\n            reason = \"timeout\"\n            break\n        }\n        n := rand.Intn(100_000_000)\n        sum += n\n        iterations++\n        if n == 1234 {\n            reason = \"found 1234\"\n            break\n        }\n    }\n    fmt.Printf(\"sum=%d, iterations=%d, reason=%s\\n\", sum, iterations, reason)\n}\n```\n\n**Exercise 3** \u2014 Log level qua context:\n\n```go\ntype Level string\nconst (\n    Debug Level = \"debug\"\n    Info  Level = \"info\"\n)\n\ntype logLevelKey struct{}\n\nfunc ContextWithLogLevel(ctx context.Context, level Level) context.Context {\n    return context.WithValue(ctx, logLevelKey{}, level)\n}\n\nfunc LogLevelFromContext(ctx context.Context) (Level, bool) {\n    level, ok := ctx.Value(logLevelKey{}).(Level)\n    return level, ok\n}\n\nfunc Log(ctx context.Context, level Level, message string) {\n    inLevel, ok := LogLevelFromContext(ctx)\n    if !ok {\n        return\n    }\n    if level == Debug && inLevel == Debug {\n        fmt.Println(message)\n    }\n    if level == Info && (inLevel == Debug || inLevel == Info) {\n        fmt.Println(message)\n    }\n}\n```\n\n---\n\n## T\u1ed5ng k\u1ebft\n\n| T\u00ecnh hu\u1ed1ng | D\u00f9ng g\u00ec | Java t\u01b0\u01a1ng \u0111\u01b0\u01a1ng |\n|---|---|---|\n| Truy\u1ec1n metadata qua layers | `context.WithValue` | `ThreadLocal` (nh\u01b0ng explicit h\u01a1n) |\n| Cancel khi c\u00f3 l\u1ed7i | `context.WithCancel` | `CompletableFuture.cancel()` |\n| Cancel v\u1edbi error cause | `context.WithCancelCause` | N/A |\n| Timeout c\u1ed1 \u0111\u1ecbnh | `context.WithTimeout` | `Future.get(timeout)` |\n| Deadline tuy\u1ec7t \u0111\u1ed1i | `context.WithDeadline` | `ScheduledFuture` |\n| Detect cancellation | `ctx.Done()` channel | `Thread.isInterrupted()` |\n| L\u00fd do cancel | `ctx.Err()` / `context.Cause(ctx)` | `CancellationException` |\n\n**Nguy\u00ean t\u1eafc v\u00e0ng:**\n1. Context l\u00e0 parameter **\u0111\u1ea7u ti\u00ean**, t\u00ean l\u00e0 `ctx`.\n2. Lu\u00f4n `defer cancel()` ngay sau khi t\u1ea1o context c\u00f3 cancel.\n3. Kh\u00f4ng l\u01b0u context v\u00e0o struct \u2014 pass qua parameter.\n4. D\u00f9ng context cho metadata k\u1ef9 thu\u1eadt, kh\u00f4ng cho business logic.\n5. Key c\u1ee7a context ph\u1ea3i unexported type \u0111\u1ec3 tr\u00e1nh collision gi\u1eefa packages.\n\n\n# Chapter 15 \u2014 Writing Tests\n\n> T\u00e0i li\u1ec7u h\u1ecdc Go d\u00e0nh cho ng\u01b0\u1eddi chuy\u1ec3n t\u1eeb Java sang.  \n> B\u00e1m s\u00e1t n\u1ed9i dung s\u00e1ch *Learning Go* (2nd ed.) \u2014 Chapter 15.\n\n---\n\n## 1. Understanding the Basics of Testing\n\n### C\u1ea5u tr\u00fac test file\n\n- Test file: `foo_test.go` (n\u1eb1m c\u00f9ng th\u01b0 m\u1ee5c v\u1edbi `foo.go`)\n- Test function: b\u1eaft \u0111\u1ea7u b\u1eb1ng `Test`, nh\u1eadn `*testing.T`\n- Ch\u1ea1y test: `go test`\n\n```go\n// adder.go\nfunc addNumbers(x, y int) int {\n    return x + y\n}\n\n// adder_test.go\nfunc Test_addNumbers(t *testing.T) {\n    result := addNumbers(2, 3)\n    if result != 5 {\n        t.Error(\"incorrect result: expected 5, got\", result)\n    }\n}\n```\n\n### Ch\u1ea1y test\n\n```bash\ngo test                  # ch\u1ea1y test trong th\u01b0 m\u1ee5c hi\u1ec7n t\u1ea1i\ngo test ./...            # ch\u1ea1y t\u1ea5t c\u1ea3 packages trong project\ngo test -v               # verbose output\ngo test -run TestFoo     # ch\u1ec9 ch\u1ea1y test matching regex \"TestFoo\"\ngo test -count=1         # force rerun (b\u1ecf qua cache)\n```\n\n> **So s\u00e1nh Java:** Kh\u00f4ng c\u1ea7n JUnit dependency hay Maven plugin. `go test` l\u00e0 built-in tool, test n\u1eb1m c\u00f9ng package v\u1edbi production code.\n\n---\n\n## 2. Reporting Test Failures\n\n| Method | H\u00e0nh vi |\n|---|---|\n| `t.Error(args...)` | Log failure, **ti\u1ebfp t\u1ee5c ch\u1ea1y** test |\n| `t.Errorf(fmt, args...)` | Nh\u01b0 Error nh\u01b0ng d\u00f9ng format string |\n| `t.Fatal(args...)` | Log failure, **d\u1eebng ngay** test function |\n| `t.Fatalf(fmt, args...)` | Nh\u01b0 Fatal nh\u01b0ng d\u00f9ng format string |\n| `t.Log(args...)` | Log message (hi\u1ec7n khi test fail ho\u1eb7c -v) |\n\n```go\nfunc TestProcessData(t *testing.T) {\n    result, err := processData(nil)\n\n    // D\u00f9ng Fatal n\u1ebfu l\u1ed7i n\u00e0y l\u00e0m c\u00e1c check ti\u1ebfp theo v\u00f4 ngh\u0129a\n    if err != nil {\n        t.Fatalf(\"unexpected error: %v\", err)\n    }\n\n    // D\u00f9ng Error \u0111\u1ec3 report nhi\u1ec1u l\u1ed7i c\u00f9ng l\u00fac\n    if result.Name != \"expected\" {\n        t.Errorf(\"Name: expected %q, got %q\", \"expected\", result.Name)\n    }\n    if result.Count != 5 {\n        t.Errorf(\"Count: expected 5, got %d\", result.Count)\n    }\n}\n```\n\n---\n\n## 3. Setting Up and Tearing Down\n\n### TestMain \u2014 setup/teardown to\u00e0n b\u1ed9 package\n\n```go\nvar testDB *sql.DB\n\nfunc TestMain(m *testing.M) {\n    // Setup tr\u01b0\u1edbc khi ch\u1ea1y tests\n    testDB = setupTestDatabase()\n\n    exitCode := m.Run()  // ch\u1ea1y t\u1ea5t c\u1ea3 tests\n\n    // Cleanup sau khi t\u1ea5t c\u1ea3 tests xong\n    testDB.Close()\n    os.Exit(exitCode)\n}\n```\n\n> Ch\u1ec9 c\u00f3 **1 TestMain** per package. Th\u01b0\u1eddng d\u00f9ng khi c\u1ea7n k\u1ebft n\u1ed1i database ho\u1eb7c setup external resources.\n\n### t.Cleanup \u2014 cleanup theo t\u1eebng test\n\n```go\n// Helper function \u2014 \u0111\u0103ng k\u00fd cleanup thay v\u00ec return cleanup func\nfunc createFile(t *testing.T) string {\n    f, err := os.Create(\"tempFile\")\n    if err != nil {\n        t.Fatal(err)\n    }\n    f.Close()\n\n    // T\u1ef1 \u0111\u1ed9ng x\u00f3a file khi test k\u1ebft th\u00fac\n    t.Cleanup(func() {\n        os.Remove(f.Name())\n    })\n\n    return f.Name()\n}\n\nfunc TestFileProcessing(t *testing.T) {\n    fname := createFile(t)\n    // D\u00f9ng fname... kh\u00f4ng c\u1ea7n lo cleanup\n}\n```\n\n### t.TempDir \u2014 th\u01b0 m\u1ee5c t\u1ea1m t\u1ef1 d\u1ecdn d\u1eb9p\n\n```go\nfunc TestFileProcessing(t *testing.T) {\n    tempDir := t.TempDir()  // t\u1ef1 \u0111\u1ed9ng x\u00f3a khi test xong\n    fname := filepath.Join(tempDir, \"test.txt\")\n    // ...\n}\n```\n\n---\n\n## 4. Testing with Environment Variables\n\n```go\nfunc TestEnvVarProcess(t *testing.T) {\n    t.Setenv(\"OUTPUT_FORMAT\", \"JSON\")\n    // T\u1ef1 \u0111\u1ed9ng restore v\u1ec1 gi\u00e1 tr\u1ecb c\u0169 khi test xong\n\n    cfg := ProcessEnvVars()\n    if cfg.OutputFormat != \"JSON\" {\n        t.Error(\"OutputFormat not set correctly\")\n    }\n}\n```\n\n> **L\u01b0u \u00fd:** Kh\u00f4ng d\u00f9ng `t.Setenv` k\u1ebft h\u1ee3p v\u1edbi `t.Parallel()` \u2014 s\u1ebd panic.\n\n---\n\n## 5. Storing Sample Test Data\n\n- \u0110\u1eb7t file test data v\u00e0o th\u01b0 m\u1ee5c `testdata/`\n- Go reserve th\u01b0 m\u1ee5c n\u00e0y, kh\u00f4ng build v\u00e0o binary\n- `go test` ch\u1ea1y trong th\u01b0 m\u1ee5c c\u1ee7a package \u2192 d\u00f9ng relative path\n\n```go\nfunc TestLoadConfig(t *testing.T) {\n    // relative path t\u1eeb package directory\n    data, err := os.ReadFile(\"testdata/config.json\")\n    if err != nil {\n        t.Fatal(err)\n    }\n    // ...\n}\n```\n\n**Caching:** Go cache k\u1ebft qu\u1ea3 test. Tests ch\u1ec9 rerun khi source ho\u1eb7c `testdata/` thay \u0111\u1ed5i.\n\n---\n\n## 6. Testing Your Public API\n\nTest ch\u1ec9 public API b\u1eb1ng `packagename_test` suffix:\n\n```go\n// pubadder/add.go\npackage pubadder\n\nfunc AddNumbers(x, y int) int {\n    return x + y\n}\n\n// pubadder/add_public_test.go \u2014 package kh\u00e1c!\np
