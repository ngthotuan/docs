ackage pubadder_test  // _test suffix\n\nimport (\n    \"testing\"\n    \"github.com/myproject/pubadder\"  // ph\u1ea3i import explicitly\n)\n\nfunc TestAddNumbers(t *testing.T) {\n    result := pubadder.AddNumbers(2, 3)  // ch\u1ec9 c\u00f3 th\u1ec3 d\u00f9ng exported API\n    if result != 5 {\n        t.Errorf(\"expected 5, got %d\", result)\n    }\n}\n```\n\n> **L\u1ee3i \u00edch:** Bu\u1ed9c b\u1ea1n test qua public API nh\u01b0 m\u1ed9t user th\u1eadt \u2014 \"black box\" testing.\n\n---\n\n## 7. Using go-cmp to Compare Test Results\n\n`go-cmp` c\u1ee7a Google so s\u00e1nh struct v\u00e0 hi\u1ec3n th\u1ecb diff r\u00f5 r\u00e0ng:\n\n```go\nimport \"github.com/google/go-cmp/cmp\"\n\nfunc TestCreatePerson(t *testing.T) {\n    expected := Person{Name: \"Dennis\", Age: 37}\n    result := CreatePerson(\"Dennis\", 37)\n\n    if diff := cmp.Diff(expected, result); diff != \"\" {\n        t.Error(diff)  // hi\u1ec3n th\u1ecb field n\u00e0o kh\u00e1c nhau\n    }\n}\n```\n\nOutput khi c\u00f3 diff:\n\n```\n  ch13_cmp.Person{\n      Name: \"Dennis\",\n      Age:  37,\n  -   DateAdded: s\"0001-01-01 00:00:00 +0000 UTC\",\n  +   DateAdded: s\"2024-03-01 22:53:58...\",\n  }\n```\n\n**Custom comparator** khi c\u1ea7n ignore m\u1ed9t s\u1ed1 fields:\n\n```go\ncomparer := cmp.Comparer(func(x, y Person) bool {\n    return x.Name == y.Name && x.Age == y.Age  // ignore DateAdded\n})\n\nif diff := cmp.Diff(expected, result, comparer); diff != \"\" {\n    t.Error(diff)\n}\n```\n\n> **So s\u00e1nh Java:** Gi\u1ed1ng AssertJ's `assertThat(result).usingRecursiveComparison()` nh\u01b0ng kh\u00f4ng c\u1ea7n chaining syntax.\n\n---\n\n## 8. Running Table Tests\n\nPattern chu\u1ea9n c\u1ee7a Go \u2014 thay v\u00ec vi\u1ebft nhi\u1ec1u test function:\n\n```go\nfunc TestDoMath(t *testing.T) {\n    data := []struct {\n        name     string\n        num1     int\n        num2     int\n        op       string\n        expected int\n        errMsg   string\n    }{\n        {\"addition\",       2, 2, \"+\", 4, \"\"},\n        {\"subtraction\",    2, 2, \"-\", 0, \"\"},\n        {\"multiplication\", 2, 2, \"*\", 4, \"\"},\n        {\"division\",       2, 2, \"/\", 1, \"\"},\n        {\"div_by_zero\",    2, 0, \"/\", 0, \"division by zero\"},\n        {\"bad_op\",         2, 2, \"?\", 0, \"unknown operator ?\"},\n    }\n\n    for _, d := range data {\n        t.Run(d.name, func(t *testing.T) {\n            result, err := DoMath(d.num1, d.num2, d.op)\n\n            if result != d.expected {\n                t.Errorf(\"Expected %d, got %d\", d.expected, result)\n            }\n\n            var errMsg string\n            if err != nil {\n                errMsg = err.Error()\n            }\n            if errMsg != d.errMsg {\n                t.Errorf(\"Expected error %q, got %q\", d.errMsg, errMsg)\n            }\n        })\n    }\n}\n```\n\n**Ch\u1ea1y subtest c\u1ee5 th\u1ec3:**\n\n```bash\ngo test -run TestDoMath/division\ngo test -run TestDoMath/bad_op\n```\n\n> **So s\u00e1nh Java:** Gi\u1ed1ng JUnit 5 `@ParameterizedTest` + `@MethodSource`, nh\u01b0ng kh\u00f4ng c\u1ea7n annotation \u2014 ch\u1ec9 l\u00e0 slice of struct + loop.\n\n---\n\n## 9. Running Tests Concurrently\n\n```go\nfunc TestMyCode(t *testing.T) {\n    t.Parallel()  // d\u00f2ng \u0111\u1ea7u ti\u00ean trong test function\n    // test n\u00e0y ch\u1ea1y song song v\u1edbi tests kh\u00e1c c\u0169ng Parallel\n}\n```\n\n**C\u1ea9n th\u1eadn v\u1edbi table tests parallel + Go \u2264 1.21:**\n\n```go\nfor _, d := range data {\n    d := d  // PH\u1ea2I shadow bi\u1ebfn d (Go \u2264 1.21)\n    t.Run(d.name, func(t *testing.T) {\n        t.Parallel()\n        // d\u00f9ng d an to\u00e0n\n    })\n}\n// Go 1.22+: kh\u00f4ng c\u1ea7n shadow n\u1eefa\n```\n\n**L\u01b0u \u00fd:** Kh\u00f4ng d\u00f9ng `t.Parallel()` n\u1ebfu test c\u00f3 shared mutable state, ho\u1eb7c n\u1ebfu d\u00f9ng `t.Setenv`.\n\n---\n\n## 10. Checking Your Code Coverage\n\n```bash\ngo test -cover                              # hi\u1ec7n % coverage\ngo test -cover -coverprofile=c.out         # l\u01b0u v\u00e0o file\ngo tool cover -html=c.out                  # m\u1edf browser xem visual\n\n# Output:\n# PASS\n# coverage: 87.5% of statements\n```\n\n**Visual output:** Lines m\u00e0u xanh = covered, m\u00e0u \u0111\u1ecf = ch\u01b0a covered.\n\n> **C\u1ea3nh b\u00e1o quan tr\u1ecdng:** 100% coverage **kh\u00f4ng \u0111\u1ea3m b\u1ea3o** code kh\u00f4ng c\u00f3 bug!\n\n```go\n// Bug \u1ea9n d\u00f9 100% coverage:\ncase \"*\":\n    return num1 + num2, nil  // BUG: + thay v\u00ec *\n```\n\nCoverage cho bi\u1ebft code \u0111\u00e3 \u0111\u01b0\u1ee3c *ch\u1ea1y qua*, kh\u00f4ng cho bi\u1ebft v\u1edbi m\u1ecdi *input* \u0111\u1ec1u \u0111\u00fang.\n\n---\n\n## 11. Fuzzing\n\nFuzzing t\u1ef1 \u0111\u1ed9ng sinh input ng\u1eabu nhi\u00ean \u0111\u1ec3 t\u00ecm bug kh\u00f4ng ng\u1edd t\u1edbi.\n\n### Vi\u1ebft fuzz test\n\n```go\nfunc FuzzParseData(f *testing.F) {\n    // Seed corpus \u2014 input m\u1eabu \u0111\u1ec3 fuzzer bi\u1ebfn t\u1ea5u\n    f.Add([]byte(\"3\\nhello\\ngoodbye\\ngreetings\\n\"))\n    f.Add([]byte(\"0\\n\"))\n\n    f.Fuzz(func(t *testing.T, in []byte) {\n        r := bytes.NewReader(in)\n        out, err := ParseData(r)\n        if err != nil {\n            t.Skip(\"handled error\")  // l\u1ed7i \u0111\u01b0\u1ee3c x\u1eed l\u00fd l\u00e0 OK\n        }\n        // Invariant: round-trip ph\u1ea3i cho c\u00f9ng k\u1ebft qu\u1ea3\n        roundTrip := ToData(out)\n        out2, err := ParseData(bytes.NewReader(roundTrip))\n        if diff := cmp.Diff(out, out2); diff != \"\" {\n            t.Error(diff)\n        }\n    })\n}\n```\n\n### Ch\u1ea1y fuzzing\n\n```bash\ngo test -fuzz=FuzzParseData    # ch\u1ea1y fuzzing th\u1eadt (t\u1ed1n t\u00e0i nguy\u00ean)\ngo test                         # ch\u1ea1y fuzz test nh\u01b0 unit test (ch\u1ec9 d\u00f9ng seed corpus)\n```\n\n### Bugs fuzzing t\u00ecm ra \u0111i\u1ec3n h\u00ecnh\n\n```\n# L\u1ea7n 1: input \"300000000000\" \u2192 OOM khi alloc 300B strings\n\u2192 Fix: if count > 1000 { return nil, errors.New(\"too many\") }\n\n# L\u1ea7n 2: input \"-1\" \u2192 panic khi make([]string, 0, -1)\n\u2192 Fix: if count < 0 { return nil, errors.New(\"no negative numbers\") }\n\n# L\u1ea7n 3: input v\u1edbi \\r trong lines\n\u2192 Fix: line = strings.TrimSpace(line); if len(line) == 0 { return error }\n```\n\n**Seed corpus m\u1edbi** \u0111\u01b0\u1ee3c l\u01b0u t\u1ef1 \u0111\u1ed9ng v\u00e0o `testdata/fuzz/FuzzName/` v\u00e0 tr\u1edf th\u00e0nh regression test.\n\n> **Types h\u1ed7 tr\u1ee3 trong corpus:** `int*`, `uint*`, `float*`, `bool`, `string`, `[]byte`, `rune`, `byte`.\n\n---\n\n## 12. Using Benchmarks\n\n### Vi\u1ebft benchmark\n\n```go\nvar blackhole int  // Ng\u0103n compiler t\u1ed1i \u01b0u h\u00f3a b\u1ecf call\n\nfunc BenchmarkFileLen1(b *testing.B) {\n    for i := 0; i < b.N; i++ {  // framework t\u1ef1 \u0111i\u1ec1u ch\u1ec9nh b.N\n        result, err := FileLen(\"testdata/data.txt\", 1)\n        if err != nil {\n            b.Fatal(err)\n        }\n        blackhole = result  // g\u00e1n v\u00e0o blackhole \u0111\u1ec3 prevent optimization\n    }\n}\n```\n\n### Ch\u1ea1y benchmark\n\n```bash\ngo test -bench=.              # ch\u1ea1y t\u1ea5t c\u1ea3 benchmark\ngo test -bench=. -benchmem    # k\u00e8m memory allocation info\ngo test -bench=BenchmarkFileLen -benchmem\n```\n\n### \u0110\u1ecdc k\u1ebft qu\u1ea3\n\n```\nBenchmarkFileLen1-12   25   47201025 ns/op   65342 B/op   65208 allocs/op\n\u2502               \u2502       \u2502      \u2502               \u2502              \u2514\u2500 allocations per op\n\u2502               \u2502       \u2502      \u2502               \u2514\u2500 bytes allocated per op\n\u2502               \u2502       \u2502      \u2514\u2500 nanoseconds per operation\n\u2502               \u2502       \u2514\u2500 s\u1ed1 l\u1ea7n ch\u1ea1y \u0111\u1ec3 c\u00f3 k\u1ebft qu\u1ea3 \u1ed5n \u0111\u1ecbnh\n\u2502               \u2514\u2500 GOMAXPROCS\n\u2514\u2500 t\u00ean benchmark\n```\n\n### Table benchmark\n\n```go\nfunc BenchmarkFileLen(b *testing.B) {\n    for _, v := range []int{1, 10, 100, 1000, 10000, 100000} {\n        b.Run(fmt.Sprintf(\"FileLen-%d\", v), func(b *testing.B) {\n            for i := 0; i < b.N; i++ {\n                result, err := FileLen(\"testdata/data.txt\", v)\n                if err != nil { b.Fatal(err) }\n                blackhole = result\n            }\n        })\n    }\n}\n```\n\n**K\u1ebft qu\u1ea3:** Buffer 10000 bytes t\u1ed1i \u01b0u nh\u1ea5t (\u00edt allocation, nhanh nh\u1ea5t) cho file ~65KB.\n\n> **L\u01b0u \u00fd quan tr\u1ecdng:** Benchmark TR\u01af\u1edaC khi optimize. N\u1ebfu code \u0111\u00e3 \u0111\u1ee7 nhanh, \u0111\u1eebng t\u1ed1i \u01b0u \u2014 t\u1eadp trung v\u00e0o feature v\u00e0 bug fix.\n\n---\n\n## 13. Using Stubs in Go\n\n### Pattern 1: Interface nh\u1ecf \u2014 implement stub tr\u1ef1c ti\u1ebfp\n\n```go\ntype MathSolver interface {\n    Resolve(ctx context.Context, expr string) (float64, error)\n}\n\n// Stub cho testing\ntype MathSolverStub struct{}\n\nfunc (ms MathSolverStub) Resolve(ctx context.Context, expr string) (float64, error) {\n    switch expr {\n    case \"2 + 2 * 10\":\n        return 22, nil\n    case \"( 2 + 2 ) * 10\":\n        return 40, nil\n    case \"( 2 + 2 * 10\":\n        return 0, errors.New(\"invalid expression\")\n    }\n    return 0, nil\n}\n\nfunc TestProcessExpression(t *testing.T) {\n    p := Processor{Solver: MathSolverStub{}}\n    // test v\u1edbi stub\n}\n```\n\n### Pattern 2: Interface l\u1edbn \u2014 embed interface trong struct\n\n```go\ntype Entities interface {\n    GetUser(id string) (User, error)\n    GetPets(userID string) ([]Pet, error)\n    GetChildren(userID string) ([]Person, error)\n    GetFriends(userID string) ([]Person, error)\n    SaveUser(user User) error\n}\n\n// Partial stub \u2014 ch\u1ec9 implement method c\u1ea7n test\ntype LogicStub struct {\n    Entities  // embed interface \u2014 c\u00e1c method kh\u00f4ng implement s\u1ebd panic n\u1ebfu g\u1ecdi\n}\n\nfunc (l LogicStub) GetUser(id string) (User, error) {\n    if id == \"1\" {\n        return User{Name: \"alice\"}, nil\n    }\n    return User{}, errors.New(\"not found\")\n}\n\nfunc TestGetUser(t *testing.T) {\n    logic := Logic{Entities: LogicStub{}}\n    // ch\u1ec9 test code path g\u1ecdi GetUser\n}\n```\n\n> **So s\u00e1nh Java:** Gi\u1ed1ng Mockito `mock(Interface.class)` + `when(...).thenReturn(...)`, nh\u01b0ng Go kh\u00f4ng c\u00f3 mock framework built-in. Thay v\u00e0o \u0111\u00f3, implement struct \u0111\u01a1n gi\u1ea3n.\n\n---\n\n## 14. Using httptest\n\nTesting HTTP handler kh\u00f4ng c\u1ea7n ch\u1ea1y server th\u1eadt:\n\n```go\nfunc TestHandler(t *testing.T) {\n    // T\u1ea1o fake request\n    req := httptest.NewRequest(http.MethodGet, \"/user?id=123\", nil)\n\n    // T\u1ea1o fake response recorder\n    rr := httptest.NewRecorder()\n\n    // G\u1ecdi handler tr\u1ef1c ti\u1ebfp\n    myHandler(rr, req)\n\n    // Ki\u1ec3m tra response\n    if rr.Code != http.StatusOK {\n        t.Errorf(\"expected 200, got %d\", rr.Code)\n    }\n\n    var result User\n    json.NewDecoder(rr.Body).Decode(&result)\n    if result.Name != \"alice\" {\n        t.Errorf(\"expected alice, got %s\", result.Name)\n    }\n}\n```\n\n**Test server th\u1eadt (integration test):**\n\n```go\nfunc TestRealServer(t *testing.T) {\n    server := httptest.NewServer(myHandler)\n    defer server.Close()\n\n    resp, err := http.Get(server.URL + \"/user?id=123\")\n    // test nh\u01b0 HTTP client th\u1eadt\n}\n```\n\n---\n\n## 15. Finding Concurrency Problems with the Data Race Detector\n\n```bash\ngo test -race           # ch\u1ea1y tests v\u1edbi race detector\ngo run -race main.go    # ch\u1ea1y program v\u1edbi race detector\ngo build -race          # build v\u1edbi race detector\n```\n\n**V\u00ed d\u1ee5 race condition:**\n\n```go\n// BUG: concurrent map write \u2192 race condition\nvar counter int\n\nfunc increment() {\n    counter++  // NOT safe - read-modify-write kh\u00f4ng atomic\n}\n\n// Fix: d\u00f9ng sync.Mutex ho\u1eb7c sync/atomic\nvar mu sync.Mutex\nfunc incrementSafe() {\n    mu.Lock()\n    defer mu.Unlock()\n    counter++\n}\n```\n\nOutput khi ph\u00e1t hi\u1ec7n race:\n\n```\nWARNING: DATA RACE\nWrite at 0x... by goroutine 7:\n  main.increment()\n      main.go:10\n\nPrevious read at 0x... by goroutine 6:\n  main.increment()\n      main.go:10\n```\n\n> Race detector **kh\u00f4ng t\u00ecm \u0111\u01b0\u1ee3c t\u1ea5t c\u1ea3** race conditions (ch\u1ec9 detect khi th\u1ef1c s\u1ef1 x\u1ea3y ra trong runtime). D\u00f9ng c\u00f9ng v\u1edbi code review v\u00e0 static analysis.\n\n---\n\n## 16. Exercises\n\n**Exercise 1** \u2014 Vi\u1ebft test cho function v\u1edbi table test v\u00e0 go-cmp:\n\n```go\nfunc TestCalculate(t *testing.T) {\n    tests := []struct {\n        name     string\n        input    Input\n        expected Output\n        wantErr  bool\n    }{\n        {\"valid\", Input{A: 1, B: 2}, Output{Sum: 3}, false},\n        {\"negative\", Input{A: -1, B: 1}, Output{Sum: 0}, false},\n        {\"overflow\", Input{A: math.MaxInt64, B: 1}, Output{}, true},\n    }\n    for _, tt := range tests {\n        t.Run(tt.name, func(t *testing.T) {\n            result, err := Calculate(tt.input)\n            if (err != nil) != tt.wantErr {\n                t.Fatalf(\"error = %v, wantErr %v\", err, tt.wantErr)\n            }\n            if diff := cmp.Diff(tt.expected, result); diff != \"\" {\n                t.Error(diff)\n            }\n        })\n    }\n}\n```\n\n**Exercise 2** \u2014 Vi\u1ebft benchmark so s\u00e1nh hai c\u00e1ch implement:\n\n```go\nfunc BenchmarkImplementations(b *testing.B) {\n    for _, size := range []int{100, 1000, 10000} {\n        b.Run(fmt.Sprintf(\"v1-%d\", size), func(b *testing.B) {\n            data := generateData(size)\n            for i := 0; i < b.N; i++ {\n                resultV1 = implementationV1(data)\n            }\n        })\n        b.Run(fmt.Sprintf(\"v2-%d\", size), func(b *testing.B) {\n            data := generateData(size)\n            for i := 0; i < b.N; i++ {\n                resultV2 = implementationV2(data)\n            }\n        })\n    }\n}\n```\n\n---\n\n## T\u1ed5ng k\u1ebft\n\n| K\u1ef9 thu\u1eadt | D\u00f9ng khi | Java t\u01b0\u01a1ng \u0111\u01b0\u01a1ng |\n|---|---|---|\n| `t.Error`/`t.Fatal` | Report test failure | `fail()`, `Assertions.fail()` |\n| `TestMain` | Setup/teardown package-level | `@BeforeAll`/`@AfterAll` |\n| `t.Cleanup` | Cleanup per-test resource | `@AfterEach` |\n| Table tests | Nhi\u1ec1u input/output cases | `@ParameterizedTest` |\n| `t.Parallel()` | Ch\u1ea1y tests song song | `@Execution(CONCURRENT)` |\n| `-cover` | Code coverage | JaCoCo |\n| Fuzzing | T\u00ecm edge cases t\u1ef1 \u0111\u1ed9ng | JQF, AFL (\u00edt ph\u1ed5 bi\u1ebfn h\u01a1n) |\n| Benchmarks | \u0110o performance | JMH |\n| Stubs | Fake dependencies | Mockito mock/stub |\n| `httptest` | Test HTTP handlers | MockMvc (Spring) |\n| `-race` | Ph\u00e1t hi\u1ec7n race condition | N/A (Java ThreadSanitizer) |\n\n**Nguy\u00ean t\u1eafc v\u00e0ng:**\n1. Test file `*_test.go` n\u1eb1m **c\u00f9ng th\u01b0 m\u1ee5c** v\u1edbi code.\n2. D\u00f9ng `t.Fatal` khi l\u1ed7i l\u00e0m check ti\u1ebfp theo v\u00f4 ngh\u0129a.\n3. Table tests > nhi\u1ec1u function test ri\u00eang l\u1ebb.\n4. 100% coverage l\u00e0 c\u1ea7n nh\u01b0ng **kh\u00f4ng \u0111\u1ee7** \u2014 c\u1ea7n test logic \u0111\u00fang.\n5. Benchmark tr\u01b0\u1edbc khi optimize \u2014 \u0111\u1eebng optimize s\u1edbm.\n6. Dependency injection (interface) \u2192 d\u1ec5 test h\u01a1n nhi\u1ec1u.\n\n\n# Chapter 16 \u2014 Here Be Dragons: Reflect, Unsafe, and Cgo\n\n> T\u00e0i li\u1ec7u h\u1ecdc Go d\u00e0nh cho ng\u01b0\u1eddi chuy\u1ec3n t\u1eeb Java sang.  \n> B\u00e1m s\u00e1t n\u1ed9i dung s\u00e1ch *Learning Go* (2nd ed.) \u2014 Chapter 16.\n>\n> **L\u01b0u \u00fd:** \u0110\u00e2y l\u00e0 n\u1ed9i dung n\u00e2ng cao. Trong h\u1ea7u h\u1ebft code b\u00ecnh th\u01b0\u1eddng b\u1ea1n s\u1ebd KH\u00d4NG c\u1ea7n d\u00f9ng \u0111\u1ebfn nh\u1eefng c\u00f4ng c\u1ee5 n\u00e0y.\n\n---\n\n## 1. Reflection \u2014 L\u00e0m vi\u1ec7c v\u1edbi Types t\u1ea1i Runtime\n\n### Khi n\u00e0o c\u1ea7n reflection?\n\nReflection d\u00f9ng khi **ki\u1ec3u d\u1eef li\u1ec7u kh\u00f4ng bi\u1ebft t\u1ea1i compile time**:\n\n| V\u00ed d\u1ee5 trong standard library | D\u00f9ng reflection \u0111\u1ec3... |\n|---|---|\n| `encoding/json` | Marshal/unmarshal struct b\u1ea5t k\u1ef3 |\n| `fmt.Println` | Detect type c\u1ee7a argument |\n| `text/template` | Process values truy\u1ec1n v\u00e0o template |\n| `database/sql` | Map rows v\u00e0o struct |\n| `errors.Is`, `errors.As` | Traverse error chain |\n| `sort.Slice` | Sort slice b\u1ea5t k\u1ef3 |\n\n> **C\u1ea3nh b\u00e1o:** Reflection ch\u1eadm h\u01a1n code b\u00ecnh th\u01b0\u1eddng ~50-75 l\u1ea7n, d\u1ec5 panic, kh\u00f3 debug. D\u00f9ng **generics** thay reflection khi c\u00f3 th\u1ec3.\n\n### 1.1 Types, Kinds, and Values\n\n**Hai kh\u00e1i ni\u1ec7m c\u1ea7n ph\u00e2n bi\u1ec7t:**\n- **Type**: t\u00ean c\u1ee5 th\u1ec3 (v\u00ed d\u1ee5: `\"Foo\"`, `\"int\"`, `\"string\"`)\n- **Kind**: category c\u1ee7a type (`reflect.Struct`, `reflect.Int`, `reflect.Slice`...)\n\n```go\ntype Foo struct{ A int }\nvar f Foo\nvar x int\n\nft := reflect.TypeOf(f)\nfmt.Println(ft.Name())   // \"Foo\"\nfmt.Println(ft.Kind())   // reflect.Struct\n\nxt := reflect.TypeOf(x)\nfmt.Println(xt.Name())   // \"int\"\nfmt.Println(xt.Kind())   // reflect.Int\n\npt := reflect.TypeOf(&x)\nfmt.Println(pt.Name())        // \"\" (pointer kh\u00f4ng c\u00f3 Name)\nfmt.Println(pt.Kind())        // reflect.Pointer\nfmt.Println(pt.Elem().Name()) // \"int\"  \u2190 type \u0111\u01b0\u1ee3c tr\u1ecf t\u1edbi\nfmt.Println(pt.Elem().Kind()) // reflect.Int\n```\n\n**Quy t\u1eafc quan tr\u1ecdng:** G\u1ecdi method sai Kind \u2192 **PANIC**. Lu\u00f4n check Kind tr\u01b0\u1edbc:\n\n```go\nft := reflect.TypeOf(someVal)\nif ft.Kind() == reflect.Func {\n    fmt.Println(\"num params:\", ft.NumIn())   // OK\n}\n// ft.NumIn() khi Kind kh\u00f4ng ph\u1ea3i Func \u2192 PANIC\n```\n\n### \u0110\u1ecdc struct fields qua reflection\n\n```go\ntype Foo struct {\n    A int    `myTag:\"value\"`\n    B string `myTag:\"value2\"`\n}\n\nvar f Foo\nft := reflect.TypeOf(f)\nfor i := 0; i < ft.NumField(); i++ {\n    field := ft.Field(i)\n    fmt.Println(field.Name,           // \"A\" ho\u1eb7c \"B\"\n                field.Type.Name(),    // \"int\" ho\u1eb7c \"string\"\n                field.Tag.Get(\"myTag\")) // \"value\" ho\u1eb7c \"value2\"\n}\n// Output:\n// A int value\n// B string value2\n```\n\n### \u0110\u1ecdc v\u00e0 ghi gi\u00e1 tr\u1ecb\n\n```go\n// \u0110\u1eccC\ns := []string{\"a\", \"b\", \"c\"}\nsv := reflect.ValueOf(s)            // reflect.Value\ns2 := sv.Interface().([]string)     // cast v\u1ec1 type g\u1ed1c\n\n// \u0110\u1ecdc primitive type tr\u1ef1c ti\u1ebfp\ni := 42\niv := reflect.ValueOf(i)\nfmt.Println(iv.Int())    // 42\n\n// GHI \u2014 ph\u1ea3i pass POINTER\ni := 10\niv := reflect.ValueOf(&i)  // pointer\nivv := iv.Elem()            // dereference\nivv.SetInt(20)\nfmt.Println(i)              // 20\n```\n\n> **So s\u00e1nh Java:** Gi\u1ed1ng `java.lang.reflect.Field.get/set()`, nh\u01b0ng c\u00fa ph\u00e1p kh\u00e1c. Go y\u00eau c\u1ea7u pass pointer \u0111\u1ec3 modify gi\u00e1 tr\u1ecb \u2014 consistent v\u1edbi non-reflection code.\n\n### 1.2 Make New Values\n\n```go\n// reflect.New = t\u1ea1o pointer \u0111\u1ebfn type m\u1edbi\nnewInt := reflect.New(reflect.TypeOf(0))     // *int\nnewInt.Elem().SetInt(42)\nresult := newInt.Elem().Interface().(int)    // 42\n\n// reflect.MakeSlice = t\u1ea1o slice m\u1edbi\nstringSliceType := reflect.TypeOf([]string(nil))\nssv := reflect.MakeSlice(stringSliceType, 0, 10)\n\n// reflect.MakeMap, reflect.MakeChan t\u01b0\u01a1ng t\u1ef1\n\n// Trick t\u1ea1o reflect.Type t\u1eeb type kh\u00f4ng c\u00f3 value\nvar stringType = reflect.TypeOf((*string)(nil)).Elem()\n```\n\n### 1.3 Check If Interface's Value Is nil\n\n```go\n// V\u1ea5n \u0111\u1ec1: interface kh\u00f4ng nil d\u00f9 value l\u00e0 nil\nvar p *Person = nil\nvar i interface{} = p\nfmt.Println(i == nil)  // false! Interface c\u00f3 type (*Person) d\u00f9 value nil\n\n// Gi\u1ea3i ph\u00e1p: d\u00f9ng reflection\nfunc hasNoValue(i any) bool {\n    iv := reflect.ValueOf(i)\n    if !iv.IsValid() {\n        return true  // interface nil ho\u00e0n to\u00e0n\n    }\n    switch iv.Kind() {\n    case reflect.Pointer, reflect.Slice, reflect.Map,\n         reflect.Func, reflect.Interface:\n        return iv.IsNil()\n    default:\n        return false\n    }\n}\n```\n\n### 1.4 Write a Data Marshaler v\u1edbi Reflection\n\nV\u00ed d\u1ee5 x\u00e2y d\u1ef1ng CSV marshaler \u2014 minh h\u1ecda c\u00e1ch `encoding/json` ho\u1ea1t \u0111\u1ed9ng:\n\n```go\ntype MyData struct {\n    Name   string `csv:\"name\"`\n    Age    int    `csv:\"age\"`\n    HasPet bool   `csv:\"has_pet\"`\n}\n\n// Marshal: []MyData \u2192 [][]string (CSV rows)\nfunc Marshal(v any) ([][]string, error) {\n    sliceVal := reflect.ValueOf(v)\n    if sliceVal.Kind() != reflect.Slice {\n        return nil, errors.New(\"must be a slice of structs\")\n    }\n    structType := sliceVal.Type().Elem()\n    if structType.Kind() != reflect.Struct {\n        return nil, errors.New(\"must be a slice of structs\")\n    }\n\n    var out [][]string\n    // Header row: \u0111\u1ecdc struct tags\n    var header []string\n    for i := 0; i < structType.NumField(); i++ {\n        if tag, ok := structType.Field(i).Tag.Lookup(\"csv\"); ok {\n            header = append(header, tag)\n        }\n    }\n    out = append(out, header)\n\n    // Data rows\n    for i := 0; i < sliceVal.Len(); i++ {\n        row, _ := marshalOne(sliceVal.Index(i))\n        out = append(out, row)\n    }\n    return out, nil\n}\n\nfunc marshalOne(vv reflect.Value) ([]string, error) {\n    var row []string\n    for i := 0; i < vv.NumField(); i++ {\n        fieldVal := vv.Field(i)\n        switch fieldVal.Kind() {\n        case reflect.Int:\n            row = append(row, strconv.FormatInt(fieldVal.Int(), 10))\n        case reflect.String:\n            row = append(row, fieldVal.String())\n        case reflect.Bool:\n            row = append(row, strconv.FormatBool(fieldVal.Bool()))\n        }\n    }\n    return row, nil\n}\n```\n\n### 1.5 Build Functions with Reflection\n\n```go\n// Factory function: wrap b\u1ea5t k\u1ef3 function n\u00e0o v\u1edbi timing\nfunc MakeTimedFunction(f any) any {\n    ft := reflect.TypeOf(f)\n    fv := reflect.ValueOf(f)\n\n    wrapperF := reflect.MakeFunc(ft, func(in []reflect.Value) []reflect.Value {\n        start := time.Now()\n        out := fv.Call(in)\n        fmt.Println(\"duration:\", time.Since(start))\n        return out\n    })\n    return wrapperF.Interface()\n}\n\n// S\u1eed d\u1ee5ng\nfunc timeMe(a int) int {\n    time.Sleep(time.Duration(a) * time.Second)\n    return a * 2\n}\n\ntimedFn := MakeTimedFunction(timeMe).(func(int) int)\nfmt.Println(timedFn(2))  // in ra duration r\u1ed3i k\u1ebft qu\u1ea3\n```\n\n> **L\u01b0u \u00fd:** Reflection kh\u00f4ng th\u1ec3 t\u1ea1o method cho type \u2014 ch\u1ec9 t\u1ea1o \u0111\u01b0\u1ee3c function v\u00e0 struct m\u1edbi.\n\n### 1.6 Khi n\u00e0o n\u00ean d\u00f9ng Reflection\n\n**Benchmark so s\u00e1nh reflection vs generic:**\n\n```\nFilter 1000 strings:\n  Reflection:  203962 ns/op  (2219 allocs)\n  Generic:       3920 ns/op  (   1 alloc)\n  Custom:        3885 ns/op  (   1 alloc)\n```\n\n**Reflection ch\u1eadm h\u01a1n ~50x!**\n\n**Khi n\u00ean d\u00f9ng reflection:**\n- Mapping data \u1edf boundaries (JSON, CSV, database)\n- S\u1ed1 l\u01b0\u1ee3ng types kh\u00f4ng bi\u1ebft tr\u01b0\u1edbc v\u00e0 r\u1ea5t nhi\u1ec1u\n- Kh\u00f4ng th\u1ec3 d\u00f9ng generics (c\u1ea7n l\u00e0m vi\u1ec7c v\u1edbi unknown number of different types)\n\n**Khi KH\u00d4NG d\u00f9ng reflection:**\n- C\u00f3 th\u1ec3 d\u00f9ng generics \u2192 d\u00f9ng generics\n- Performance-critical code\n- Code r\u00f5 r\u00e0ng h\u01a1n v\u1edbi type assertions\n\n---\n\n## 2. unsafe \u2014 Thao t\u00e1c b\u1ed9 nh\u1edb tr\u1ef1c ti\u1ebfp\n\n`unsafe` package cho ph\u00e9p v\u01b0\u1ee3t qua type safety c\u1ee7a Go. D\u00f9ng \u0111\u1ec3:\n- \u0110\u1ecdc/ghi binary data t\u1eeb network/OS\n- Performance optimization c\u1ef1c \u0111oan\n- Truy c\u1eadp unexported fields (last resort)\n\n### 2.1 Sizeof v\u00e0 Offsetof\n\n```go\ntype BoolInt struct {\n    b bool    // 1 byte + 7 bytes padding\n    i int64   // 8 bytes\n}  // total: 16 bytes\n\ntype IntBool struct {\n    i int64   // 8 bytes\n    b bool    // 1 byte + 7 bytes padding \u1edf cu\u1ed1i\n}  // total: 16 bytes\n\nfmt.Println(unsafe.Sizeof(BoolInt{}))  // 16\nfmt.Println(unsafe.Sizeof(IntBool{}))  // 16\n\n// T\u1ed1i \u01b0u: gom c\u00e1c field nh\u1ecf l\u1ea1i v\u1edbi nhau\ntype BoolBoolInt struct {\n    b  bool    // 1 byte\n    b2 bool    // 1 byte + 6 bytes padding\n    i  int64   // 8 bytes\n}  // 16 bytes\n\ntype IntBoolBool struct {\n    i  int64   // 8 bytes\n    b  bool    // 1 byte\n    b2 bool    // 1 byte + 6 bytes padding\n}  // 16 bytes \u2014 gom bool l\u1ea1i ti\u1ebft ki\u1ec7m h\u01a1n\n```\n\n> **\u1ee8ng d\u1ee5ng:** N\u1ebfu c\u00f3 struct v\u1edbi h\u00e0ng tri\u1ec7u instances, s\u1eafp x\u1ebfp l\u1ea1i field c\u00f3 th\u1ec3 ti\u1ebft ki\u1ec7m \u0111\u00e1ng k\u1ec3 memory.\n\n### 2.2 Convert External Binary Data\n\n**B\u00e0i to\u00e1n:** Map bytes t\u1eeb network v\u00e0o Go struct hi\u1ec7u qu\u1ea3.\n\nWire protocol:\n```\nValue:   4 bytes (uint32 big-endian)\nLabel:  10 bytes (ASCII)\nActive:  1 byte  (bool)\nPadding: 1 byte\nTotal:  16 bytes\n```\n\n```go\ntype Data struct {\n    Value  uint32\n    Label  [10]byte\n    Active bool\n    // Go t\u1ef1 th\u00eam 1 byte padding\n}\nconst dataSize = unsafe.Sizeof(Data{})  // 16, t\u00ednh t\u1ea1i compile time\n\n// C\u00e1ch an to\u00e0n (readable)\nfunc DataFromBytes(b [16]byte) Data {\n    d := Data{}\n    d.Value = binary.BigEndian.Uint32(b[:4])\n    copy(d.Label[:], b[4:14])\n    d.Active = b[14] != 0\n    return d\n}\n\n// C\u00e1ch unsafe (nhanh h\u01a1n ~2x)\nfunc DataFromBytesUnsafe(b [16]byte) Data {\n    data := *(*Data)(unsafe.Pointer(&b))  // cast array th\u00e0nh struct\n    if isLittleEndian {\n        data.Value = bits.ReverseBytes32(data.Value)  // fix endianness\n    }\n    return data\n}\n```\n\n**Benchmark:**\n\n```\nDataFromBytes:        2.186 ns/op   (safe)\nDataFromBytesUnsafe:  1.160 ns/op   (unsafe, ~2x faster)\n```\n\nCh\u1ec9 \u0111\u00e1ng d\u00f9ng unsafe khi conversion x\u1ea3y ra r\u1ea5t nhi\u1ec1u l\u1ea7n ho\u1eb7c data r\u1ea5t l\u1edbn.\n\n### 2.3 Accessing Unexported Fields\n\n**D\u00f9ng nh\u01b0 last resort** \u2014 th\u01b0\u1eddng khi c\u1ea7n interact v\u1edbi code kh\u00f4ng th\u1ec3 s\u1eeda:\n\n```go\n// Package A\ntype HasUnexportedField struct {\n    A int\n    b bool  // unexported\n    C string\n}\n\n// Package B \u2014 access unexported field b\nfunc SetBUnsafe(huf *packageA.HasUnexportedField) {\n    sf, _ := reflect.TypeOf(huf).Elem().FieldByName(\"b\")\n    offset := sf.Offset\n\n    // Pointer arithmetic \u0111\u1ec3 t\u00ecm v\u1ecb tr\u00ed c\u1ee7a b\n    start := unsafe.Pointer(huf)\n    pos := unsafe.Add(start, offset)\n\n    b := (*bool)(pos)\n    fmt.Println(*b)  // \u0111\u1ecdc\n    *b = true        // ghi\n}\n```\n\n> **C\u1ea2NH B\u00c1O:** Code n\u00e0y break n\u1ebfu internal layout c\u1ee7a struct thay \u0111\u1ed5i. Ch\u1ec9 d\u00f9ng khi th\u1ef1c s\u1ef1 kh\u00f4ng c\u00f2n c\u00e1ch n\u00e0o kh\u00e1c.\n\n### C\u00f4ng c\u1ee5 ki\u1ec3m tra unsafe\n\n```bash\n# Th\u00eam runtime checks cho unsafe.Pointer usage\ngo test -gcflags=-d=checkptr ./...\n```\n\n---\n\n## 3. Cgo \u2014 G\u1ecdi C t\u1eeb Go\n\nCgo l\u00e0 FFI (Foreign Function Interface) c\u1ee7a Go v\u1edbi C. D\u00f9ng \u0111\u1ec3:\n- T\u00edch h\u1ee3p v\u1edbi C libraries\n- D\u00f9ng OS-level APIs ch\u1ec9 c\u00f3 trong C\n- **KH\u00d4NG d\u00f9ng cho performance** \u2014 overhead crossing the C/Go boundary r\u1ea5t \u0111\u1eaft\n\n### V\u00ed d\u1ee5 c\u01a1 b\u1ea3n\n\n```go\npackage main\n\nimport \"fmt\"\n\n/*\n#cgo LDFLAGS: -lm\n#include <stdio.h>\n#include <math.h>\n#include \"mylib.h\"\n\nint add(int a, int b) {\n    int sum = a + b;\n    printf(\"a: %d, b: %d, sum %d\\n\", a, b, sum);\n    return sum;\n}\n*/\nimport \"C\"   // Import \u0111\u1eb7c bi\u1ec7t, ph\u1ea3i ngay sau comment C code\n\nfunc main() {\n    sum := C.add(3, 2)           // g\u1ecdi C function\n    fmt.Println(sum)             // 5\n    fmt.Println(C.sqrt(100))     // t\u1eeb math.h\n    fmt.Println(C.multiply(10, 20))  // t\u1eeb mylib.h\n}\n```\n\n**C\u1ea7n c\u00f3 C compiler installed.** Build b\u00ecnh th\u01b0\u1eddng v\u1edbi `go build`.\n\n### Khi n\u00e0o d\u00f9ng cgo\n\n```\n\u2705 D\u00f9ng:\n- Wrap C library kh\u00f4ng c\u00f3 Go alternative\n- G\u1ecdi OS-specific APIs\n- Integrate v\u1edbi legacy C/C++ code\n\n\u274c Kh\u00f4ng d\u00f9ng:\n- T\u0103ng performance (context switch Go\u2194C \u0111\u1eaft h\u01a1n b\u1ea1n ngh\u0129)\n- Code m\u1edbi c\u00f3 th\u1ec3 vi\u1ebft thu\u1ea7n Go\n```\n\n**Chi ph\u00ed c\u1ee7a cgo:**\n- Cross-boundary calls: ~50-100ns overhead m\u1ed7i l\u1ea7n\n- CGo disable cross-compilation d\u1ec5 d\u00e0ng\n- Build ch\u1eadm h\u01a1n\n- Debugging kh\u00f3 h\u01a1n\n\n---\n\n## 4. Exercises\n\n**Exercise 1** \u2014 D\u00f9ng reflection \u0111\u1ec3 vi\u1ebft function in t\u1ea5t c\u1ea3 exported fields c\u1ee7a b\u1ea5t k\u1ef3 struct n\u00e0o:\n\n```go\nfunc PrintFields(v any) {\n    rv := reflect.ValueOf(v)\n    if rv.Kind() == reflect.Pointer {\n        rv = rv.Elem()\n    }\n    if rv.Kind() != reflect.Struct {\n        fmt.Println(\"not a struct\")\n        return\n    }\n    rt := rv.Type()\n    for i := 0; i < rt.NumField(); i++ {\n        field := rt.Field(i)\n        if field.IsExported() {\n            fmt.Printf(\"%s: %v\\n\", field.Name, rv.Field(i).Interface())\n        }\n    }\n}\n```\n\n**Exercise 2** \u2014 D\u00f9ng `unsafe.Sizeof` v\u00e0 `unsafe.Offsetof` \u0111\u1ec3 in layout c\u1ee7a m\u1ed9t struct:\n\n```go\ntype Example struct {\n    A bool\n    B int64\n    C string\n    D float32\n}\n\nfunc main() {\n    fmt.Printf(\"Size: %d\\n\", unsafe.Sizeof(Example{}))\n    fmt.Printf(\"A offset: %d\\n\", unsafe.Offsetof(Example{}.A))\n    fmt.Printf(\"B offset: %d\\n\", unsafe.Offsetof(Example{}.B))\n    fmt.Printf(\"C offset: %d\\n\", unsafe.Offsetof(Example{}.C))\n    fmt.Printf(\"D offset: %d\\n\", unsafe.Offsetof(Example{}.D))\n}\n```\n\n**Exercise 3** \u2014 Vi\u1ebft CSV marshaler ho\u00e0n ch\u1ec9nh h\u1ed7 tr\u1ee3 th\u00eam `float64`:\n\n```go\n// Th\u00eam case v\u00e0o marshalOne v\u00e0 unmarshalOne:\ncase reflect.Float64:\n    row = append(row, strconv.FormatFloat(fieldVal.Float(), 'f', -1, 64))\n\n// Trong unmarshalOne:\ncase reflect.Float64:\n    f, err := strconv.ParseFloat(val, 64)\n    if err != nil { return err }\n    field.SetFloat(f)\n```\n\n---\n\n## T\u1ed5ng k\u1ebft\n\n| C\u00f4ng c\u1ee5 | D\u00f9ng khi | R\u1ee7i ro |\n|---|---|---|\n| `reflect` | Marshal/unmarshal unknown types, framework code | Ch\u1eadm 50x, d\u1ec5 panic |\n| `unsafe` | Binary data t\u1eeb network/OS, field layout optimization | Ph\u00e1 type safety, code fragile |\n| `cgo` | Integrate v\u1edbi C libraries | Build ph\u1ee9c t\u1ea1p, overhead cao |\n\n**Khi n\u00e0o KH\u00d4NG d\u00f9ng:**\n\n| Thay v\u00ec | D\u00f9ng |\n|---|---|\n| Reflection cho filter/map | **Generics** |\n| Reflection cho type check | **Type assertion/switch** |\n| unsafe cho performance | Profile tr\u01b0\u1edbc, c\u00e2n nh\u1eafc k\u1ef9 |\n| Cgo cho performance | Go native code ho\u1eb7c algorithm t\u1ed1t h\u01a1n |\n\n**Nguy\u00ean t\u1eafc v\u00e0ng t\u1eeb t\u00ean ch\u01b0\u01a1ng \u2014 \"Here Be Dragons\":**\n1. \u0110\u00e2y l\u00e0 nh\u1eefng c\u00f4ng c\u1ee5 **nguy hi\u1ec3m**. N\u1ebfu c\u00f3 c\u00e1ch kh\u00e1c, h\u00e3y d\u00f9ng c\u00e1ch \u0111\u00f3.\n2. Reflection: ch\u1ec9 d\u00f9ng \u1edf **boundaries** c\u1ee7a ch\u01b0\u01a1ng tr\u00ecnh (I/O, serialization).\n3. unsafe: ch\u1ec9 d\u00f9ng khi **bi\u1ebft r\u00f5** layout b\u1ed9 nh\u1edb v\u00e0 c\u00f3 **benchmark** ch\u1ee9ng minh c\u1ea7n thi\u1ebft.\n4. Cgo: ch\u1ec9 d\u00f9ng cho **integration**, kh\u00f4ng ph\u1ea3i performance.\n5. Lu\u00f4n \u0111\u1ec3 l\u1ea1i **comment r\u00f5 r\u00e0ng** khi d\u00f9ng b\u1ea5t k\u1ef3 c\u00f4ng c\u1ee5 n\u00e0o trong s\u1ed1 n\u00e0y.\n\n> \"With great power comes great responsibility.\" \u2014 nh\u1eefng k\u1ef9 thu\u1eadt n\u00e0y t\u1ed3n t\u1ea1i v\u00ec \u0111\u00f4i khi b\u1ea1n c\u1ea7n ch\u00fang, nh\u01b0ng h\u1ea7u h\u1ebft code production kh\u00f4ng c\u1ea7n \u0111\u1ebfn ch\u00fang.\n";

// ── Smooth scroll with topbar offset ──
const TOPBAR_H = 60;
function smoothScrollTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - TOPBAR_H;
  window.scrollTo({ top, behavior: 'smooth' });
}

// ── Heading ID generator (handle duplicates) ──
const headingCounts = {};
function makeId(text) {
  const base = text.toLowerCase()
    .replace(/<[^>]+>/g, '')
    .replace(/[^\w\s\u00C0-\u024F\u4e00-\u9fff-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-');
  headingCounts[base] = (headingCounts[base] || 0) + 1;
  return headingCounts[base] > 1 ? `${base}-${headingCounts[base]}` : base;
}

// ── Configure marked ──
const renderer = new marked.Renderer();
const headings = []; // {level, text, id, chapterIdx}

renderer.heading = function(text, level) {
  const id = makeId(text);
  headings.push({ level, text, id });
  const tag = `h${level}`;
  return `<${tag} id="${id}"><a class="anchor" href="#${id}">${text}</a></${tag}>`;
};

renderer.code = function(code, lang) {
  const validLang = lang && hljs.getLanguage(lang) ? lang : null;
  const highlighted = validLang
    ? hljs.highlight(code, { language: validLang }).value
    : hljs.highlightAuto(code).value;
  const langLabel = (lang || 'code').toLowerCase();
  return `<pre><span class="code-lang">${langLabel}</span><code class="language-${langLabel}">${highlighted}</code><button class="copy-btn" onclick="copyCode(this)">Copy</button></pre>`;
};

marked.setOptions({
  renderer,
  gfm: true,
  breaks: false,
  mangle: false,
  headerIds: false,
});

// ── Render markdown ──
document.getElementById('content').innerHTML = marked.parse(RAW_MD);

// ── Build TOC ──
function buildTOC() {
  const nav = document.getElementById('toc-nav');
  nav.innerHTML = '';

  // Group headings into chapters (h1 = chapter)
  const chapters = [];
  let current = null;

  headings.forEach(h => {
    if (h.level === 1) {
      current = { heading: h, sections: [] };
      chapters.push(current);
    } else if (h.level === 2 && current) {
      current.sections.push(h);
    }
  });

  chapters.forEach((ch, idx) => {
    const div = document.createElement('div');
    div.className = 'toc-chapter';
    div.dataset.idx = idx;

    // Extract short chapter title
    const raw = ch.heading.text.replace(/<[^>]*>/g,'');
    // Try to get "Chapter X. Title" → "Ch X · Title"
    const m = raw.match(/Chapter\s*(\d+)[.:]?\s*(.*)/i);
    const label = m ? `<span class="ch-num">Ch${m[1]}</span> ${m[2]}` : raw;

    const titleEl = document.createElement('div');
    titleEl.className = 'toc-chapter-title';
    titleEl.innerHTML = `<span class="ch-arrow">▶</span>${label}`;
    titleEl.dataset.id = ch.heading.id;
    titleEl.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      div.classList.toggle('open');
      smoothScrollTo(ch.heading.id);
    });

    div.appendChild(titleEl);

    if (ch.sections.length > 0) {
      const secWrap = document.createElement('div');
      secWrap.className = 'toc-sections';

      ch.sections.forEach(s => {
        const a = document.createElement('a');
        a.className = 'toc-section';
        a.href = `#${s.id}`;
        a.textContent = s.text.replace(/<[^>]*>/g,'');
        a.addEventListener('click', (e) => {
          e.preventDefault();
          smoothScrollTo(s.id);
          closeSidebarMobile();
        });
        secWrap.appendChild(a);
      });

      div.appendChild(secWrap);
    }

    nav.appendChild(div);
  });
}

buildTOC();

// ── Scroll spy ──
const allHeadingEls = Array.from(document.querySelectorAll('#content h1, #content h2'));
let activeChapterIdx = -1;

function updateScrollSpy() {
  const scrollY = window.scrollY + 70;
  const total = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById('progress-bar').style.width = total > 0 ? (window.scrollY / total * 100) + '%' : '0%';

  // Back to top
  document.getElementById('back-top').classList.toggle('show', window.scrollY > 400);

  // Find current heading
  let current = null;
  for (const el of allHeadingEls) {
    if (el.offsetTop <= scrollY) current = el;
    else break;
  }

  if (!current) return;
  const id = current.id;

  // Update TOC links
  document.querySelectorAll('.toc-section').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + id);
  });

  // Find which chapter this belongs to
  const chapters = document.querySelectorAll('.toc-chapter');
  chapters.forEach((ch, idx) => {
    const titleEl = ch.querySelector('.toc-chapter-title');
    const chId = titleEl.dataset.id;
    const sections = Array.from(ch.querySelectorAll('.toc-section'));
    const sectionIds = sections.map(a => a.getAttribute('href').slice(1));
    const isActive = chId === id || sectionIds.includes(id);

    titleEl.classList.toggle('active', isActive);

    if (isActive && idx !== activeChapterIdx) {
      activeChapterIdx = idx;
      // Auto-expand current chapter
      if (!ch.classList.contains('open')) {
        document.querySelectorAll('.toc-chapter.open').forEach(c => c.classList.remove('open'));
        ch.classList.add('open');
      }
      // Scroll TOC to keep active item visible
      const nav = document.getElementById('toc-nav');
      const elTop = titleEl.offsetTop - nav.offsetTop;
      const navScroll = nav.scrollTop;
      const navH = nav.clientHeight;
      if (elTop < navScroll + 40 || elTop > navScroll + navH - 80) {
        nav.scrollTo({ top: elTop - navH / 3, behavior: 'smooth' });
      }
    }
  });

  // Update topbar title
  const topbar = document.getElementById('topbar-title');
  const h1 = [...allHeadingEls].filter(e => e.tagName === 'H1').reverse().find(e => e.offsetTop <= scrollY);
  if (h1) {
    const text = h1.textContent.replace(/\s+/g,' ').trim();
    topbar.innerHTML = `<strong>Learning Go</strong> <span style="color:var(--text-muted)">— ${text}</span>`;
  }
}

window.addEventListener('scroll', updateScrollSpy, { passive: true });
updateScrollSpy();

// ── Mobile sidebar ──
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

// ── Sidebar toggle (desktop + mobile) ──
let sidebarCollapsed = localStorage.getItem('sidebarCollapsed') === '1';
function applySidebarState() {
  if (window.innerWidth <= 768) return; // mobile handled separately
  document.body.classList.toggle('sidebar-collapsed', sidebarCollapsed);
}
applySidebarState();

document.getElementById('menu-btn').addEventListener('click', () => {
  if (window.innerWidth <= 768) {
    // Mobile: drawer behaviour
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  } else {
    // Desktop: collapse/expand
    sidebarCollapsed = !sidebarCollapsed;
    localStorage.setItem('sidebarCollapsed', sidebarCollapsed ? '1' : '0');
    document.body.classList.toggle('sidebar-collapsed', sidebarCollapsed);
  }
});

overlay.addEventListener('click', closeSidebarMobile);

function closeSidebarMobile() {
  if (window.innerWidth <= 768) {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }
}

// ── Dark mode ──
const darkBtn = document.getElementById('dark-btn');
let dark = localStorage.getItem('dark') === '1' ||
  window.matchMedia('(prefers-color-scheme: dark)').matches;

function applyDark() {
  document.documentElement.classList.toggle('dark', dark);
  darkBtn.textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('dark', dark ? '1' : '0');
}
applyDark();

darkBtn.addEventListener('click', () => { dark = !dark; applyDark(); });

// ── Back to top ──
document.getElementById('back-top').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ── Copy code ──
function copyCode(btn) {
  const code = btn.closest('pre').querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = code; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── TOC search ──
document.getElementById('toc-search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.toc-chapter').forEach(ch => {
    const titleEl = ch.querySelector('.toc-chapter-title');
    const titleText = titleEl.textContent.toLowerCase();
    const sections = ch.querySelectorAll('.toc-section');
    let anySection = false;

    sections.forEach(s => {
      const match = !q || s.textContent.toLowerCase().includes(q);
      s.style.display = match ? '' : 'none';
      if (match) anySection = true;
    });

    const chMatch = !q || titleText.includes(q);
    ch.style.display = (chMatch || anySection) ? '' : 'none';
    if (q && anySection) ch.classList.add('open');
  });
});

// ── Auto-open first chapter ──
const first = document.querySelector('.toc-chapter');
if (first) first.classList.add('open');
