00f3 type elements **ch\u1ec9 d\u00f9ng l\u00e0m type constraint**, kh\u00f4ng d\u00f9ng l\u00e0m variable type.\n\n---\n\n## 6. Type Inference v\u1edbi Generics\n\n```go\n// Go t\u1ef1 suy ra type khi c\u00f3 \u0111\u1ee7 th\u00f4ng tin t\u1eeb arguments\nwords := []string{\"One\", \"Two\"}\nfiltered := Filter(words, ...)   // kh\u00f4ng c\u1ea7n Filter[string](...)\n\n// Khi kh\u00f4ng th\u1ec3 infer \u2014 ph\u1ea3i explicit\nfunc Convert[T1, T2 Integer](in T1) T2 {\n    return T2(in)\n}\nvar a int = 10\nb := Convert[int, int64](a)  // ph\u1ea3i explicit v\u00ec return type kh\u00f4ng th\u1ec3 infer\n```\n\n---\n\n## 7. Generic Data Structure \u2014 Binary Tree\n\n```go\ntype OrderableFunc[T any] func(t1, t2 T) int\n\ntype Tree[T any] struct {\n    f    OrderableFunc[T]\n    root *Node[T]\n}\n\ntype Node[T any] struct {\n    val         T\n    left, right *Node[T]\n}\n\nfunc NewTree[T any](f OrderableFunc[T]) *Tree[T] {\n    return &Tree[T]{f: f}\n}\n\nfunc (t *Tree[T]) Add(v T) {\n    t.root = t.root.Add(t.f, v)\n}\n\nfunc (t *Tree[T]) Contains(v T) bool {\n    return t.root.Contains(t.f, v)\n}\n\nfunc (n *Node[T]) Add(f OrderableFunc[T], v T) *Node[T] {\n    if n == nil {\n        return &Node[T]{val: v}\n    }\n    switch r := f(v, n.val); {\n    case r <= -1:\n        n.left = n.left.Add(f, v)\n    case r >= 1:\n        n.right = n.right.Add(f, v)\n    }\n    return n\n}\n```\n\n**D\u00f9ng v\u1edbi int (cmp.Compare):**\n```go\nt1 := NewTree(cmp.Compare[int])\nt1.Add(10)\nt1.Add(30)\nt1.Add(15)\nfmt.Println(t1.Contains(15))  // true\n```\n\n**D\u00f9ng v\u1edbi struct:**\n```go\ntype Person struct { Name string; Age int }\n\n// Option 1: function\nfunc OrderPeople(p1, p2 Person) int {\n    out := cmp.Compare(p1.Name, p2.Name)\n    if out == 0 { out = cmp.Compare(p1.Age, p2.Age) }\n    return out\n}\nt2 := NewTree(OrderPeople)\n\n// Option 2: method expression\nfunc (p Person) Order(other Person) int { ... }\nt3 := NewTree(Person.Order)  // method expression\n```\n\n---\n\n## 8. comparable v\u00e0 Gotchas\n\n```go\nfunc Comparer[T comparable](t1, t2 T) {\n    if t1 == t2 { fmt.Println(\"equal!\") }\n}\n\n// OK \u2014 int, ThingerInt \u0111\u1ec1u comparable\nComparer(10, 10)\n\n// Compile error \u2014 ThingerSlice ([]int) kh\u00f4ng comparable\nvar a3 ThingerSlice = []int{1, 2, 3}\nComparer(a3, a3)  // error: ThingerSlice does not satisfy comparable\n\n// NGUY HI\u1ec2M \u2014 interface Thinger \u0111\u01b0\u1ee3c coi l\u00e0 comparable, nh\u01b0ng...\nvar a4 Thinger = a3  // assign slice v\u00e0o interface\nComparer(a4, a4)     // compile OK, nh\u01b0ng PANIC at runtime!\n```\n\n**T\u1ea1i sao?** Interface l\u00e0 comparable type, nh\u01b0ng n\u1ebfu underlying value l\u00e0 slice \u2192 panic khi compare.\n\n---\n\n## 9. Nh\u1eefng g\u00ec KH\u00d4NG c\u00f3 trong Go Generics\n\n| T\u00ednh n\u0103ng | C\u00f3 trong Go? |\n|---|---|\n| Operator overloading | \u274c Kh\u00f4ng |\n| Additional type params tr\u00ean methods | \u274c Kh\u00f4ng |\n| Variadic type parameters | \u274c Kh\u00f4ng |\n| Specialization (per-type implementation) | \u274c Kh\u00f4ng |\n| Currying | \u274c Kh\u00f4ng |\n| Metaprogramming | \u274c Kh\u00f4ng |\n\n**Method v\u1edbi extra type param \u2014 KH\u00d4NG compile:**\n```go\ntype functionalSlice[T any] []T\n\n// KH\u00d4NG WORK\nfunc (fs functionalSlice[T]) Map[E any](f func(T) E) functionalSlice[E] { ... }\n// Ph\u1ea3i d\u00f9ng standalone function thay v\u00ec method\n```\n\n---\n\n## 10. Idiomatic Go v\u00e0 Generics\n\n**Khi n\u00e0o d\u00f9ng generics:**\n- Data structures (Stack, Tree, Queue...)\n- Algorithms tr\u00ean collections (Map, Filter, Reduce)\n- Khi c\u1ea7n multiple numeric types (Integer, Ordered)\n\n**Khi n\u00e0o KH\u00d4NG d\u00f9ng generics:**\n- Thay th\u1ebf interface parameter b\u1eb1ng generic \u0111\u1ec3 \"c\u1ea3i thi\u1ec7n performance\"\n\n```go\n// Interface \u2014 fine\nfunc doubleAge(a Ager) int { return a.age() * 2 }\n\n// Generic \u2014 ~30% CH\u1eacM h\u01a1n trong Go 1.20!\nfunc doubleAgeGeneric[T Ager](a T) int { return a.age() * 2 }\n```\n\nT\u1ea1i sao ch\u1eadm h\u01a1n? Go compiler kh\u00f4ng generate unique function cho m\u1ed7i type nh\u01b0 C++. Pointer types chia s\u1ebb m\u1ed9t generated function v\u1edbi extra runtime lookups.\n\n**Generics m\u1edbi trong standard library (Go 1.21+):**\n```go\nimport \"slices\"\nslices.Equal(s1, s2)          // so s\u00e1nh 2 slices\nslices.Insert(s, i, vals...)  // insert elements\nslices.Delete(s, i, j)        // delete range\n\nimport \"maps\"\nmaps.Equal(m1, m2)    // so s\u00e1nh 2 maps\nmaps.Clone(m)         // shallow copy\n\nimport \"cmp\"\ncmp.Compare(a, b)     // tr\u1ea3 v\u1ec1 -1, 0, 1\ncmp.Less(a, b)        // tr\u1ea3 v\u1ec1 bool\n```\n\n---\n\n## Exercises\n\n**1. Double function:**\n```go\ntype Number interface {\n    ~int | ~int8 | ~int16 | ~int32 | ~int64 |\n        ~float32 | ~float64\n}\n\nfunc Double[T Number](val T) T {\n    return val * 2\n}\n\nfmt.Println(Double(5))    // 10\nfmt.Println(Double(3.14)) // 6.28\n```\n\n**2. Printable interface:**\n```go\ntype Printable interface {\n    fmt.Stringer\n    ~int | ~float64\n}\n\ntype PrintInt int\nfunc (pi PrintInt) String() string { return fmt.Sprintf(\"PrintInt: %d\", pi) }\n\ntype PrintFloat float64\nfunc (pf PrintFloat) String() string { return fmt.Sprintf(\"PrintFloat: %f\", pf) }\n\nfunc PrintValue[T Printable](val T) {\n    fmt.Println(val)\n}\n```\n\n**3. Generic Linked List:**\n```go\ntype Node[T comparable] struct {\n    val  T\n    next *Node[T]\n}\n\ntype LinkedList[T comparable] struct {\n    head *Node[T]\n    size int\n}\n\nfunc (ll *LinkedList[T]) Add(val T) {\n    newNode := &Node[T]{val: val}\n    if ll.head == nil {\n        ll.head = newNode\n    } else {\n        cur := ll.head\n        for cur.next != nil { cur = cur.next }\n        cur.next = newNode\n    }\n    ll.size++\n}\n\nfunc (ll *LinkedList[T]) Index(val T) int {\n    cur := ll.head\n    i := 0\n    for cur != nil {\n        if cur.val == val { return i }\n        cur = cur.next\n        i++\n    }\n    return -1\n}\n\nfunc (ll *LinkedList[T]) Insert(val T, pos int) {\n    newNode := &Node[T]{val: val}\n    if pos == 0 {\n        newNode.next = ll.head\n        ll.head = newNode\n        ll.size++\n        return\n    }\n    cur := ll.head\n    for i := 0; i < pos-1 && cur != nil; i++ { cur = cur.next }\n    if cur != nil {\n        newNode.next = cur.next\n        cur.next = newNode\n        ll.size++\n    }\n}\n```\n\n---\n\n## Wrapping Up\n\nB\u1ea1n \u0111\u00e3 h\u1ecdc:\n- **Generics = type parameters** \u2014 `[T constraint]` sau t\u00ean type/function\n- **Constraints**: `any`, `comparable`, custom interface, type terms\n- **Type terms**: `int | string | float64`, `~int` cho underlying types\n- **Type inference**: Go t\u1ef1 suy ra type khi \u0111\u1ee7 th\u00f4ng tin\n- **Generic data structures v\u00e0 functions**: Stack, Tree, Map/Filter/Reduce\n- **Idiomatic**: D\u00f9ng generics cho data structures/algorithms; KH\u00d4NG replace interface params\n- **Standard library**: `slices`, `maps`, `cmp` packages d\u00f9ng generics (Go 1.21+)\n\n**Ch\u01b0\u01a1ng ti\u1ebfp theo:** Errors \u2014 m\u1ed9t trong nh\u1eefng t\u00ednh n\u0103ng g\u00e2y tranh c\u00e3i nh\u1ea5t c\u1ee7a Go.\n\n\n# Chapter 9. Errors\n\n## Gi\u1edbi thi\u1ec7u\n\nError handling l\u00e0 m\u1ed9t trong nh\u1eefng \u0111i\u1ec3m kh\u00e1c bi\u1ec7t l\u1edbn nh\u1ea5t c\u1ee7a Go so v\u1edbi c\u00e1c ng\u00f4n ng\u1eef kh\u00e1c. Thay v\u00ec d\u00f9ng exception nh\u01b0 Java/Python, Go tr\u1ea3 v\u1ec1 error nh\u01b0 m\u1ed9t gi\u00e1 tr\u1ecb b\u00ecnh th\u01b0\u1eddng \u2014 forcing developer ph\u1ea3i x\u1eed l\u00fd r\u00f5 r\u00e0ng m\u1ecdi l\u1ed7i c\u00f3 th\u1ec3 x\u1ea3y ra.\n\n> **So s\u00e1nh v\u1edbi Java:**\n> - Java: `throw new Exception(...)` \u2192 try/catch/finally\n> - Go: `return ..., errors.New(...)` \u2192 `if err != nil { ... }`\n\n---\n\n## 1. X\u1eed l\u00fd Errors: C\u01a1 b\u1ea3n\n\n### C\u1ea5u tr\u00fac tr\u1ea3 v\u1ec1 error\n\n```go\nfunc calcRemainderAndMod(numerator, denominator int) (int, int, error) {\n    if denominator == 0 {\n        return 0, 0, errors.New(\"denominator is 0\")\n    }\n    return numerator / denominator, numerator % denominator, nil\n}\n```\n\n**Quy t\u1eafc:**\n- Error l\u00e0 **return value cu\u1ed1i c\u00f9ng** (convention b\u1eaft bu\u1ed9c)\n- Khi th\u00e0nh c\u00f4ng: tr\u1ea3 v\u1ec1 `nil` cho error\n- Khi l\u1ed7i: tr\u1ea3 v\u1ec1 **zero values** cho c\u00e1c return kh\u00e1c (th\u01b0\u1eddng v\u1eady \u2014 c\u00f3 ngo\u1ea1i l\u1ec7 v\u1edbi sentinel errors)\n- Error message: **kh\u00f4ng vi\u1ebft hoa**, **kh\u00f4ng k\u1ebft th\u00fac b\u1eb1ng d\u1ea5u c\u00e2u ho\u1eb7c newline**\n\n### G\u1ecdi h\u00e0m v\u00e0 ki\u1ec3m tra error\n\n```go\nfunc main() {\n    numerator := 20\n    denominator := 3\n    remainder, mod, err := calcRemainderAndMod(numerator, denominator)\n    if err != nil {\n        fmt.Println(err)\n        os.Exit(1)\n    }\n    fmt.Println(remainder, mod)\n}\n```\n\n**Visual pattern \u2014 \"golden path\":**\n```\n// Error handling: th\u1ee5t v\u00e0o b\u00ean trong if\nif err != nil {\n    // handle error\n}\n// Business logic: th\u1eb3ng, kh\u00f4ng th\u1ee5t\ndoWork()\n```\n\n### error interface\n\n```go\n// error l\u00e0 built-in interface\ntype error interface {\n    Error() string\n}\n```\n\n`nil` l\u00e0 zero value c\u1ee7a m\u1ecdi interface type \u2014 \u0111\u00f3 l\u00e0 l\u00fd do `return nil` ngh\u0129a l\u00e0 \"kh\u00f4ng c\u00f3 l\u1ed7i\".\n\n### T\u1ea1i sao kh\u00f4ng d\u00f9ng exceptions?\n\n**L\u00fd do 1: Exceptions t\u1ea1o ra hidden code paths**\n- Java: throw c\u00f3 th\u1ec3 xu\u1ea5t hi\u1ec7n \u1edf b\u1ea5t k\u1ef3 \u0111\u00e2u, kh\u00f4ng khai b\u00e1o r\u00f5 r\u00e0ng\n- D\u1ec5 b\u1ecf s\u00f3t \u2192 crash b\u1ea5t ng\u1edd ho\u1eb7c data kh\u00f4ng h\u1ee3p l\u1ec7\n\n**L\u00fd do 2: Go compiler \u00e9p bu\u1ed9c \u0111\u1ecdc bi\u1ebfn**\n- Compiler y\u00eau c\u1ea7u m\u1ecdi variable ph\u1ea3i \u0111\u01b0\u1ee3c \u0111\u1ecdc \u00edt nh\u1ea5t m\u1ed9t l\u1ea7n\n- Error l\u00e0 returned value \u2192 ph\u1ea3i x\u1eed l\u00fd ho\u1eb7c explicitly d\u00f9ng `_` \u0111\u1ec3 ignore\n- Kh\u00f4ng th\u1ec3 \"v\u00f4 t\u00ecnh\" b\u1ecf qua error\n\n```go\n// Explicitly ignore error (ph\u1ea3i c\u1ed1 \u00fd)\nresult, _ := someFunc()\n\n// Nh\u01b0ng Go kh\u00f4ng ki\u1ec3m tra xem b\u1ea1n c\u00f3 \u0110\u1eccC err sau khi g\u00e1n kh\u00f4ng\n// \u0110\u1ec3 catch n\u00e0y, d\u00f9ng staticcheck tool\n```\n\n> **So s\u00e1nh v\u1edbi Java:**\n> ```java\n> // Java \u2014 c\u00f3 th\u1ec3 qu\u00ean catch\n> int result = divide(a, b);  // n\u1ebfu throw, crash kh\u00f4ng r\u00f5 r\u00e0ng\n>\n> // Go \u2014 compiler b\u1eaft bu\u1ed9c x\u1eed l\u00fd\n> result, err := divide(a, b)\n> if err != nil { ... }  // ph\u1ea3i c\u00f3, kh\u00f4ng l\u00e0 compiler error (n\u1ebfu err b\u1ecb declare nh\u01b0ng kh\u00f4ng \u0111\u1ecdc)\n> ```\n\n---\n\n## 2. T\u1ea1o Errors t\u1eeb String\n\n### C\u00e1ch 1: `errors.New`\n\n```go\nfunc doubleEven(i int) (int, error) {\n    if i%2 != 0 {\n        return 0, errors.New(\"only even numbers are processed\")\n    }\n    return i * 2, nil\n}\n\nfunc main() {\n    result, err := doubleEven(1)\n    if err != nil {\n        fmt.Println(err)  // in ra: \"only even numbers are processed\"\n    }\n    fmt.Println(result)\n}\n```\n\n### C\u00e1ch 2: `fmt.Errorf` \u2014 th\u00eam runtime info\n\n```go\nfunc doubleEven(i int) (int, error) {\n    if i%2 != 0 {\n        return 0, fmt.Errorf(\"%d isn't an even number\", i)\n    }\n    return i * 2, nil\n}\n```\n\n`fmt.Errorf` gi\u1ed1ng `fmt.Sprintf` nh\u01b0ng tr\u1ea3 v\u1ec1 `error` thay v\u00ec `string`.\n\n> **So s\u00e1nh v\u1edbi Java:**\n> ```java\n> throw new IllegalArgumentException(i + \" isn't an even number\");\n>\n> // Go:\n> return 0, fmt.Errorf(\"%d isn't an even number\", i)\n> ```\n\n---\n\n## 3. Sentinel Errors\n\n**Sentinel error** l\u00e0 error \u0111\u1eb7c bi\u1ec7t \u0111\u01b0\u1ee3c khai b\u00e1o \u1edf package level \u2014 b\u00e1o hi\u1ec7u r\u1eb1ng x\u1eed l\u00fd kh\u00f4ng th\u1ec3 ti\u1ebfp t\u1ee5c v\u00ec tr\u1ea1ng th\u00e1i hi\u1ec7n t\u1ea1i.\n\n```go\n// Khai b\u00e1o \u1edf package level\nvar ErrDivisionByZero = errors.New(\"division by zero\")\nvar ErrNegativeNumber = errors.New(\"negative number not allowed\")\n\n// S\u1eed d\u1ee5ng\nfunc divide(a, b int) (int, error) {\n    if b == 0 {\n        return 0, ErrDivisionByZero\n    }\n    return a / b, nil\n}\n\n// Ki\u1ec3m tra b\u1eb1ng ==\nresult, err := divide(10, 0)\nif err == ErrDivisionByZero {\n    fmt.Println(\"Cannot divide by zero!\")\n}\n```\n\n**V\u00ed d\u1ee5 t\u1eeb standard library:**\n\n```go\n// archive/zip package\n_, err := zip.NewReader(notAZipFile, int64(len(data)))\nif err == zip.ErrFormat {\n    fmt.Println(\"Not a valid ZIP file\")\n}\n\n// io package\nif err == io.EOF {\n    // end of file reached\n}\n```\n\n**Quy t\u1eafc \u0111\u1eb7t t\u00ean:** B\u1eaft \u0111\u1ea7u b\u1eb1ng `Err` (ngo\u1ea1i l\u1ec7: `io.EOF`).\n\n**Convention:** Coi sentinel errors l\u00e0 read-only \u2014 kh\u00f4ng bao gi\u1edd g\u00e1n l\u1ea1i gi\u00e1 tr\u1ecb.\n\n### Khi n\u00e0o d\u00f9ng sentinel errors?\n\n- Khi c\u00f3 tr\u1ea1ng th\u00e1i l\u1ed7i **c\u1ee5 th\u1ec3** m\u00e0 caller c\u1ea7n x\u1eed l\u00fd kh\u00e1c nhau\n- Khi kh\u00f4ng c\u00f3 th\u00eam information n\u00e0o c\u1ea7n \u0111\u00ednh k\u00e8m\n- Khi error \u0111\u00f3 l\u00e0 **public API** \u2192 cam k\u1ebft gi\u1eef nguy\u00ean trong t\u01b0\u01a1ng lai\n\n**C\u1ea9n th\u1eadn:** M\u1ed9t khi \u0111\u00e3 export sentinel error, n\u00f3 l\u00e0 ph\u1ea7n c\u1ee7a public API \u2014 kh\u00f4ng th\u1ec3 x\u00f3a m\u00e0 kh\u00f4ng breaking backward compatibility.\n\n### Constant Errors (kh\u00f4ng idiomatic)\n\n```go\n// \u0110\u1ec1 xu\u1ea5t nh\u01b0ng kh\u00f4ng ph\u1ed5 bi\u1ebfn\ntype Sentinel string\nfunc (s Sentinel) Error() string { return string(s) }\n\nconst ErrFoo = Sentinel(\"foo error\")\n\n// V\u1ea5n \u0111\u1ec1: 2 errors t\u1eeb 2 package kh\u00e1c nhau c\u00f3 th\u1ec3 b\u1eb1ng nhau n\u1ebfu c\u00f9ng string\n// \u2192 kh\u00f4ng idiomatic, kh\u00f4ng d\u00f9ng trong production\n```\n\n---\n\n## 4. Errors Are Values \u2014 Custom Error Types\n\nV\u00ec `error` l\u00e0 interface, b\u1ea1n c\u00f3 th\u1ec3 t\u1ea1o custom error type ch\u1ee9a th\u00eam th\u00f4ng tin.\n\n### \u0110\u1ecbnh ngh\u0129a custom error\n\n```go\ntype Status int\n\nconst (\n    InvalidLogin Status = iota + 1  // 1\n    NotFound                         // 2\n)\n\ntype StatusErr struct {\n    Status  Status\n    Message string\n}\n\n// Implement error interface\nfunc (se StatusErr) Error() string {\n    return se.Message\n}\n```\n\n### S\u1eed d\u1ee5ng custom error\n\n```go\nfunc LoginAndGetData(uid, pwd, file string) ([]byte, error) {\n    token, err := login(uid, pwd)\n    if err != nil {\n        return nil, StatusErr{\n            Status:  InvalidLogin,\n            Message: fmt.Sprintf(\"invalid credentials for user %s\", uid),\n        }\n    }\n    data, err := getData(token, file)\n    if err != nil {\n        return nil, StatusErr{\n            Status:  NotFound,\n            Message: fmt.Sprintf(\"file %s not found\", file),\n        }\n    }\n    return data, nil\n}\n```\n\n**Quan tr\u1ecdng:** Lu\u00f4n d\u00f9ng `error` l\u00e0m return type \u2014 kh\u00f4ng d\u00f9ng concrete type. \u0110i\u1ec1u n\u00e0y cho ph\u00e9p tr\u1ea3 v\u1ec1 nhi\u1ec1u lo\u1ea1i error kh\u00e1c nhau.\n\n### GOTCHA: Uninitialized custom error\n\n```go\n// BUG: GenerateErrorBroken tr\u1ea3 v\u1ec1 non-nil d\u00f9 kh\u00f4ng c\u00f3 l\u1ed7i!\nfunc GenerateErrorBroken(flag bool) error {\n    var genErr StatusErr  // zero value c\u1ee7a StatusErr\n    if flag {\n        genErr = StatusErr{Status: NotFound}\n    }\n    return genErr  // L\u1ed6I: lu\u00f4n non-nil d\u00f9 flag = false!\n}\n\n// T\u1ea1i sao? Interface c\u00f3 2 ph\u1ea7n: (type, value)\n// genErr c\u00f3 type = StatusErr, value = zero \u2192 (StatusErr, zero) \u2260 nil\n```\n\n**K\u1ebft qu\u1ea3:**\n```go\nerr := GenerateErrorBroken(true)\nfmt.Println(err != nil)  // true \u2713\n\nerr = GenerateErrorBroken(false)\nfmt.Println(err != nil)  // true \u2190 SAI! Ph\u1ea3i l\u00e0 false\n```\n\n**Fix 1: Explicit return nil**\n```go\nfunc GenerateErrorOKReturnNil(flag bool) error {\n    if flag {\n        return StatusErr{Status: NotFound}\n    }\n    return nil  // explicit nil \u2014 \u0111\u00fang\n}\n```\n\n**Fix 2: Khai b\u00e1o variable l\u00e0 `error` type**\n```go\nfunc GenerateErrorUseErrorVar(flag bool) error {\n    var genErr error  // type l\u00e0 error interface, kh\u00f4ng ph\u1ea3i StatusErr\n    if flag {\n        genErr = StatusErr{Status: NotFound}\n    }\n    return genErr  // genErr l\u00e0 nil v\u00ec (nil, nil) = nil interface\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java kh\u00f4ng c\u00f3 v\u1ea5n \u0111\u1ec1 n\u00e0y \u2014 null l\u00e0 null. Go interface c\u00f3 2 ph\u1ea7n (type, value) n\u00ean c\u1ea7n c\u1ea9n th\u1eadn.\n\n---\n\n## 5. Wrapping Errors\n\n**Wrapping** = b\u1ecdc error g\u1ed1c trong m\u1ed9t error m\u1edbi, th\u00eam context, nh\u01b0ng v\u1eabn gi\u1eef error g\u1ed1c \u0111\u1ec3 caller c\u00f3 th\u1ec3 inspect.\n\n### Wrap v\u1edbi `fmt.Errorf` v\u00e0 `%w`\n\n```go\nfunc fileChecker(name string) error {\n    f, err := os.Open(name)\n    if err != nil {\n        return fmt.Errorf(\"in fileChecker: %w\", err)  // %w wrap error\n    }\n    f.Close()\n    return nil\n}\n\nfunc main() {\n    err := fileChecker(\"not_here.txt\")\n    if err != nil {\n        fmt.Println(err)\n        // \"in fileChecker: open not_here.txt: no such file or directory\"\n\n        if wrappedErr := errors.Unwrap(err); wrappedErr != nil {\n            fmt.Println(wrappedErr)\n            // \"open not_here.txt: no such file or directory\"\n        }\n    }\n}\n```\n\n**Convention:** Vi\u1ebft `: %w` \u1edf **cu\u1ed1i** format string, wrapped error l\u00e0 **tham s\u1ed1 cu\u1ed1i**.\n\n### Custom error v\u1edbi Unwrap\n\n```go\ntype StatusErr struct {\n    Status  Status\n    Message string\n    Err     error  // th\u00eam field \u0111\u1ec3 wrap error g\u1ed1c\n}\n\nfunc (se StatusErr) Error() string { return se.Message }\n\n// Implement Unwrap \u0111\u1ec3 h\u1ed7 tr\u1ee3 errors.Is v\u00e0 errors.As\nfunc (se StatusErr) Unwrap() error { return se.Err }\n```\n\n### Khi n\u00e0o KH\u00d4NG wrap\n\n```go\n// D\u00f9ng %v thay v\u00ec %w \u0111\u1ec3 KH\u00d4NG wrap\n// Khi mu\u1ed1n t\u1ea1o error message m\u1edbi t\u1eeb error c\u0169 m\u00e0 kh\u00f4ng mu\u1ed1n caller inspect b\u00ean trong\nerr := internalFunction()\nif err != nil {\n    return fmt.Errorf(\"internal failure: %v\", err)  // %v kh\u00f4ng wrap\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:**\n> Java c\u00f3 cause chain: `new Exception(\"wrapper\", cause)` v\u00e0 `e.getCause()`\n> Go: `fmt.Errorf(\"%w\", err)` v\u00e0 `errors.Unwrap(err)`\n\n---\n\n## 6. Wrapping Multiple Errors\n\n\u0110\u00f4i khi m\u1ed9t function t\u1ea1o ra nhi\u1ec1u l\u1ed7i \u2014 v\u00ed d\u1ee5 validate nhi\u1ec1u fields.\n\n### `errors.Join`\n\n```go\ntype Person struct {\n    FirstName string\n    LastName  string\n    Age       int\n}\n\nfunc ValidatePerson(p Person) error {\n    var errs []error\n    if len(p.FirstName) == 0 {\n        errs = append(errs, errors.New(\"field FirstName cannot be empty\"))\n    }\n    if len(p.LastName) == 0 {\n        errs = append(errs, errors.New(\"field LastName cannot be empty\"))\n    }\n    if p.Age < 0 {\n        errs = append(errs, errors.New(\"field Age cannot be negative\"))\n    }\n    if len(errs) > 0 {\n        return errors.Join(errs...)  // merge th\u00e0nh 1 error\n    }\n    return nil\n}\n```\n\n### Nhi\u1ec1u `%w` trong fmt.Errorf\n\n```go\nerr1 := errors.New(\"first error\")\nerr2 := errors.New(\"second error\")\nerr3 := errors.New(\"third error\")\nerr := fmt.Errorf(\"first: %w, second: %w, third: %w\", err1, err2, err3)\n```\n\n### Custom multi-error type\n\n```go\ntype MyError struct {\n    Code   int\n    Errors []error\n}\n\nfunc (m MyError) Error() string {\n    return errors.Join(m.Errors...).Error()\n}\n\nfunc (m MyError) Unwrap() []error {  // tr\u1ea3 v\u1ec1 []error thay v\u00ec error\n    return m.Errors\n}\n```\n\n### X\u1eed l\u00fd error tree ph\u1ee9c t\u1ea1p\n\n```go\nvar err error\nerr = funcThatReturnsAnError()\n\nswitch err := err.(type) {\ncase interface{ Unwrap() error }:\n    // error wrap 1 error kh\u00e1c\n    innerErr := err.Unwrap()\n    _ = innerErr\ncase interface{ Unwrap() []error }:\n    // error wrap nhi\u1ec1u errors\n    innerErrs := err.Unwrap()\n    for _, innerErr := range innerErrs {\n        _ = innerErr\n    }\ndefault:\n    // error kh\u00f4ng wrap g\u00ec\n}\n```\n\n---\n\n## 7. `errors.Is` v\u00e0 `errors.As`\n\nKhi errors b\u1ecb wrap, kh\u00f4ng th\u1ec3 d\u00f9ng `==` hay type assertion tr\u1ef1c ti\u1ebfp. D\u00f9ng `errors.Is` v\u00e0 `errors.As` \u0111\u1ec3 search trong error tree.\n\n### `errors.Is` \u2014 ki\u1ec3m tra sentinel error\n\n```go\nfunc fileChecker(name string) error {\n    f, err := os.Open(name)\n    if err != nil {\n        return fmt.Errorf(\"in fileChecker: %w\", err)  // wrap err\n    }\n    f.Close()\n    return nil\n}\n\nfunc main() {\n    err := fileChecker(\"not_here.txt\")\n    if err != nil {\n        // errors.Is t\u00ecm ki\u1ebfm trong to\u00e0n b\u1ed9 error tree\n        if errors.Is(err, os.ErrNotExist) {\n            fmt.Println(\"That file doesn't exist\")  // in ra d\u00f9 err \u0111\u00e3 b\u1ecb wrap\n        }\n    }\n}\n```\n\n**Custom `Is` method \u2014 cho non-comparable types:**\n\n```go\ntype MyErr struct {\n    Codes []int  // slice kh\u00f4ng comparable\n}\n\nfunc (me MyErr) Error() string { return fmt.Sprintf(\"codes: %v\", me.Codes) }\n\nfunc (me MyErr) Is(target error) bool {\n    if me2, ok := target.(MyErr); ok {\n        return slices.Equal(me.Codes, me2.Codes)\n    }\n    return false\n}\n```\n\n**Pattern matching v\u1edbi custom `Is`:**\n\n```go\ntype ResourceErr struct {\n    Resource string\n    Code     int\n}\n\nfunc (re ResourceErr) Error() string {\n    return fmt.Sprintf(\"%s: %d\", re.Resource, re.Code)\n}\n\nfunc (re ResourceErr) Is(target error) bool {\n    if other, ok := target.(ResourceErr); ok {\n        ignoreResource := other.Resource == \"\"\n        ignoreCode := other.Code == 0\n        matchResource := other.Resource == re.Resource\n        matchCode := other.Code == re.Code\n        return matchResource && matchCode ||\n            matchResource && ignoreCode ||\n            ignoreResource && matchCode\n    }\n    return false\n}\n\n// T\u00ecm t\u1ea5t c\u1ea3 errors li\u00ean quan \u0111\u1ebfn \"Database\", kh\u00f4ng k\u1ec3 code\nif errors.Is(err, ResourceErr{Resource: \"Database\"}) {\n    fmt.Println(\"The database is broken:\", err)\n}\n```\n\n### `errors.As` \u2014 ki\u1ec3m tra theo type\n\n```go\nerr := AFunctionThatReturnsAnError()\n\nvar myErr MyErr\nif errors.As(err, &myErr) {  // pass pointer to zero value\n    fmt.Println(myErr.Codes)  // myErr \u0111\u00e3 \u0111\u01b0\u1ee3c g\u00e1n v\u1edbi error t\u00ecm th\u1ea5y\n}\n```\n\n**V\u1edbi interface:**\n\n```go\nvar coder interface {\n    CodeVals() []int\n}\nif errors.As(err, &coder) {\n    fmt.Println(coder.CodeVals())\n}\n```\n\n**Rule:** Tham s\u1ed1 th\u1ee9 2 c\u1ee7a `errors.As` ph\u1ea3i l\u00e0 pointer to error ho\u1eb7c pointer to interface \u2014 n\u1ebfu kh\u00f4ng s\u1ebd **panic**.\n\n### T\u1ed5ng k\u1ebft Is vs As\n\n| | `errors.Is` | `errors.As` |\n|---|---|---|\n| M\u1ee5c \u0111\u00edch | T\u00ecm specific instance/value | T\u00ecm specific type |\n| Tham s\u1ed1 2 | Sentinel error instance | Pointer to zero value |\n| D\u00f9ng khi | Ki\u1ec3m tra sentinel errors | Ki\u1ec3m tra custom error type |\n\n> **So s\u00e1nh v\u1edbi Java:**\n> ```java\n> // Java \u2014 catch theo type\n> try { ... }\n> catch (FileNotFoundException e) { ... }  // = errors.As\n> catch (IllegalArgumentException e) { ... }\n>\n> // Go\n> var notFound *os.PathError\n> if errors.As(err, &notFound) { ... }\n> ```\n\n---\n\n## 8. Wrapping Errors v\u1edbi `defer`\n\nKhi nhi\u1ec1u errors trong c\u00f9ng m\u1ed9t function \u0111\u1ec1u c\u1ea7n wrap v\u1edbi c\u00f9ng message:\n\n### C\u00e1ch th\u00f4ng th\u01b0\u1eddng \u2014 l\u1eb7p code\n\n```go\nfunc DoSomeThings(val1 int, val2 string) (string, error) {\n    val3, err := doThing1(val1)\n    if err != nil {\n        return \"\", fmt.Errorf(\"in DoSomeThings: %w\", err)  // l\u1eb7p\n    }\n    val4, err := doThing2(val2)\n    if err != nil {\n        return \"\", fmt.Errorf(\"in DoSomeThings: %w\", err)  // l\u1eb7p\n    }\n    result, err := doThing3(val3, val4)\n    if err != nil {\n        return \"\", fmt.Errorf(\"in DoSomeThings: %w\", err)  // l\u1eb7p\n    }\n    return result, nil\n}\n```\n\n### C\u00e1ch d\u00f9ng `defer` \u2014 g\u1ecdn h\u01a1n\n\n```go\nfunc DoSomeThings(val1 int, val2 string) (_ string, err error) {\n    // defer closure wrap error tr\u01b0\u1edbc khi return\n    defer func() {\n        if err != nil {\n            err = fmt.Errorf(\"in DoSomeThings: %w\", err)\n        }\n    }()\n\n    val3, err := doThing1(val1)\n    if err != nil {\n        return \"\", err  // defer s\u1ebd wrap tr\u01b0\u1edbc khi return\n    }\n    val4, err := doThing2(val2)\n    if err != nil {\n        return \"\", err\n    }\n    return doThing3(val3, val4)\n}\n```\n\n**L\u01b0u \u00fd c\u00fa ph\u00e1p:**\n- `(_ string, err error)` \u2014 ph\u1ea3i \u0111\u1eb7t t\u00ean return values\n- `_` cho string v\u00ec kh\u00f4ng c\u1ea7n assign trong defer\n- `err` cho error v\u00ec defer closure c\u1ea7n refer \u0111\u1ebfn n\u00f3\n\n---\n\n## 9. `panic` v\u00e0 `recover`\n\n### panic l\u00e0 g\u00ec?\n\n`panic` x\u1ea3y ra khi Go runtime kh\u00f4ng bi\u1ebft ph\u1ea3i l\u00e0m g\u00ec ti\u1ebfp theo:\n- Index out of bounds\n- Nil pointer dereference\n- Division by zero (v\u1edbi integer)\n- Type assertion th\u1ea5t b\u1ea1i (kh\u00f4ng d\u00f9ng comma-ok)\n\n> **So s\u00e1nh v\u1edbi Java:** panic \u2248 `Error` (RuntimeException) trong Java \u2014 runtime errors m\u00e0 th\u01b0\u1eddng do l\u1ed7i l\u1eadp tr\u00ecnh.\n\n### Khi panic x\u1ea3y ra\n\n1. Function hi\u1ec7n t\u1ea1i **tho\u00e1t ngay l\u1eadp t\u1ee9c**\n2. C\u00e1c `defer` c\u1ee7a function \u0111\u00f3 ch\u1ea1y\n3. `defer` c\u1ee7a caller ch\u1ea1y, ti\u1ebfp t\u1ee5c l\u00ean tr\u00ean\n4. \u0110\u1ebfn `main` \u2192 **ch\u01b0\u01a1ng tr\u00ecnh k\u1ebft th\u00fac** v\u1edbi message v\u00e0 stack trace\n\n```go\nfunc doPanic(msg string) {\n    panic(msg)\n}\n\nfunc main() {\n    doPanic(\"something went wrong\")\n}\n```\n\nOutput:\n```\npanic: something went wrong\n\ngoroutine 1 [running]:\nmain.doPanic(...)\n    /tmp/prog.go:6\nmain.main()\n    /tmp/prog.go:10 +0x5f\n```\n\n### `recover` \u2014 b\u1eaft panic\n\n```go\nfunc div60(i int) {\n    defer func() {\n        if v := recover(); v != nil {  // recover() tr\u1ea3 v\u1ec1 panic value\n            fmt.Println(v)\n        }\n    }()\n    fmt.Println(60 / i)\n}\n\nfunc main() {\n    for _, val := range []int{1, 2, 0, 6} {\n        div60(val)\n    }\n}\n```\n\nOutput:\n```\n60\n30\nruntime error: integer divide by zero\n10\n```\n\n**Pattern cho recover:**\n1. D\u00f9ng `defer` \u0111\u1ec3 \u0111\u0103ng k\u00fd closure\n2. G\u1ecdi `recover()` trong `if` statement b\u00ean trong defer\n3. Ki\u1ec3m tra gi\u00e1 tr\u1ecb non-nil (nil = kh\u00f4ng c\u00f3 panic)\n4. **Ph\u1ea3i g\u1ecdi recover t\u1eeb trong defer** \u2014 kh\u00f4ng th\u1ec3 g\u1ecdi t\u1eeb n\u01a1i kh\u00e1c\n\n### panic(nil) \u2014 Go 1.21+\n\n```go\n// Go < 1.21: panic(nil) \u2192 recover() tr\u1ea3 v\u1ec1 nil \u2192 kh\u00f4ng detect \u0111\u01b0\u1ee3c\n// Go >= 1.21: panic(nil) \u2261 panic(new(runtime.PanicNilError))\n// recover() tr\u1ea3 v\u1ec1 *runtime.PanicNilError \u2192 c\u00f3 th\u1ec3 detect\n```\n\n### Khi n\u00e0o d\u00f9ng panic/recover?\n\n**N\u00ean d\u00f9ng panic khi:**\n- L\u1ed7i l\u1eadp tr\u00ecnh nghi\u00eam tr\u1ecdng (programmer error)\n- T\u00ecnh hu\u1ed1ng kh\u00f4ng th\u1ec3 ti\u1ebfp t\u1ee5c (h\u1ebft memory, disk)\n\n**N\u00ean d\u00f9ng recover khi:**\n- Trong **library code** \u2014 kh\u00f4ng \u0111\u1ec3 panic escape ra public API\n- Log v\u00e0 shutdown gracefully khi h\u1ebft resource\n\n**Kh\u00f4ng n\u00ean d\u00f9ng nh\u01b0 exception:**\n```go\n// KH\u00d4NG l\u00e0m th\u1ebf n\u00e0y \u2014 kh\u00f4ng idiomatic\nfunc riskyOperation() {\n    defer func() {\n        if r := recover(); r != nil {\n            // \"x\u1eed l\u00fd\" panic nh\u01b0 exception\n        }\n    }()\n    // ...\n}\n\n// Thay v\u00e0o \u0111\u00f3, return error r\u00f5 r\u00e0ng\nfunc safeOperation() error {\n    if someCondition {\n        return errors.New(\"condition not met\")\n    }\n    return nil\n}\n```\n\n**Library code n\u00ean d\u00f9ng recover:**\n```go\n// Public API c\u1ee7a library kh\u00f4ng n\u00ean \u0111\u1ec3 panic escape\nfunc PublicFunc(input []byte) (result []byte, err error) {\n    defer func() {\n        if r := recover(); r != nil {\n            err = fmt.Errorf(\"unexpected panic: %v\", r)\n        }\n    }()\n    // ... x\u1eed l\u00fd internal\n    return internalProcess(input), nil\n}\n```\n\n> **So s\u00e1nh v\u1edbi Java:**\n> ```java\n> // Java\n> try {\n>     riskyOp();\n> } catch (RuntimeException e) {\n>     // x\u1eed l\u00fd\n> }\n>\n> // Go \u2014 panic/recover kh\u00f4ng d\u00f9ng nh\u01b0 try/catch\n> // Thay v\u00e0o \u0111\u00f3, explicit error handling\n> if err := riskyOp(); err != nil { ... }\n> ```\n\n---\n\n## 10. Stack Trace t\u1eeb Error\n\nGo kh\u00f4ng t\u1ef1 \u0111\u1ed9ng cung c\u1ea5p stack trace trong errors (kh\u00e1c Java).\n\n**C\u00e1ch th\u1ee7 c\u00f4ng: wrap errors v\u1edbi function name**\n```go\nfunc layer3() error { return errors.New(\"root cause\") }\nfunc layer2() error {\n    err := layer3()\n    return fmt.Errorf(\"layer2: %w\", err)\n}\nfunc layer1() error {\n    err := layer2()\n    return fmt.Errorf(\"layer1: %w\", err)\n}\n// K\u1ebft qu\u1ea3: \"layer1: layer2: root cause\"\n```\n\n**Third-party library (cockroachdb/errors):**\n```go\nimport \"github.com/cockroachdb/errors\"\n\nfunc doSomething() error {\n    return errors.New(\"something failed\")  // t\u1ef1 \u0111\u1ed9ng capture stack trace\n}\n\nerr := doSomething()\nfmt.Printf(\"%+v\\n\", err)  // in stack trace v\u1edbi %+v\n```\n\n**Build flag \u0111\u1ec3 \u1ea9n path:**\n```bash\ngo build -trimpath  # thay th\u1ebf full path b\u1eb1ng package name\n```\n\n---\n\n## Exercises\n\n**1. Sentinel error cho invalid ID:**\n```go\nvar ErrInvalidID = errors.New(\"invalid employee ID\")\n\nfunc GetEmployee(id int) (Employee, error) {\n    if id <= 0 {\n        return Employee{}, ErrInvalidID\n    }\n    // ...\n    return emp, nil\n}\n\nfunc main() {\n    _, err := GetEmployee(-1)\n    if errors.Is(err, ErrInvalidID) {\n        fmt.Println(\"Error: invalid ID provided\")\n    }\n}\n```\n\n**2. Custom error type cho empty field:**\n```go\ntype EmptyFieldError struct {\n    FieldName string\n}\n\nfunc (e EmptyFieldError) Error() string {\n    return fmt.Sprintf(\"field %s cannot be empty\", e.FieldName)\n}\n\nfunc ValidateEmployee(e Employee) error {\n    if e.FirstName == \"\" {\n        return EmptyFieldError{FieldName: \"FirstName\"}\n    }\n    if e.LastName == \"\" {\n        return EmptyFieldError{FieldName: \"LastName\"}\n    }\n    return nil\n}\n\nfunc main() {\n    err := ValidateEmployee(Employee{})\n    var fieldErr EmptyFieldError\n    if errors.As(err, &fieldErr) {\n        fmt.Printf(\"Validation failed: field '%s' is required\\n\", fieldErr.FieldName)\n    }\n}\n```\n\n**3. Return t\u1ea5t c\u1ea3 validation errors:**\n```go\nfunc ValidateEmployee(e Employee) error {\n    var errs []error\n    if e.FirstName == \"\" {\n        errs = append(errs, EmptyFieldError{FieldName: \"FirstName\"})\n    }\n    if e.LastName == \"\" {\n        errs = append(errs, EmptyFieldError{FieldName: \"LastName\"})\n    }\n    if e.ID <= 0 {\n        errs = append(errs, ErrInvalidID)\n    }\n    if len(errs) > 0 {\n        return errors.Join(errs...)\n    }\n    return nil\n}\n\nfunc main() {\n    err := ValidateEmployee(Employee{})\n    if err != nil {\n        // In t\u1ea5t c\u1ea3 errors\n        fmt.Println(\"Validation errors:\", err)\n\n        // Ki\u1ec3m tra t\u1eebng lo\u1ea1i\n        var fieldErr EmptyFieldError\n        if errors.As(err, &fieldErr) {\n            fmt.Println(\"Empty field:\", fieldErr.FieldName)\n        }\n        if errors.Is(err, ErrInvalidID) {\n            fmt.Println(\"Invalid ID\")\n        }\n    }\n}\n```\n\n---\n\n## Wrapping Up\n\nB\u1ea1n \u0111\u00e3 h\u1ecdc:\n- **Error l\u00e0 returned value** \u2014 kh\u00f4ng ph\u1ea3i exception; caller ph\u1ea3i check `if err != nil`\n- **`errors.New` v\u00e0 `fmt.Errorf`** \u2014 t\u1ea1o simple errors; `%w` \u0111\u1ec3 wrap\n- **Sentinel errors** \u2014 package-level variables cho specific error states; ki\u1ec3m tra b\u1eb1ng `==`\n- **Custom error types** \u2014 implement `error` interface; tr\u00e1nh uninitialized instance gotcha\n- **Error wrapping** \u2014 `fmt.Errorf(\"%w\", err)` th\u00eam context; `Unwrap()` method cho custom types\n- **Multiple errors** \u2014 `errors.Join`, nhi\u1ec1u `%w` trong fmt.Errorf\n- **`errors.Is`** \u2014 t\u00ecm sentinel error trong error tree\n- **`errors.As`** \u2014 t\u00ecm custom error type trong error tree; tr\u1ea3 v\u1ec1 typed value\n- **defer + wrap** \u2014 pattern \u0111\u1ec3 wrap t\u1ea5t c\u1ea3 errors trong function v\u1edbi c\u00f9ng context\n- **panic/recover** \u2014 d\u00f9ng cho programmer errors, kh\u00f4ng thay th\u1ebf exception handling; library n\u00ean d\u00f9ng recover \u0111\u1ec3 protect public API\n\n**Ch\u01b0\u01a1ng ti\u1ebfp theo:** Modules, Packages, and Imports \u2014 c\u00e1ch t\u1ed5 ch\u1ee9c code v\u00e0 d\u00f9ng third-party libraries.\n\n\n# Chapter 10. Modules, Packages, and Imports\n\n## Gi\u1edbi thi\u1ec7u\n\nGo c\u00f3 h\u1ec7 th\u1ed1ng t\u1ed5 ch\u1ee9c code d\u1ef1a tr\u00ean 3 kh\u00e1i ni\u1ec7m: **repository**, **module**, v\u00e0 **package**. Ch\u01b0\u01a1ng n\u00e0y gi\u1ea3i th\u00edch c\u00e1ch t\u1ed5 ch\u1ee9c code, d\u00f9ng third-party libraries, v\u00e0 publish module c\u1ee7a m\u00ecnh.\n\n> **So s\u00e1nh v\u1edbi Java:**\n> | Kh\u00e1i ni\u1ec7m | Java | Go |\n> |---|---|---|\n> | N\u01a1i l\u01b0u tr\u1eef nhi\u1ec1u artifact | Repository (Maven Central) | Repository (GitHub) |\n> | \u0110\u01a1n v\u1ecb ph\u00e2n ph\u1ed1i c\u00f3 version | artifact / JAR | module |\n> | Namespace t\u1ed5 ch\u1ee9c code | package | package |\n> | Unique identifier | `com.company.project` | `github.com/user/repo` |\n\n---\n\n## 1. Repositories, Modules, v\u00e0 Packages\n\n```\nRepository (GitHub)\n\u2514\u2500\u2500 Module (go.mod \u2014 github.com/user/myapp)\n    \u251c\u2500\u2500 package main        (main.go)\n    \u251c\u2500\u2500 package math        (math/math.go)\n    \u2514\u2500\u2500 package format      (do-format/formatter.go)\n```\n\n- **Repository**: n\u01a1i l\u01b0u source code (GitHub, GitLab\u2026)\n- **Module**: bundle code \u0111\u01b0\u1ee3c distribute v\u00e0 version c\u00f9ng nhau \u2014 1 module = 1 `go.mod`\n- **Package**: th\u01b0 m\u1ee5c source code \u2014 \u0111\u01a1n v\u1ecb t\u1ed5 ch\u1ee9c trong module\n\n**Module path** = globally unique identifier, th\u01b0\u1eddng d\u1ef1a tr\u00ean repository URL:\n```\ngithub.com/jonbodner/proteus\ngithub.com/shopspring/decimal\n```\n\n> **L\u01b0u \u00fd:** Kh\u00f4ng n\u00ean \u0111\u1eb7t nhi\u1ec1u module trong c\u00f9ng m\u1ed9t repository \u2014 ch\u00fang s\u1ebd c\u1ea7n version ri\u00eang bi\u1ec7t, g\u00e2y ph\u1ee9c t\u1ea1p.\n\n---\n\n## 2. `go.mod` \u2014 C\u1ea5u tr\u00fac v\u00e0 Ch\u1ec9 th\u1ecb\n\n### T\u1ea1o module\n\n```bash\ngo mod init github.com/yourname/myproject\n```\n\nT\u1ea1o file `go.mod` trong th\u01b0 m\u1ee5c hi\u1ec7n t\u1ea1i.\n\n### C\u1ea5u tr\u00fac go.mod\n\n```\nmodule github.com/learning-go-book-2e/money\n\ngo 1.21\n\nrequire (\n    github.com/learning-go-book-2e/formatter v0.0.0-20220918024742-18...\n    github.com/shopspring/decimal v1.3.1\n)\n\nrequire (\n    github.com/fatih/color v1.13.0 // indirect\n    github.com/mattn/go-colorable v0.1.9 // indirect\n    github.com/mattn/go-isatty v0.0.14 // indirect\n    golang.org/x/sys v0.0.0-20210630005230-0f9fa26af87c // indirect\n)\n```\n\n**C\u00e1c ch\u1ec9 th\u1ecb:**\n\n| Ch\u1ec9 th\u1ecb | \u00dd ngh\u0129a |\n|---|---|\n| `module` | Module path \u2014 globally unique identifier |\n| `go` | Phi\u00ean b\u1ea3n Go t\u1ed1i thi\u1ec3u y\u00eau c\u1ea7u |\n| `require` | Dependencies v\u00e0 version |\n| `replace` | Override m\u1ed9t module b\u1eb1ng fork ho\u1eb7c local path |\n| `exclude` | Ch\u1eb7n kh\u00f4ng d\u00f9ng version c\u1ee5 th\u1ec3 c\u1ee7a module |\n| `retract` | \u0110\u00e1nh d\u1ea5u version kh\u00f4ng n\u00ean d\u00f9ng (d\u00e0nh cho ng\u01b0\u1eddi publish) |\n\n### `go` directive v\u00e0 toolchain\n\n```\ngo 1.21      # y\u00eau c\u1ea7u Go 1.21\ntoolchain go1.21.0  # toolchain c\u1ee5 th\u1ec3\n```\n\n**H\u00e0nh vi khi version kh\u00f4ng kh\u1edbp:**\n- Go \u2264 1.20: b\u1ecf qua version m\u1edbi, d\u00f9ng b\u1ea3n \u0111ang c\u00e0i\n- Go \u2265 1.21: **t\u1ef1 \u0111\u1ed9ng download** version m\u1edbi h\u01a1n (n\u1ebfu c\u1ea7n)\n\n```bash\nGOTOOLCHAIN=go1.18 go build   # build v\u1edbi Go 1.18 c\u1ee5 th\u1ec3\nGOTOOLCHAIN=local go build    # d\u00f9ng version \u0111ang c\u00e0i, kh\u00f4ng download\n```\n\n**Go 1.22 \u2014 breaking change trong for loop:**\n```go\n// go.mod: go 1.21 \u2192 c\u00f9ng \u0111\u1ecba ch\u1ec9 memory cho v\nx := []int{1, 2, 3, 4, 5}\nfor _, v := range x {\n    fmt.Printf(\"%p\\n\", &v)  // in c\u00f9ng \u0111\u1ecba ch\u1ec9 5 l\u1ea7n\n}\n\n// go.mod: go 1.22 \u2192 \u0111\u1ecba ch\u1ec9 memory m\u1edbi m\u1ed7i iteration\n// Gi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1 closure-in-loop l\u00e2u nay!\n```\n\n---\n\n## 3. Importing v\u00e0 Exporting\n\n### Export b\u1eb1ng ch\u1eef hoa\n\n```go\n// EXPORTED \u2014 c\u00f3 th\u1ec3 d\u00f9ng t\u1eeb package kh\u00e1c\nfunc Double(a int) int { return a * 2 }\ntype User struct { Name string }\nconst MaxRetries = 3\n\n// unexported \u2014 ch\u1ec9 d\u00f9ng trong package n\u00e0y\nfunc helper() {}\ntype internalState struct {}\nvar counter int\n```\n\n**Quy t\u1eafc:**\n- **Ch\u1eef hoa** \u2192 exported (public API)\n- **Ch\u1eef th\u01b0\u1eddng** \u2192 unexported (private)\n- Kh\u00f4ng c\u00f3 keyword `public`/`private` nh\u01b0 Java\n\n> **So s\u00e1nh v\u1edbi Java:**\n> ```java\n> // Java \u2014 explicit keywords\n> public class User {}\n> private void helper() {}\n>\n> // Go \u2014 capitalization quy\u1ebft \u0111\u1ecbnh\n> type User struct {}    // exported\n> func helper() {}      // unexported\n> ```\n\n### T\u1ea1o v\u00e0 Import Package\n\n**C\u1ea5u tr\u00fac th\u01b0 m\u1ee5c:**\n```\npackage_example/\n\u251c\u2500\u2500 go.mod\n\u251c\u2500\u2500 main.go\n\u251c\u2500\u2500 math/\n\u2502   \u2514\u2500\u2500 math.go\n\u2514\u2500\u2500 do-format/\n    \u2514\u2500\u2500 formatter.go\n```\n\n**math/math.go:**\n```go\npackage math\n\nfunc Double(a int) int {\n    return a * 2\n}\n```\n\n**do-format/formatter.go:**\n```go\npackage format   // t\u00ean package kh\u00e1c t\u00ean th\u01b0 m\u1ee5c (do-format kh\u00f4ng ph\u1ea3i identifier h\u1ee3p l\u1ec7)\n\nimport \"fmt\"\n\nfunc Number(num int) string {\n    return fmt.Sprintf(\"The number is %d\", num)\n}\n```\n\n**main.go:**\n```go\npackage main\n\nimport (\n    \"fmt\"\n\n    \"github.com/learning-go-book-2e/package_example/do-format\"  // import path\n    \"github.com/learning-go-book-2e/package_example/math\"\n)\n\nfunc main() {\n    num := math.Double(2)          // d\u00f9ng package name: math.Double\n    output := format.Number(num)   // d\u00f9ng package clause name: format (kh\u00f4ng ph\u1ea3i do-format)\n    fmt.Println(output)\n}\n```\n\n**Quan tr\u1ecdng:**\n- Import path = module path + path to directory\n- Package name \u0111\u01b0\u1ee3c l\u1ea5y t\u1eeb **package clause** (d\u00f2ng `package xxx`), kh\u00f4ng ph\u1ea3i t\u00ean th\u01b0 m\u1ee5c\n- Compile error n\u1ebfu import package m\u00e0 **kh\u00f4ng d\u00f9ng** identifier n\u00e0o\n\n---\n\n## 4. \u0110\u1eb7t t\u00ean Package\n\n**Quy t\u1eafc:**\n- T\u00ean **ng\u1eafn g\u1ecdn, m\u00f4 t\u1ea3** ch\u1ee9c n\u0103ng\n- Tr\u00e1nh t\u00ean chung chung nh\u01b0 `util`, `common`, `helper`\n- Kh\u00f4ng l\u1eb7p l\u1ea1i t\u00ean package trong t\u00ean function\n\n```go\n// BAD: util.ExtractNames, util.FormatNames\n// Kh\u00f4ng bi\u1ebft util l\u00e0m g\u00ec\n\n// BETTER: extract.Names, format.Names\n// Nh\u01b0ng v\u1eabn ch\u01b0a t\u1ed1t v\u00ec 2 package cho 1 vi\u1ec7c\n\n// BEST: names.Extract, names.Format\n// Package names \u2014 noun; functions Extract/Format \u2014 verb\n```\n\n**Tr\u00e1nh tr\u00f9ng t\u00ean:**\n```go\n// BAD \u2014 l\u1eb7p t\u00ean package trong function\npackage names\nfunc NamesExtract() {}  // g\u1ecdi l\u00e0 names.NamesExtract \u2014 th\u1eeba \"names\"\n\n// GOOD\nfunc Extract() {}  // g\u1ecdi l\u00e0 names.Extract\n```\n\n**Ngo\u1ea1i l\u1ec7:** `sort.Sort`, `context.Context` \u2014 khi t\u00ean identifier == t\u00ean package.\n\n---\n\n## 5. Override T\u00ean Package (Import Alias)\n\nKhi hai package c\u00f3 c\u00f9ng t\u00ean:\n\n```go\nimport (\n    crand \"crypto/rand\"    // \u0111\u1eb7t alias crand\n    \"encoding/binary\"\n    \"fmt\"\n    \"math/rand\"            // d\u00f9ng t\u00ean m\u1eb7c \u0111\u1ecbnh rand\n)\n\nfunc seedRand() *rand.Rand {\n    var b [8]byte\n    _, err := crand.Read(b[:])   // d\u00f9ng alias\n    if err != nil {\n        panic(\"cannot seed with cryptographic random number generator\")\n    }\n    r := rand.New(rand.NewSource(int64(binary.LittleEndian.Uint64(b[:]))))\n    return r\n}\n```\n\n**C\u00e1c alias \u0111\u1eb7c bi\u1ec7t:**\n```go\nimport . \"fmt\"    // import t\u1ea5t c\u1ea3 v\u00e0o namespace hi\u1ec7n t\u1ea1i \u2014 KH\u00d4NG khuy\u1ebfn kh\u00edch\nimport _ \"fmt\"    // blank import \u2014 ch\u1ec9 ch\u1ea1y init(), kh\u00f4ng d\u00f9ng identifier\n```\n\n---\n\n## 6. Go Doc Comments\n\nGo t\u1ef1 \u0111\u1ed9ng sinh documentation t\u1eeb comments theo format chu\u1ea9n.\n\n**Quy t\u1eafc:**\n- Comment ngay tr\u01b0\u1edbc declaration, **kh\u00f4ng c\u00f3 d\u00f2ng tr\u1ed1ng** gi\u1eefa\n- B\u1eaft \u0111\u1ea7u m\u1ed7i d\u00f2ng b\u1eb1ng `//` + space\n- D\u00f2ng \u0111\u1ea7u ti\u00ean: b\u1eaft \u0111\u1ea7u b\u1eb1ng t\u00ean symbol\n- D\u00f2ng tr\u1ed1ng (ch\u1ec9 `//`) \u0111\u1ec3 t\u00e1ch paragraph\n\n```go\n// Package convert provides various utilities to\n// make it easy to convert money from one currency to another.\npackage convert\n\n// Money represents the combination of an amount of money\n// and the currency the money is in.\n//\n// The value is stored using a [github.com/shopspring/decimal.Decimal]\ntype Money struct {\n    Value    decimal.Decimal\n    Currency string\n}\n\n// Convert converts the value of one currency to another.\n//\n// It has two parameters: a Money instance with the value to convert,\n// and a string that represents the currency to convert to. Convert returns\n// the converted currency and any errors encountered from unknown or unconvertible\n// currencies.\n//\n// If an error is returned, the Money instance is set to the zero value.\n//\n// Supported currencies are:\n//   - USD - US Dollar\n//   - CAD - Canadian Dollar\n//   - EUR - Euro\n//   - INR - Indian Rupee\n//\n// More information on exchange rates can be found at [Investopedia].\n//\n// [Investopedia]: https://www.investopedia.com/terms/e/exchangerate.asp\nfunc Convert(from Money, to string) (Money, error) {\n    // ...\n}\n```\n\n**Formatting \u0111\u1eb7c bi\u1ec7t:**\n- `//   indented` \u2014 preformatted (code, table)\n- `// # Header` \u2014 header\n- `[pkgName.Symbol]` \u2014 link \u0111\u1ebfn symbol kh\u00e1c\n- URL tr\u1ef1c ti\u1ebfp \u2192 auto-link\n\n**Tools:**\n```bash\ngo doc fmt                   # xem doc c\u1ee7a package\ngo doc fmt.Println           # xem doc c\u1ee7a function c\u1ee5 th\u1ec3\ngo install golang.org/x/pkgsite/cmd/pkgsite@latest\npkgsite                      # preview HTML doc t\u1ea1i localhost:8080\n```\n\n---\n\n## 7. `internal` Package\n\nD\u00f9ng \u0111\u1ec3 share code trong module m\u00e0 **kh\u00f4ng expose ra public API**.\n\n```\nmymodule/\n\u251c\u2500\u2500 foo/\n\u2502   \u251c\u2500\u2500 foo.go          \u2190 C\u00d3 TH\u1ec2 d\u00f9ng internal\n\u2502   \u251c\u2500\u2500 sibling/\n\u2502   \u2502   \u2514\u2500\u2500 sibling.go  \u2190 C\u00d3 TH\u1ec2 d\u00f9ng internal\n\u2502   \u2514\u2500\u2500 internal/\n\u2502       \u2514\u2500\u2500 internal.go \u2190 \u0111\u1ecbnh ngh\u0129a Doubler()\n\u251c\u2500\u2500 bar/\n\u2502   \u2514\u2500\u2500 bar.go          \u2190 KH\u00d4NG TH\u1ec2 d\u00f9ng internal (compile error)\n\u2514\u2500\u2500 example.go          \u2190 KH\u00d4NG TH\u1ec2 d\u00f9ng internal (compile error)\n```\n\n```go\n// foo/internal/internal.go\npackage internal\n\nfunc Doubler(a int) int {\n    return a * 2\n}\n\n// foo/foo.go \u2014 OK: parent c\u1ee7a internal\nimport \"github.com/mymodule/foo/internal\"\n\n// bar/bar.go \u2014 COMPILE ERROR\n// use of internal package .../foo/internal not allowed\n```\n\n**Nguy\u00ean t\u1eafc Hyrum's Law:** \"V\u1edbi \u0111\u1ee7 ng\u01b0\u1eddi d\u00f9ng API, m\u1ecdi h\u00e0nh vi observable \u0111\u1ec1u c\u00f3 ng\u01b0\u1eddi ph\u1ee5 thu\u1ed9c.\" \u2192 D\u00f9ng `internal` \u0111\u1ec3 b\u1ea3o v\u1ec7 implementation details.\n\n---\n\n## 8. Tr\u00e1nh Circular Dependencies\n\nGo **kh\u00f4ng cho ph\u00e9p** circular imports \u2014 A import B, B import A.\n\n```go\n// pet/pet.go\nimport \"mymodule/person\"  // pet ph\u1ee5 thu\u1ed9c person\n\n// person/person.go\nimport \"mymodule/pet\"     // person ph\u1ee5 thu\u1ed9c pet\n// \u2192 COMPILE ERROR: import cycle not allowed\n```\n\n**Gi\u1ea3i ph\u00e1p:**\n1. **Merge** 2 packages th\u00e0nh 1 n\u1ebfu ch\u00fang th\u1ef1c s\u1ef1 li\u00ean quan\n2. **T\u00e1ch** ph\u1ea7n g\u00e2y cycle ra package m\u1edbi (v\u00ed d\u1ee5 `petperson` package)\n3. **Redesign** \u0111\u1ec3 lo\u1ea1i b\u1ecf dependency theo m\u1ed9t chi\u1ec1u\n\n---\n\n## 9. T\u1ed5 ch\u1ee9c Module\n\n### Module nh\u1ecf\n\n```\nmyapp/\n\u251c\u2500\u2500 go.mod\n\u2514\u2500\u2500 main.go       \u2190 t\u1ea5t c\u1ea3 code \u1edf \u0111\u00e2y\n```\n\n### Application module (kh\u00f4ng d\u00e0nh cho library)\n\n```\nmyapp/\n\u251c\u2500\u2500 go.mod\n\u251c\u2500\u2500 main.go          \u2190 ch\u1ec9 g\u1ecdi internal code\n\u2514\u2500\u2500 internal/\n    \u251c\u2500\u2500 server/\n    \u2514\u2500\u2500 storage/\n```\n\n\u0110\u1eb7t h\u1ebft logic v\u00e0o `internal/` \u2192 kh\u00f4ng ai import \u0111\u01b0\u1ee3c implementation details.\n\n### Library module\n\n```\nmylib/\n\u251c\u2500\u2500 go.mod\n\u251c\u2500\u2500 mylib.go         \u2190 package name = repo name\n\u2514\u2500\u2500 cmd/\n    \u251c\u2500\u2500 server/\n    \u2502   \u2514\u2500\u2500 main.go  \u2190 application \u0111i k\u00e8m\n    \u2514\u2500\u2500 tool/\n        \u2514\u2500\u2500 main.go\n```\n\n**L\u01b0u \u00fd:** Repository name ph\u1ea3i l\u00e0 valid Go identifier \u2014 kh\u00f4ng d\u00f9ng d\u1ea5u g\u1ea1ch ngang `-`.\n\n### T\u1ed5 ch\u1ee9c theo slice of functionality\n\n```go\n// JAVA style (th\u01b0\u1eddng g\u1eb7p, KH\u00d4NG ph\u1ea3i Go style)\nbusiness/   \u2190 t\u1ea5t c\u1ea3 business logic\ndatabase/   \u2190 t\u1ea5t c\u1ea3 DB code\ndto/        \u2190 data transfer objects\n\n// GO style \u2014 t\u1ed5 ch\u1ee9c theo domain/feature\ncustomer/   \u2190 customer management (business + DB + models)\ninventory/  \u2190 inventory management (business + DB + models)\n```\n\n---\n\n## 10. \u0110\u1ed5i T\u00ean API Gracefully \u2014 Type Alias\n\nKhi c\u1ea7n rename type m\u00e0 kh\u00f4ng breaking backward compatibility:\n\n```go\n// File c\u0169\ntype Foo struct {\n    x int\n    S string\n}\n\nfunc (f Foo) Hello() string { return \"hello\" }\n\n// Th\u00eam alias \u0111\u1ec3 h\u1ed7 tr\u1ee3 t\u00ean m\u1edbi Bar\ntype Bar = Foo  // = l\u00e0 alias, kh\u00f4ng ph\u1ea3i new type\n\n// Bar v\u00e0 Foo c\u00f3 th\u1ec3 d\u00f9ng l\u1eabn nhau\nfunc MakeBar() Bar {\n    bar := Bar{S: \"Hello\"}\n    var f Foo = bar  // assign kh\u00f4ng c\u1ea7n conversion\n    fmt.Println(f.Hello())\n    return bar\n}\n```\n\n**Alias vs New Type:**\n```go\ntype Bar = Foo  // alias \u2014 c\u00f9ng type, c\u00f3 th\u1ec3 assign l\u1eabn nhau\ntype Bar Foo    // new type \u2014 kh\u00e1c type, ph\u1ea3i convert\n```\n\n**Gi\u1edbi h\u1ea1n c\u1ee7a alias:** Kh\u00f4ng th\u1ec3 d\u00f9ng alias \u0111\u1ec3 truy c\u1eadp unexported fields/methods t\u1eeb package kh\u00e1c.\n\n**Rename function/method:**\n```go\n// Gi\u1eef t\u00ean c\u0169, g\u1ecdi t\u00ean m\u1edbi\nfunc OldName(x int) int { return NewName(x) }\nfunc NewName(x int) int { return x * 2 }\n```\n\n---\n\n## 11. Tr\u00e1nh d\u00f9ng `init` Function\n\n`init()` l\u00e0 function \u0111\u1eb7c bi\u1ec7t ch\u1ea1y t\u1ef1 \u0111\u1ed9ng khi package \u0111\u01b0\u1ee3c load l\u1ea7n \u0111\u1ea7u:\n\n```go\nfunc init() {\n    // Ch\u1ea1y tr\u01b0\u1edbc main(), kh\u00f4ng c\u1ea7n g\u1ecdi\n    // Kh\u00f4ng c\u00f3 input/output\n}\n```\n\n**V\u1ea5n \u0111\u1ec1 v\u1edbi init:**\n- Kh\u00f3 debug \u2014 kh\u00f4ng r\u00f5 th\u1ee9 t\u1ef1 ch\u1ea1y\n- Side effects \u1ea9n \u2014 kh\u00f3 hi\u1ec3u data flow\n- Nhi\u1ec1u `init` trong c\u00f9ng file/package \u2192 th\u1ee9 t\u1ef1 ph\u1ee9c t\u1ea1p\n\n**Blank import \u2014 trigger init:**\n```go\n// Import ch\u1ec9 \u0111\u1ec3 ch\u1ea1y init() (\u0111\u0103ng k\u00fd DB driver)\nimport (\n    \"database/sql\"\n    _ \"github.com/lib/pq\"  // blank import: ch\u1ea1y init, kh\u00f4ng d\u00f9ng identifier\n)\n```\n\nPattern n\u00e0y **\u0111\u00e3 l\u1ed7i th\u1eddi** \u2014 prefer explicit registration.\n\n**Khi n\u00e0o c\u00f3 th\u1ec3 d\u00f9ng init:**\n- Initialize package-level variables kh\u00f4ng th\u1ec3 config trong 1 assignment\n- Bi\u1ebfn \u0111\u00f3 ph\u1ea3i effectively immutable sau khi init\n\n---\n\n## 12. Importing Third-Party Code\n\n### Th\u00eam dependency\n\n```go\n// main.go\nimport (\n    \"github.com/learning-go-book-2e/formatter\"\n    \"github.com/shopspring/decimal\"\n)\n```\n\n```bash\n# C\u00e1ch 1: scan source code t\u1ef1 \u0111\u1ed9ng\ngo get ./...\n\n# C\u00e1ch 2: ch\u1ec9 \u0111\u1ecbnh module c\u1ee5 th\u1ec3\ngo get github.com/shopspring/decimal\n```\n\n**go.mod sau khi get:**\n```\nmodule github.com/learning-go-book-2e/money\n\ngo 1.20\n\nrequire (\n    github.com/learning-go-book-2e/formatter v0.0.0-20220918024742-...\n    github.com/shopspring/decimal v1.3.1\n)\n\nrequire (\n    github.com/fatih/color v1.13.0 // indirect  \u2190 dep c\u1ee7a dep\n    ...\n)\n```\n\n**go.sum \u2014 checksum file:**\n```\ngithub.com/shopspring/decimal v1.3.1 h1:2Usl1nmF/...\ngithub.com/shopspring/decimal v1.3.1/go.mod h1:DKy...\n```\n\nM\u1ed7i entry c\u00f3 hash \u0111\u1ec3 verify integrity. **Lu\u00f4n commit c\u1ea3 go.mod v\u00e0 go.sum.**\n\n### Module cache\n\n```bash\n# Go cache modules t\u1ea1i $GOPATH/pkg/mod\n# X\u00f3a cache n\u1ebfu c\u1ea7n\ngo clean -modcache\n```\n\n### Sync go.mod v\u1edbi source\n\n```bash\ngo mod tidy  # th\u00eam missing, x\u00f3a unused, s\u1eeda indirect comments\n```\n\n---\n\n## 13. Semantic Versioning v\u00e0 Qu\u1ea3n l\u00fd Version\n\n**SemVer format:** `v{major}.{minor}.{patch}`\n\n| Thay \u0111\u1ed5i | T\u0103ng version |\n|---|---|\n| Fix bug | patch: v1.2.3 \u2192 v1.2.4 |\n| Feature m\u1edbi (backward compatible) | minor: v1.2.3 \u2192 v1.3.0 |\n| Breaking change | major: v1.2.3 \u2192 v2.0.0 |\n\n### Xem versions c\u00f3 s\u1eb5n\n\n```bash\ngo list -m -versions github.com/learning-go-book-2e/simpletax\n# github.com/learning-go-book-2e/simpletax v1.0.0 v1.1.0\n```\n\n### C\u1eadp nh\u1eadt version\n\n```bash\n# Xu\u1ed1ng version c\u1ee5 th\u1ec3\ngo get github.com/learning-go-book-2e/simpletax@v1.0.0\n\n# L\u00ean patch version m\u1edbi nh\u1ea5t c\u1ee7a minor hi\u1ec7n t\u1ea1i\ngo get -u=patch github.com/learning-go-book-2e/simpletax\n\n# L\u00ean version m\u1edbi nh\u1ea5t (compatible)\ngo get -u github.com/learning-go-book-2e/simpletax\n```\n\n### Minimal Version Selection\n\nKhi A c\u1ea7n D@v1.1.0, B c\u1ea7n D@v1.2.0, C c\u1ea7n D@v1.2.3 \u2192 Go ch\u1ecdn **v1.2.3** (min version th\u1ecfa t\u1ea5t c\u1ea3).\n\n**Kh\u00f4ng** d\u00f9ng latest, **kh\u00f4ng** include nhi\u1ec1u version c\u1ee7a c\u00f9ng package (kh\u00e1c npm).\n\n---\n\n## 14. Breaking Changes \u2014 Major Version\n\nKhi c\u1ea7n breaking change, ph\u1ea3i \u0111\u1ed5i import path:\n\n```\nv1: github.com/user/simpletax\nv2: github.com/user/simpletax/v2\n```\n\n```go\n// \u0110\u1ed5i import\nimport \"github.com/learning-go-book-2e/simpletax/v2\"\n\n// C\u00f3 th\u1ec3 d\u00f9ng c\u1ea3 2 version c\u00f9ng l\u00fac n\u1ebfu c\u1ea7n\nimport (\n    v1 \"github.com/learning-go-book-2e/simpletax\"\n    v2 \"github.com/learning-go-book-2e/simpletax/v2\"\n)\n```\n\n**go.mod khi d\u00f9ng c\u1ea3 2:**\n```\nrequire (\n    github.com/learning-go-book-2e/simpletax v1.0.0\n    github.com/learning-go-book-2e/simpletax/v2 v2.0.0\n)\n```\n\n**C\u00e1ch t\u1ed5 ch\u1ee9c code cho v2:**\n- **Option 1**: t\u1ea1o th\u01b0 m\u1ee5c `v2/` trong repo, copy code v\u00e0o\n- **Option 2**: t\u1ea1o branch `v1` cho code c\u0169, main branch = v2\n\n---\n\n## 15. Vendoring\n\n```bash\n# Copy t\u1ea5t c\u1ea3 dependencies v\u00e0o th\u01b0 m\u1ee5c vendor/\ngo mod vendor\n\n# vendor/ \u0111\u01b0\u1ee3c d\u00f9ng thay v\u00ec module cache\n# Ph\u1ea3i ch\u1ea1y l\u1ea1i sau khi thay \u0111\u1ed5i dependencies\n```\n\n**\u01afu \u0111i\u1ec3m:** Build nhanh trong CI/CD kh\u00f4ng cache module.\n**Nh\u01b0\u1ee3c \u0111i\u1ec3m:** T\u0103ng k\u00edch th\u01b0\u1edbc repo \u0111\u00e1ng k\u1ec3.\n**Xu h\u01b0\u1edbng:** \u00cdt d\u00f9ng h\u01a1n nh\u1edd proxy servers.\n\n---\n\n## 16. pkg.go.dev\n\nTrang web t\u1ed5ng h\u1ee3p documentation cho t\u1ea5t c\u1ea3 public Go modules:\n- Godocs, license, README\n- Dependencies v\u00e0 dependents\n- Version history\n\n---\n\n## 17. Publish v\u00e0 Version Module\n\n### Publish\n\n```bash\n# Ch\u1ec9 c\u1ea7n push l\u00ean public repository\ngit push origin main\n\n# T\u1ea1o version tag\ngit tag v1.0.0\ngit push origin v1.0.0\n```\n\n### Pre-release\n\n```bash\ngit tag v1.4.0-beta1   # beta\ngit tag v1.4.0-rc2     # release candidate\n# Ph\u1ea3i explicit khi go get, kh\u00f4ng t\u1ef1 \u0111\u1ed9ng ch\u1ecdn\n```\n\n### Retract \u2014 \u0111\u00e1nh d\u1ea5u version kh\u00f4ng d\u00f9ng\n\n```go\n// go.mod\nretract v1.5.0 // not fully tested\nretract [v1.7.0, v1.8.5] // contains critical bug\n```\n\n- Builds \u0111\u00e3 d\u00f9ng version \u0111\u00f3 v\u1eabn ch\u1ea1y b\u00ecnh th\u01b0\u1eddng\n- `go get` v\u00e0 `go mod tidy` s\u1ebd kh\u00f4ng upgrade l\u00ean version b\u1ecb retract\n- Ph\u1ea3i t\u1ea1o version m\u1edbi \u0111\u1ec3 publish retraction\n\n---\n\n## 18. Override Dependencies\n\n### `replace` directive\n\n```go\n// go.mod \u2014 d\u00f9ng fork\nreplace github.com/jonbodner/proteus => github.com/someone/my_proteus v1.0.0\n\n// D\u00f9ng local path (ch\u1ec9 cho development, KH\u00d4NG commit)\nreplace github.com/jonbodner/proteus => ../projects/proteus\n```\n\n### `exclude` directive\n\n```go\n// Ch\u1eb7n version c\u1ee5 th\u1ec3 (v\u00ed d\u1ee5 c\u00f3 bug)\nexclude github.com/jonbodner/proteus v0.10.1\n```\n\n---\n\n## 19. Go Workspaces\n\nKhi c\u1ea7n s\u1eeda 2+ modules \u0111\u1ed3ng th\u1eddi m\u00e0 ch\u01b0a push l\u00ean repo:\n\n```bash\n# T\u1ea1o workspace\ngo work init ./workspace_app\ngo work use ./workspace_lib\n```\n\n**go.work:**\n```\ngo 1.20\n\nuse (\n    ./workspace_app\n    ./workspace_lib\n)\n```\n\n- Workspace local \u2192 **KH\u00d4NG commit** go.work l\u00ean repo\n- References gi\u1eefa modules trong workspace t\u1ef1 resolve sang local code\n- Sau khi ho\u00e0n thi\u1ec7n, push t\u1eebng module theo th\u1ee9 t\u1ef1 dependency\n\n```bash\n# Ki\u1ec3m tra kh\u00f4ng d\u00f9ng workspace (test v\u1edbi public module)\nGOWORK=off go build\n```\n\n**Th\u1ee9 t\u1ef1 commit khi c\u00f3 workspace:**\n1. Commit module kh\u00f4ng c\u00f3 dependency v\u00e0o module kh\u00e1c trong workspace\n2. Tag version m\u1edbi\n3. `go get` \u0111\u1ec3 update reference trong modules ph\u1ee5 thu\u1ed9c\n4. L\u1eb7p l\u1ea1i cho \u0111\u1ebfn khi t\u1ea5t c\u1ea3 modules \u0111\u01b0\u1ee3c commit\n\n---\n\n## 20. Module Proxy Servers\n\n**M\u1eb7c \u0111\u1ecbnh:** `go get` \u2192 Google Proxy Server (proxy.golang.org)\n\n**Flow:**\n```\ngo get \u2192 proxy.golang.org \u2192 (cache) \u2192 GitHub/GitLab/...\n                          \u2192 checksum DB \u2192 verify hash\n```\n\n**Checksum database b\u1ea3o v\u1ec7:**\n- Module b\u1ecb x\u00f3a kh\u1ecfi internet\n- Module b\u1ecb modify sau khi release (malicious ho\u1eb7c v\u00f4 \u00fd reuse tag)\n\n### C\u1ea5u h\u00ecnh proxy\n\n```bash\n# T\u1eaft proxy \u2014 download tr\u1ef1c ti\u1ebfp t\u1eeb repo\nGOPROXY=direct go get ...\n\n# D\u00f9ng proxy server ri\u00eang (Athens, Artifactory, Sonatype)\nGOPROXY=https://my-proxy.company.com go get ...\n```\n\n### Private repositories\n\n```bash\n# Kh\u00f4ng g\u1eedi request private repos qua proxy public\nGOPRIVATE=*.example.com,company.com/repo\n\n# Ho\u1eb7c ch\u1ea1y private proxy server (Athens) trong company network\n```\n\n---\n\n## Exercises\n\n**1. T\u1ea1o module v\u1edbi function Add:**\n```go\n// go.mod: module github.com/yourname/myadder\n\n// adder.go\npackage myadder\n\n// Add adds two integers and returns their sum.\nfunc Add(a, b int) int {\n    return a + b\n}\n// Tag: v1.0.0\n```\n\n**2. Th\u00eam godoc comments v\u00e0 link:**\n```go\n// Package myadder provides simple arithmetic utilities.\npackage myadder\n\n// Add adds two integers and returns their sum.\n//\n// For more information on addition, see [Addition on MathIsFun].\n//\n// [Addition on MathIsFun]: https://www.mathsisfun.com/numbers/addition.html\nfunc Add(a, b int) int {\n    return a + b\n}\n// Tag: v1.0.1\n```\n\n**3. Generic Add \u2014 breaking change \u2192 v2.0.0:**\n```go\n// go.mod: module github.com/yourname/myadder/v2\n// import golang.org/x/exp/constraints\n\npackage myadder\n\nimport (\n    \"golang.org/x/exp/constraints\"\n)\n\n// Number combines Integer and Float constraints.\ntype Number interface {\n    constraints.Integer | constraints.Float\n}\n\n// Add adds two values of any numeric type and returns their sum.\n//\n// For more information on addition, see [Addition on MathIsFun].\n//\n// [Addition on MathIsFun]: https://www.mathsisfun.com/numbers/addition.html\nfunc Add[T Number](a, b T) T {\n    return a + b\n}\n// Tag: v2.0.0\n```\n\n---\n\n## Wrapping Up\n\nB\u1ea1n \u0111\u00e3 h\u1ecdc:\n- **Repository \u2192 Module \u2192 Package**: h\u1ec7 th\u1ed1ng 3 t\u1ea7ng t\u1ed5 ch\u1ee9c code Go\n- **go.mod**: `module`, `go`, `require`, `replace`, `exclude`, `retract`\n- **Export b\u1eb1ng ch\u1eef hoa**: kh\u00f4ng keyword public/private\n- **Import path**: module path + path to directory; package name t\u1eeb package clause\n- **\u0110\u1eb7t t\u00ean package**: descriptive noun, kh\u00f4ng l\u1eb7p t\u00ean trong function\n- **Import alias**: gi\u1ea3i quy\u1ebft name collision\n- **Go Doc**: comment format cho auto-generated documentation\n- **internal**: share trong module, kh\u00f4ng expose ra public API\n- **Circular dependency**: kh\u00f4ng \u0111\u01b0\u1ee3c ph\u00e9p \u2014 redesign ho\u1eb7c merge\n- **Module organization**: flat \u2192 functional slices, d\u00f9ng cmd/ cho applications\n- **Type alias** (`type Bar = Foo`): rename API kh\u00f4ng breaking\n- **Tr\u00e1nh init**: prefer explicit initialization\n- **go get, go mod tidy**: manage dependencies\n- **SemVer + minimal version selection**: predictable dependency resolution\n- **Major version**: import path thay \u0111\u1ed5i (`/v2`)\n- **Vendoring**: copy deps v\u00e0o repo, \u00edt d\u00f9ng h\u01a1n v\u1edbi proxy\n- **Workspaces**: develop nhi\u1ec1u modules \u0111\u1ed3ng th\u1eddi locally\n- **Module proxy**: Google proxy + checksum DB \u0111\u1ea3m b\u1ea3o integrity\n\n**Ch\u01b0\u01a1ng ti\u1ebfp theo:** Go Tooling \u2014 c\u00e1c c\u00f4ng c\u1ee5 \u0111i k\u00e8m v\u1edbi Go v\u00e0 third-party tools h\u1eefu \u00edch.\n\n\n# Chapter 11. Go Tooling\n\n## Gi\u1edbi thi\u1ec7u\n\nGo \u0111\u01b0\u1ee3c thi\u1ebft k\u1ebf v\u1edbi b\u1ed9 c\u00f4ng c\u1ee5 phong ph\u00fa gi\u00fap developer vi\u1ebft code ch\u1ea5t l\u01b0\u1ee3ng cao. Ch\u01b0\u01a1ng n\u00e0y gi\u1edbi thi\u1ec7u c\u00e1c c\u00f4ng c\u1ee5 \u0111i k\u00e8m v\u1edbi Go v\u00e0 c\u00e1c third-party tools ph\u1ed5 bi\u1ebfn trong h\u1ec7 sinh th\u00e1i.\n\nC\u00e1c tool \u0111\u00e3 \u0111\u01b0\u1ee3c \u0111\u1ec1 c\u1eadp \u1edf c\u00e1c ch\u01b0\u01a1ng tr\u01b0\u1edbc: `go vet`, `go fmt`, `go mod`, `go get`, `go list`, `go work`, `go doc`, `go build`.\n\n---\n\n## 1. `go run` \u2014 Ch\u1ea1y Nhanh nh\u01b0 Script\n\n```bash\ngo run hello.go\n```\n\n**C\u00e1ch ho\u1ea1t \u0111\u1ed9ng:**\n1. Compile source code \u2192 binary trong th\u01b0 m\u1ee5c t\u1ea1m\n2. Ch\u1ea1y binary\n3. X\u00f3a binary sau khi ch\u1ea1y xong\n\nKh\u00f4ng c\u00f3 binary c\u00f2n l\u1ea1i trong th\u01b0 m\u1ee5c \u2014 h\u1eefu \u00edch khi mu\u1ed1n test nhanh.\n\n```go\n// hello.go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Hello, world!\")\n}\n```\n\n```bash\n$ go run hello.go\nHello, world!\n```\n\n> **So s\u00e1nh v\u1edbi Java:** Java c\u1ea7n compile tr\u01b0\u1edbc (`javac Hello.java`) r\u1ed3i m\u1edbi ch\u1ea1y (`java Hello`). `go run` g\u1ed9p 2 b\u01b0\u1edbc th\u00e0nh 1 \u2014 g\u1ea7n v\u1edbi tr\u1ea3i nghi\u1ec7m scripting c\u1ee7a Python/Node.js.\n\n**D\u00f9ng khi:** Test \u00fd t\u01b0\u1edfng nhanh, vi\u1ebft script \u0111\u01a1n gi\u1ea3n b\u1eb1ng Go.\n\n---\n\n## 2. `go install` \u2014 C\u00e0i C\u00f4ng C\u1ee5 t\u1eeb Source\n\n```bash\ngo install github.com/rakyll/hey@latest\ngo install github.com/rakyll/hey@v0.1.4   # version c\u1ee5 th\u1ec3\n```\n\n**C\u00e1ch ho\u1ea1t \u0111\u1ed9ng:**\n1. Download module v\u00e0 dependencies\n2. Build binary\n3. \u0110\u1eb7t binary v\u00e0o `~/go/bin/` (ho\u1eb7c `$GOBIN`)\n\n```bash\n# Sau khi install\n$ hey https://go.dev\nSummary:\n  Total:        2.1272 secs\n  Average:      0.3467 secs\n  Requests/sec: 94.0181\n```\n\n**L\u01b0u \u00fd quan tr\u1ecdng:** Lu\u00f4n th\u00eam `@version` ho\u1eb7c `@latest` \u2014 thi\u1ebfu s\u1ebd g\u00e2y l\u1ed7i ho\u1eb7c h\u00e0nh vi kh\u00f4ng mong mu\u1ed1n.\n\n**C\u1eadp nh\u1eadt tool:**\n```bash\ngo install github.com/rakyll/hey@latest   # reinstall = update\n```\n\n**Setup PATH:**\n```bash\n# Th\u00eam v\u00e0o ~/.zshrc ho\u1eb7c ~/.bashrc\nexport PATH=\"$PATH:$HOME/go/bin\"\n```\n\n> **So s\u00e1nh v\u1edbi Java:** T\u01b0\u01a1ng t\u1ef1 `mvn install` nh\u01b0ng kh\u00f4ng c\u1ea7n Maven \u2014 ch\u1ec9 c\u1ea7n URL c\u1ee7a source code.\n\n---\n\n## 3. `goimports` \u2014 Format Import Statements\n\n```bash\ngo install golang.org/x/tools/cmd/goimports@latest\ngoimports -l -w .\n```\n\nL\u00e0m nhi\u1ec1u h\u01a1n `go fmt`:\n- Format code nh\u01b0 `go fmt`\n- **S\u1eafp x\u1ebfp imports theo alphabet**\n- **X\u00f3a unused imports**\n- **T\u1ef1 \u0111o\u00e1n missing imports** (kh\u00f4ng ch\u00ednh x\u00e1c 100% \u2014 n\u00ean t\u1ef1 th\u00eam)\n\n**Flags:**\n- `-l`: li\u1ec7t k\u00ea files c\u00f3 v\u1ea5n \u0111\u1ec1\n- `-w`: s\u1eeda file tr\u1ef1c ti\u1ebfp\n- `.`: scan th\u01b0 m\u1ee5c hi\u1ec7n t\u1ea1i v\u00e0 subdirectories\n\n---\n\n## 4. Code Quality Scanners (Linters)\n\n### `go vet` (built-in)\n\n```bash\ngo vet ./...\n```\n\nT\u00ecm c\u00e1c l\u1ed7i ph\u1ed5 bi\u1ebfn: format string sai, unreachable code, suspicious composite literals\u2026\n\n### `staticcheck` \u2014 Khuy\u1ebfn ngh\u1ecb h\u00e0ng \u0111\u1ea7u\n\n```bash\ngo install honnef.co/go/tools/cmd/staticcheck@latest\nstaticcheck ./...\nstaticcheck -explain S1039   # gi\u1ea3i th\u00edch error code\n```\n\n**Ph\u00e1t hi\u1ec7n \u0111\u01b0\u1ee3c nh\u1eefng g\u00ec go vet kh\u00f4ng th\u1ea5y:**\n\n```go\n// staticcheck ph\u00e1t hi\u1ec7n: unnecessary use of fmt.Sprintf\nfunc main() {\n    s := fmt.Sprintf(\"Hello\")  // S1039: d\u00f9ng \"Hello\" tr\u1ef1c ti\u1ebfp l\u00e0 \u0111\u1ee7\n    fmt.Println(s)\n}\n```\n\n```bash\n$ staticcheck ./...\nmain.go:6:7: unnecessary use of fmt.Sprintf (S1039)\n```\n\n**Ph\u00e1t hi\u1ec7n error kh\u00f4ng \u0111\u01b0\u1ee3c check:**\n\n```go\nfunc main() {\n    err := returnErr(false)\n    if err != nil {\n        fmt.Println(err)\n    }\n    err = returnErr(true)\n    fmt.Println(\"end of program\")  // err kh\u00f4ng \u0111\u01b0\u1ee3c check!\n}\n```\n\n```bash\n$ staticcheck ./...\nmain.go:13:2: this value of err is never used (SA4006)\nmain.go:13:8: returnErr doesn't have side effects and its return value is ignored (SA4017)\n```\n\n> **150+ code quality checks**, \u00edt false positives \u2014 b\u1eaft \u0111\u1ea7u t\u1eeb tool n\u00e0y.\n\n### `revive` \u2014 D\u1ef1a tr\u00ean `golint`\n\n```bash\ngo install github.com/mgechev/revive@latest\nrevive ./...\n```\n\nKi\u1ec3m tra:\n- Exported identifiers thi\u1ebfu comments\n- Variable naming conventions\n- Error return values kh\u00f4ng ph\u1ea3i return value cu\u1ed1i\n\n**C\u1ea5u h\u00ecnh th\u00eam rules:**\n```toml\n# built_in.toml\n[rule.redefines-builtin-id]\n```\n\n```go\nfunc main() {\n    true := false  // shadow built-in identifier!\n    fmt.Println(true)\n}\n```\n\n```bash\n$ revive -config built_in.toml ./...\nmain.go:6:2: assignment creates a shadow of built-in identifier true\n```\n\n### `golangci-lint` \u2014 Buffet t\u1ed5ng h\u1ee3p\n\n```bash\n# C\u00e0i t\u1eeb binary (khuy\u1ebfn ngh\u1ecb, kh\u00f4ng d\u00f9ng go install)\n# Xem h\u01b0\u1edbng d\u1eabn t\u1ea1i https://golangci-lint.run/usage/install/\ngolangci-lint run\n```\n\nCh\u1ea1y **50+ tools** c\u00f9ng l\u00fac, bao g\u1ed3m go vet, staticcheck, revive.\n\n**Ph\u00e1t hi\u1ec7n ineffectual assignments:**\n```go\nx := 10  // ineffassign: gi\u00e1 tr\u1ecb n\u00e0y kh\u00f4ng bao gi\u1edd \u0111\u01b0\u1ee3c d\u00f9ng\nx = 30   // ineffassign: gi\u00e1 tr\u1ecb n\u00e0y kh\u00f4ng bao gi\u1edd \u0111\u01b0\u1ee3c d\u00f9ng\nfmt.Println(x)\n```\n\n```bash\n$ golangci-lint run\nmain.go:6:2: ineffectual assignment to x (ineffassign)\nmain.go:9:2: ineffectual assignment to x (ineffassign)\n```\n\n**C\u1ea5u h\u00ecnh `.golangci.yml`:**\n```yaml\nlinters:\n  enable:\n    - govet\n    - predeclared\n\nlinters-settings:\n  govet:\n    check-shadowing: true\n    settings:\n      shadow:\n        strict: true\n    enable-all: true\n```\n\n**Ph\u00e1t hi\u1ec7n shadowing chi ti\u1ebft:**\n```go\nvar b = 20\n\nfunc main() {\n    true := false  // shadow built-in\n    a := 10\n    b := 30        // shadow package-level var\n    if true {\n        a := 20    // shadow outer a\n        fmt.Println(a)\n    }\n    fmt.Println(a, b)\n}\n```\n\n```bash\n$ golangci-lint run\nmain.go:5:5: var `b` is unused (unused)\nmain.go:10:2: shadow: declaration of \"b\" shadows declaration at line 5 (govet)\nmain.go:12:3: shadow: declaration of \"a\" shadows declaration at line 9 (govet)\nmain.go:8:2: variable true has same name as predeclared identifier (predeclared)\n```\n\n**L\u01b0u \u00fd:** Commit `.golangci.yml` v\u00e0o repo \u0111\u1ec3 to\u00e0n team d\u00f9ng c\u00f9ng rules.\n\n### Th\u1ee9 t\u1ef1 \u00e1p d\u1ee5ng linters\n\n1. **`go vet`** \u2014 b\u1eaft bu\u1ed9c trong CI/CD\n2. **`staticcheck`** \u2014 \u00edt false positives, th\u00eam s\u1edbm\n3. **`revive`** \u2014 khi mu\u1ed1n enforce style conventions\n4. **`golangci-lint`** \u2014 khi \u0111\u00e3 s\u1eb5n s\u00e0ng configure chi ti\u1ebft\n\n---\n\n## 5. `govulncheck` \u2014 Scan L\u1ed7 H\u1ed5ng B\u1ea3o M\u1eadt\n\n```bash\ngo install golang.org/x/vuln/cmd/govulncheck@latest\ngovulncheck ./...\n```\n\n**Ph\u00e1t hi\u1ec7n vulnerability trong dependencies:**\n\n```bash\n$ govulncheck ./...\nVulnerability #1: GO-2020-0036\n    Excessive resource consumption in YAML parsing in gopkg.in/yaml.v2\n  Module: gopkg.in/yaml.v2\n    Found in: gopkg.in/yaml.v2@v2.2.7\n    Fixed in: gopkg.in/yaml.v2@v2.2.8\n    Example traces found:\n      #1: main.go:25:23: vulnerable.main calls yaml.Unmarshal\n```\n\n**Fix:**\n```bash\ngo get -u=patch gopkg.in/yaml.v2   # update patch version\ngovulncheck ./...\n# No vulnerabilities found.\n```\n\n**Scan binary \u0111\u00e3 deploy:**\n```bash\ngovulncheck -mode binary ./myapp\n```\n\n\u0110\u00e2y l\u00e0 t\u00ednh n\u0103ng \u0111\u1eb7c bi\u1ec7t: m\u1ecdi Go binary t\u1ef1 \u0111\u1ed9ng ch\u1ee9a build info (version c\u1ee7a dependencies), n\u00ean govulncheck c\u00f3 th\u1ec3 scan binary m\u00e0 kh\u00f4ng c\u1ea7n source code.\n\n**L\u00fd do quan tr\u1ecdng:** T\u01b0\u01a1ng t\u1ef1 Log4j vulnerability trong Java \u2014 khi vulnerability \u0111\u01b0\u1ee3c ph\u00e1t hi\u1ec7n, c\u1ea7n bi\u1ebft binary n\u00e0o \u0111ang d\u00f9ng version b\u1ecb \u1ea3nh h\u01b0\u1edfng.\n\n---\n\n## 6. Embedding Files v\u00e0o Binary\n\n### Embed single file\n\n```go\npackage main\n\nimport (\n    _ \"embed\"   // import blank \u0111\u1ec3 enable embedding\n    \"fmt\"\n    \"os\"\n    \"strings\"\n)\n\n//go:embed passwords.txt    // magic comment \u2014 ph\u1ea3i \u0111\u1eb7t ngay tr\u01b0\u1edbc variable\nvar passwords string\n\nfunc main() {\n    pwds := strings.Split(passwords, \"\\n\")\n    if len(os.Args) > 1 {\n        for _, v := range pwds {\n            if v == os.Args[1] {\n                fmt.Println(\"true\")\n                os.Exit(0)\n            }\n        }\n        fmt.Println(\"false\")\n    }\n}\n```\n\n**Quy t\u1eafc embedding:**\n- Import `embed` (blank import n\u1ebfu ch\u1ec9 d\u00f9ng string/[]byte)\n- Magic comment `//go:embed FILENAME` ngay tr\u01b0\u1edbc variable declaration \u2014 **kh\u00f4ng c\u00f3 d\u00f2ng tr\u1ed1ng**\n- Variable ph\u1ea3i l\u00e0 package-level (kh\u00f4ng th\u1ec3 trong function)\n- Type ph\u1ea3i l\u00e0 `string`, `[]byte`, ho\u1eb7c `embed.FS`\n- Treat embedded variables nh\u01b0 immutable\n\n### Embed directory (embed.FS)\n\n```go\npackage main\n\nimport (\n    \"embed\"\n    \"fmt\"\n    \"io/fs\"\n    \"os\"\n    \"strings\"\n)\n\n//go:embed help\nvar helpInfo embed.FS  // nh\u00fang to\u00e0n b\u1ed9 th\u01b0 m\u1ee5c help/\n\nfunc main() {\n    if len(os.Args) == 1 {\n        printHelpFiles()\n        os.Exit(0)\n    }\n    data, err := helpInfo.ReadFile(\"help/\" + os.Args[1])  // t\u00ean th\u01b0 m\u1ee5c l\u00e0 ph\u1ea7n c\u1ee7a path\n    if err != nil {\n        fmt.Println(err)\n        os.Exit(1)\n    }\n    fmt.Println(string(data))\n}\n\nfunc printHelpFiles() {\n    fmt.Println(\"contents:\")\n    fs.WalkDir(helpInfo, \"help\",\n        func(path string, d fs.DirEntry, err error) error {\n            if !d.IsDir() {\n                _, fileName, _ := strings.Cut(path, \"/\")\n                fmt.Println(fileName)\n            }\n            return nil\n        })\n}\n```\n\n```bash\n$ ./help_system\ncontents:\nadvanced/topic1.txt\nadvanced/topic2.txt\ninfo.txt\n\n$ ./help_system advanced/topic1.txt\nThis is advanced topic 1.\n```\n\n**embed.FS implements:** `fs.FS`, `fs.ReadDirFS`, `fs.ReadFileFS` \u2192 d\u00f9ng nh\u01b0 real filesystem.\n\n### Embedding Hidden Files (b\u1eaft \u0111\u1ea7u b\u1eb1ng `.` ho\u1eb7c `_`)\n\n```go\n//go:embed parent_dir\nvar noHidden embed.FS            // kh\u00f4ng bao g\u1ed3m hidden files\n\n//go:embed parent_dir/*\nvar parentHiddenOnly embed.FS    // hidden files trong root nh\u01b0ng kh\u00f4ng trong subdirs\n\n//go:embed all:parent_dir\nvar allHidden embed.FS           // t\u1ea5t c\u1ea3 hidden files trong m\u1ecdi c\u1ea5p\n```\n\n**\u01afu \u0111i\u1ec3m embedding:** Ph\u00e2n ph\u1ed1i single binary, kh\u00f4ng c\u1ea7n k\u00e8m directory files. Compiler ki\u1ec3m tra path h\u1ee3p l\u1ec7 t\u1ea1i compile time.\n\n> **So s\u00e1nh v\u1edbi Java:** Java d\u00f9ng classpath resources (`getResourceAsStream`), ph\u1ea3i \u0111\u00f3ng g\u00f3i v\u00e0o JAR. Go \u0111\u01a1n gi\u1ea3n h\u01a1n v\u1edbi `//go:embed`.\n\n---\n\n## 7. `go generate` \u2014 Sinh Code T\u1ef1 \u0110\u1ed9ng\n\n```go\n//go:generate protoc -I=. --go_out=. person.proto\n```\n\n```bash\ngo generate ./...   # ch\u1ea1y t\u1ea5t c\u1ea3 go:generate commands trong module\n```\n\n**go generate kh\u00f4ng t\u1ef1 l\u00e0m g\u00ec** \u2014 ch\u1ec9 ch\u1ea1y command \u0111\u01b0\u1ee3c ch\u1ec9 \u0111\u1ecbnh trong magic comment.\n\n### V\u00ed d\u1ee5: Protocol Buffers\n\n```protobuf\n// person.proto\nsyntax = \"proto3\";\nmessage Person {\n  string name = 1;\n  int32 id = 2;\n  string email = 3;\n}\n```\n\n```go\n// main.go\n//go:generate protoc -I=. --go_out=. --go_opt=module=... person.proto\n```\n\n```bash\ngo install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28\ngo generate ./...\n# T\u1ea1o ra: data/person.pb.go v\u1edbi struct Person v\u00e0 methods\n```\n\n```go\nfunc main() {\n    p := &data.Person{\n        Name:  \"Bob Bobson\",\n        Id:    20,\n        Email: \"bob@bobson.com\",\n    }\n    protoBytes, _ := proto.Marshal(p)\n    var p2 data.Person\n    proto.Unmarshal(protoBytes, &p2)\n    fmt.Println(&p2)\n}\n```\n\n### V\u00ed d\u1ee5: `stringer` \u2014 Enum String Method\n\n```go\ntype Direction int\n\nconst (\n    _ Direction = iota\n    North\n    South\n    East\n    West\n)\n\n//go:generate stringer -type=Direction\n\nfunc main() {\n    fmt.Println(North.String())  // \"North\"\n}\n```\n\n```bash\ngo install golang.org/x/tools/cmd/stringer@latest\ngo generate ./...\n# T\u1ea1o ra: direction_string.go v\u1edbi method String() cho Direction\n```\n\n### Best Practices v\u1edbi go generate\n\n**N\u00ean:**\n- Commit generated code v\u00e0o version control\n- Th\u00eam generate step v\u00e0o Makefile, ch\u1ea1y tr\u01b0\u1edbc build\n\n**Kh\u00f4ng n\u00ean t\u1ef1 \u0111\u1ed9ng generate khi:**\n- Tool cho output kh\u00e1c nhau (timestamp\u2026) d\u00f9 input gi\u1ed1ng nhau\n- Generate m\u1ea5t r\u1ea5t nhi\u1ec1u th\u1eddi gian\n\n```makefile\n.PHONY: generate build\ngenerate:\n    go generate ./...\n\nbuild: generate\n    go build ./...\n```\n\n---\n\n## 8. Build Info trong Go Binary\n\nM\u1ecdi Go binary t\u1ef1 \u0111\u1ed9ng ch\u1ee9a th\u00f4ng tin build:\n\n```bash\n$ go version -m myapp\nmyapp: go1.20\n    path    github.com/myorg/myapp\n    mod     github.com/myorg/myapp    (devel)\n    dep     gopkg.in/yaml.v2  v2.2.7  h1:...\n    build   -compiler=gc\n    build   CGO_ENABLED=1\n    build   GOARCH=arm64\n    build   GOOS=darwin\n    build   vcs=git\n    build   vcs.revision=623a65b94fd02ea6f18df53afaaea3510cd1e611\n    build   vcs.time=2022-10-02T03:31:05Z\n    build   vcs.modified=false\n```\n\n**\u00dd ngh\u0129a:** Ngay c\u1ea3 binary \u0111ang ch\u1ea1y trong production, v\u1eabn bi\u1ebft \u0111\u01b0\u1ee3c:\n- Version Go d\u00f9ng \u0111\u1ec3 build\n- T\u00ean v\u00e0 version c\u1ee7a t\u1ea5t c\u1ea3 dependencies\n- Git commit hash\n- OS v\u00e0 CPU architecture\n\nGi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1 \"library n\u00e0o \u0111ang ch\u1ea1y trong production?\" \u2014 quan tr\u1ecdng khi c\u00f3 vulnerability report.\n\n```bash\n# Scan binary cho vulnerabilities\ngovulncheck -mode binary ./myapp\n```\n\n**\u0110\u1ecdc programmatically:**\n```go\nimport \"debug/buildinfo\"\n// debug/buildinfo package cho ph\u00e9p \u0111\u1ecdc th\u00f4ng tin n\u00e0y t\u1eeb code\n```\n\n---\n\n## 9. Cross-Compilation \u2014 Build cho Platform Kh\u00e1c\n\n```bash\n# Build cho Linux AMD64 (tr\u00ean Mac)\nGOOS=linux GOARCH=amd64 go build\n\n# Build cho Windows ARM64\nGOOS=windows GOARCH=arm64 go build\n\n# Build cho macOS Intel\nGOOS=darwin GOARCH=amd64 go build\n```\n\n**Ki\u1ec3m tra output:**\n```bash\n$ file myapp\nmyapp: ELF 64-bit LSB executable, x86-64, ...  # Linux\nmyapp: Mach-O 64-bit executable arm64          # Mac Apple Silicon\nmyapp.exe: PE32+ executable (console) ARM64    # Windows ARM\n```\n\n**C\u00e1c gi\u00e1 tr\u1ecb GOOS ph\u1ed5 bi\u1ebfn:**\n\n| GOOS | N\u1ec1n t\u1ea3ng |\n|---|---|\n| `linux` | Linux |\n| `darwin` | macOS (Darwin = t\u00ean kernel) |\n| `windows` | Windows |\n| `freebsd` | FreeBSD |\n\n**C\u00e1c gi\u00e1 tr\u1ecb GOARCH ph\u1ed5 bi\u1ebfn:**\n\n| GOARCH | CPU |\n|---|---|\n| `amd64` | 64-bit Intel/AMD |\n| `arm64` | ARM 64-bit (Apple Silicon, AWS Graviton) |\n| `386` | 32-bit x86 |\n| `arm` | ARM 32-bit |\n\n> **So s\u00e1nh v\u1edbi Java:** Java ch\u1ea1y tr\u00ean JVM n\u00ean portable t\u1ef1 nhi\u00ean. Go compile sang native binary \u2014 c\u1ea7n build ri\u00eang cho m\u1ed7i platform, nh\u01b0ng kh\u00f4ng c\u1ea7n JVM tr\u00ean m\u00e1y \u0111\u00edch.\n\n---\n\n## 10. Build Tags (Build Constraints)\n\n### C\u00e1ch 1: T\u00ean file\n\n```\nmyfile_linux.go           # ch\u1ec9 build tr\u00ean Linux\nmyfile_windows_amd64.go   # ch\u1ec9 build tr\u00ean Windows AMD64\nmyfile_darwin_arm64.go    # ch\u1ec9 build tr\u00ean Mac Apple Silicon\n```\n\n### C\u00e1ch 2: Build tag comment\n\n```go\n//go:build linux && amd64   // ph\u1ea3i \u1edf d\u00f2ng tr\u01b0\u1edbc package declaration\n// Kh\u00f4ng c\u00f3 kho\u1ea3ng tr\u1eafng gi\u1eefa // v\u00e0 go:build!\n\npackage mypackage\n```\n\n**Operators:** `&&` (AND), `||` (OR), `!` (NOT), `()`\n\n**V\u00ed d\u1ee5 ph\u1ee9c t\u1ea1p:**\n```go\n//go:build (!darwin && !linux) || (darwin && !go1.12)\n```\n\n**Meta constraints:**\n- `unix` \u2014 m\u1ecdi Unix-like platform\n- `cgo` \u2014 n\u1ebfu CGO \u0111\u01b0\u1ee3c support v\u00e0 enable\n\n### Custom build tags\n\n```go\n//go:build integration_test   // ch\u1ec9 build khi c\u00f3 flag n\u00e0y\n\npackage mypackage\n```\n\n```bash\ngo test -tags integration_test ./...   # build v\u1edbi custom tag\n```\n\n**D\u00f9ng `ignore` \u0111\u1ec3 skip file:**\n```go\n//go:build ignore   // file n\u00e0y kh\u00f4ng bao gi\u1edd \u0111\u01b0\u1ee3c build\n\npackage mypackage\n// Code \u0111ang develop, ch\u01b0a compile \u0111\u01b0\u1ee3c\n```\n\n**Belt-and-suspenders (c\u1ea3 2 c\u00e1ch):**\n```\ncpu_arm64_darwin.go  + //go:build arm64 && darwin && !ios\n```\n\n---\n\n## 11. Test v\u1edbi Go Version Kh\u00e1c\n\n```bash\n# C\u00e0i Go version c\u1ee5 th\u1ec3\ngo install golang.org/dl/go1.19.2@latest\ngo1.19.2 download\n\n# D\u00f9ng nh\u01b0 go b\u00ecnh th\u01b0\u1eddng\ngo1.19.2 build\ngo1.19.2 test ./...\n\n# G\u1ee1 c\u00e0i \u0111\u1eb7t\nrm -rf ~/sdk/go1.19.2\nrm ~/go/bin/go1.19.2\n```\n\nH\u1eefu \u00edch \u0111\u1ec3 ki\u1ec3m tra backward compatibility ho\u1eb7c reproduce bug c\u1ee7a user.\n\n---\n\n## 12. `go help` \u2014 H\u1ecdc Th\u00eam v\u1ec1 Tooling\n\n```bash\ngo help           # danh s\u00e1ch t\u1ea5t c\u1ea3 commands\ngo help build     # help v\u1ec1 go build\ngo help importpath  # c\u00fa ph\u00e1p import path\ngo help environment  # c\u00e1c environment variables\ngo help modules   # module system documentation\n```\n\n---\n\n## Exercises\n\n**1. Embed UDHR files:**\n```go\npackage main\n\nimport (\n    _ \"embed\"\n    \"fmt\"\n    \"os\"\n)\n\n//go:embed english_rights.txt\nvar englishRights string\n\n//go:embed vietnamese_rights.txt\nvar vietnameseRights string\n\nfunc main() {\n    if len(os.Args) < 2 {\n        fmt.Println(\"Usage: program <language>\")\n        os.Exit(1)\n    }\n\n    switch os.Args[1] {\n    case \"english\":\n        fmt.Println(englishRights)\n    case \"vietnamese\":\n        fmt.Println(vietnameseRights)\n    default:\n        fmt.Printf(\"Language '%s' not found\\n\", os.Args[1])\n        os.Exit(1
