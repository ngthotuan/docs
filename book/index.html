<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Sách & Khóa học</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --light-bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 30px; color: #333; background-color: #f0f2f5; }
        .notebook { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 10px; font-size: 2.2em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; }
        .breadcrumb { margin-bottom: 20px; font-size: 0.9em; }
        .breadcrumb a { color: var(--accent); text-decoration: none; font-weight: 600; display: inline; padding: 0; border: none; background: none; }
        .breadcrumb a:hover { text-decoration: underline; background: none; color: var(--accent); transform: none; }
        .breadcrumb span { color: #999; margin: 0 5px; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 15px; }
        li > a { text-decoration: none; color: var(--primary); display: block; padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 12px; transition: all 0.3s ease; }
        li > a:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateX(5px); box-shadow: 0 5px 15px rgba(52,152,219,0.3); }
        .book-icon { font-size: 1.5em; margin-right: 12px; vertical-align: middle; }
        .book-title { font-weight: 700; font-size: 1.1em; }
        .book-desc { font-size: 0.85em; opacity: 0.7; margin-top: 5px; font-weight: 400; }
        .tag { font-size: 0.75em; padding: 2px 8px; border-radius: 12px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .tag-grammar { background: #e3f2fd; color: #1976d2; }

        @media (max-width: 768px) {
            body { padding: 10px; font-size: 16px; }
            .notebook { padding: 15px; border-radius: 8px; }
            h1 { font-size: 1.6em; }
        }
    </style>
</head>
<body>
    <div class="notebook">
        <div class="breadcrumb">
            <a href="../">🏠 Trang chủ</a> <span>›</span> Sách & Khóa học
        </div>

        <h1>📚 Sách & Khóa học</h1>
        <p class="subtitle">Danh sách tất cả khóa học và tài liệu</p>

        <ul>
            <li>
                <a href="ielts-basic/">
                    <span class="book-icon">🇬🇧</span>
                    <span class="book-title">Ngữ pháp cơ bản cho IELTS</span>
                    <div class="book-desc">Khóa học 13 bài — Lý thuyết ngữ pháp nền tảng và bài tập sửa lỗi cho IELTS</div>
                    <span class="tag tag-grammar">Ngữ pháp</span>
                </a>
            </li>
            <!-- Thêm khóa học mới ở đây -->
        </ul>
    </div>
</body>
</html>
